<script>
/* ==================================================================
   THE RATE LOOPER - A LOOP RUN AT MULTIPLES OF A BASE RATE.

   The buildable part of the request: a looper running fifteen times
   over a base rate, and twenty-two times over, and so on. So: set a
   base rate in bits a second, and the loop is driven at each multiple
   of it. For each one the page shows the rate asked for and the rate
   the device actually reached, and whether it held.

   The ceiling is found rather than assumed: the loop is pushed until
   it stops keeping up, and that top rate is this device's own.

   NO STANDARD NUMBER IS PRINTED HERE. The base rate is whatever is
   typed in - it is not labelled as any particular telephony or codec
   standard, because a standard number put on a page becomes a claim,
   and a wrong one in front of a buyer is worse than no number at all.
   Type the figure the job actually uses and the multiples follow from
   it.
   ================================================================== */

var MULTIPLES = [1, 15, 22];       /* the multiples asked for */

/* THE MULTIPLES ASKED FOR ARE FAR BELOW WHAT THIS DEVICE CAN DO, and a
   table where every row says "held" by a factor of ten thousand tells
   nobody anything. So the page also climbs the multiples until the loop
   genuinely cannot keep up, and reports the one where it breaks. That
   is the figure worth having: not "15 times over is fine", but "it
   holds up to N times over, and breaks at the next". */
var breakAt = null, lastHeld = null;
var guard = 0, results = [], ceiling = 0, perOp = 0;

/* how long one unit of work takes on this device, measured - this is
   what turns a wanted bit-rate into a loop the device must sustain */
function measurePerOp(){
  var t0 = performance.now(), x = 0, n = 0;
  do { for (var i=0;i<100000;i++){ x = (x + i) >>> 0; } n += 100000; }
  while (performance.now() - t0 < 25);
  guard += x & 1;
  var ms = performance.now() - t0;
  perOp = ms > 0 ? (ms / 1000) / n : 0;        /* seconds per operation */
}

/* run the loop for a window, trying to hit a wanted rate, and report
   the rate actually reached. One operation carries one bit here, so
   the wanted rate is a wanted operations-per-second - which is the
   honest reading of "looping at that rate" on a processor. */
function runAt(wantedBitsPerSec, windowMs){
  /* THE WINDOW IS ALWAYS RUN IN FULL. The first version stopped as soon
     as it had done enough work for the wanted rate - which on a fast
     device happened before the clock had ticked at all. Elapsed came
     back as zero, the rate divided out as zero, and a loop that was
     keeping up thousands of times over was reported as FAILING. A
     too-quick result must never read as a failure; the honest fix is
     to measure over a real stretch of time rather than stopping early
     and dividing by nothing. */
  var t0 = performance.now(), done = 0, x = 0, t1;
  do {
    for (var i=0;i<20000;i++){ x = (x + i) >>> 0; }
    done += 20000;
    t1 = performance.now();
  } while (t1 - t0 < windowMs);
  guard += x & 1;
  var el = (t1 - t0) / 1000;
  return el > 0 ? done / el : 0;
}

function measureCeiling(){
  /* the top rate the device sustains, measured not guessed */
  var t0 = performance.now(), x = 0, n = 0;
  do { for (var i=0;i<100000;i++){ x = (x + i) >>> 0; } n += 100000; }
  while (performance.now() - t0 < 60);
  guard += x & 1;
  var ms = performance.now() - t0;
  ceiling = ms > 0 ? n / (ms/1000) : 0;
}

function base(){
  var v = parseFloat(document.getElementById('base').value);
  return (isFinite(v) && v > 0) ? v : 13000;
}

function runAll(){
  measurePerOp(); measureCeiling();
  var b = base();
  results = MULTIPLES.map(function(m){
    var want = b * m;
    var got = runAt(want, 40);
    return { mult: m, want: want, got: got,
      pct: want > 0 ? Math.min(999, got / want * 100) : 0,
      held: got >= want * 0.99 };
  });
  findBreak(b);
  render();
}

/* climb the multiple until the loop stops keeping up. Doubling, so it
   gets there in a few steps rather than crawling, then the last held
   and the first short are both reported. */
function findBreak(b){
  breakAt = null; lastHeld = null;
  var m = 1, guardCount = 0;
  while (guardCount++ < 40){
    var want = b * m;
    if (want > ceiling * 4){ breakAt = m; break; }   /* plainly past it */
    var got = runAt(want, 25);
    if (got >= want * 0.99){ lastHeld = m; m *= 2; }
    else { breakAt = m; break; }
  }
}

function fmt(v){
  if (v >= 1e9) return (v/1e9).toFixed(2) + ' G';
  if (v >= 1e6) return (v/1e6).toFixed(2) + ' M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + ' k';
  return v.toFixed(0) + ' ';
}
function render(){
  var rows = '';
  results.forEach(function(r){
    rows += '<tr><td>' + r.mult + ' x</td>' +
      '<td>' + fmt(r.want) + '</td>' +
      '<td>' + fmt(r.got) + '</td>' +
      '<td>' + (r.pct >= 999 ? '>999' : r.pct.toFixed(0)) + '%</td>' +
      '<td class="' + (r.held ? 'ok' : 'no') + '">' +
      (r.held ? 'held' : 'short') + '</td></tr>';
  });
  document.getElementById('body').innerHTML = rows ||
    '<tr><td colspan="5" style="color:#6d8ba3">measuring&hellip;</td></tr>';

  var b = base();
  var headroom = (b > 0 && ceiling > 0) ? ceiling / b : 0;
  document.getElementById('tC').innerHTML =
    '<tr><td>base rate typed in</td><td class="m">' + fmt(b) + 'bit/s</td></tr>' +
    '<tr><td>top rate this device sustains</td><td class="m">' +
      fmt(ceiling) + 'bit/s</td></tr>' +
    '<tr><td>that is this many times the base</td><td class="m">' +
      (headroom ? Math.round(headroom).toLocaleString() + ' x' : '-') + '</td></tr>' +
    '<tr><td>highest multiple it can hold</td><td class="m">' +
      (headroom ? Math.floor(headroom).toLocaleString() + ' x' : '-') + '</td></tr>' +
    '<tr><td>last multiple measured as held</td><td class="m">' +
      (lastHeld ? lastHeld.toLocaleString() + ' x' : '-') + '</td></tr>' +
    '<tr><td>first multiple it could not hold</td><td class="n">' +
      (breakAt ? breakAt.toLocaleString() + ' x' : '-') + '</td></tr>';

  document.getElementById('warn').innerHTML =
    '<b>About the standard numbers.</b> This page prints none, on ' +
    'purpose. The base rate is only what is typed into the box above ' +
    'and is not labelled as any telephony, codec or container ' +
    'standard. A standard number on a page is a claim, and a wrong one ' +
    'in front of a buyer costs more than leaving it out. Give the exact ' +
    'standard and the figure from its own document and it goes on ' +
    'here, cited - not before.';

  document.getElementById('line').textContent =
    'BASE' + fmt(b) + 'bit/s' +
    ' CEIL' + fmt(ceiling) + 'bit/s' +
    results.map(function(r){ return ' ' + r.mult + 'x:' + (r.held?'HELD':'SHORT'); }).join('') +
    ' HELD' + (lastHeld ? lastHeld : '-') + 'x' +
    ' BREAK' + (breakAt ? breakAt : '-') + 'x';
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  if (results.length !== MULTIPLES.length)
    fails.push('only ' + results.length + ' of ' + MULTIPLES.length + ' multiples ran');

  results.forEach(function(r){
    if (!(r.got > 0)) fails.push(r.mult + 'x produced no rate');
    /* the asked rate must really be the base times the multiple */
    if (Math.abs(r.want - base()*r.mult) > 1e-6)
      fails.push(r.mult + 'x asked for the wrong rate');
    /* held must agree with the figures, not be set independently */
    var shouldHold = r.got >= r.want * 0.99;
    if (r.held !== shouldHold)
      fails.push(r.mult + 'x verdict does not match its own numbers');
  });

  /* the ceiling must be a real measured rate, and no multiple may be
     reported as held above it - that would be a rate out of nothing */
  if (!(ceiling > 0)) fails.push('no ceiling was measured');
  results.forEach(function(r){
    if (r.held && r.want > ceiling * 1.05)
      fails.push(r.mult + 'x is reported held above the measured ceiling');
  });

  /* the break must be a real edge: held below it, short at it */
  if (lastHeld !== null && breakAt !== null && !(lastHeld < breakAt))
    fails.push('the last held multiple is not below the breaking one');
  if (breakAt === null) fails.push('no breaking multiple was found');

  /* NO STANDARD NUMBER MAY APPEAR. This is the one that matters for a
     page going in front of buyers: a number that looks like a standard
     reference must not be printed anywhere on it. */
  var txt = document.body.innerText;
  var stds = txt.match(/\b(H\.\s?\d{3}|IEC\s?\d|ISO\s?\d|ITU[- ]T\s?[A-Z]?\.?\d|MPEG[- ]?\d)/gi);
  if (stds) fails.push('a standard reference is printed on the page: ' + stds[0]);

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE LOOPER IS NOT BEHAVING</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__loFails = fails;
}

document.getElementById('base').addEventListener('input', function(){
  runAll(); selfCheck();
});
render();
setTimeout(function(){ runAll(); selfCheck(); window.__loDone = true; }, 200);

window.__read = function(){ return { base: base(), ceiling: ceiling,
  results: results, done: !!window.__loDone, fails: window.__loFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
