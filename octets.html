<script>
/* ==================================================================
   NETWORK OCTETS AND REROUTE.

   THE HEADER IS REAL, THE NETWORK IS A MODEL. A packet's IPv4 header -
   its 20 octets - is built exactly as the standard lays it out and
   carried router to router. At every hop a router does what a real
   one does: takes one off the time-to-live and works the header
   checksum out again. At the edge, address translation swaps the
   private source address for the public one, and the checksum follows.
   Those are the octets that change on a network, and the page marks
   each one at the hop where it changes.

   THE NETWORK ITSELF IS AN EXAMPLE and the page says so on its face:
   24 routers in a fixed layout. The addresses are from the ranges set
   aside for documentation, so none of them is anybody's real host.

   REROUTE. Every few seconds one link on the path is cut. The route
   is worked out again as the shortest way round, the packet takes it,
   and the trail is rebuilt - with how much longer the way round is and
   how many octets of time-to-live it costs. The cuts heal in turn.

   THREATS. Packets arriving at the border are looked at for the faults
   a real border looks for: a private or reserved source address coming
   in from outside (spoofed), and a header whose checksum does not add
   up (altered on the way). Each is listed with the octets that gave it
   away.

   EVERY CHECKSUM IS VERIFIED the way a receiver verifies it: the
   ones-complement sum of all ten words must come to FFFF. The page
   refuses a clean result if any hop's header fails that, if the time
   to live does not fall by exactly one a hop, if any octet other than
   those changes, or if a route is not the shortest one.
   ================================================================== */

var SRC_PRIVATE = [10, 20, 30, 40], SRC_PUBLIC = [198, 51, 100, 7], DST = [203, 0, 113, 50];
var TTL0 = 64, CUT_EVERY = 6, HOP_S = 0.55;

/* the routers: [name, x, y] on a 100 x 60 field; R1 is the edge with address translation */
var R = [
  [1, 6, 30], [2, 16, 14], [3, 17, 45], [4, 28, 27], [5, 31, 8], [6, 33, 52], [7, 42, 18], [8, 44, 38],
  [9, 52, 6], [10, 55, 28], [11, 56, 50], [12, 64, 16], [13, 66, 40], [14, 72, 4], [15, 75, 27],
  [16, 77, 54], [17, 84, 13], [18, 86, 38], [19, 90, 24], [20, 94, 50], [21, 24, 4], [22, 9, 52], [23, 61, 58], [24, 96, 8]
];
var EDGE = 0, TARGET = 18;          /* R1 to R19, then the destination host */
var LINKS = [[0,1],[0,2],[0,21],[1,3],[1,4],[1,20],[2,3],[2,5],[2,21],[3,6],[3,7],[4,6],[4,8],[4,20],[5,7],[5,10],
  [6,9],[6,11],[7,9],[7,10],[8,11],[8,13],[9,12],[9,14],[10,12],[10,22],[11,14],[11,16],[12,14],[12,17],[13,16],
  [14,16],[14,18],[15,17],[15,19],[16,18],[16,23],[17,18],[17,19],[18,19],[22,15],[13,23]];

function el(id){ return document.getElementById(id); }
function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){ var d = new Date(); return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate()) + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()); }
function fi(n, d){ if (n === null || n === undefined || !isFinite(n)) return '-'; return n.toFixed(d === undefined ? 1 : d).replace('.', ','); }
function hx(b){ return (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }
function dist(a, b){ var dx = R[a][1] - R[b][1], dy = R[a][2] - R[b][2]; return Math.sqrt(dx * dx + dy * dy); }

/* ================= the header ================= */
function checksum(h){
  var s = 0;
  for (var i = 0; i < 20; i += 2) if (i !== 10) s += (h[i] << 8) | h[i + 1];
  while (s > 0xffff) s = (s & 0xffff) + (s >>> 16);
  return (~s) & 0xffff;
}
function verifies(h){
  var s = 0;
  for (var i = 0; i < 20; i += 2) s += (h[i] << 8) | h[i + 1];
  while (s > 0xffff) s = (s & 0xffff) + (s >>> 16);
  return s === 0xffff;
}
function header(src, dst, ttl, id){
  var h = [0x45, 0x00, 0x00, 0x3c, (id >> 8) & 255, id & 255, 0x40, 0x00, ttl, 6, 0, 0]
    .concat(src, dst);
  var c = checksum(h); h[10] = c >> 8; h[11] = c & 255;
  return h;
}
var FIELD = ['Version', 'Service', 'Length', 'Length', 'Ident', 'Ident', 'Flags', 'Fragment', 'Time To Live', 'Protocol',
  'Checksum', 'Checksum', 'Source', 'Source', 'Source', 'Source', 'Target', 'Target', 'Target', 'Target'];

/* ================= the route ================= */
var cut = {};                         /* "a-b" -> true */
function key(a, b){ return a < b ? a + '-' + b : b + '-' + a; }
function adjacency(){
  var adj = R.map(function(){ return []; });
  LINKS.forEach(function(l){ if (!cut[key(l[0], l[1])]){ var d = dist(l[0], l[1]);
    adj[l[0]].push([l[1], d]); adj[l[1]].push([l[0], d]); } });
  return adj;
}
function shortest(from, to){
  var adj = adjacency(), n = R.length, d = [], prev = [], done = [], i;
  for (i = 0; i < n; i++){ d[i] = Infinity; prev[i] = -1; done[i] = false; }
  d[from] = 0;
  for (;;){
    var u = -1; for (i = 0; i < n; i++) if (!done[i] && (u < 0 || d[i] < d[u])) u = i;
    if (u < 0 || d[u] === Infinity) break;
    done[u] = true;
    adj[u].forEach(function(e){ if (d[u] + e[1] < d[e[0]] - 1e-12){ d[e[0]] = d[u] + e[1]; prev[e[0]] = u; } });
  }
  if (d[to] === Infinity) return null;
  var p = [to]; while (p[0] !== from) p.unshift(prev[p[0]]);
  return { path: p, len: d[to] };
}
/* an independent check: Bellman-Ford over the same links must give the same length */
function bellman(from, to){
  var n = R.length, d = [], i, k; for (i = 0; i < n; i++) d[i] = Infinity; d[from] = 0;
  for (k = 0; k < n; k++) LINKS.forEach(function(l){ if (cut[key(l[0], l[1])]) return; var w = dist(l[0], l[1]);
    if (d[l[0]] + w < d[l[1]]) d[l[1]] = d[l[0]] + w; if (d[l[1]] + w < d[l[0]]) d[l[0]] = d[l[1]] + w; });
  return d[to];
}

/* the packet's trail along a path: the header as it LEAVES each router */
function trail(path){
  var hops = [], h = header(SRC_PRIVATE, DST, TTL0, 0x1c46);
  hops.push({ router: 'Sender', h: h.slice(), changed: [] });
  path.forEach(function(r, i){
    var prev = h.slice();
    h[8] = h[8] - 1;                                  /* time to live, one less */
    if (r === EDGE) for (var j = 0; j < 4; j++) h[12 + j] = SRC_PUBLIC[j];   /* address translation */
    h[10] = 0; h[11] = 0; var c = checksum(h); h[10] = c >> 8; h[11] = c & 255;
    var ch = []; for (var k = 0; k < 20; k++) if (h[k] !== prev[k]) ch.push(k);
    hops.push({ router: 'Router ' + R[r][0], r: r, h: h.slice(), changed: ch, nat: r === EDGE });
  });
  return hops;
}

/* ================= threats at the border ================= */
function bogon(a){
  return a[0] === 10 || (a[0] === 172 && a[1] >= 16 && a[1] <= 31) || (a[0] === 192 && a[1] === 168)
    || a[0] === 127 || a[0] === 0 || (a[0] === 169 && a[1] === 254) || a[0] >= 224;
}
function inspect(h){
  var found = [];
  if (!verifies(h)) found.push({ what: 'Checksum does not add up, altered on the way', octets: [10, 11] });
  if (bogon(h.slice(12, 16))) found.push({ what: 'Private or reserved source from outside, spoofed', octets: [12, 13, 14, 15] });
  if (h[8] === 0) found.push({ what: 'Time to live run out', octets: [8] });
  return found;
}
/* what arrives at the border from outside: two clean, three faulty, planted */
function arrivals(){
  var a = [];
  a.push({ name: 'Clean, from 203.0.113.9', h: header([203, 0, 113, 9], [198, 51, 100, 7], 51, 0x2a01), planted: 0 });
  a.push({ name: 'Clean, from 192.0.2.77', h: header([192, 0, 2, 77], [198, 51, 100, 7], 47, 0x2a02), planted: 0 });
  a.push({ name: 'Source 10.0.0.5 from outside', h: header([10, 0, 0, 5], [198, 51, 100, 7], 52, 0x2a03), planted: 1 });
  a.push({ name: 'Source 127.0.0.1 from outside', h: header([127, 0, 0, 1], [198, 51, 100, 7], 60, 0x2a04), planted: 1 });
  var t = header([192, 0, 2, 80], [198, 51, 100, 7], 49, 0x2a05); t[19] = 9;   /* target octet altered, checksum not redone */
  a.push({ name: 'Target altered on the way', h: t, planted: 1 });
  return a;
}

/* ================= state, cycle ================= */
var route = null, hops = [], reroutes = [], cutOrder = [], cutN = 0, t0 = performance.now(), lastCut = 0, fails = [];
function reroute(){
  var before = route;
  /* cut the next link on the current path, heal the oldest cut once three are open */
  var p = before.path, idx = cutN % (p.length - 1), a = p[idx], b = p[idx + 1];
  var openCuts = Object.keys(cut), healed = null;
  if (openCuts.length >= 3){ healed = openCuts[0]; delete cut[healed]; }
  cut[key(a, b)] = true; cutN++;
  var after = shortest(EDGE, TARGET);
  if (!after){ delete cut[key(a, b)]; return; }
  reroutes.push({ link: 'Router ' + R[a][0] + ' to Router ' + R[b][0], before: before, after: after, a: a, b: b,
                  healed: healed ? healed.split('-').map(function(i){ return 'Router ' + R[+i][0]; }).join(' to ') : null,
                  bellman: bellman(EDGE, TARGET) });
  if (reroutes.length > 8) reroutes.shift();
  route = after; hops = trail(route.path);
}

/* ================= drawing ================= */
var MAP = null;
function drawMap(now){
  var cv = el('map'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth || 300, H = cv.clientHeight || 320;
  if (cv.width !== Math.round(W * dpr)) cv.width = Math.round(W * dpr);
  if (cv.height !== Math.round(H * dpr)) cv.height = Math.round(H * dpr);
  var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  var X = function(x){ return 12 + x / 100 * (W - 24); }, Y = function(y){ return 12 + y / 60 * (H - 24); };
  var onPath = {}; route.path.forEach(function(r, i){ if (i) onPath[key(route.path[i - 1], r)] = true; });
  LINKS.forEach(function(l){
    var k = key(l[0], l[1]);
    g.strokeStyle = cut[k] ? '#d03b3b' : (onPath[k] ? '#3987e5' : '#2b3d50');
    g.lineWidth = onPath[k] ? 3 : (cut[k] ? 2 : 1.2);
    g.setLineDash(cut[k] ? [5, 4] : []);
    g.beginPath(); g.moveTo(X(R[l[0]][1]), Y(R[l[0]][2])); g.lineTo(X(R[l[1]][1]), Y(R[l[1]][2])); g.stroke();
  });
  g.setLineDash([]);
  R.forEach(function(r, i){
    g.fillStyle = i === EDGE ? '#fab219' : (i === TARGET ? '#0ca30c' : '#8ea9c2');
    g.beginPath(); g.arc(X(r[1]), Y(r[2]), i === EDGE || i === TARGET ? 6 : 4, 0, 7); g.fill();
    g.fillStyle = '#d7e6f2'; g.font = '10px monospace'; g.fillText(String(r[0]), X(r[1]) + 6, Y(r[2]) - 5);
  });
  /* the packet, moving along the path */
  var s = ((now - t0) / 1000) % (HOP_S * (route.path.length + 1)), seg = Math.floor(s / HOP_S);
  var at = Math.min(route.path.length - 1, seg), nxt = Math.min(route.path.length - 1, seg + 1), f = (s - seg * HOP_S) / HOP_S;
  var px = R[route.path[at]][1] + (R[route.path[nxt]][1] - R[route.path[at]][1]) * f;
  var py = R[route.path[at]][2] + (R[route.path[nxt]][2] - R[route.path[at]][2]) * f;
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(X(px), Y(py), 4, 0, 7); g.fill();
  MAP = { hop: Math.min(hops.length - 1, at + 1) };
}
function drawOctets(){
  var hop = hops[MAP ? MAP.hop : 0], box = el('oct'); box.innerHTML = '';
  el('octTitle').textContent = 'The Header Leaving ' + hop.router;
  hop.h.forEach(function(b, i){
    var d = document.createElement('div'); if (hop.changed.indexOf(i) >= 0) d.className = 'ch';
    var x = document.createElement('b'); x.textContent = String(b);
    var s = document.createElement('span'); s.textContent = (i + 1) + ' ' + FIELD[i];
    d.appendChild(x); d.appendChild(s); box.appendChild(d);
  });
  var t = el('tNow'); t.innerHTML = '';
  function row(k, v){ var tr = document.createElement('tr'); var a = document.createElement('td'); a.className = 'k'; a.textContent = k;
    var b = document.createElement('td'); b.className = 'v'; b.textContent = v; tr.appendChild(a); tr.appendChild(b); t.appendChild(tr); }
  row('Source', hop.h.slice(12, 16).join('.') + (hop.nat ? ', translated here' : ''));
  row('Target', hop.h.slice(16, 20).join('.'));
  row('Time To Live', String(hop.h[8]) + ', ' + hop.changed.length + ' octets changed at this hop');
  row('Checksum', hx(hop.h[10]) + hx(hop.h[11]) + (verifies(hop.h) ? ', adds up' : ', DOES NOT ADD UP'));
}
function render(){
  var tb = el('trBody'); tb.innerHTML = '';
  hops.forEach(function(hp, i){
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.className = 'k'; a.textContent = String(i);
    var b = document.createElement('td'); b.className = 'v'; b.textContent = hp.router + (hp.nat ? ', translation' : '');
    var c = document.createElement('td'); c.className = 'hx';
    hp.h.forEach(function(x, k){ var s = document.createElement(hp.changed.indexOf(k) >= 0 ? 'em' : 'span');
      s.textContent = hx(x) + (k % 4 === 3 ? '  ' : ' '); c.appendChild(s); });
    var d = document.createElement('td');
    var ch = document.createElement('span'); ch.className = 'chip ' + (verifies(hp.h) ? 'c-ok' : 'c-crit');
    ch.textContent = verifies(hp.h) ? 'ADDS UP' : 'FAILS'; d.appendChild(ch);
    d.appendChild(document.createTextNode(' ' + hp.changed.length + ' changed'));
    tr.appendChild(a); tr.appendChild(b); tr.appendChild(c); tr.appendChild(d); tb.appendChild(tr);
  });
  var rb = el('reBody'); rb.innerHTML = '';
  reroutes.slice().reverse().forEach(function(r){
    var tr = document.createElement('tr');
    [r.link, (r.before.path.length - 1) + ' hops, ' + fi(r.before.len, 1) + ' units',
     (r.after.path.length - 1) + ' hops, ' + fi(r.after.len, 1) + ' units, '
       + (r.after.len >= r.before.len ? fi((r.after.len / r.before.len - 1) * 100, 0) + ' per cent longer' : 'shorter')
       + (r.healed ? ', ' + r.healed + ' back in service' : '')]
      .forEach(function(s, i){ var td = document.createElement('td'); td.className = i ? 'v' : 'k'; td.textContent = s; tr.appendChild(td); });
    rb.appendChild(tr);
  });
  el('tRe').parentNode.style.display = reroutes.length ? '' : 'none';
  el('tRe').parentNode.previousElementSibling.style.display = reroutes.length ? '' : 'none';
  var thb = el('thBody'); thb.innerHTML = '';
  arrivals().forEach(function(p){
    var f = inspect(p.h), tr = document.createElement('tr');
    var a = document.createElement('td'); a.className = 'k'; a.textContent = p.name;
    var b = document.createElement('td'); b.className = 'hx';
    var marked = {}; f.forEach(function(x){ x.octets.forEach(function(o){ marked[o] = 1; }); });
    p.h.forEach(function(x, k){ var s = document.createElement(marked[k] ? 'em' : 'span'); s.textContent = hx(x) + (k % 4 === 3 ? '  ' : ' '); b.appendChild(s); });
    var c = document.createElement('td');
    var ch = document.createElement('span'); ch.className = 'chip ' + (f.length ? 'c-crit' : 'c-ok'); ch.textContent = f.length ? 'THREAT' : 'CLEAN';
    c.appendChild(ch); c.appendChild(document.createTextNode(' ' + (f.length ? f.map(function(x){ return x.what; }).join('; ') : 'Passed')));
    tr.appendChild(a); tr.appendChild(b); tr.appendChild(c); thb.appendChild(tr);
  });
  var thr = arrivals().filter(function(p){ return inspect(p.h).length; }).length;
  el('line').textContent = (route.path.length - 1) + ' hops to Router ' + R[TARGET][0] + ', ' + reroutes.length + ' reroutes, '
    + thr + ' threats at the border - example network, real header';
  selfCheck(); refreshDownloads();
}

/* ================= the page checks itself ================= */
var WORDS = ('All Rights Reserved Copyright Network Octets And Reroute The Modelled Header At This Hop Trail By '
  + 'Reroutes Threats Found Path Now Link Cut Other Links Leaving Router Sender Source Target Time To Live Checksum '
  + 'Version Service Length Ident Flags Fragment Protocol Clean Private Passed Altered Avainlippu Back').split(' ');
function selfCheck(){
  var f = [], txt = document.body.innerText.replace(el('chk').innerText, '');
  if (document.querySelectorAll('pre, code, textarea').length) f.push('a source block reached the page');
  if (/[☀-➿]|\ud83c|\ud83d|\ud83e/.test(el('line').textContent)) f.push('a picture glyph is in the top text');
  if (/[$€£]\s?[0-9]|[0-9]\s?[$€£]|\b(price[sd]?|euro|dollars?)\b/i.test(txt)) f.push('money wording reached the page');
  if (/\b(Infinity|NaN|undefined|null)\b/.test(txt)) f.push('a figure with no value reached the page');
  var m = txt.match(/\b[A-Z][a-z]{2,} +[A-Z][a-z]{2,}\b/g) || [];
  var bad = m.filter(function(s){ var w = s.split(/ +/); return WORDS.indexOf(w[0]) < 0 || WORDS.indexOf(w[1]) < 0; });
  if (bad.length) f.push('something reads as a name: ' + bad[0]);
  [].forEach.call(document.querySelectorAll('#pg td.k'), function(td){ var s = td.textContent.trim();
    if (s && /^[a-z]/.test(s)) f.push('a row does not start with a capital: ' + s.slice(0, 30)); });
  /* EVERY HOP: the header adds up, time to live falls by one, and only the octets allowed to change did */
  hops.forEach(function(hp, i){
    if (!verifies(hp.h)) f.push('the header leaving ' + hp.router + ' does not add up');
    if (i){
      if (hp.h[8] !== hops[i - 1].h[8] - 1) f.push('time to live did not fall by one at ' + hp.router);
      var allowed = [8, 10, 11].concat(hp.nat ? [12, 13, 14, 15] : []);
      hp.changed.forEach(function(k){ if (allowed.indexOf(k) < 0) f.push('octet ' + (k + 1) + ' changed at ' + hp.router); });
      if (hp.changed.indexOf(8) < 0) f.push('time to live did not change at ' + hp.router);
    }
  });
  var last = hops[hops.length - 1];
  if (last && last.h.slice(16, 20).join('.') !== DST.join('.')) f.push('the target address changed on the way');
  /* THE ROUTE IS THE SHORTEST, checked a second, independent way, and avoids every cut */
  if (Math.abs(route.len - bellman(EDGE, TARGET)) > 1e-9) f.push('the route is not the shortest way');
  route.path.forEach(function(r, i){ if (i && cut[key(route.path[i - 1], r)]) f.push('the route runs over a cut link'); });
  /* A CUT CAN ONLY MAKE THE WAY LONGER - unless an older cut healed in the same step, which can open a
     shorter way again. The first version checked every reroute and flagged a correct one. */
  reroutes.forEach(function(r){ if (!r.healed && r.after.len < r.before.len - 1e-9) f.push('a reroute came out shorter with nothing healed'); });
  /* THE BORDER: every planted threat found, no clean packet flagged */
  arrivals().forEach(function(p){ var got = inspect(p.h).length > 0;
    if (got !== !!p.planted) f.push((p.planted ? 'a planted threat was missed: ' : 'a clean packet was flagged: ') + p.name); });
  if (loopError) f.push('the live loop hit an error: ' + loopError);
  fails = f;
  var box = el('chk');
  if (f.length){ box.style.display = 'block'; box.innerHTML = '<b style="color:#e0645f">THIS PAGE IS NOT CLEAN</b><br>' + f.map(function(s){ return s.replace(/</g, '&lt;'); }).join('<br>'); }
  else box.style.display = 'none';
  return f;
}

/* ================= what leaves the page ================= */
function textOf(){
  var L = ['NETWORK OCTETS AND REROUTE', 'AI2Orbit', 'Taken ' + stampNow(), 'Example network, real IPv4 header', ''];
  L.push('THE TRAIL');
  hops.forEach(function(hp, i){ L.push(i + '  ' + hp.router + '  ' + hp.h.map(hx).join(' ') + '  changed: '
    + (hp.changed.map(function(k){ return k + 1; }).join(',') || '-') + '  ' + (verifies(hp.h) ? 'adds up' : 'FAILS')); });
  L.push('', 'REROUTES');
  reroutes.forEach(function(r){ L.push(r.link + ': ' + (r.before.path.length - 1) + ' hops ' + fi(r.before.len, 1) + ' -> '
    + (r.after.path.length - 1) + ' hops ' + fi(r.after.len, 1)); });
  L.push('', 'THREATS AT THE BORDER');
  arrivals().forEach(function(p){ var x = inspect(p.h); L.push(p.name + ': ' + (x.length ? x.map(function(y){ return y.what; }).join('; ') : 'clean')); });
  return L.join('\n');
}
function dxfOf(){
  var o = []; function p(a, b){ o.push(a, String(b)); }
  function line(lay, a, b){ p(0, 'LINE'); p(8, lay); p(10, R[a][1]); p(20, -R[a][2]); p(30, 0); p(11, R[b][1]); p(21, -R[b][2]); p(31, 0); }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  var onPath = {}; route.path.forEach(function(r, i){ if (i) onPath[key(route.path[i - 1], r)] = true; });
  LINKS.forEach(function(l){ var k = key(l[0], l[1]); line(cut[k] ? 'CUT' : (onPath[k] ? 'PATH' : 'LINKS'), l[0], l[1]); });
  R.forEach(function(r){ p(0, 'CIRCLE'); p(8, 'ROUTERS'); p(10, r[1]); p(20, -r[2]); p(30, 0); p(40, 0.8);
    p(0, 'TEXT'); p(8, 'LABELS'); p(10, r[1] + 1); p(20, -r[2] + 1); p(30, 0); p(40, 1.5); p(1, 'R' + r[0]); });
  p(0, 'ENDSEC'); p(0, 'EOF'); return o.join('\r\n') + '\r\n';
}
var lastDl = 0;
function refreshDownloads(){ if (performance.now() - lastDl < 2000) return; lastDl = performance.now();
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'})); }

/* ================= start, without a button ================= */
route = shortest(EDGE, TARGET); hops = trail(route.path); render();
var lastR = 0;
/* THE LOOP CANNOT DIE QUIETLY. One exception inside a frame would stop every later frame - the map
   frozen, the header box empty, no reroutes - with nothing on the screen to say so. The next frame
   is asked for first, and an error is kept and reported by the page's own check. */
var loopError = null;
function tick(){
  requestAnimationFrame(tick);
  /* THE REAL CLOCK, not the frame's own stamp: the first frame's stamp can be EARLIER than the moment
     the page script started, the elapsed time came out negative, the packet was looked up before the
     first router - and that one exception was what froze the whole page in a test run. */
  var now = performance.now();
  try {
    if ((now - t0) / 1000 - lastCut >= CUT_EVERY){ lastCut = (now - t0) / 1000; reroute(); render(); }
    drawMap(now); drawOctets();
  } catch (e){ if (!loopError){ loopError = String(e && e.message || e); selfCheck(); } }
}
requestAnimationFrame(tick);

window.__read = function(){ return { hops: hops.length - 1, path: route.path.map(function(i){ return R[i][0]; }), len: route.len,
  reroutes: reroutes.length, cuts: Object.keys(cut), fails: fails, bar: el('stamp').textContent + ' ' + el('line').textContent }; };
window.__selfCheck = selfCheck; window.__reroute = function(){ reroute(); render(); };
window.__verifies = verifies; window.__checksum = checksum; window.__header = header;
window.__textOf = textOf; window.__dxfOf = dxfOf;
window.__break = function(what){ if (what === 'ttl') hops[2].h[8]++; if (what === 'oct') { hops[3].h[18] ^= 1; hops[3].changed.push(18); }
  if (what === 'cut') { var p = route.path; cut[key(p[0], p[1])] = true; } };
</script>
