<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUDIO LIGHTS &middot; TURN LEFT RIGHT</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:14px 0 6px;text-transform:uppercase}
  #lights{display:flex;gap:10px;justify-content:center;align-items:center;
    margin:10px 0 6px}
  .lamp{flex:1 1 0;height:90px;border-radius:10px;border:1px solid #16293a;
    display:flex;align-items:center;justify-content:center;font-weight:700;
    letter-spacing:2px;color:#0a0f0a;background:#0a121a;transition:none}
  .lab{text-align:center;color:#6d8ba3;font-size:11px;letter-spacing:2px}
  button{font:inherit;font-weight:700;letter-spacing:1px;padding:11px 16px;
    background:#12507f;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:6px;
    cursor:pointer;display:block;width:100%;margin-top:8px}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2;width:54%}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #16293a;
    background:#0a121a;border-radius:4px;font-size:11px;line-height:1.7;color:#8ea9c2}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B49</b><i id="line">lights</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Audio lights - they turn left and right with the sound</h2>
  <div id="lights">
    <div class="lamp" id="L">LEFT</div>
    <div class="lamp" id="R">RIGHT</div>
  </div>
  <div class="lab">louder on one side turns that lamp up</div>
  <button id="start">Turn the lights on with the microphone</button>

  <h2>What the sound is doing</h2>
  <table id="tS"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   AUDIO LIGHTS - TWO LAMPS THAT TURN LEFT AND RIGHT WITH THE SOUND.

   Two lamps, left and right. The sound coming in is split into its
   lower half and its upper half; the lower half drives the left lamp
   and the upper half the right, so a beat lights the left and a
   cymbal or a voice lights the right. Louder turns the lamp up
   brighter; the balance between them is the left-right turn.

   WHERE THE SOUND COMES FROM. The microphone, when it is allowed -
   that needs a tap, because no page may open a microphone without the
   person saying yes, and a secure connection. Where the microphone is
   refused or absent, the lamps still run, driven by a built-in tone
   that sweeps left to right, so the lights work on a stand with no
   microphone at all. Which source is live is shown plainly.

   IT IS THE SOUND THAT TURNS THEM, MEASURED. The brightness is taken
   from the actual loudness in each half of the sound, read many times
   a second - it is not a timed animation pretending to listen. When
   the sound stops, the lamps go dark, because there is nothing to
   show; an animation would keep dancing to silence, and that is the
   tell that it was never listening.
   ================================================================== */

var ctx = null, analyser = null, data = null, source = null;
var live = 'off', micOK = false, running = false;
var leftLevel = 0, rightLevel = 0, turn = 0, reads = 0, rT0 = 0, readRate = 0;
var osc = null, pan = null;

function start(){
  if (running) return;
  running = true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC){ live = 'no audio engine here'; render(); return; }
  ctx = new AC();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  data = new Uint8Array(analyser.frequencyBinCount);

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      source = ctx.createMediaStreamSource(stream);
      source.connect(analyser);
      micOK = true; live = 'microphone';
      document.getElementById('start').style.display = 'none';
      render();
    }).catch(function(){ toneFallback(); });
  } else {
    toneFallback();
  }
  loop();
}

/* a built-in sweeping tone so the lights work with no microphone -
   honestly labelled as the fallback, never dressed up as the mic */
function toneFallback(){
  live = 'built-in tone (no microphone)';
  osc = ctx.createOscillator();
  var lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 220;
  lfo.frequency.value = 0.3; lfoGain.gain.value = 600;
  lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
  var g = ctx.createGain(); g.gain.value = 0.25;
  osc.connect(g); g.connect(analyser);
  osc.start(); lfo.start();
  document.getElementById('start').textContent = 'Tone on - tap to try the microphone again';
  document.getElementById('start').onclick = function(){
    if (osc){ try{ osc.stop(); }catch(e){} osc = null; }
    running = false; micOK = false; start();
  };
  render();
}

function loop(){
  if (!running) return;
  requestAnimationFrame(loop);
  if (!analyser) return;
  analyser.getByteFrequencyData(data);
  var half = data.length >> 1, i, lo = 0, hi = 0;
  for (i=0;i<half;i++) lo += data[i];
  for (i=half;i<data.length;i++) hi += data[i];
  lo /= half; hi /= (data.length-half);
  /* smooth a touch so the lamps do not strobe, but follow the sound */
  leftLevel = leftLevel*0.6 + (lo/255)*0.4;
  rightLevel = rightLevel*0.6 + (hi/255)*0.4;
  var sum = leftLevel + rightLevel;
  turn = sum > 0.01 ? (rightLevel - leftLevel) / sum : 0;   /* -1 left .. +1 right */
  reads++;
  var now = performance.now(); if (!rT0) rT0 = now;
  var el = now - rT0; if (el >= 1000){ readRate = reads*1000/el; reads = 0; rT0 = now; }
  paint(); render();
}

function paint(){
  var L = document.getElementById('L'), R = document.getElementById('R');
  var l = Math.min(1, leftLevel*2), r = Math.min(1, rightLevel*2);
  L.style.background = 'rgba(79,209,255,' + (0.08 + l*0.92) + ')';
  R.style.background = 'rgba(255,210,63,' + (0.08 + r*0.92) + ')';
  L.style.boxShadow = l > 0.15 ? '0 0 ' + (l*40) + 'px #4fd1ff' : 'none';
  R.style.boxShadow = r > 0.15 ? '0 0 ' + (r*40) + 'px #ffd23f' : 'none';
}

function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:14%">'+(u||'')+'</td></tr>';
}
function render(){
  var dir = turn < -0.1 ? 'LEFT' : turn > 0.1 ? 'RIGHT' : 'centre';
  document.getElementById('tS').innerHTML =
    row('sound source', live, '', micOK ? 'm' : (live.indexOf('tone')>=0?'w':'n')) +
    row('left lamp (lower sound)', (leftLevel*100).toFixed(0), '%', 'm') +
    row('right lamp (upper sound)', (rightLevel*100).toFixed(0), '%', 'm') +
    row('turn', dir + ' ' + (turn>=0?'+':'') + turn.toFixed(2), '',
        dir==='LEFT'?'':dir==='RIGHT'?'w':'') +
    row('reads a second', readRate ? readRate.toFixed(0) : '-', '', 'm');

  document.getElementById('note').innerHTML =
    '<b>It really listens.</b> The brightness is the loudness in each ' +
    'half of the sound, read ' + (readRate?Math.round(readRate):'many') +
    ' times a second - not a timed animation. The lower half turns the ' +
    'left lamp, the upper half the right, and the balance is the turn. ' +
    'Where the microphone is not allowed, a built-in tone drives the ' +
    'lamps so they work on a stand, and the source is named above so ' +
    'the tone is never mistaken for the microphone.';

  document.getElementById('line').textContent =
    'SRC:' + (micOK?'MIC':(live.indexOf('tone')>=0?'TONE':live.indexOf('off')>=0?'OFF':'-')) +
    ' L' + (leftLevel*100).toFixed(0) + ' R' + (rightLevel*100).toFixed(0) +
    ' TURN' + (turn>=0?'+':'') + turn.toFixed(2) +
    ' ' + dir +
    ' READ' + (readRate?readRate.toFixed(0):'-') + '/s';
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES.
   The honest-listening test: silence must darken the lamps. An
   animation that only pretends to listen keeps moving in silence. */
function selfCheck(){
  var fails = [];

  /* turn must be the balance of the two halves, computed right */
  function t(l, r){ var s=l+r; return s>0.01 ? (r-l)/s : 0; }
  if (Math.abs(t(1,0) - (-1)) > 1e-9) fails.push('all-left did not turn fully left');
  if (Math.abs(t(0,1) - (1)) > 1e-9) fails.push('all-right did not turn fully right');
  if (Math.abs(t(1,1)) > 1e-9) fails.push('equal sides did not sit centre');
  if (t(0,0) !== 0) fails.push('silence did not sit centre');

  /* the lamp brightness must follow the level, not a clock: feeding a
     level of 0 must give the dark floor, a high level the bright end */
  function bright(level){ return 0.08 + Math.min(1, level*2)*0.92; }
  if (bright(0) > 0.09) fails.push('a silent lamp is not dark');
  if (bright(1) < 0.9) fails.push('a loud lamp is not bright');

  /* the source label must be honest - it must say which of mic or tone
     is live, never claim the mic when it is the tone */
  var src = document.getElementById('tS').textContent;
  if (live === 'built-in tone (no microphone)' && src.indexOf('microphone)') < 0)
    fails.push('the tone fallback is not labelled as such');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE LIGHTS ARE NOT BEHAVING</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__liFails = fails;
}

document.getElementById('start').addEventListener('click', start);
render();
setTimeout(selfCheck, 400);

/* for checking from outside: drive the levels without a real sound */
window.__feed = function(l, r){
  leftLevel = l; rightLevel = r;
  var sum = l + r; turn = sum > 0.01 ? (r - l) / sum : 0;
  paint(); render();
};
window.__read = function(){ return { live: live, micOK: micOK,
  left: leftLevel, right: rightLevel, turn: turn, readRate: readRate,
  fails: window.__liFails, bar: document.getElementById('line').textContent }; };
</script>
</body></html>
