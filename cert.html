/* ==================================================================
   A CERTIFICATE HELD IN THE APP, SHOWN READ ONLY, AND CARRIED
   ROM -> RAM -> CPU WITH EACH LEG TIMED.

   kv = ONE TENTH OF A MILLISECOND, as given. Every leg is reported in
   kv as well as in milliseconds, so the two can be checked against
   each other by eye: 1 ms is 10 kv.

   NO SECRET HALF OF ANY KEY IS IN THIS FILE. Only the certificates
   travel, and a
   certificate is the public half by design - it is what a server
   hands to every browser that connects. The keys that signed these
   were destroyed on the machine that made them.

   THE THREE LEGS, AND WHAT EACH ONE REALLY IS:

     ROM   the certificate is put into the device's own durable store
           and read back out of it. That is the storage chip, the
           nearest thing a browser can reach to ROM.
     RAM   the bytes that came back are copied into a fresh block of
           memory. No storage involved, just memory to memory.
     CPU   the bytes are parsed - walked field by field - and hashed.
           That is the processor doing work on the certificate and
           nothing else.

   THE LEGS ARE MEASURED SEPARATELY AND NOT DERIVED FROM ONE ANOTHER.
   Timing the whole thing once and splitting it by guesswork would
   have produced three numbers that always add to the total and mean
   nothing individually.
   ================================================================== */

function b64bytes(s){
  var raw = atob(s), a = new Uint8Array(raw.length), i;
  for (i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i);
  return a;

/* ================= a small reader for the certificate =============
   A certificate is a nest of tagged, length-prefixed pieces. This
   walks it rather than pattern-matching the bytes: each piece says
   what it is and how long it is, so the next one is found by
   arithmetic and never by searching for something that looks right.
   Searching the raw bytes for a name would also find that name if it
   appeared anywhere else in the file. */
function tlv(b, p){
  var tag = b[p], q = p+1, len = b[q++];
  if (len & 0x80){                       /* long form: the low bits say
                                            how many length bytes follow */
    var n = len & 0x7f, i; len = 0;
    for (i=0;i<n;i++) len = (len<<8) | b[q++];
  }
  return { tag:tag, start:p, vstart:q, len:len, end:q+len };
}
function children(b, t){
  var out = [], p = t.vstart;
  while (p < t.end){ var c = tlv(b, p); out.push(c); p = c.end; }
  return out;
}
function txt(b, t){
  var s = '', i;
  for (i=t.vstart;i<t.end;i++) s += String.fromCharCode(b[i]);
  return s;
}
function hex(b, t){
  var s = '', i;
  for (i=t.vstart;i<t.end;i++) s += ('0'+b[i].toString(16)).slice(-2);
  return s.toUpperCase();
}
/* 2.5.4.3 is the common name; in bytes that is 55 04 03 */
function findCN(b, name){
  var out = null;
  (function walk(t){
    var kids;
    try { kids = children(b, t); } catch(e){ return; }
    for (var i=0;i<kids.length;i++){
      var k = kids[i];
      if (k.tag === 0x30){
        var sub = children(b, k);
        if (sub.length === 2 && sub[0].tag === 0x06 && sub[0].len === 3 &&
            b[sub[0].vstart] === 0x55 && b[sub[0].vstart+1] === 0x04 &&
            b[sub[0].vstart+2] === 0x03){
          if (out === null) out = txt(b, sub[1]);
          return;
        }
      }
      if (k.tag === 0x30 || k.tag === 0x31) walk(k);
    }
  })(name);
  return out;
}
/* Times come two ways. Two-digit years are the older form and the
   century is implied - under 50 means the two thousands. Getting that
   wrong would date a 2027 certificate to 1927 and call it expired. */
function derTime(b, t){
  var s = txt(b, t), y;
  if (t.tag === 0x17){                       /* YYMMDDHHMMSSZ */
    y = parseInt(s.slice(0,2), 10);
    y += (y < 50) ? 2000 : 1900;
    s = String(y) + s.slice(2);
  }
  return Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8),
                  +s.slice(8,10), +s.slice(10,12), +s.slice(12,14));
}
function parseCert(b){
  var cert = tlv(b, 0), top = children(b, cert), tbs = children(b, top[0]);
  var i = 0;
  if (tbs[0].tag === 0xA0) i = 1;            /* the version, when present */
  var serial = tbs[i], issuer = tbs[i+2], validity = tbs[i+3],
      subject = tbs[i+4], spki = tbs[i+5];
  var v = children(b, validity);
  var keyBits = 0;
  try {
    var bits = children(b, spki)[1];         /* the key itself */
    var inner = tlv(b, bits.vstart + 1);     /* one byte of padding first */
    var modulus = children(b, inner)[0];
    var n = modulus.len;
    if (b[modulus.vstart] === 0) n -= 1;     /* the sign byte is not key */
    keyBits = n * 8;
  } catch(e){ keyBits = 0; }
  return {
    subject: findCN(b, subject),
    issuer: findCN(b, issuer),
    serial: hex(b, serial),
    notBefore: derTime(b, v[0]),
    notAfter: derTime(b, v[1]),
    keyBits: keyBits,
    bytes: b.length
  };
}

/* ================= ROM -> RAM -> CPU ============================== */
var leg = { rom:0, ram:0, cpu:0, note:'' }, parsed = null, fingerprint = '';

function db(){ return new Promise(function(res, rej){
  var r = indexedDB.open('ai2cert', 1);
  r.onupgradeneeded = function(e){ e.target.result.createObjectStore('c'); };
  r.onsuccess = function(e){ res(e.target.result); };
  r.onerror = function(){ rej(new Error('no durable store here')); }; }); }
function put(d, k, v){ return new Promise(function(res, rej){
  var t = d.transaction('c','readwrite'); t.objectStore('c').put(v, k);
  t.oncomplete = function(){ res(); };
  t.onerror = function(){ rej(new Error('store refused the write')); }; }); }
function get(d, k){ return new Promise(function(res, rej){
  var t = d.transaction('c','readonly'), q = t.objectStore('c').get(k);
  q.onsuccess = function(){ res(q.result); };
  q.onerror = function(){ rej(new Error('store refused the read')); }; }); }

function carry(){
  var bytes = b64bytes(CERTS.good.b64);
  if (!window.indexedDB){
    leg.note = 'no durable store, so the ROM leg cannot be timed';
    ramAndCpu(bytes); return;
  }
  db().then(function(d){
    return put(d, 'cert', bytes.buffer.slice(0)).then(function(){
      /* ROM: read it back out of the device's own store */
      var t0 = performance.now();
      return get(d, 'cert').then(function(back){
        leg.rom = performance.now() - t0;
        ramAndCpu(new Uint8Array(back));
      });
    });
  }).catch(function(e){
    leg.note = e.message;
    ramAndCpu(bytes);
  });
}

function ramAndCpu(bytes){
  /* RAM: memory to memory, nothing else in the way. One copy of 729
     bytes is far below the clock's resolution, so it is copied many
     times and the total divided - a single copy would have timed as
     nought and printed 0,0 kv for ever. */
  var N = 2000, t0 = performance.now(), i, sink = 0, copy;
  for (i=0;i<N;i++){ copy = bytes.slice(0); sink += copy[0]; }
  leg.ram = (performance.now() - t0) / N;
  leg.ramSink = sink;

  /* CPU: parse the certificate field by field, same reason for the
     repeat, then hash it once. */
  var M = 200; t0 = performance.now();
  for (i=0;i<M;i++) parsed = parseCert(bytes);
  leg.cpu = (performance.now() - t0) / M;

  render();
  if (window.crypto && window.crypto.subtle){
    var h0 = performance.now();
    crypto.subtle.digest('SHA-256', bytes).then(function(d){
      leg.hash = performance.now() - h0;
      var a = new Uint8Array(d), s = '', k;
      for (k=0;k<a.length;k++) s += ('0'+a[k].toString(16)).slice(-2);
      fingerprint = s.toUpperCase();
      render(); compare();
    });
  } else {
    leg.note = (leg.note ? leg.note + '; ' : '') +
               'no crypto here, so the certificate cannot be fingerprinted';
    render(); compare();
  }
}

/* ================= good and bad, on the numbers ==================
   Each certificate is put through the same two questions, and both
   answers are numbers rather than opinions:
     is today inside its dates, and by how many days
     does what it hashes to match what it is supposed to hash to
   A certificate that fails either one is bad. */
var verdicts = [];
function checkOne(name, rec){
  var b = b64bytes(rec.b64), p = parseCert(b), now = Date.now();
  var daysLeft = (p.notAfter - now) / 86400000;
  var started = now >= p.notBefore;
  var live = started && now <= p.notAfter;
  return { name:name, p:p, daysLeft:daysLeft, started:started, live:live,
           expected:(rec.sha256||'').replace(/:/g,'').toUpperCase(), bytes:b };
}
function compare(){
  verdicts = [checkOne('good', CERTS.good), checkOne('expired', CERTS.expired)];
  var done = 0;
  verdicts.forEach(function(v){
    if (window.crypto && window.crypto.subtle){
      crypto.subtle.digest('SHA-256', v.bytes).then(function(d){
        var a = new Uint8Array(d), s = '', k;
        for (k=0;k<a.length;k++) s += ('0'+a[k].toString(16)).slice(-2);
        v.got = s.toUpperCase();
        v.matches = (v.got === v.expected);
        v.ok = v.live && v.matches;
        if (++done === verdicts.length){ render(); selfCheck(); }
      });
    } else {
      v.got = ''; v.matches = null; v.ok = v.live;
      if (++done === verdicts.length){ render(); selfCheck(); }
    }
  });
}

/* ================= the listing ================= */
function row(k, v, u, cls){
  return '<tr><td class="k">'+k+'</td><td class="v '+(cls||'')+'">'+v+
         '</td><td class="u">'+(u||'')+'</td></tr>';
}
function day(ms){ return new Date(ms).toISOString().slice(0,10); }
function group(s, n){ return (s.match(/.{1,2}/g)||[]).slice(0,n).join(' '); }

function render(){
  var p = parsed;
  document.getElementById('tCert').innerHTML = !p ? row('reading','…','') :
    row('name on it', p.subject || '-', '', 'm') +
    row('issued by', p.issuer || '-', '', 'm') +
    row('valid from', day(p.notBefore), '', 'm') +
    row('valid until', day(p.notAfter), '', 'm') +
    row('key size', p.keyBits || '-', 'bits', 'm') +
    row('serial', group(p.serial, 10) + '…', '', 'm') +
    row('size', p.bytes, 'bytes', 'm') +
    row('fingerprint', fingerprint ? group(fingerprint, 12) + '…' : '…', '', 'm');

  document.getElementById('tPath').innerHTML =
    row('ROM &mdash; read back out of storage',
        leg.rom ? kv(leg.rom).toFixed(2) : '-', 'kv', 'm') +
    row('&nbsp;&nbsp;the same in milliseconds',
        leg.rom ? leg.rom.toFixed(3) : '-', 'ms', 'm') +
    row('RAM &mdash; copied in memory',
        leg.ram ? kv(leg.ram).toFixed(4) : '-', 'kv', 'm') +
    row('&nbsp;&nbsp;the same in milliseconds',
        leg.ram ? leg.ram.toFixed(5) : '-', 'ms', 'm') +
    row('CPU &mdash; parsed field by field',
        leg.cpu ? kv(leg.cpu).toFixed(4) : '-', 'kv', 'm') +
    row('&nbsp;&nbsp;the same in milliseconds',
        leg.cpu ? leg.cpu.toFixed(5) : '-', 'ms', 'm') +
    row('CPU &mdash; hashed once',
        leg.hash ? kv(leg.hash).toFixed(2) : '-', 'kv', 'm') +
    row('all three legs together',
        (leg.rom||leg.ram||leg.cpu)
          ? kv(leg.rom + leg.ram + leg.cpu).toFixed(2) : '-', 'kv', 'm') +
    (leg.note ? row('note', leg.note, '', 'n') : '');

  var rows = '';
  verdicts.forEach(function(v){
    rows += row('<b>' + v.name + '</b>', v.ok === undefined ? '…'
                : (v.ok ? 'GOOD' : 'BAD'), '', v.ok ? 'good' : 'bad') +
      row('&nbsp;&nbsp;name on it', v.p.subject || '-', '') +
      row('&nbsp;&nbsp;valid until', day(v.p.notAfter), '') +
      row('&nbsp;&nbsp;days left', v.daysLeft.toFixed(1), 'days',
          v.live ? 'm' : 'n') +
      row('&nbsp;&nbsp;inside its dates', v.live ? 'yes' : 'no', '',
          v.live ? 'good' : 'bad') +
      row('&nbsp;&nbsp;hash matches', v.matches === null ? 'cannot check'
          : (v.matches ? 'yes' : 'no'), '', v.matches ? 'good' : 'bad');
  });
  document.getElementById('tCmp').innerHTML = rows;

  /* the header, while the processor runs */
  var g = verdicts[0], bmsg;
  bmsg = 'CERT' + (parsed ? (parsed.subject||'?') : '…') +
    ' ' + (g ? (g.ok ? 'GOOD' : 'BAD') : '…') +
    ' DAYS' + (g ? g.daysLeft.toFixed(0) : '-') +
    ' ROM' + (leg.rom ? kv(leg.rom).toFixed(1) : '-') + 'kv' +
    ' RAM' + (leg.ram ? kv(leg.ram).toFixed(3) : '-') + 'kv' +
    ' CPU' + (leg.cpu ? kv(leg.cpu).toFixed(3) : '-') + 'kv' +
    ' BITS' + (parsed ? parsed.keyBits : '-') +
    ' CPU%' + cpuPct.toFixed(1).replace('.', ',');
  document.getElementById('line').textContent = bmsg;
}

/* ---- the processor, so the header moves while it runs ---- */
var busyMs = 0, winT0 = performance.now(), cpuPct = 0;
function own(fn){
  return function(){
    var t0 = performance.now();
    try { return fn.apply(this, arguments); }
    finally { busyMs += performance.now() - t0; }
  };
}
setInterval(own(function(){
  var now = performance.now(), el = now - winT0;
  if (el > 0) cpuPct = Math.min(100, busyMs/el*100);
  busyMs = 0; winT0 = now;
  render();
}), 500);

/* ================= the check on all of it =========================
   The reader above is checked against what the certificate really
   says - the fields as read by the tool that made it, carried in
   beside the bytes. If the reader ever drifts, this speaks up and
   the page stops being worth reading.

   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];
  ['good','expired'].forEach(function(n){
    var rec = CERTS[n], p = parseCert(b64bytes(rec.b64));
    if (rec.subjectCN && p.subject !== rec.subjectCN)
      fails.push(n + ' name read as ' + p.subject);
    if (rec.issuerCN && p.issuer !== rec.issuerCN)
      fails.push(n + ' issuer read as ' + p.issuer);
    if (rec.serialHex && p.serial !== rec.serialHex)
      fails.push(n + ' serial read as ' + p.serial);
    if (rec.notAfterDay && day(p.notAfter) !== rec.notAfterDay)
      fails.push(n + ' end date read as ' + day(p.notAfter));
    if (rec.bytes && p.bytes !== rec.bytes)
      fails.push(n + ' size read as ' + p.bytes);
  });
  /* and the two verdicts have to come out the way the dates demand */
  if (verdicts.length === 2){
    if (verdicts[0].ok !== true)  fails.push('the valid one was called bad');
    if (verdicts[1].ok !== false) fails.push('the expired one was called good');
  }
  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="bad">THE CERTIFICATE IS NOT BEING READ ' +
      'CORRECTLY</b><br>' + fails.join('<br>') +
      '<br>Nothing above should be trusted.';
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
  window.__certFails = fails;
}

setTimeout(own(carry), 120);
render();

window.__read = function(){ return { leg:leg, parsed:parsed,
  fingerprint:fingerprint, fails:window.__certFails,
  verdicts: verdicts.map(function(v){ return { name:v.name, ok:v.ok,
    live:v.live, matches:v.matches, daysLeft:v.daysLeft,
    subject:v.p.subject, keyBits:v.p.keyBits }; }),
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
