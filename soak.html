<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOAK &middot; 3 MIN, 1 MIN, THEN LOOP</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:right;color:#6d8ba3;font-weight:400;padding:4px 6px;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
  td:first-child{color:#8ea9c2}
  .run{color:#4fd1ff;font-weight:700}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  canvas{display:block;width:100%;background:#070d15;
    border:1px solid #16293a;border-radius:5px;margin-top:8px}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #16293a;
    background:#0a121a;border-radius:4px;font-size:11px;line-height:1.7;color:#8ea9c2}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B56</b><i id="line">soak</i></div>
<div id="pg" style="padding-top:58px">

  <h2>The run: 3 minutes, 1 minute, then looping 3 minutes</h2>
  <table id="tNow"></table>
  <canvas id="g" height="180"></canvas>

  <h2>Each stretch, stamped</h2>
  <table id="tPh"><thead><tr>
    <th>stretch</th><th>started</th><th>ran</th><th>rate</th><th>vs first</th>
  </tr></thead><tbody id="phBody"></tbody></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   THE SOAK - 3 MINUTES, THEN 1 MINUTE, THEN LOOPING 3 MINUTES.

   The schedule asked for, run on real work: trigonometry and
   logarithms, over and over, with the clock stamped at the start and
   end of every stretch.

   WHY THIS IS THE USEFUL VERSION OF "LOAD THE PROCESSOR UP". A short
   burst tells you what a machine can do for a second. Nobody buys a
   machine for a second. Running the same work for three minutes, then
   one, then three again and again, shows what it holds on to - and
   when the rate falls away between stretches, that is the processor
   being pulled back as it warms, which is the thing that actually
   decides whether a job finishes. The comparison between stretches is
   the whole product; a soak that only printed a total would hide it.

   EVERY STRETCH IS STAMPED, and the stamp is written without dots as
   asked - year, month, day, hour, minute, second run together - so it
   sorts and pastes cleanly into anything else.

   THE WORK IS REAL AND CANNOT BE SKIPPED. Each round takes the result
   of the last one into the next, so none of it can be thrown away by
   the engine as pointless - a loop whose answer nobody reads is a
   loop that quietly gets deleted, and then the figure is a measure of
   nothing.
   ================================================================== */

/* the schedule, in milliseconds. The last one repeats. */
var PHASES = [
  { name: 'first',  ms: 180000, loops: false },
  { name: 'second', ms:  60000, loops: false },
  { name: 'loop',   ms: 180000, loops: true  }
];

var phase = 0, loopNo = 0, phStart = 0, phOps = 0, running = false;
var done = [], guard = 0, firstRate = 0;

/* a date and time with no dots - as asked */
function stampNow(){
  var d = new Date();
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

/* the work: sine, cosine, tangent, arc tangent and a logarithm, each
   round fed by the last so nothing can be optimised away.

   THE ROUND NUMBER GOES INTO THE SUM, AND IT HAS TO. Without it the
   chain settles on a fixed point after a few hundred rounds - sine
   and cosine of the same value give that value back - and from then
   on the processor is computing an answer it already has. The work
   still happens, so the rate still looks fine, but a soak that has
   quietly converged is no longer exercising anything that varies.
   The page's own check caught exactly this: the carried value had
   stopped moving. Feeding the counter in keeps every round different
   for as long as it runs. */
var tick_n = 0;
function work(rounds){
  var x = guard || 0.5, i;
  for (i = 0; i < rounds; i++){
    tick_n++;
    x = Math.sin(x + tick_n * 1e-6) + Math.cos(x * 1.609);
    x = Math.tan(x * 0.5);
    x = Math.atan(x) + Math.log(Math.abs(x) + 1.0001);
    if (!isFinite(x)) x = 0.5 + (tick_n % 7) * 0.01;
  }
  guard = x;
  return rounds;
}

function startPhase(){
  phStart = performance.now();
  phOps = 0;
  done.push({ name: PHASES[phase].name,
    loop: PHASES[phase].loops ? (loopNo + 1) : 0,
    wanted: PHASES[phase].ms, started: stampNow(),
    ran: 0, ops: 0, rate: 0, open: true });
  render();
}

function finishPhase(){
  var rec = done[done.length - 1];
  rec.ran = performance.now() - phStart;
  rec.ops = phOps;
  rec.rate = rec.ran > 0 ? phOps / (rec.ran / 1000) : 0;
  rec.ended = stampNow();
  rec.open = false;
  if (!firstRate) firstRate = rec.rate;
  rec.vsFirst = firstRate > 0 ? rec.rate / firstRate : 1;

  if (PHASES[phase].loops){ loopNo++; }
  else { phase++; }
  startPhase();
}

var CHUNK = 4000;
function tick(){
  if (!running) return;
  phOps += work(CHUNK);
  var el = performance.now() - phStart;
  if (el >= PHASES[phase].ms) finishPhase();
  render();
  setTimeout(tick, 0);
}

/* ---------------- the listing ---------------- */
function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:16%">'+(u||'')+'</td></tr>';
}
function mmss(ms){
  var s = Math.floor(ms/1000);
  return Math.floor(s/60) + ':' + ((s%60) < 10 ? '0' : '') + (s%60);
}

function render(){
  var cur = PHASES[phase], el = running ? performance.now() - phStart : 0;
  var rate = el > 0 ? phOps / (el/1000) : 0;
  document.getElementById('tNow').innerHTML =
    row('stretch running now', cur.name + (cur.loops ? ' ' + (loopNo+1) : ''), '', 'run') +
    row('how long it runs for', mmss(cur.ms), 'min:sec', 'm') +
    row('how far in', mmss(el), 'min:sec', 'm') +
    row('rounds done this stretch', Math.round(phOps).toLocaleString(), '', 'm') +
    row('rate right now', Math.round(rate).toLocaleString(), 'rounds a second', 'm') +
    row('clock, no dots', stampNow(), '', 'm') +
    row('stretches finished', done.filter(function(d){ return !d.open; }).length, '', 'm');

  var rows = '';
  done.slice().reverse().forEach(function(d){
    if (d.open) return;
    var cls = d.vsFirst >= 0.97 ? 'm' : (d.vsFirst >= 0.9 ? 'w' : 'n');
    rows += '<tr><td>' + d.name + (d.loop ? ' ' + d.loop : '') + '</td>' +
      '<td>' + d.started + '</td>' +
      '<td>' + mmss(d.ran) + '</td>' +
      '<td>' + Math.round(d.rate).toLocaleString() + '</td>' +
      '<td class="' + cls + '">' + (d.vsFirst*100).toFixed(1) + '%</td></tr>';
  });
  document.getElementById('phBody').innerHTML = rows ||
    '<tr><td colspan="5" style="color:#6d8ba3">the first stretch is still running</td></tr>';

  drawDrift();

  var last = null;
  for (var i = done.length-1; i >= 0; i--){ if (!done[i].open){ last = done[i]; break; } }
  document.getElementById('note').innerHTML =
    '<b>What to watch.</b> The last column is each stretch against the ' +
    'first one. If it stays near 100 per cent the machine is holding its ' +
    'pace; if it slides, the processor is being pulled back as it warms, ' +
    'and that is the number that decides whether a long job finishes on ' +
    'time. ' +
    (last ? 'Latest finished stretch: ' + (last.vsFirst*100).toFixed(1) +
            ' per cent of the first.' : 'Nothing has finished yet - the first ' +
            'stretch runs for three minutes.');

  document.getElementById('line').textContent =
    'RUN:' + cur.name + (cur.loops ? (loopNo+1) : '') +
    ' ' + mmss(el) + '/' + mmss(cur.ms) +
    ' RATE' + Math.round(rate).toLocaleString().replace(/,/g,'') +
    ' DONE' + done.filter(function(d){ return !d.open; }).length +
    (last ? ' VS1st' + (last.vsFirst*100).toFixed(0) + '%' : '') +
    ' ' + stampNow();
}

function drawDrift(){
  var cv = document.getElementById('g'), g = cv.getContext('2d');
  var w = cv.clientWidth || 320; if (cv.width !== w) cv.width = w;
  var W = cv.width, H = cv.height, L = 40, R = 10, T = 10, B = 20;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);
  var fin = done.filter(function(d){ return !d.open; });
  if (!fin.length) return;
  var rates = fin.map(function(d){ return d.rate; });
  var lo = Math.min.apply(null, rates) * 0.9, hi = Math.max.apply(null, rates) * 1.05;
  if (hi - lo < 1) hi = lo + 1;
  function X(i){ return L + (fin.length < 2 ? 0.5 : i/(fin.length-1)) * (W-L-R); }
  function Y(v){ return T + (1 - (v-lo)/(hi-lo)) * (H-T-B); }
  g.font = '9px monospace'; g.fillStyle = '#4a6076'; g.strokeStyle = '#12202c';
  [lo, (lo+hi)/2, hi].forEach(function(v){
    var y = Y(v); g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke();
    g.fillText(Math.round(v/1000) + 'k', 3, y+3);
  });
  g.strokeStyle = '#4fd1ff'; g.lineWidth = 2; g.beginPath();
  fin.forEach(function(d,i){ var x = X(i), y = Y(d.rate);
    if (i===0) g.moveTo(x,y); else g.lineTo(x,y); });
  g.stroke();
  fin.forEach(function(d,i){
    g.fillStyle = d.vsFirst >= 0.97 ? '#3fd18a' : (d.vsFirst >= 0.9 ? '#e8c98a' : '#ff5b4d');
    g.beginPath(); g.arc(X(i), Y(d.rate), 3, 0, 6.283); g.fill();
  });
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* the schedule must be the one asked for */
  if (PHASES[0].ms !== 180000) fails.push('the first stretch is not 3 minutes');
  if (PHASES[1].ms !== 60000) fails.push('the second stretch is not 1 minute');
  if (PHASES[2].ms !== 180000) fails.push('the looping stretch is not 3 minutes');
  if (!PHASES[2].loops) fails.push('the last stretch does not loop');

  /* the stamp must have no dots and be the right length */
  var s = stampNow();
  if (/[.\-: ]/.test(s)) fails.push('the clock stamp has separators in it: ' + s);
  if (!/^\d{14}$/.test(s)) fails.push('the clock stamp is not 14 digits: ' + s);

  /* the work must not be removable: feeding it rounds must move the
     guard, or the engine has thrown the loop away and the rate is a
     measure of nothing */
  var before = guard;
  work(1000);
  if (guard === before) fails.push('THE WORK IS BEING OPTIMISED AWAY - the rate means nothing');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE SOAK IS NOT SET UP RIGHT</b><br>' + fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__soakFails = fails;
}

running = true;
startPhase();
tick();
setTimeout(function(){ selfCheck(); window.__soakReady = true; }, 400);

/* for checking the schedule without sitting through seven minutes */
window.__setPhases = function(a, b, c){
  PHASES[0].ms = a; PHASES[1].ms = b; PHASES[2].ms = c;
  phase = 0; loopNo = 0; done = []; firstRate = 0; startPhase();
};
window.__read = function(){ return { phase: PHASES[phase].name, loopNo: loopNo,
  phases: PHASES.map(function(p){ return { name:p.name, ms:p.ms, loops:p.loops }; }),
  done: done.filter(function(d){ return !d.open; }),
  stamp: stampNow(), ready: !!window.__soakReady, fails: window.__soakFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
