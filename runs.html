<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CALCULATION RUNS &middot; AI2ORBIT</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #top{padding:60px 10px 0}
  #topText{color:#9fb6c9;font-size:12px}
  #ref{margin-top:6px;color:#4fd1ff;font-weight:700;letter-spacing:1px;
    word-break:break-all}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 5px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;color:#6d8ba3;font-weight:400;padding:3px 4px;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{padding:4px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td.k{color:#8ea9c2;text-align:left}
  td.v{color:#eaf6ff;font-weight:700}
  td.u{color:#4a6076;font-weight:400}
  .m{color:#3fd18a}.r{color:#d8a53f}.n{color:#e0645f}.sub{color:#4a6076}
  canvas{display:block;width:100%;background:#070d15;
    border:1px solid #16293a;border-radius:4px;margin-top:6px}
  .send{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .send button,.send select{color:#05080c;background:#4fd1ff;border:0;
    border-radius:4px;padding:8px 12px;font-weight:700;font-size:12px;
    font-family:inherit;cursor:pointer}
  .send select{background:#070d15;color:#eaf6ff;border:1px solid #1d3448;
    font-weight:400}
  .send button.alt{background:#16293a;color:#9fd6f5}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B74</b><i id="line">Ready</i></div>

<div id="top">
  <div id="topText">Calculation Runs. The same calculation at every size on the
    ladder, with a switch to change which calculation it is.</div>
  <div id="ref">&nbsp;</div>
</div>

<div id="pg">

  <div class="send">
    <label style="color:#9fb6c9;font-size:11px">Calculation</label>
    <select id="kind"></select>
    <label style="color:#9fb6c9;font-size:11px">Starting number</label>
    <select id="seed"></select>
    <button id="go">Run The Ladder</button>
    <button id="stop" class="alt">Stop</button>
  </div>

  <h2>The Ladder</h2>
  <table id="tRun"><thead><tr>
    <th>rounds asked</th><th>rounds done</th><th>one round</th>
    <th>rounds a second</th><th>took</th>
  </tr></thead><tbody id="runBody"></tbody></table>
  <canvas id="g" height="190"></canvas>

  <h2>Where It Stopped Getting Better</h2><table id="tStop"></table>

  <h2>The Repeats</h2><table id="tRep"></table>

  <h2>What This Run Is</h2><table id="tCan"></table>

  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   THE LADDER OF SIZES, THE SWITCH BETWEEN CALCULATIONS, AND THE
   THREE STARTING NUMBERS.

   The ladder is the one that was given: fifty, sixty five, seventy, a
   thousand, one million one hundred thousand, fifteen million, six
   hundred million, a thousand million. Those rungs span seven orders
   of magnitude, which is why the chart is drawn on a logarithmic
   scale - on a straight scale the first five rungs would share a
   single pixel and the picture would show one dot.

   A RUN THAT CANNOT FINISH SAYS SO INSTEAD OF PRETENDING. A thousand
   million rounds of trigonometry is minutes of work. A page that
   quietly printed a figure for a run it never completed would be
   worthless, so every rung has a clock: when the clock runs out the
   run stops, and the table shows rounds ASKED beside rounds DONE so
   the gap is visible rather than hidden. Every rate is worked from
   what was actually done.

   THE FACTORIAL IS CARRIED AS LOGARITHMS. Twenty one factorial is
   already past what a browser holds exactly, and a hundred and
   seventy one factorial is simply infinity. Printing that would be a
   figure that means nothing, so the sum of the logarithms is carried
   instead - the same quantity, in a form that survives.

   AND IT RUNS IN A THREAD OF ITS OWN, so the page stays alive while
   it works. A browser frozen for two minutes is not a demonstration
   of speed.
   ================================================================== */

var LADDER = [50, 65, 70, 1000, 1100000, 15000000, 600000000, 1000000000];
var SEEDS = [615243, 61525346, 615235467];
var KINDS = ['Trigonometry', 'Square Root', 'Logarithm', 'Factorial', 'Integer Mix'];
var CAP_MS = 1500;          /* the clock on any one rung */
var REPEATS = 4;            /* the third and fourth time, as asked */
var REPEAT_ROUNDS = 1100000;

var WORKER_SRC = [
  'var guard = 0;',
  'function logFactorial(n){',
  '  /* A FACTORIAL PAST 170 IS INFINITY IN A BROWSER. Printing that',
  '     would be a meaningless figure on a page, so the sum of the',
  '     logarithms is carried instead - the same quantity, in a form',
  '     that survives. */',
  '  var s = 0, i;',
  '  for (i=2;i<=n;i++) s += Math.log(i);',
  '  return s;',
  '}',
  'function runOnce(kind, seed, rounds, capMs){',
  '  var x = (seed % 1000) / 1000 + 0.5, i = 0, done = 0;',
  '  var t0 = performance.now(), t1 = t0, chunk = 2000;',
  '  while (done < rounds){',
  '    var n = Math.min(chunk, rounds - done);',
  '    for (i=0;i<n;i++){',
  '      if (kind === \'Trigonometry\'){',
  '        x = Math.sin(x + i*1e-7) + Math.cos(x*1.609);',
  '        x = Math.atan(x) + 0.5;',
  '      } else if (kind === \'Square Root\'){',
  '        x = Math.sqrt(Math.abs(x) + i*1e-7) + 0.5;',
  '      } else if (kind === \'Logarithm\'){',
  '        x = Math.log(Math.abs(x) + 1.0001) + 0.7;',
  '      } else if (kind === \'Factorial\'){',
  '        x = logFactorial(20 + (i % 12)) * 1e-3 + 0.5;',
  '      } else {',
  '        x = ((x * 1.0000001) + (i & 15) * 1e-7) % 7 + 0.5;',
  '      }',
  '      if (!isFinite(x)) x = 0.5;',
  '    }',
  '    done += n;',
  '    t1 = performance.now();',
  '    /* A RUN THAT HITS THE CLOCK STOPS AND SAYS SO. It never claims',
  '       a count it did not reach. */',
  '    if (t1 - t0 > capMs) break;',
  '  }',
  '  guard += x;',
  '  var ms = t1 - t0;',
  '  return { asked: rounds, done: done, ms: ms,',
  '           nsEach: done ? ms * 1e6 / done : 0,',
  '           perSec: ms > 0 ? done / (ms/1000) : 0,',
  '           finished: done >= rounds };',
  '}',
  'self.onmessage = function(e){',
  '  var d = e.data;',
  '  self.postMessage({ step: d.step, res: runOnce(d.kind, d.seed, d.rounds, d.capMs) });',
  '};'
].join("\n");
var WORKER_URL = URL.createObjectURL(new Blob([WORKER_SRC], { type:"text/javascript" }));

var worker = null, running = false, rows = [], repeats = [], stopAsked = false;
var kind = KINDS[0], seed = SEEDS[0], stepAt = 0, repAt = 0;

function two(n){ return (n<10?"0":"") + n; }
function stampNow(){
  var d = new Date();
  return String(d.getFullYear()) + two(d.getMonth()+1) + two(d.getDate())
       + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}
function num(n){ return Math.round(n).toLocaleString().replace(/,/g, " "); }

function ask(msg, then){
  if (!worker){
    worker = new Worker(WORKER_URL);
    worker.onmessage = function(ev){
      var fn = worker.__then; worker.__then = null;
      if (fn) fn(ev.data);
    };
  }
  worker.__then = then;
  worker.postMessage(msg);
}

/* ---- the ladder ---- */
function runLadder(){
  if (running) return;
  running = true; stopAsked = false; rows = []; repeats = []; stepAt = 0; repAt = 0;
  render();
  nextStep();
}
function nextStep(){
  if (stopAsked || stepAt >= LADDER.length){ runRepeats(); return; }
  var rounds = LADDER[stepAt];
  ask({ step: stepAt, kind: kind, seed: seed, rounds: rounds, capMs: CAP_MS },
      function(d){
        rows.push(d.res);
        stepAt++;
        render();
        setTimeout(nextStep, 0);
      });
}

/* ---- THE REPEATS. One reading of anything is an anecdote. The third
   and fourth passes were asked for by name, and they are the ones
   that say whether the machine holds its pace or drifts as it warms. */
function runRepeats(){
  if (stopAsked || repAt >= REPEATS){ finish(); return; }
  ask({ step: 100 + repAt, kind: kind, seed: seed,
        rounds: REPEAT_ROUNDS, capMs: CAP_MS },
      function(d){
        repeats.push(d.res);
        repAt++;
        render();
        setTimeout(runRepeats, 0);
      });
}
function finish(){ running = false; render(); }

/* ---- rendering ---- */
function row(t, k, v, u){
  var tr = document.createElement("tr");
  tr.innerHTML = '<td class="k">' + k + '</td><td class="v">' + v
               + '</td><td class="u">' + (u||"") + '</td>';
  t.appendChild(tr);
}

function render(){
  var tb = document.getElementById("runBody"); tb.innerHTML = "";
  var i;
  for (i=0;i<rows.length;i++){
    var r = rows[i], tr = document.createElement("tr");
    tr.innerHTML = '<td class="k">' + num(r.asked) + '</td>'
      + '<td class="' + (r.finished ? "v" : "n") + '">' + num(r.done)
      + (r.finished ? "" : ' <span class="sub">stopped on the clock</span>') + '</td>'
      + '<td class="v">' + r.nsEach.toFixed(1) + ' ns</td>'
      + '<td class="u">' + num(r.perSec) + '</td>'
      + '<td class="u">' + r.ms.toFixed(0) + ' ms</td>';
    tb.appendChild(tr);
  }

  /* WHERE IT STOPPED GETTING BETTER. The rate climbs while the rungs
     are too small to time properly, then flattens. The flattening is
     the answer: past that size, more rounds say nothing new. */
  var tS = document.getElementById("tStop"); tS.innerHTML = "";
  var best = null, flatAt = null;
  for (i=0;i<rows.length;i++) if (!best || rows[i].perSec > best.perSec) best = rows[i];
  for (i=0;i<rows.length;i++){
    if (best && rows[i].perSec >= best.perSec * 0.9){ flatAt = rows[i]; break; }
  }
  if (!rows.length) row(tS, "Nothing run yet", "-", "Press Run The Ladder");
  else {
    row(tS, "Best rate seen", best ? num(best.perSec) : "-", "Rounds a second");
    row(tS, "First rung within a tenth of it",
        flatAt ? num(flatAt.asked) + " rounds" : '<span class="sub">None yet</span>',
        "Past here, more rounds say nothing new");
    var unfinished = 0;
    for (i=0;i<rows.length;i++) if (!rows[i].finished) unfinished++;
    row(tS, "Rungs the clock cut short", unfinished,
        unfinished ? "Their rate is worked from what was done" : "All of them finished");
  }

  var tR = document.getElementById("tRep"); tR.innerHTML = "";
  if (!repeats.length) row(tR, "No repeats yet", "-", "They run after the ladder");
  else {
    for (i=0;i<repeats.length;i++){
      var rep = repeats[i];
      var vs = repeats[0].perSec > 0 ? (rep.perSec / repeats[0].perSec * 100) : 0;
      row(tR, "Pass " + (i+1), num(rep.perSec) + " a second",
          i === 0 ? "The first pass" : vs.toFixed(0) + " per cent of the first");
    }
  }

  renderCan();
  draw();

  document.getElementById("ref").textContent =
    "c.YTGaA." + String(seed).slice(0,7) + "   RUNS-1 " + stampNow();
  document.getElementById("line").textContent =
    (running ? "RUNNING " : "DONE ") + kind.toUpperCase().replace(/ /g, "")
    + " SEED" + seed
    + " RUNGS" + rows.length + "/" + LADDER.length
    + " PASSES" + repeats.length
    + " " + stampNow();
  selfCheck();
}

function renderCan(){
  var t = document.getElementById("tCan"); t.innerHTML = "";
  row(t, "Run The Same Calculation At Every Size", '<span class="m">YES</span>',
      "Fifty rounds up to a thousand million.");
  row(t, "Switch Which Calculation It Is", '<span class="m">YES</span>',
      "Trigonometry, square root, logarithm, factorial, integer mix.");
  row(t, "Start From A Given Number", '<span class="m">YES</span>',
      "The three that were asked for.");
  row(t, "Say When A Run Was Cut Short", '<span class="m">YES</span>',
      "Rounds asked and rounds done sit side by side.");
  row(t, "Finish A Thousand Million Rounds Of Trigonometry",
      '<span class="r">NOT INSIDE THE CLOCK</span>',
      "It stops and reports what it reached.");
  row(t, "Print A Factorial Past A Hundred And Seventy",
      '<span class="n">NOT AVAILABLE</span>',
      "It is infinity in a browser, so logarithms are carried instead.");
  row(t, "Keep The Page Alive While It Runs", '<span class="m">YES</span>',
      "The work runs in a thread of its own.");
}

function draw(){
  var cv = document.getElementById("g"), g = cv.getContext("2d");
  var w = cv.clientWidth || 320; if (cv.width !== w) cv.width = w;
  var W = cv.width, H = cv.height, L = 52, R = 10, T = 14, B = 26;
  g.fillStyle = "#070d15"; g.fillRect(0, 0, W, H);
  if (!rows.length) return;
  var i, maxRate = 0;
  for (i=0;i<rows.length;i++) if (rows[i].perSec > maxRate) maxRate = rows[i].perSec;
  if (maxRate <= 0) return;
  /* LOGARITHMIC BOTH WAYS - the rungs span seven orders of magnitude */
  var lo = Math.log(LADDER[0]) / Math.LN10;
  var hi = Math.log(LADDER[LADDER.length-1]) / Math.LN10;
  var rhi = Math.log(maxRate) / Math.LN10 + 0.3, rlo = rhi - 7;
  function X(v){ return L + ((Math.log(v)/Math.LN10) - lo) / (hi - lo) * (W - L - R); }
  function Y(v){
    return (H - B) - ((Math.log(Math.max(v,1))/Math.LN10) - rlo) / (rhi - rlo) * (H - T - B);
  }
  g.strokeStyle = "#12202c"; g.font = "9px monospace"; g.fillStyle = "#4a6076";
  for (i=0;i<LADDER.length;i++){
    var x = X(LADDER[i]);
    g.beginPath(); g.moveTo(x, T); g.lineTo(x, H - B); g.stroke();
  }
  var dec;
  for (dec = Math.ceil(rlo); dec <= rhi; dec++){
    var y = Y(Math.pow(10, dec));
    g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
    g.fillText("1e" + dec, 3, y + 3);
  }
  g.strokeStyle = "#4fd1ff"; g.lineWidth = 2; g.beginPath();
  for (i=0;i<rows.length;i++){
    var px = X(rows[i].asked), py = Y(rows[i].perSec);
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.stroke();
  for (i=0;i<rows.length;i++){
    g.fillStyle = rows[i].finished ? "#3fd18a" : "#ff5b4d";
    g.beginPath(); g.arc(X(rows[i].asked), Y(rows[i].perSec), 3.4, 0, 6.283); g.fill();
  }
  g.fillStyle = "#9fb6c9";
  g.fillText("Rounds asked across, rounds a second up, both logarithmic. "
    + "A red dot is a rung the clock cut short.", L, H - 6);
}

/* ================= the check ================= */
function selfCheck(){
  var fails = [], i;

  if (document.querySelector("pre, code, textarea"))
    fails.push("There is a code block on the page.");
  var OK_EXTRA = "…–—·";
  var topText = document.getElementById("bar").textContent + " "
              + document.getElementById("top").textContent;
  var odd = [], c, j;
  for (j=0;j<topText.length;j++){
    c = topText.charCodeAt(j);
    if (c >= 32 && c < 127) continue;
    if (c === 9 || c === 10 || c === 13) continue;
    if (OK_EXTRA.indexOf(topText.charAt(j)) >= 0) continue;
    if (odd.indexOf(topText.charAt(j)) < 0) odd.push(topText.charAt(j));
  }
  if (odd.length) fails.push("There is a picture glyph in the top text: " + odd.join(" "));
  if (!/^\d{14}$/.test(stampNow())) fails.push("The clock stamp is not 14 digits.");

  var money = document.getElementById("pg").innerText
              .match(/\b(free|price|prices|cost|costs|billed|billing|cheap|expensive)\b/i);
  if (money) fails.push("There is price wording on the page: " + money[0]);

  /* A RATE MUST NEVER BE WORKED FROM ROUNDS THAT WERE NOT DONE. This
     is the one that matters here: a rung cut short still has an
     honest rate, but only if it is divided by what was completed. */
  for (i=0;i<rows.length;i++){
    var r = rows[i];
    if (r.done > r.asked)
      fails.push("A rung reports more rounds done than were asked for.");
    if (r.done > 0 && r.ms > 0){
      var expect = r.ms * 1e6 / r.done;
      if (Math.abs(expect - r.nsEach) > 0.001)
        fails.push("A rung reports a time that does not match the rounds it did.");
    }
    if (!r.finished && r.done >= r.asked)
      fails.push("A rung is marked cut short but reached its count.");
    if (!isFinite(r.nsEach) || !isFinite(r.perSec))
      fails.push("A rung reports a figure that is not a number.");
  }

  /* ONE LINE, AND NOTHING ADDED TO IT. This check used to insist a
     second line was present; it is asked for gone, so it now refuses
     one instead. Deleting the check altogether would have left
     nothing standing between a later build and the line returning. */
  if (document.getElementById("crBiz"))
    fails.push("A second copyright line is on the page. There must be only one.");

  var el = document.getElementById("chk");
  if (fails.length){
    el.style.display = "";
    el.innerHTML = '<b class="n">THIS RUN IS NOT REPORTING CLEANLY</b><br>'
                 + fails.join("<br>");
  } else { el.style.display = "none"; el.innerHTML = ""; }
  window.__fails = fails;
  return fails;
}

/* ================= wiring ================= */
(function(){
  var ks = document.getElementById("kind"), i, o;
  for (i=0;i<KINDS.length;i++){
    o = document.createElement("option"); o.value = KINDS[i]; o.textContent = KINDS[i];
    ks.appendChild(o);
  }
  ks.onchange = function(){ kind = this.value; render(); };
  var ss = document.getElementById("seed");
  for (i=0;i<SEEDS.length;i++){
    o = document.createElement("option"); o.value = String(SEEDS[i]);
    o.textContent = num(SEEDS[i]);
    ss.appendChild(o);
  }
  ss.onchange = function(){ seed = Number(this.value); render(); };
})();
document.getElementById("go").onclick = runLadder;
document.getElementById("stop").onclick = function(){ stopAsked = true; };
render();

/* IT STARTS ITSELF. HIS RULE: no page waits for a button being
   pressed. The ladder begins as soon as the page is up, so whoever
   opens it is looking at figures from their own machine rather than
   at an empty table and an instruction. The button stays, for running
   it again or after changing the calculation. */
setTimeout(runLadder, 60);

/* ---- hooks, for checking from outside ---- */
window.__selfCheck = selfCheck;
window.__putGlyph = function(g){
  document.getElementById("topText").textContent += " " + g; };
window.__setKind = function(k){ kind = k;
  document.getElementById("kind").value = k; render(); };
window.__setSeed = function(s){ seed = s;
  document.getElementById("seed").value = String(s); render(); };
window.__run = function(){ runLadder(); };
window.__read = function(){ return {
  running: running, kind: kind, seed: seed,
  ladder: LADDER, kinds: KINDS, seeds: SEEDS,
  rows: rows, repeats: repeats, fails: window.__fails,
  capMs: CAP_MS, stamp: stampNow(),
  bar: document.getElementById("line").textContent }; };
</script>
</body></html>
