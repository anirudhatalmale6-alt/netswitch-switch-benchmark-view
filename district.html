<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DISTRICT ELECTRICITY MAPS</title>
<style>
  :root{ --bg:#05080c; --panel:#0a121a; --line:#16293a; --ink:#d7e6f2; --ink2:#8ea9c2; --muted:#6d8ba3; --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b; }
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;display:flex;align-items:baseline;gap:8px;padding:6px 10px;font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:58px 12px 70px;max-width:1200px}
  h2{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:400;margin:16px 0 6px;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
  .pair{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:10px}
  @media (max-width:720px){ .pair{grid-template-columns:1fr} }
  .zwrap{position:relative} .zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
  .zb button{min-width:34px;height:30px;background:#16293a;color:#d7e6f2;border:1px solid #2b3d50;border-radius:4px;font:700 14px ui-monospace,monospace;cursor:pointer;padding:0 6px}
  canvas{display:block;width:100%;height:400px;touch-action:pan-y}
  .zhint{font-size:10px;color:#6d8ba3;margin-top:4px}
  .flist{max-height:520px;overflow:auto} .flist td{font-size:11px} .flist th{position:sticky;top:0;background:var(--panel)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-weight:400;padding:3px 4px;border-bottom:1px solid var(--line);letter-spacing:1px;font-size:9px;white-space:nowrap}
  td{padding:4px;border-bottom:1px solid #0e1a26;vertical-align:top;font-variant-numeric:tabular-nums;font-size:12px}
  td.k{color:var(--ink2)} td.v{color:var(--ink);font-weight:700}
  tr.sel td{background:#13263a}
  .chip{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:700;font-size:10px;color:#05080c;white-space:nowrap}
  .c-ok{background:var(--ok)} .c-warn{background:var(--warn)} .c-crit{background:var(--crit)}
  select,input{background:#0e1a26;color:var(--ink);border:1px solid #2b3d50;border-radius:4px;padding:6px;font:inherit}
  .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px}
  .leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;text-decoration:none;border-radius:4px;padding:8px 12px;font-size:12px;box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
  #cr{margin-top:14px;padding:3px 7px;display:inline-flex;align-items:center;gap:6px;background:#d0cefd;border-radius:3px}
  #cr img{width:17px;height:auto;display:block}
  #crText{color:#12261a;font-weight:400;font-size:9px;line-height:1.2;white-space:nowrap}
</style></head><body>

/* ==================================================================
   DISTRICT ELECTRICITY MAPS - three ways to build the same district.

   ANY PLACE in Finland, all 308 municipalities, real populations. One
   district is one 110/20 kV primary substation and its 20 kV feeders,
   each feeder carrying secondary substations (20/0,4 kV) that feed the
   homes. A big town has many districts; the page draws one, sized to
   the homes it serves; a small place is one district on its own.

   THREE WAYS, as in the lecture slides:
   1 RADIAL WITH TIES - each feeder a tree with branches, its far ends
     tied to the next feeder through switches kept open.
   2 DUAL CABLE - every secondary substation on two cables from two
     feeders; a fault on one cable is ridden through on the other.
   3 LOOP - feeders joined in pairs into loops, run open at one point;
     a fault is cut out between two switches and the open point closed.

   FAULTS, one every few seconds on each map, are LISTED BESIDE THE MAP
   as a control room lists them: time, station, feeder, fault current,
   the distance worked out from it, every place on the feeder at that
   distance (a branched feeder has several), and where it was found.

   FINDING THE FAULT is impedance based: the relay sees the reactance
   to the fault, which an arc does not change, and divides by the
   reactance per km. The arc's resistance - from the slide, 8750 times
   the arc length over the current to the power 1,4 - lowers the
   current and is shown. Everything electrical here is modelled from
   the cable data; the places and people are real.
   ================================================================== */
