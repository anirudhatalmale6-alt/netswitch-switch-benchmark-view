<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMPARE TWO DEVICES</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 5px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  th{color:#6d8ba3;font-weight:400;padding:3px 4px;text-align:right;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child{text-align:left}
  td{padding:4px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2}
  .me{color:#4fd1ff;font-weight:700}
  .them{color:#ffc24f;font-weight:700}
  .win{color:#3fd18a;font-weight:700}.lose{color:#ff8a7a;font-weight:700}
  .same{color:#8ea9c2}
  .n{color:#e0645f}
  #link{margin-top:6px;padding:9px 11px;background:#0a121a;
    border:1px solid #16293a;border-radius:5px;color:#7ee787;
    font-size:11px;word-break:break-all;line-height:1.6}
  #warn{margin-top:10px;padding:8px 10px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.6}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B39</b><i id="line">measuring this device&hellip;</i></div>
<div id="pg" style="padding-top:60px">

  <h2 id="hdr">This device</h2>
  <table id="tCmp"><thead><tr>
    <th>what</th><th class="me">this</th><th class="them" id="thCol">other</th>
    <th>ratio</th>
  </tr></thead><tbody id="body"></tbody></table>

  <div id="warn" style="display:none"></div>

  <h2>Carry this device over to another one</h2>
  <div id="link">measuring&hellip;</div>

  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   COMPARING TWO DEVICES - processors, memory, screen, and the tack.

   Everything until now measured one machine. A single machine's
   numbers cannot say whether a processor is fast; they only say what
   it did that afternoon. This page measures the device it is on,
   packs every reading into a short code, and puts that code in a
   link. Open that link on a second device and the second device shows
   both sets side by side with the ratio between them.

   NO BUTTON AND NOTHING TO TYPE. The readings travel in the address
   itself, so carrying them across is sending a link. It works off a
   disc as well as over a network.

   THE CODE CARRIES ITS OWN VERSION. A code is a row of numbers in a
   fixed order, and the one thing that must never happen is a later
   version reading an older code with the fields shifted along by one
   - every figure would be wrong, every ratio would be wrong, and all
   of it would look perfectly reasonable. A code from a version this
   page does not know is refused and said so, not decoded hopefully.

   WHAT IS COMPARABLE AND WHAT IS NOT. Some of these are the device:
   the processors, the screen, the tack. Some are the browser's policy
   rather than the hardware - the heap ceiling is handed out by the
   browser and two phones with identical memory can report different
   ceilings. Those are listed but marked, and left out of the verdict,
   because a comparison that quietly includes them is comparing
   browser settings and calling it hardware.
   ================================================================== */

var VERSION = 1;

/* THE SEPARATOR MUST NOT BE A CHARACTER THE FIGURES THEMSELVES USE.
   Joining with a full stop looked fine and was wrong: every decimal
   point became a separator, so fifteen figures went out and
   twenty-five came back. The page's own check caught it - a code has
   to survive being written and read back before anything is compared
   - but the lesson is the general one. An underscore cannot appear in
   a number, so it can safely stand between them. */
var SEP = '_';

/* name, how to read it, unit, higher-is-better, is it really the device */
var FIELDS = [
  ['processors',          'count',  '',        1, 1],
  ['work rate, all',      'mops',   'Mop/s',   1, 1],
  ['work rate, each',     'mopsEa', 'Mop/s',   1, 1],
  ['tack, nearest level', 'near',   'ns',      0, 1],
  ['tack, main memory',   'main',   'ddr',     0, 1],
  ['tack, the spread',    'ratio',  'x',       0, 1],
  ['memory fitted',       'mem',    'GB',      1, 1],
  ['screen, across',      'sw',     'px',      1, 1],
  ['screen, down',        'sh',     'px',      1, 1],
  ['screen, dots per px', 'dpr',    '',        1, 1],
  ['screen, refresh',     'hz',     'Hz',      1, 1],
  ['screen, colour',      'depth',  'bits',    1, 1],
  ['storage allowance',   'store',  'GB',      1, 0],
  ['heap ceiling',        'heap',   'MB',      1, 0],
  ['how busy while measured', 'busy', 'ms late', 0, 0]
];
var ORDER = FIELDS.map(function(f){ return f[1]; });

/* EVERY FIGURE STARTS AT NOUGHT RATHER THAN MISSING. The page draws
   once the moment it opens, before anything has been measured, and if
   a code is already in the address it draws a full comparison at that
   moment. With the readings merely absent, the first draw reached
   into a figure that was not there yet and threw - which killed the
   script before a single measurement was taken. The page then sat
   showing the other device and nothing of its own, for ever, with no
   sign of what had gone wrong.

   It only happens when a code IS in the address, which is the one
   path that matters: the second device opening the link. The first
   device never sees it. */
var me = {}, them = null, themErr = '', done = false;
ORDER.forEach(function(k){ me[k] = 0; });

/* ---------------- measuring this device ---------------- */
var guard = 0;

function ring(kb){
  var n = kb*1024/4, a = new Int32Array(n), idx = new Int32Array(n), i, j, t;
  for (i=0;i<n;i++) idx[i] = i;
  for (i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  for (i=0;i<n;i++) a[idx[i]] = idx[(i+1)%n];
  return a;
}
function chase(a, ms){
  var p = 0, steps = 0, t0 = performance.now(), t1;
  do { for (var k=0;k<20000;k++) p = a[p]; steps += 20000; t1 = performance.now(); }
  while (t1 - t0 < ms);
  guard = p;
  return (t1 - t0) * 1e6 / steps;
}
/* twice, quicker kept - interference can only ever make a reading
   come out too slow, so the faster pass is the less disturbed one */
function best(a, ms){ var x = chase(a, ms), y = chase(a, ms); return Math.min(x, y); }

/* how late a 100 ms timer runs: if the machine was busy while these
   readings were taken, they are not worth comparing and the page says
   so rather than presenting them as a clean result */
var lateMs = 0;
(function(){ var want = 100, prev = performance.now();
  setInterval(function(){ var now = performance.now(), late = now - prev - want;
    prev = now; if (late < 0) late = 0;
    lateMs = lateMs*0.6 + late*0.4; }, want); })();

/* the screen's refresh rate, from the shortest gap between frames */
var hzBest = 1e9;
(function(){ var last = 0;
  function f(now){ requestAnimationFrame(f);
    if (last){ var g = now - last; if (g > 1 && g < hzBest) hzBest = g; }
    last = now; }
  requestAnimationFrame(f); })();

function cores(cb){
  var N = navigator.hardwareConcurrency || 1, got = [], back = 0;
  var src = "onmessage=function(e){var t0=performance.now(),x=0,n=0;" +
    "do{for(var i=0;i<200000;i++){x+=(i&15)+1;}n+=200000;}" +
    "while(performance.now()-t0<e.data);" +
    "postMessage({mops:(n/(performance.now()-t0))/1000,g:x});};";
  var url;
  try { url = URL.createObjectURL(new Blob([src], {type:'text/javascript'})); }
  catch(e){ cb(null); return; }
  var finished = false;
  for (var i=0;i<N;i++){
    (function(k){
      var w;
      try { w = new Worker(url); } catch(e){ return; }
      w.onmessage = function(e){
        got[k] = e.data.mops; w.terminate();
        if (++back === N && !finished){ finished = true; cb(got); }
      };
      w.onerror = function(){ if (++back === N && !finished){ finished = true; cb(got); } };
      w.postMessage(140);
    })(i);
  }
  /* a processor that never answers must not hang the page for ever */
  setTimeout(function(){ if (!finished){ finished = true; cb(got); } }, 6000);
}

function measure(){
  var small = ring(16), big = ring(65536);
  var near = best(small, 45), main = best(big, 60);
  var m = window.performance && performance.memory;

  me = {
    count: navigator.hardwareConcurrency || 0,
    mops: 0, mopsEa: 0,
    near: near, main: main, ratio: near > 0 ? main/near : 0,
    mem: navigator.deviceMemory || 0,
    sw: screen.width, sh: screen.height,
    dpr: window.devicePixelRatio || 1,
    hz: hzBest < 1e9 ? 1000/hzBest : 0,
    depth: screen.colorDepth || 0,
    store: 0,
    heap: m ? m.jsHeapSizeLimit/1048576 : 0,
    busy: lateMs
  };
  render();

  if (navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){
      me.store = (e.quota || 0)/1073741824; render();
    }).catch(function(){ render(); });
  }
  cores(function(list){
    if (list && list.length){
      var sum = 0, n = 0;
      list.forEach(function(v){ if (v){ sum += v; n++; } });
      me.mops = sum; me.mopsEa = n ? sum/n : 0;
    }
    me.hz = hzBest < 1e9 ? 1000/hzBest : 0;
    me.busy = lateMs;
    done = true;
    render(); selfCheck();
  });
}

/* ---------------- the code, and the link ----------------
   Fixed order, rounded to what is worth carrying, joined with dots,
   with the version on the front. Short enough to survive being sent
   as a link and read back without a scrollbar. */
function encode(d){
  var parts = ORDER.map(function(k){
    var v = d[k];
    if (typeof v !== 'number' || !isFinite(v)) v = 0;
    return Math.round(v * 1000) / 1000;
  });
  return 'v' + VERSION + SEP + parts.join(SEP);
}
function decode(s){
  if (!s) return null;
  var bits = String(s).split(SEP);
  if (bits[0] !== 'v' + VERSION)
    throw new Error('this code was written by a different version (' +
                    bits[0] + '), so its figures are not in the order ' +
                    'read here');
  if (bits.length !== ORDER.length + 1)
    throw new Error('this code carries ' + (bits.length-1) + ' figures, ' +
                    'and ' + ORDER.length + ' are expected');
  var out = {}, i;
  for (i=0;i<ORDER.length;i++){
    var v = parseFloat(bits[i+1]);
    if (!isFinite(v)) throw new Error('figure ' + (i+1) + ' is not a number');
    out[ORDER[i]] = v;
  }
  return out;
}

/* ---------------- the listing ---------------- */
function fmt(v, u){
  if (v === undefined || v === null || !isFinite(v) || v === 0) return '-';
  if (u === 'ns' || u === 'ddr') return v.toFixed(v < 10 ? 2 : 1);
  if (u === 'x') return v.toFixed(0) + 'x';
  if (u === 'GB' || u === '') return v.toFixed(v < 10 ? 2 : 0);
  return Math.round(v).toLocaleString();
}
function render(){
  var rows = '', wins = 0, losses = 0;
  FIELDS.forEach(function(f){
    var label = f[0], key = f[1], unit = f[2], up = f[3], real = f[4];
    var a = me[key], b = them ? them[key] : null;
    var cell = '-', cls = 'same';
    if (them && a && b){
      var r = up ? a/b : b/a;          /* above 1 means this device leads */
      cell = r.toFixed(2) + 'x';
      if (r > 1.03){ cls = 'win'; if (real) wins++; }
      else if (r < 0.97){ cls = 'lose'; if (real) losses++; }
      else cls = 'same';
    }
    rows += '<tr><td>' + label + (real ? '' : ' <span class="n">*</span>') +
      '</td><td class="me">' + fmt(a, unit) +
      (unit && unit !== 'x' && unit !== 'ddr' ? ' <span style="color:#4a6076">' +
        unit + '</span>' : '') +
      '</td><td class="them">' + (them ? fmt(b, unit) : '&mdash;') +
      '</td><td class="' + cls + '">' + cell + '</td></tr>';
  });
  document.getElementById('body').innerHTML = rows;

  var w = document.getElementById('warn'), msg = [];
  if (themErr) msg.push('<b>The other device was not read.</b> ' + themErr);
  if (them) msg.push('A star marks a figure that is the browser’s ' +
    'policy rather than the hardware — shown, but kept out of the count.');
  if ((me.busy || 0) > 8 || (them && (them.busy || 0) > 8))
    msg.push('<b>One of these was measured on a busy machine</b> ' +
      '(this one ' + (me.busy||0).toFixed(0) + ' ms late' +
      (them ? ', the other ' + (them.busy||0).toFixed(0) + ' ms' : '') +
      '). Readings taken under load come out slow, so this comparison ' +
      'is not worth much until both are quiet.');
  w.style.display = msg.length ? '' : 'none';
  w.innerHTML = msg.join('<br><br>');

  var code = encode(me);
  var base = location.href.split('#')[0];
  document.getElementById('link').textContent = base + '#' + code;
  document.getElementById('hdr').textContent =
    them ? 'This device against the other' : 'This device';
  document.getElementById('thCol').textContent = them ? 'other' : 'no other yet';

  document.getElementById('line').textContent =
    (them ? 'TWO DEVICES' : 'ONE DEVICE') +
    ' CPU' + (me.count || '-') +
    ' MOP' + (me.mops ? Math.round(me.mops) : '-') +
    ' NEAR' + fmt(me.near, 'ns').replace('.', ',') + 'ns' +
    ' MAIN' + fmt(me.main, 'ddr') + 'ns' +
    ' SCREEN' + me.sw + 'x' + me.sh +
    ' HZ' + (me.hz ? Math.round(me.hz) : '-') +
    (them ? ' AHEAD' + wins + '/' + (wins+losses) : '');
}

/* ================= the check ==================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* a code must survive being written and read back. If it does not,
     every comparison made from here on is between this device and a
     mangled copy of another one. */
  var back;
  try { back = decode(encode(me)); }
  catch(e){ fails.push('a fresh code will not read back: ' + e.message); }
  if (back) ORDER.forEach(function(k){
    var a = Math.round((me[k]||0)*1000)/1000;
    if (Math.abs(back[k] - a) > 1e-9)
      fails.push(k + ' came back as ' + back[k] + ' instead of ' + a);
  });

  /* A DEVICE COMPARED WITH ITSELF MUST BE DEAD LEVEL. If any ratio
     drifts off 1, the two columns are not being lined up field for
     field and the whole table is nonsense.

     THE COMPARISON IS AGAINST THE ROUNDED FIGURE, because rounding is
     what the code deliberately does - three decimals is all that is
     worth carrying. Comparing the rounded value back against the full
     one reports a failure every time and is just the rounding being
     rediscovered, not a fault. */
  if (back) ORDER.forEach(function(k){
    var a = Math.round((me[k]||0)*1000)/1000;
    if (!a) return;
    var r = a/back[k];
    if (Math.abs(r - 1) > 1e-9)
      fails.push(k + ' against itself is ' + r.toFixed(9) + ', not 1');
  });

  /* a code from another version must be REFUSED, not read hopefully */
  var refused = false;
  try { decode('v' + (VERSION+1) + '.' + ORDER.map(function(){ return 1; }).join('.')); }
  catch(e){ refused = true; }
  if (!refused) fails.push('a code from a later version was accepted');

  /* and so must one with the wrong number of figures */
  var shortRefused = false;
  try { decode('v' + VERSION + '.1.2.3'); }
  catch(e){ shortRefused = true; }
  if (!shortRefused) fails.push('a code with figures missing was accepted');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THESE READINGS DO NOT HOLD TOGETHER</b><br>' +
      fails.join('<br>') + '<br>Nothing above should be trusted.';
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__cmpFails = fails;
}

/* ---------------- the other device, out of the address ---------------- */
function readHash(){
  var h = location.hash.replace(/^#/, '');
  them = null; themErr = '';
  if (!h) return;
  try { them = decode(h); }
  catch(e){ themErr = e.message; }
}
window.addEventListener('hashchange', function(){ readHash(); render(); });

readHash();
render();
setTimeout(measure, 150);

window.__read = function(){ return { me:me, them:them, themErr:themErr,
  done:done, code:encode(me), fails:window.__cmpFails,
  bar:document.getElementById('line').textContent }; };
</script>
</body></html>
