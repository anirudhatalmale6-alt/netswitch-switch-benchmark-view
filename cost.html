<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COST PER DATA &middot; AI2ORBIT</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #top{padding:58px 10px 0}
  #topText{color:#9fb6c9;font-size:12px}
  #ref{margin-top:5px;color:#4fd1ff;font-weight:700;letter-spacing:1px;
    word-break:break-all;font-size:11px}
  #pg{padding:6px 10px 70px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:15px 0 4px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;color:#6d8ba3;font-weight:400;padding:3px 4px;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{padding:3px 4px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td.k{color:#8ea9c2;text-align:left;white-space:normal}
  td.v{color:#eaf6ff;font-weight:700}
  td.u{color:#4a6076;font-weight:400;text-align:left;white-space:normal}
  .m{color:#3fd18a}.r{color:#d8a53f}.n{color:#e0645f}.sub{color:#4a6076}
  .money{color:#7ee787;font-weight:700}
  .send{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  .send input{background:#070d15;color:#eaf6ff;border:1px solid #1d3448;
    border-radius:4px;padding:7px 10px;font-family:inherit;font-size:12px;width:110px}
  .send label{color:#9fb6c9;font-size:11px}
  .send button{color:#05080c;background:#4fd1ff;border:0;border-radius:4px;
    padding:7px 11px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}
  #chk{margin-top:10px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;
    text-decoration:none;border-radius:4px;padding:8px 12px;font-size:12px;
    box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. ONE LINE OF
     COPYRIGHT, nothing beside it. */
  /* THE PURPLE WAS THE MARK'S OWN BACKGROUND. The supplied jpeg is
     that colour across four fifths of itself, and the panel was set
     to match so the mark would not sit in a box of its own. Matching
     it made a purple bar right across the page. The panel is now only
     as wide as what is in it, so there is no bar - and the mark is
     still untouched and still beside the phrase. */
</style></head><body>

<div id="bar"><b id="stamp">B83</b><i id="line">Measuring the data&hellip;</i></div>

<div id="top">
  <div id="topText">Cost Per Data. The bytes this device really moves, measured,
    and what they come to a day once you give the rate.</div>
  <div id="ref">&nbsp;</div>
</div>

<div id="pg">

  <h2>The Bytes, Measured</h2>
  <table id="tBytes"></table>
  <div id="bytesSay" style="margin-top:6px;color:#9fb6c9"></div>

  <h2>The Rate, Which Only You Know</h2>
  <div class="send">
    <label>Euro A Gigabyte</label><input id="eur" type="text" inputmode="decimal" placeholder="0,45">
    <label>Dollar A Gigabyte</label><input id="usd" type="text" inputmode="decimal" placeholder="0,50">
    <label>Hours A Day</label><input id="hrs" type="text" inputmode="decimal" placeholder="24">
    <label>Devices In The Fleet</label><input id="fleet" type="text" inputmode="numeric" placeholder="1">
    <button id="btnUse">Use These</button>
  </div>

  <h2>What It Comes To</h2>
  <table id="tMoney"></table>
  <div id="moneySay" style="margin-top:6px;color:#9fb6c9"></div>

  <h2>What The Link Claims Against What It Did</h2>
  <table id="tLink"></table>

  <div id="chk" style="display:none"></div>

</div>

<div id="always">
  <a id="dlDxf" class="alt" download="cost-per-data.dxf">DXF</a>
  <a id="dlTxt" download="cost-per-data.txt">Download</a>
</div>

<script>
/* ==================================================================
   COST PER DATA.

   THE SPLIT THIS PAGE IS BUILT ON. Bytes are a measurement. A rate is
   not - it is a contract, and it differs by carrier, by country and
   by month. So this page MEASURES the bytes and ASKS for the rate,
   and it will not print a money figure until the rate is given. There
   is no built-in rate, no typical rate and no suggested rate
   anywhere in it.

   HOW THE BYTES ARE COUNTED. The browser keeps a record of every file
   this page fetched and how many bytes went over the wire for each,
   including the headers. That is read rather than estimated. Then a
   measured download of known size gives the rate the link actually
   managed.

   THE TRAP, AND IT IS A REAL ONE. A file that came out of the cache
   reports NOUGHT bytes transferred, because none were. A page that
   added those up without looking would report a device that moves no
   data at all, and the cost would come out as nothing. So the count
   separates what really crossed the wire from what was served from
   the cache, and says how many of each.

   A LINK'S CLAIM IS NOT A MEASUREMENT. Some browsers report a
   downlink speed. That figure is an estimate the browser keeps, often
   rounded and often stale. It is printed as a claim, next to what the
   link actually did, and the two are never mixed.
   ================================================================== */

var PROBE_FILES = ['lines.html', 'both.html', 'bits.html'];
var GB = 1000000000;            /* a gigabyte as a carrier bills it */

/* A WORKED EXAMPLE, SO THERE IS A COST ON SCREEN THE MOMENT THE PAGE
   OPENS. Every row built from it is marked as an example, and the
   rate sits in the boxes above where it can be changed. This is not
   a claim about anybody's tariff - it is arithmetic with a figure
   that is shown rather than hidden, which is the opposite of
   inventing one. */
var EXAMPLE = { eur: 0.45, usd: 0.50, hrs: 8, fleet: 1, example: true };

var res = null, probe = null, rates = null, fails = [];

function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){
  var d = new Date();
  return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate())
       + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}
function comma(n){
  var s = Math.round(n).toString(), o = '', i, c = 0;
  for (i = s.length - 1; i >= 0; i--){ o = s[i] + o; if (++c % 3 === 0 && i > 0) o = ' ' + o; }
  return o;
}
function fi(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '-';
  return n.toFixed(d === undefined ? 2 : d).replace('.', ',');
}
function el(id){ return document.getElementById(id); }
function say(s){ el('line').textContent = s; }
var hidden = 0;
/* HIS INSTRUCTION: DO NOT SHOW ITEMS THAT HAVE NO DATA. A row whose
   figure is not available is left off the page entirely rather than
   printed as a blank. How many were left off is counted and said in
   one line at the end, so nothing goes missing quietly. */
function row(t, k, v, u, cls){
  if (v === 'NOT AVAILABLE' || v === null || v === undefined || v === '-'){ hidden++; return; }
  var tr = document.createElement('tr');
  var a = document.createElement('td'); a.className = 'k'; a.textContent = k;
  var b = document.createElement('td'); b.className = 'v ' + (cls || ''); b.textContent = v;
  var c = document.createElement('td'); c.className = 'u'; c.textContent = u || '';
  tr.appendChild(a); tr.appendChild(b); tr.appendChild(c); t.appendChild(tr);
}

/* ================= the bytes this page really moved ================= */
function readResources(){
  var out = { count: 0, overWire: 0, fromCache: 0, cachedBytes: 0, unknown: 0 };
  if (!(window.performance && performance.getEntriesByType)) return out;
  var list = performance.getEntriesByType('resource').concat(
             performance.getEntriesByType('navigation'));
  list.forEach(function(e){
    out.count++;
    if (typeof e.transferSize !== 'number'){ out.unknown++; return; }
    if (e.transferSize > 0) out.overWire += e.transferSize;
    else {
      /* NOUGHT TRANSFERRED MEANS THE CACHE ANSWERED, not that the file
         is empty. decodedBodySize says how big it really is. */
      out.fromCache++;
      out.cachedBytes += (e.decodedBodySize || 0);
    }
  });
  return out;
}

/* ================= what the link actually managed ================= */
/* KEPT APART FROM THE MEASURING so it can be handed known figures.
   Bits a second from bytes and milliseconds - and a download that
   took no measurable time gives NO rate, never an infinite one. */
function mbitPerSec(bytes, ms){
  if (!bytes || !ms || ms <= 0) return null;
  return bytes * 8 / (ms / 1000) / 1000000;
}
function probeLink(then){
  var got = [], i = 0;
  function one(){
    if (i >= PROBE_FILES.length){
      var tot = got.reduce(function(s, g){ return s + g.bytes; }, 0);
      var ms = got.reduce(function(s, g){ return s + g.ms; }, 0);
      then({ files: got, bytes: tot, ms: ms, mbit: mbitPerSec(tot, ms) });
      return;
    }
    var f = PROBE_FILES[i++];
    say('Fetching ' + f);
    var t0 = performance.now();
    /* no-store so the cache cannot answer - a cached fetch measures
       the disk, not the link */
    fetch(f + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(buf){
        got.push({ file: f, bytes: buf.byteLength, ms: performance.now() - t0 });
        one();
      })
      .catch(function(){ got.push({ file: f, bytes: 0, ms: 0, failed: true }); one(); });
  }
  one();
}

/* ================= the money ================= */
/* NO RATE, NO FIGURE. Every money number on this page comes from a
   rate that was typed in. Nothing is assumed and nothing is
   suggested. */
function costPerDay(bytesPerDay, perGb){
  if (perGb === null || perGb === undefined || !isFinite(perGb) || perGb < 0) return null;
  if (!bytesPerDay || !isFinite(bytesPerDay)) return null;
  return bytesPerDay / GB * perGb;
}
function money(v, sym){
  if (v === null) return 'NOT AVAILABLE';
  if (v < 0.01 && v > 0) return 'under ' + sym + '0,01';
  return sym + fi(v, 2);
}

function render(){
  hidden = 0;
  var t = el('tBytes'); t.innerHTML = '';
  if (!res) row(t, 'Measuring', 'please wait', '');
  else {
    row(t, 'Files This Page Fetched', comma(res.count), 'Counted from the browser’s own record');
    row(t, 'Bytes That Crossed The Wire', comma(res.overWire),
        'Headers included. This is what a carrier would count');
    row(t, 'Files The Cache Answered', comma(res.fromCache),
        res.fromCache
          ? 'These moved nothing, and their ' + comma(res.cachedBytes)
            + ' bytes are kept out of the total rather than counted as free data'
          : 'None. Everything came over the wire');
    if (res.unknown)
      row(t, 'Files With No Size Given', comma(res.unknown),
          'Another site’s files do not report their size to this page, so they are '
          + 'left out rather than guessed', 'r');
  }
  if (probe){
    row(t, 'A Measured Download', comma(probe.bytes) + ' bytes',
        'Fetched fresh, cache refused, over ' + fi(probe.ms, 0) + ' ms');
    row(t, 'What The Link Managed',
        probe.mbit === null ? 'too quick to time' : fi(probe.mbit, 2) + ' Mbit a second',
        probe.mbit === null
          ? 'The download finished inside the clock’s own step'
          : 'Measured here, on this connection, just now');
  }
  var bpd = bytesPerDay(), useH = (rates || EXAMPLE).hrs;
  if (bpd !== null)
    row(t, 'At That Rate, Bytes A Day', comma(bpd),
        fi(useH, 0) + ' hours a day at the speed measured above, flat out. '
        + 'Change the hours below to match how the phone is really used');
  el('bytesSay').textContent = res && res.fromCache
    ? 'A file served from the cache reports nought bytes transferred, because nothing '
      + 'crossed the wire. Adding those in as nought without noticing would make a '
      + 'busy device look like it moves no data and cost nothing.'
    : '';

  var tm = el('tMoney'); tm.innerHTML = '';
  /* The rate he typed if there is one, otherwise the worked example.
     It is never shadowed over the real one - a `var` inside a block
     would hoist and quietly replace it for the whole function. */
  var use = rates || EXAMPLE;
  if (res && probe){
    var per = bytesPerDay();
    row(tm, 'One Gigabyte',
        money(costPerDay(GB, use.eur), '€') + '   ' + money(costPerDay(GB, use.usd), '$'),
        use.example
          ? 'An EXAMPLE rate. Put your own in the boxes above and every figure here '
            + 'moves with it'
          : 'The rate you gave', 'money');
    row(tm, 'One Phone, A Day',
        money(costPerDay(per, use.eur), '€') + '   ' + money(costPerDay(per, use.usd), '$'),
        per === null ? '' : comma(per) + ' bytes a day, for one phone, if the link '
          + 'ran flat out for ' + fi(use.hrs, 0) + ' hours. That is the most it could '
          + 'spend, not what it would normally spend', 'money');
    row(tm, 'One Phone, A Month Of Thirty Days',
        money(costPerDay(per === null ? null : per * 30, use.eur), '€') + '   '
        + money(costPerDay(per === null ? null : per * 30, use.usd), '$'), '', 'money');
    if (use.fleet > 1){
      row(tm, 'The Fleet Of ' + comma(use.fleet) + ', A Day',
          money(costPerDay(per === null ? null : per * use.fleet, use.eur), '€') + '   '
          + money(costPerDay(per === null ? null : per * use.fleet, use.usd), '$'), '', 'money');
      row(tm, 'The Fleet Of ' + comma(use.fleet) + ', A Year Of 365 Days',
          money(costPerDay(per === null ? null : per * use.fleet * 365, use.eur), '€') + '   '
          + money(costPerDay(per === null ? null : per * use.fleet * 365, use.usd), '$'), '', 'money');
    }
    row(tm, 'What One Load Of This Page Cost',
        money(costPerDay(res.overWire, use.eur), '€') + '   '
        + money(costPerDay(res.overWire, use.usd), '$'),
        comma(res.overWire) + ' bytes, measured on this very page', 'money');
    el('moneySay').textContent = (use.example
      ? 'Worked with an EXAMPLE rate of 0,45 euro and 0,50 dollar a gigabyte over '
        + 'eight hours a day, because a page that shows nothing until you type is no '
        + 'use to anybody. It is not a real tariff and it is not a quote. Put yours '
        + 'in the boxes above and every figure moves with it. '
      : '')
      + 'The bytes are measured on this phone. The rate is the one thing here that '
      + 'was not measured, which is why it is shown rather than buried. The daily '
      + 'figures assume the link runs flat out for every one of those hours, so they '
      + 'are a ceiling - real traffic sits well under it.';
  }

  var tl = el('tLink'); tl.innerHTML = '';
  var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!c){
    row(tl, 'What The Link Claims', 'NOT AVAILABLE',
        'This browser tells a page nothing about the connection. Chrome does, Firefox '
        + 'and Safari do not');
  } else {
    row(tl, 'The Kind It Claims', String(c.effectiveType || 'not said'),
        'The browser’s own label, not a measurement');
    row(tl, 'The Speed It Claims',
        c.downlink ? fi(c.downlink, 2) + ' Mbit a second' : 'not said',
        'An estimate the browser keeps. It is rounded and it can be stale');
    row(tl, 'The Delay It Claims', c.rtt ? comma(c.rtt) + ' ms' : 'not said',
        'Also an estimate, usually rounded to twenty five');
    if (c.downlink && probe && probe.mbit !== null)
      row(tl, 'The Claim Against What It Did',
          fi(probe.mbit / c.downlink, 2) + ' times',
          probe.mbit > c.downlink
            ? 'The link did better than the browser claimed'
            : 'The link did worse than the browser claimed',
          Math.abs(probe.mbit / c.downlink - 1) < 0.3 ? 'm' : 'r');
  }
  if (hidden){
    var hn = document.createElement('div');
    hn.style.cssText = 'margin-top:6px;color:#4a6076;font-size:11px';
    hn.textContent = hidden + ' row' + (hidden === 1 ? '' : 's')
      + ' left off this page because there is no figure behind them.';
    el('tLink').parentNode.insertBefore(hn, el('tLink').nextSibling);
  }
  refreshDownloads();
}

function bytesPerDay(){
  var use = rates || EXAMPLE;
  if (!probe || probe.mbit === null) return null;
  return probe.mbit * 1000000 / 8 * 3600 * use.hrs;
}

/* ================= the page checks itself ================= */
function selfCheck(){
  var f = [], txt = el('pg').innerText;
  if (document.querySelectorAll('pre, code, textarea').length)
    f.push('a source block reached the page');
  if (/[☺-➿\ud83c-􏰀-\udfff]/.test(el('topText').textContent))
    f.push('a picture glyph is in the top text');
  if (/\b(Infinity|NaN)\b/.test(txt)) f.push('a figure with no value reached the page');
  if (document.getElementById('crBiz'))
    f.push('a second copyright line is on the page. There must be only one.');
  var ks = el('pg').querySelectorAll('td.k');
  for (var i = 0; i < ks.length; i++){
    var s = ks[i].textContent.trim();
    if (s && /[a-z]/.test(s[0])) f.push('a row does not start with a capital: ' + s);
  }
  /* MONEY IS WANTED ON THIS PAGE - and it may appear ONLY when a rate
     was typed in. Every other page refuses money outright; this one
     refuses money that nothing stands behind, which is the same rule
     doing the same job. */
  /* MONEY MAY APPEAR ONLY WITH A RATE ON SCREEN BEHIND IT - either the
     one he typed, or the worked example, which is printed and
     labelled. What must never happen is a money figure with no rate
     anybody can see. */
  if (/[€$]\s?\d/.test(txt) && !rates && !/EXAMPLE rate/.test(txt))
    f.push('a money figure is on the page with no rate shown behind it');
  /* AND THE EXAMPLE MUST SAY IT IS ONE. */
  if (/[€$]\s?\d/.test(txt) && !rates && !/not a real tariff/.test(txt))
    f.push('the example rate is on the page without saying it is an example');
  fails = f;
  var box = el('chk');
  if (f.length){
    box.style.display = 'block';
    box.innerHTML = '<b>THIS PAGE FAILED ITS OWN CHECK</b><br>' + f.join('<br>');
  } else box.style.display = 'none';
  return f;
}

function textOf(){
  var L = ['COST PER DATA', 'AI2Orbit', 'Taken ' + stampNow(), ''];
  if (res) L.push('Bytes over the wire: ' + comma(res.overWire)
                  + ', files from cache: ' + comma(res.fromCache));
  if (probe && probe.mbit !== null) L.push('Link measured: ' + fi(probe.mbit, 2) + ' Mbit a second');
  if (rates){
    var per = bytesPerDay();
    L.push('Rate given: ' + fi(rates.eur, 4) + ' euro and ' + fi(rates.usd, 4) + ' dollar a gigabyte');
    L.push('One device a day: ' + money(costPerDay(per, rates.eur), '€')
           + ' / ' + money(costPerDay(per, rates.usd), '$'));
    L.push('Fleet of ' + comma(rates.fleet) + ' a year: '
           + money(costPerDay(per * rates.fleet * 365, rates.eur), '€')
           + ' / ' + money(costPerDay(per * rates.fleet * 365, rates.usd), '$'));
  } else L.push('No rate given, so no money figure.');
  return L.join('\n');
}
function dxfOf(){
  var o = [], i;
  function p(a, b){ o.push(a, String(b)); }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  if (probe) probe.files.forEach(function(g, i2){
    p(0, 'LINE'); p(8, 'FETCHES'); p(10, i2 * 20); p(20, 0); p(30, 0);
    p(11, i2 * 20); p(21, g.bytes / 1000); p(31, 0);
    p(0, 'TEXT'); p(8, 'LABELS'); p(10, i2 * 20); p(20, -6); p(30, 0); p(40, 3); p(1, g.file);
  });
  p(0, 'TEXT'); p(8, 'LABELS'); p(10, 0); p(20, -16); p(30, 0); p(40, 4);
  p(1, 'COST PER DATA ' + stampNow());
  p(0, 'ENDSEC'); p(0, 'EOF');
  return o.join('\r\n') + '\r\n';
}
function refreshDownloads(){
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'}));
}

function num(id, dflt){
  var v = parseFloat((el(id).value || '').replace(',', '.'));
  return isFinite(v) && v >= 0 ? v : dflt;
}
function useRates(){
  var e = num('eur', null), d = num('usd', null);
  if (e === null && d === null){ rates = null; render(); selfCheck(); return; }
  rates = { eur: e === null ? 0 : e, usd: d === null ? 0 : d,
            hrs: num('hrs', 24), fleet: Math.max(1, Math.round(num('fleet', 1))) };
  render(); selfCheck();
}

/* ================= start, with nothing to press ================= */
/* THE BOXES SHOW THE FIGURES THAT ARE ACTUALLY IN USE. Leaving them
   empty with a placeholder saying 24 while the page worked on 8 would
   have the screen disagreeing with itself. */
el('eur').value = fi(EXAMPLE.eur, 2);
el('usd').value = fi(EXAMPLE.usd, 2);
el('hrs').value = String(EXAMPLE.hrs);
el('fleet').value = String(EXAMPLE.fleet);
el('btnUse').onclick = useRates;
el('ref').textContent = 'COST PER DATA ' + stampNow();
render();
setTimeout(function(){
  res = readResources(); render();
  probeLink(function(p){
    probe = p; res = readResources();
    say('Done, ' + stampNow());
    render(); selfCheck();
  });
}, 60);

window.__read = function(){
  return { ready: !!probe, bar: el('stamp').textContent + ' ' + el('line').textContent,
           fails: fails, res: res, probe: probe, rates: rates,
           bytesPerDay: bytesPerDay() };
};
window.__mbitPerSec = mbitPerSec;
window.__costPerDay = costPerDay;
window.__setRates = function(r){ rates = r; render(); selfCheck(); };
window.__selfCheck = selfCheck;
window.__putGlyph = function(g){ el('topText').textContent += g; };
</script>
</body></html>
