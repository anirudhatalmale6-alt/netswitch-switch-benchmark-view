<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MENU</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  a.item{display:block;text-decoration:none;color:inherit;
    border:1px solid #16293a;border-radius:5px;padding:9px 11px;
    margin-bottom:7px;background:#0a121a}
  a.item b{color:#4fd1ff;font-size:13px;letter-spacing:.3px}
  a.item span{display:block;color:#8ea9c2;margin-top:3px;font-size:11px}
  a.item u{display:block;color:#4a6076;margin-top:4px;font-size:10px;
    text-decoration:none;word-break:break-all}
  .dl{color:#7ee787}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B74</b><i id="line">every item, and the link to take it away</i></div>
<div id="pg" style="padding-top:58px">
  <h2>Items</h2>
  <div id="items"></div>
  <h2>Taking them away</h2>
  <div id="note" style="color:#8ea9c2;font-size:11px;line-height:1.7"></div>

</div>

<script>
/* ==================================================================
   THE MENU. Every item present, and beside each one the link that
   downloads it rather than opens it.

   THE LIST IS NOT TYPED OUT AND TRUSTED. Each item is fetched when
   this page loads, and one that does not answer is shown as missing
   instead of as a working link. A menu is the one page where a dead
   entry is invisible - it looks exactly like a live one until it is
   tapped, and by then whoever tapped it has decided the product is
   broken.
   ================================================================== */
var ITEMS = [
  ['octets.html', 'Network Octets And Reroute',
   'A packet header, all 20 octets, carried router to router - the octets each hop changes marked, every checksum verified, '
   + 'links cut and the packet rerouted the shortest way round, spoofed and altered packets caught at the border'],
  ['finland.html', 'Finland Grid',
   'The country at once and a local view of each part of it - 28 real places and four supply points, lines cut and the feed '
   + 'rerouted round them, and one 20 kV district of each city with its own fault switched out and fed through a tie'],
  ['grid.html', 'Electric Grid Reroute',
   'A 20 kV, 50 Hz grid that heals itself - a fault trips the breaker, the section is switched out, the breaker closes again '
   + 'and a tie feeds the far side from the other feeder, with every section held to its rating'],
  ['relay.html', 'The Relay Card',
   'The relay data sheet that was sent, made to run at 50 or 60 Hz - a short dip that must not trip, a long one that must, '
   + 'the 1,03 reset band and the 60 ms reset, all checked against the sheet - with the alarm contact levels 0,9 / 0,25 / 0,15 A'],
  ['watch.html', 'The Watch',
   'This device watched the way a server is - processor, graphics, memory, screen, network, battery and storage '
   + 'each checked on a schedule and given OK, WARNING or CRITICAL, with every change of state logged and graphed live, the screen against 80 updates a second'],
  ['referee.html', 'FootballAI Referee',
   'The side plays itself, nine and a goalie, and a referee holds every touch to the rule table - '
   + 'played within 7 s, kicked again within 5 s, back to the goalie within 3 s, a kick for yourself of 18 m, '
   + 'a goal kick within 4 + 10 s - with a goal line camera checked every millisecond'],
  ['pass.html', 'FootballAI Pass',
   'The ball and the pass on the same steering, in real metres on a full pitch - every pass '
   + 'struck hard enough to reach the feet, and timed against what the physics says it should take'],
  ['perf.html', 'Against The Target',
   'The processor on one core and on every core at once, the graphics, the memory by level and the bus - each measured here and set beside the figure you asked for, with the share of it reached'],
  ['cost.html', 'Cost Per Data',
   'The bytes this device really moves, counted from the browser own record and from a measured download - then what they come to a day, a month and a year in euro and dollar, for one device or a whole fleet, once you give the rate'],
  ['power.html', 'Power Going In',
   'What a browser can and cannot be told about watts - it cannot be told any, on any platform - with the one honest route it does have, and a native reader that takes real watts off the hardware counters instead'],
  ['bits.html', 'One Bit, One Byte',
   'What it really costs to change a single bit, which is more than changing a whole byte because no bit has an address of its own - and the same sixty four writes packed into one line against spread one to a line, which is the only honest view of the memory from a browser'],
  ['blink.html', 'The Blinks',
   'The screen own blink, measured three times over and then counted for as long as you '
   + 'leave it running - and the same blinks summed three ways that do not agree, with '
   + 'the reason they cannot agree written underneath'],
  ['all.html', 'All Results',
   'Every local calculation on the machine, started the moment the page opens with nothing to press - the processor on five calculations, the memory at six working sizes, the transform both ways and the key, written out as figures with no chart anywhere'],
  ['both.html', 'Both Directions',
   'The same ladder of work walked upwards and then downwards, with a coefficient per rung showing how much the direction changed it - and any rung that finishes inside one tick of the clock is given no figure at all rather than a figure the clock could not have produced'],
  ['runs.html', 'Calculation Runs',
   'The same calculation from fifty rounds up to a thousand million, with a switch between five different calculations - and any run the clock cuts short says so instead of reporting a figure it never reached'],
  ['lines.html', 'Lines And Switches',
   'Drag to pan anywhere. Lines, switches and their connections load for whatever is in view and are dropped when they leave, so the page never grows as you drag'],
  ['material.html', 'Material Learning',
   'Show the camera a material for thirty seconds and it is recognised again by what it does to light - gloss, grain, and whether its black has structure in it. It says when it does not know'],
  ['threads.html', 'Thread Watchdog',
   'Every thread answers within 150 ms or it is killed and replaced - with one thread hung on purpose so you can watch it being caught. Proved in Chrome, Firefox and Safari'],
  ['report.html', 'AI Cloud Report: keywords to email',
   'Type keywords, the report writes itself out of what the device measures, and goes to Gmail or any mail application already filled in - no server anywhere in it'],
  ['calc.html', 'Processor: primary, secondary, tertiary',
   'The same calculation started at each level of the processor, and what each start adds to it - with the levels found on the chip rather than assumed'],
  ['startup.html', 'Startup and boot, logged',
   'Every leg of the startup timed by the device, an ALogTIME log with no dots in the clock, and a DXF of the whole thing'],
  ['selfplay.html', 'FootballAI: self play + DXF',
   'Nobody steers - the ball finds its own way past 150 obstacles, and the vector exports as DXF'],
  ['steer.html', 'FootballAI: steer',
   'Left, right, straight, back - a run steered on a pitch, with what it costs the device'],
  ['tracker.html', 'Satellite tracker (4-square)',
   'A four-square grid with a diamond inside and 36 markers; a fixed point, and the impossible asks shown honestly'],
  ['soak.html', 'Soak (3 min, 1 min, then looping)',
   'The same work for three minutes, then one, then three on repeat - showing what the machine holds on to'],
  ['looper.html', 'Rate looper (multiples of a base rate)',
   'A loop driven at 15x and 22x a base rate you set, and the multiple where it genuinely breaks'],
  ['bench.html', 'Benchmarker (43 ms looper)',
   'Six code versions, each one instance on its own processor for 43 ms, ranked by what they got through'],
  ['overlap.html', 'Secondary start (overlap)',
   'What starting the secondary before the primary ends is worth, and the honest limit on timing it'],
  ['licence.html', 'Licence tester (for a binary)',
   'Issue a signed licence tied to a binary, and test one - a tampered or expired licence is refused'],
  ['worklist.html', 'Work listing (NFC)',
   'Searchable factory work items, each timestamped; reads NFC tags where the device allows it'],
  ['techspec.html', 'Tech spec: System AI - CPU',
   'What the product measures, how it is verified, and what it honestly will not claim'],
  ['yt.html', 'One search (football, skiing, anything)',
   'One box, one tap, straight into YouTube own player - nothing hosted, copied or restreamed'],
  ['lights.html', 'Audio lights (turn left / right)',
   'Two lamps that turn left and right with the sound - microphone where allowed, a built-in tone otherwise'],
  ['screen.html', 'DDR - CPU - GPU screen',
   'Four live - DDR, CPU, GPU and a graphic-turn - each with a red/blue/yellow on-target mark'],
  ['listing.html', 'Listing',
   'Memory, processors one by one, DDR, NAND, encryption marks, tack with a status'],
  ['commands.html', 'Commands for the phone',
   'Android and Linux, each block marked measured here or not tested here'],
  ['probe.html', 'Probe the five axes',
   'cpuu, cpua, gpuu, gpua and scrpx measured here, as one line the ranking tool can read'],
  ['encrypt.html', 'Encrypt folder, files, encrypt',
   'Draw a shape to lock a folder to this phone; draw it again to open, with a note of when'],
  ['compare.html', 'Compare two devices',
   'Processors, memory, screen and the tack, this device against another'],
  ['ladder.html', 'How long the processor waits',
   'Every level of memory in nanoseconds and in processor work'],
  ['cert.html', 'Certificate',
   'Held in the app, read only, carried ROM to RAM to CPU with each leg timed'],
  ['sigma.html', 'Control chart',
   'Limits on the measured access time, and good against bad by sigma'],
  ['eigen.html', 'Main axis',
   'The two directions the readings move along, off this device'],
  ['slot.html', 'RAM slot',
   'One slot drawn, with processor, graphics lag and delay beside it'],
  ['ramtime.html', 'RAM timing',
   'Read, write and read-write-write-read over rising parts of the chip']
];

function el(tag, cls){ var e = document.createElement(tag);
  if (cls) e.className = cls; return e; }

function build(){
  var box = document.getElementById('items'), live = 0;
  ITEMS.forEach(function(it){
    var a = el('a', 'item');
    a.href = it[0];
    var b = el('b'); b.textContent = it[1]; a.appendChild(b);
    var s = el('span'); s.textContent = it[2]; a.appendChild(s);
    var u = el('u'); u.textContent = 'checking…'; a.appendChild(u);
    box.appendChild(a);

    /* a HEAD asks the server whether the file is there without
       dragging the whole thing down the line */
    fetch(it[0], { method:'HEAD' }).then(function(r){
      if (r.ok){
        live++;
        u.className = 'dl';
        u.textContent = 'present · ' +
          (r.headers.get('content-length')
            ? Math.round(r.headers.get('content-length')/1024) + ' kB · '
            : '') + location.href.replace(/[^/]*$/, '') + it[0];
      } else {
        u.style.color = '#ff5b4d';
        u.textContent = 'MISSING — the server answered ' + r.status;
      }
      bar(live);
    }).catch(function(e){
      /* off a disc there is no server to ask, and that is not a fault */
      u.textContent = location.protocol === 'file:'
        ? 'beside this file on the disc'
        : 'could not be checked: ' + e.message;
      bar(live);
    });
  });

  document.getElementById('note').innerHTML =
    'Every link above opens the item. To keep a copy instead of opening ' +
    'it, hold the link and choose to download.<br><br>' +
    'All of them run off a disc as well as over a network — no server ' +
    'and no certificate needed. Saved into one folder and opened, they ' +
    'behave exactly as they do here.';
}
function bar(live){
  document.getElementById('line').textContent =
    'ITEMS' + ITEMS.length + ' PRESENT' + live +
    (location.protocol === 'file:' ? ' OFFDISC' : ' OVERNET');
}
build(); bar(0);
window.__read = function(){ return { items: ITEMS.length,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
