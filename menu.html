<script>
/* ==================================================================
   THE MENU. Every item present, and beside each one the link that
   downloads it rather than opens it.

   THE LIST IS NOT TYPED OUT AND TRUSTED. Each item is fetched when
   this page loads, and one that does not answer is shown as missing
   instead of as a working link. A menu is the one page where a dead
   entry is invisible - it looks exactly like a live one until it is
   tapped, and by then whoever tapped it has decided the product is
   broken.
   ================================================================== */
var ITEMS = [
  ['material.html', 'Material Learning',
   'Show the camera a material for thirty seconds and it is recognised again by what it does to light - gloss, grain, and whether its black has structure in it. It says when it does not know'],
  ['threads.html', 'Thread Watchdog',
   'Every thread answers within 150 ms or it is killed and replaced - with one thread hung on purpose so you can watch it being caught. Proved in Chrome, Firefox and Safari'],
  ['report.html', 'AI Cloud Report: keywords to email',
   'Type keywords, the report writes itself out of what the device measures, and goes to Gmail or any mail application already filled in - no server anywhere in it'],
  ['calc.html', 'Processor: primary, secondary, tertiary',
   'The same calculation started at each level of the processor, and what each start adds to it - with the levels found on the chip rather than assumed'],
  ['startup.html', 'Startup and boot, logged',
   'Every leg of the startup timed by the device, an ALogTIME log with no dots in the clock, and a DXF of the whole thing'],
  ['selfplay.html', 'FootballAI: self play + DXF',
   'Nobody steers - the ball finds its own way past 150 obstacles, and the vector exports as DXF'],
  ['steer.html', 'FootballAI: steer',
   'Left, right, straight, back - a run steered on a pitch, with what it costs the device'],
  ['tracker.html', 'Satellite tracker (4-square)',
   'A four-square grid with a diamond inside and 36 markers; a fixed point, and the impossible asks shown honestly'],
  ['soak.html', 'Soak (3 min, 1 min, then looping)',
   'The same work for three minutes, then one, then three on repeat - showing what the machine holds on to'],
  ['looper.html', 'Rate looper (multiples of a base rate)',
   'A loop driven at 15x and 22x a base rate you set, and the multiple where it genuinely breaks'],
  ['bench.html', 'Benchmarker (43 ms looper)',
   'Six code versions, each one instance on its own processor for 43 ms, ranked by what they got through'],
  ['overlap.html', 'Secondary start (overlap)',
   'What starting the secondary before the primary ends is worth, and the honest limit on timing it'],
  ['licence.html', 'Licence tester (for a binary)',
   'Issue a signed licence tied to a binary, and test one - a tampered or expired licence is refused'],
  ['worklist.html', 'Work listing (NFC)',
   'Searchable factory work items, each timestamped; reads NFC tags where the device allows it'],
  ['techspec.html', 'Tech spec: System AI - CPU',
   'What the product measures, how it is verified, and what it honestly will not claim'],
  ['yt.html', 'One search (football, skiing, anything)',
   'One box, one tap, straight into YouTube own player - nothing hosted, copied or restreamed'],
  ['lights.html', 'Audio lights (turn left / right)',
   'Two lamps that turn left and right with the sound - microphone where allowed, a built-in tone otherwise'],
  ['screen.html', 'DDR - CPU - GPU screen',
   'Four live - DDR, CPU, GPU and a graphic-turn - each with a red/blue/yellow on-target mark'],
  ['listing.html', 'Listing',
   'Memory, processors one by one, DDR, NAND, encryption marks, tack with a status'],
  ['commands.html', 'Commands for the phone',
   'Android and Linux, each block marked measured here or not tested here'],
  ['probe.html', 'Probe the five axes',
   'cpuu, cpua, gpuu, gpua and scrpx measured here, as one line the ranking tool can read'],
  ['encrypt.html', 'Encrypt folder, files, encrypt',
   'Draw a shape to lock a folder to this phone; draw it again to open, with a note of when'],
  ['compare.html', 'Compare two devices',
   'Processors, memory, screen and the tack, this device against another'],
  ['ladder.html', 'How long the processor waits',
   'Every level of memory in nanoseconds and in processor work'],
  ['cert.html', 'Certificate',
   'Held in the app, read only, carried ROM to RAM to CPU with each leg timed'],
  ['sigma.html', 'Control chart',
   'Limits on the measured access time, and good against bad by sigma'],
  ['eigen.html', 'Main axis',
   'The two directions the readings move along, off this device'],
  ['slot.html', 'RAM slot',
   'One slot drawn, with processor, graphics lag and delay beside it'],
  ['ramtime.html', 'RAM timing',
   'Read, write and read-write-write-read over rising parts of the chip']
];

function el(tag, cls){ var e = document.createElement(tag);
  if (cls) e.className = cls; return e; }

function build(){
  var box = document.getElementById('items'), live = 0;
  ITEMS.forEach(function(it){
    var a = el('a', 'item');
    a.href = it[0];
    var b = el('b'); b.textContent = it[1]; a.appendChild(b);
    var s = el('span'); s.textContent = it[2]; a.appendChild(s);
    var u = el('u'); u.textContent = 'checking…'; a.appendChild(u);
    box.appendChild(a);

    /* a HEAD asks the server whether the file is there without
       dragging the whole thing down the line */
    fetch(it[0], { method:'HEAD' }).then(function(r){
      if (r.ok){
        live++;
        u.className = 'dl';
        u.textContent = 'present · ' +
          (r.headers.get('content-length')
            ? Math.round(r.headers.get('content-length')/1024) + ' kB · '
            : '') + location.href.replace(/[^/]*$/, '') + it[0];
      } else {
        u.style.color = '#ff5b4d';
        u.textContent = 'MISSING — the server answered ' + r.status;
      }
      bar(live);
    }).catch(function(e){
      /* off a disc there is no server to ask, and that is not a fault */
      u.textContent = location.protocol === 'file:'
        ? 'beside this file on the disc'
        : 'could not be checked: ' + e.message;
      bar(live);
    });
  });

  document.getElementById('note').innerHTML =
    'Every link above opens the item. To keep a copy instead of opening ' +
    'it, hold the link and choose to download.<br><br>' +
    'All of them run off a disc as well as over a network — no server ' +
    'and no certificate needed. Saved into one folder and opened, they ' +
    'behave exactly as they do here.';
}
function bar(live){
  document.getElementById('line').textContent =
    'ITEMS' + ITEMS.length + ' PRESENT' + live +
    (location.protocol === 'file:' ? ' OFFDISC' : ' OVERNET');
}
build(); bar(0);
window.__read = function(){ return { items: ITEMS.length,
  bar: document.getElementById('line').textContent }; };
</script>
