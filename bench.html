<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BENCHMARKER &middot; 43 ms LOOPER</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:18px 0 6px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;color:#6d8ba3;font-weight:400;padding:4px 6px;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td.v{color:#eaf6ff;font-weight:700}
  td.win{color:#3fd18a;font-weight:700}
  .bar{display:inline-block;height:9px;background:#2b6ea8;border-radius:2px;
    vertical-align:1px}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.7}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B46</b><i id="line">benchmarking&hellip;</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Six versions, each one instance, 43 ms a run</h2>
  <table id="tV"><thead><tr>
    <th>version (slowest first)</th><th>work rate</th><th></th><th>vs best</th><th>spread</th>
  </tr></thead><tbody id="body"></tbody></table>

  <h2>The run</h2>
  <table id="tRun"></table>

  <h2>Spec numbers, for display</h2>
  <table id="tSpec"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   THE BENCHMARKER - ONE INSTANCE ON THE NATIVE PROCESSOR, A 43 ms
   LOOP, SIX VERSIONS COMPARED.

   Six ways of doing the same arithmetic are each run on their own
   processor for a fixed window of 43 milliseconds, and what each got
   through in that window is the score. The window is the same for all
   six, so the scores are directly comparable - the fastest version is
   simply the one that counted furthest in the same time.

   WHY A FIXED WINDOW AND NOT A FIXED COUNT. A fixed count of work
   would finish in wildly different times on a fast and a slow version,
   and the short ones would fall below the clock and read as noise. A
   fixed window - the "43 ms looper" - gives every version the same
   stretch of real time and asks how far it got, which is the fair
   question and the one that does not sink into timer resolution.

   EACH VERSION IS WARMED BEFORE IT IS SCORED. The first pass through a
   loop pays for the engine compiling it; scoring that pass would rank
   the compiler, not the code. So each runs once, discarded, then three
   scored windows, and the best of the three is kept - a window can
   only be spoiled by the machine being busy, never helped.

   THE SPEC NUMBERS AT THE BOTTOM ARE FOR DISPLAY, NOT SCHEDULED. A
   figure like the 178 ns secondary lead is a spec value to show beside
   the product - it is not something a browser can time to, and it is
   labelled as a shelf figure rather than a measurement, so the two are
   never confused.
   ================================================================== */

var WINDOW_MS = 43;          /* the looper window, as asked */
var WARM = 1, SCORED = 3;    /* one warm-up pass, three scored */

/* six versions of the same sum, each a different shape. The point is
   that they do equivalent arithmetic and the processor runs them at
   different rates - that difference is what the benchmark shows. */
var VERSIONS = [
  { key:'plain',      note:'one accumulator',
    body:"for(var i=0;i<16384;i++){x=(x+i)>>>0;}" },
  { key:'unrolled4',  note:'four at a time',
    body:"for(var i=0;i<16384;i+=4){x=(x+i)>>>0;x=(x+i+1)>>>0;x=(x+i+2)>>>0;x=(x+i+3)>>>0;}" },
  { key:'mul-add',    note:'a multiply in the loop',
    body:"for(var i=0;i<16384;i++){x=(x+i*2654435761)>>>0;}" },
  { key:'xor-shift',  note:'shift and mix',
    body:"for(var i=0;i<16384;i++){x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;}" },
  { key:'two-acc',    note:'two accumulators',
    body:"for(var i=0;i<16384;i+=2){x=(x+i)>>>0;y=(y+i+1)>>>0;}x=(x+y)>>>0;" },
  { key:'branchy',    note:'a branch each step',
    body:"for(var i=0;i<16384;i++){ if(i&1){x=(x+i)>>>0;} else {x=(x^i)>>>0;} }" }
];

/* a worker that runs one version's body in a fixed time window and
   returns how many inner steps it completed */
function workerFor(body){
  var src =
    "onmessage=function(e){var ms=e.data,x=123456789,y=987654321,n=0," +
    "t0=performance.now(),t1;do{" + body + "n+=16384;t1=performance.now();}" +
    "while(t1-t0<ms);postMessage({ops:n,ms:t1-t0,g:(x^y)>>>0});};";
  var url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
  return new Worker(url);
}
function runOnce(w, ms){
  return new Promise(function(res){
    w.onmessage = function(e){ res(e.data); };
    w.postMessage(ms);
  });
}

var results = [], guard = 0, runInfo = {};

function runAll(done){
  var i = 0;
  (function next(){
    if (i >= VERSIONS.length){ finish(); done(); return; }
    var v = VERSIONS[i++];
    var w = workerFor(v.body);
    /* warm, then score */
    var scores = [];
    runOnce(w, WINDOW_MS * WARM).then(function(){
      var k = 0;
      (function score(){
        runOnce(w, WINDOW_MS).then(function(r){
          guard += r.g & 1;
          scores.push({ rate: r.ops / r.ms, ms: r.ms });
          if (++k < SCORED){ score(); return; }
          w.terminate();
          var rates = scores.map(function(s){ return s.rate; });
          var bestRate = Math.max.apply(null, rates);
          var worstRate = Math.min.apply(null, rates);
          results.push({ key: v.key, note: v.note,
            rate: bestRate,                  /* best window, least disturbed */
            spread: bestRate > 0 ? (bestRate - worstRate) / bestRate * 100 : 0,
            ms: scores[0].ms });
          render(); next();
        });
      })();
    });
  })();
}

function finish(){
  var best = Math.max.apply(null, results.map(function(r){ return r.rate; }));
  results.forEach(function(r){ r.vsBest = best > 0 ? r.rate / best : 0; });
  /* SLOWEST FIRST, as asked - the benchmark is looking for the weakest
     performer, so the slowest version leads the table. */
  results.sort(function(a,b){ return a.rate - b.rate; });
  runInfo = { window: WINDOW_MS, warm: WARM, scored: SCORED,
    processors: navigator.hardwareConcurrency || 1, versions: results.length };
  render();
}

/* ---------------- the listing ---------------- */
function kops(rate){ return (rate / 1000); }   /* steps per ms -> k steps/ms */
function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:16%">'+(u||'')+'</td></tr>';
}

function render(){
  var best = Math.max.apply(null, results.map(function(r){ return r.rate; })) || 1;
  var leaders = results.filter(function(r){ return r.vsBest >= 0.999; }).length;
  var rows = '';
  results.forEach(function(r, i){
    var w = Math.round(r.rate / best * 90);
    rows += '<tr><td>' + r.key + ' <span style="color:#4a6076">' + r.note +
      '</span></td><td class="v">' + Math.round(kops(r.rate)).toLocaleString() +
      '</td><td><span class="bar" style="width:' + w + 'px"></span></td>' +
      '<td class="' + (r.vsBest >= 0.999 ? 'win' : '') + '">' +
      (r.vsBest ? (r.vsBest*100).toFixed(0) + '%' +
        (r.vsBest >= 0.999 && leaders > 1 ? ' =' : '') : '-') + '</td>' +
      '<td style="color:#8ea9c2">' + r.spread.toFixed(1) + '%</td></tr>';
  });
  document.getElementById('body').innerHTML = rows ||
    '<tr><td colspan="5" style="color:#6d8ba3">running&hellip;</td></tr>';

  document.getElementById('tRun').innerHTML =
    row('window each run', WINDOW_MS, 'ms', 'm') +
    row('warm-up passes', WARM, '', 'm') +
    row('scored windows, best kept', SCORED, '', 'm') +
    row('processors on this device', navigator.hardwareConcurrency || '?', '', 'm') +
    row('versions compared', results.length + ' of ' + VERSIONS.length, '', 'm');

  /* spec numbers: shelf values, shown but not measured here */
  document.getElementById('tSpec').innerHTML =
    row('secondary lead (spec, not scheduled)', '178', 'ns', 'w') +
    row('looper window', WINDOW_MS, 'ms', 'w') +
    row('note', 'spec values are for display beside the product', '', 'w');

  var slow = results[0], fast = results[results.length-1];
  document.getElementById('line').textContent =
    'WIN' + WINDOW_MS + 'ms' +
    ' VER' + results.length + '/' + VERSIONS.length +
    (slow ? ' SLOWEST:' + slow.key + ' ' + Math.round(kops(slow.rate)).toLocaleString() + 'k' : '') +
    (fast ? ' FASTEST:' + fast.key : '') +
    ' CPU' + (navigator.hardwareConcurrency || '-');
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  if (results.length !== VERSIONS.length)
    fails.push('only ' + results.length + ' of ' + VERSIONS.length + ' versions ran');

  /* every version must have run for about the window, not far short -
     a version that fell below the window was not given a fair run */
  results.forEach(function(r){
    if (r.ms < WINDOW_MS * 0.8)
      fails.push(r.key + ' ran only ' + r.ms.toFixed(0) + ' ms, under the window');
    if (!(r.rate > 0))
      fails.push(r.key + ' scored no work');
  });

  /* exactly one version is the best, and it reads 100 per cent; the
     ranking must be in order */
  var hundred = results.filter(function(r){ return r.vsBest >= 0.999; }).length;
  if (results.length && hundred < 1) fails.push('no version is the benchmark best');
  for (var i = 1; i < results.length; i++){
    /* slowest first: each row must be at least as fast as the one above */
    if (results[i].rate < results[i-1].rate - 1e-9)
      fails.push('the ranking is out of order at ' + results[i].key);
  }

  /* the versions must not all be identical - a benchmark where every
     version scores the same is measuring the harness, not the code.
     (A real device shows spread between these six.) */
  if (results.length === VERSIONS.length){
    var rates = results.map(function(r){ return r.rate; });
    var hi = Math.max.apply(null, rates), lo = Math.min.apply(null, rates);
    if (hi > 0 && (hi - lo) / hi < 0.02)
      fails.push('all six versions scored within 2% - the benchmark is not ' +
                 'telling them apart');
  }

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE BENCHMARK DID NOT RUN CLEANLY</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__bFails = fails;
}

document.getElementById('note').innerHTML =
  '<b>How to read it.</b> Every version ran one instance on its own ' +
  'processor for the same 43 ms. The work rate is how far it counted in ' +
  'that time, so higher is faster, and the best version is 100 per cent. ' +
  'The spread is how much the three scored windows varied - small spread ' +
  'means a steady reading. The 178 ns is a spec value shown for the shelf, ' +
  'not something timed here; a browser cannot schedule to a nanosecond.';

render();
setTimeout(function(){ runAll(function(){ selfCheck(); window.__bDone = true; }); }, 200);

window.__read = function(){ return { results: results, run: runInfo,
  done: !!window.__bDone, fails: window.__bFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
