# XcodeGen spec — generates GGWSysBar.xcodeproj from these Swift sources.
# On a Mac:  brew install xcodegen && xcodegen && open GGWSysBar.xcodeproj
name: GGWSysBar
options:
  bundleIdPrefix: com.ggw
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  GGWSysBar:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggw.sysbar
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: SysBarWidget

  SysBarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggw.sysbar.widget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
