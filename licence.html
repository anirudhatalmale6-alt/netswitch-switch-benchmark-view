<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LICENCE TESTER &middot; FOR A BINARY</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:9px 11px;
    background:#0a121a;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:6px}
  textarea{min-height:70px;resize:vertical;word-break:break-all}
  .lab{color:#8ea9c2;font-size:11px;margin:8px 0 3px}
  button{font:inherit;font-weight:700;letter-spacing:.5px;padding:10px 14px;
    background:#12507f;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:6px;
    cursor:pointer;margin-top:8px}
  .row{display:flex;gap:8px}.row>*{flex:1 1 0}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;text-align:right;
    word-break:break-all}
  td:first-child{text-align:left;color:#8ea9c2;width:42%;word-break:normal}
  .ok{color:#3fd18a;font-weight:700}.bad{color:#ff5b4d;font-weight:700}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #verdict{margin-top:8px;padding:11px 13px;border-radius:6px;font-weight:700;
    border:1px solid #16293a;background:#0a121a}
  #warn{margin-top:12px;padding:10px 12px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.8}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B52</b><i id="line">licence tester</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Issue a licence</h2>
  <div class="lab">who it is for</div>
  <input id="who" value="Acme Oy">
  <div class="row">
    <div><div class="lab">product</div><input id="prod" value="netswitch"></div>
    <div><div class="lab">days valid</div><input id="days" value="365" inputmode="numeric"></div>
  </div>
  <div class="lab">the binary it is tied to (its fingerprint)</div>
  <input id="bin" placeholder="pick a file below, or paste a fingerprint">
  <input type="file" id="file" style="margin-top:8px">
  <button id="make">Issue it</button>
  <div class="lab">the licence</div>
  <textarea id="lic" readonly></textarea>

  <h2>Test a licence</h2>
  <div class="lab">paste a licence to test</div>
  <textarea id="test"></textarea>
  <button id="check">Test it</button>
  <div id="verdict">nothing tested yet</div>
  <table id="tV"></table>

  <div id="warn"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   A LICENCE TESTER FOR A BINARY.

   Two halves, which is how licensing actually works:

     ISSUE   the vendor makes a licence - who it is for, which product,
             how long it runs, and the fingerprint of the exact binary
             it covers - and SIGNS it with a private key.
     TEST    anybody can test a licence with the PUBLIC key: is the
             signature genuine, is it still in date, and does it match
             the binary in front of them.

   THE SIGNATURE IS THE WHOLE POINT. A licence that is only a code
   someone compares against a list can be forged by anyone who sees the
   list. A signed licence cannot be altered at all - change one
   character of the name, the date or the fingerprint and the signature
   stops verifying, which the tester below demonstrates on a real
   licence rather than describing.

   =================================================================
   AND THE HONEST LIMIT, WHICH MATTERS MORE THAN THE FEATURE:

   A CHECK THAT RUNS ON THE CUSTOMER'S MACHINE CAN BE REMOVED FROM THE
   CUSTOMER'S MACHINE. Anything shipped can be read and patched, and
   no amount of cleverness in the shipped code changes that. What
   signing does buy is real and worth having: nobody can MAKE a
   licence they were not given, because the private key never leaves
   the vendor. A customer can disable a check in their own copy; they
   cannot mint licences for the world.

   So: this is honest vendor tooling for issuing and testing. It is
   not copy protection, and I will not call it that.
   =================================================================

   The private key here is generated fresh in this page for the
   demonstration and never leaves it. In the real product the private
   key lives on the vendor's machine only, and the binary ships with
   the public key alone.
   ================================================================== */

var keys = null, pubRaw = null;

function b64(buf){
  var a = new Uint8Array(buf), s = '', i;
  for (i=0;i<a.length;i++) s += String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(s){
  s = String(s).replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  var raw = atob(s), a = new Uint8Array(raw.length), i;
  for (i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i);
  return a;
}
function bytes(s){ return new TextEncoder().encode(s); }
function hexOf(buf){
  var a = new Uint8Array(buf), s = '', i;
  for (i=0;i<a.length;i++) s += ('0'+a[i].toString(16)).slice(-2);
  return s.toUpperCase();
}

function ready(){
  if (keys) return Promise.resolve(keys);
  return crypto.subtle.generateKey({ name:'ECDSA', namedCurve:'P-256' },
    false, ['sign','verify']).then(function(k){
      keys = k;
      return crypto.subtle.exportKey('raw', k.publicKey).then(function(p){
        pubRaw = b64(p); return keys;
      });
    });
}

/* the licence body: plain, readable, so a customer can see what they
   hold. Nothing is hidden - the signature is what makes it genuine,
   not secrecy about the contents. */
function body(who, prod, days, bin){
  var now = Date.now();
  return JSON.stringify({
    who: who, prod: prod,
    from: new Date(now).toISOString().slice(0,10),
    until: new Date(now + days*86400000).toISOString().slice(0,10),
    bin: bin || ''
  });
}

function issue(){
  var who = document.getElementById('who').value.trim() || 'unnamed';
  var prod = document.getElementById('prod').value.trim() || 'product';
  var days = parseInt(document.getElementById('days').value, 10);
  if (!isFinite(days) || days <= 0) days = 365;
  var bin = document.getElementById('bin').value.trim();
  var b = body(who, prod, days, bin);
  return ready().then(function(k){
    return crypto.subtle.sign({ name:'ECDSA', hash:'SHA-256' },
      k.privateKey, bytes(b));
  }).then(function(sig){
    var lic = b64(bytes(b)) + '.' + b64(sig);
    document.getElementById('lic').value = lic;
    document.getElementById('test').value = lic;
    render();
    return lic;
  });
}

function test(lic){
  /* EVERY WAY OUT OF THIS FUNCTION SETS A VERDICT. The early returns
     first left `valid` unset, so anything that could not be read came
     back as neither good nor bad - and a caller reading that field got
     nothing at all rather than a refusal. A licence that cannot be
     read is NOT GOOD, and it must say so in the same word as every
     other failure. */
  var out = { given: !!lic, valid: false, signature: false, inDate: false,
              binMatches: null };
  var parts = String(lic || '').split('.');
  if (parts.length !== 2){
    out.reason = 'this is not a licence - it has no signature on it';
    return Promise.resolve(out);
  }
  var bodyBytes, sigBytes, data;
  try {
    bodyBytes = unb64(parts[0]); sigBytes = unb64(parts[1]);
    data = JSON.parse(new TextDecoder().decode(bodyBytes));
  } catch(e){
    out.reason = 'the licence is damaged and cannot be read';
    return Promise.resolve(out);
  }
  out.data = data;
  return ready().then(function(k){
    return crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' },
      k.publicKey, sigBytes, bodyBytes);
  }).then(function(good){
    out.signature = good;
    var today = new Date().toISOString().slice(0,10);
    out.inDate = (data.until || '') >= today && (data.from || '') <= today;
    var shown = document.getElementById('bin').value.trim();
    out.binMatches = !data.bin ? null : (!shown ? null : data.bin === shown);
    out.valid = good && out.inDate && out.binMatches !== false;
    if (!good) out.reason = 'the signature is not genuine - this licence was ' +
      'altered or was never issued here';
    else if (!out.inDate) out.reason = 'the signature is genuine but the ' +
      'licence is out of date';
    else if (out.binMatches === false) out.reason = 'genuine and in date, but ' +
      'it is for a different binary';
    return out;
  });
}

function fingerprintFile(f){
  return f.arrayBuffer().then(function(buf){
    return crypto.subtle.digest('SHA-256', buf);
  }).then(function(h){
    var fp = hexOf(h);
    document.getElementById('bin').value = fp;
    render();
    return fp;
  });
}

var last = null;
function render(){
  var v = document.getElementById('verdict');
  if (!last){ v.textContent = 'nothing tested yet'; v.style.color = '#8ea9c2'; }
  else if (last.valid){ v.textContent = 'LICENCE GOOD'; v.style.color = '#3fd18a'; }
  else { v.textContent = 'LICENCE NOT GOOD - ' + (last.reason || ''); v.style.color = '#ff5b4d'; }

  var d = last && last.data ? last.data : null;
  document.getElementById('tV').innerHTML = !d ? '' :
    '<tr><td>issued to</td><td>' + (d.who||'-') + '</td></tr>' +
    '<tr><td>product</td><td>' + (d.prod||'-') + '</td></tr>' +
    '<tr><td>runs from</td><td>' + (d.from||'-') + '</td></tr>' +
    '<tr><td>runs until</td><td>' + (d.until||'-') + '</td></tr>' +
    '<tr><td>signature genuine</td><td class="' + (last.signature?'ok':'bad') +
      '">' + (last.signature?'yes':'no') + '</td></tr>' +
    '<tr><td>in date</td><td class="' + (last.inDate?'ok':'bad') + '">' +
      (last.inDate?'yes':'no') + '</td></tr>' +
    '<tr><td>binary it covers</td><td>' + (d.bin ? d.bin.slice(0,24)+'…' : 'any') +
      '</td></tr>' +
    '<tr><td>matches the binary shown</td><td class="' +
      (last.binMatches===true?'ok':last.binMatches===false?'bad':'') + '">' +
      (last.binMatches===null?'not compared':last.binMatches?'yes':'no') +
      '</td></tr>';

  document.getElementById('warn').innerHTML =
    '<b>What this does and does not protect.</b><br>' +
    '&bull; Nobody can make a licence they were not given - the private ' +
    'key never leaves the vendor, and a licence cannot be altered without ' +
    'breaking its signature.<br>' +
    '&bull; A check that runs on the customer&rsquo;s machine can be ' +
    'removed from the customer&rsquo;s machine. Anything shipped can be ' +
    'read and patched. This is honest licensing, not copy protection, and ' +
    'it should not be sold as the second thing.<br>' +
    '&bull; The licence is readable on purpose - a customer can see what ' +
    'they hold. The signature is what makes it genuine, not secrecy.';

  document.getElementById('line').textContent =
    'LIC' + (last ? (last.valid?'GOOD':'NOTGOOD') : '-') +
    ' SIG' + (last ? (last.signature?'OK':'BAD') : '-') +
    ' DATE' + (last ? (last.inDate?'OK':'OUT') : '-') +
    ' BIN' + (last ? (last.binMatches===null?'-':last.binMatches?'OK':'MISMATCH') : '-') +
    ' KEY' + (pubRaw ? 'P-256' : '-');
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES.
   A licence tester that says GOOD to everything is worse than none, so
   the failures are what gets tested: a tampered licence, an expired
   one, and one for a different binary must all be refused. */
function selfCheck(){
  var fails = [];
  issue().then(function(lic){
    return test(lic).then(function(a){
      if (!a.valid) fails.push('a freshly issued licence did not test good');
      if (!a.signature) fails.push('a freshly issued signature did not verify');

      /* TAMPER: change one character of the body - must be refused */
      var parts = lic.split('.');
      var raw = new TextDecoder().decode(unb64(parts[0]));
      var bent = raw.replace(/"who":"[^"]*"/, '"who":"Someone Else"');
      var bentLic = b64(bytes(bent)) + '.' + parts[1];
      return test(bentLic).then(function(b){
        if (b.valid) fails.push('A TAMPERED LICENCE TESTED GOOD');
        if (b.signature) fails.push('a tampered body still verified');

        /* EXPIRED: a licence whose dates have passed */
        var old = JSON.stringify({ who:'Old', prod:'p', from:'2020-01-01',
          until:'2020-12-31', bin:'' });
        return ready().then(function(k){
          return crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},
            k.privateKey, bytes(old));
        }).then(function(sig){
          return test(b64(bytes(old)) + '.' + b64(sig));
        }).then(function(c){
          if (c.valid) fails.push('AN EXPIRED LICENCE TESTED GOOD');
          if (!c.signature) fails.push('the expired one should still have a genuine signature');
          if (c.inDate) fails.push('an expired licence was called in date');

          /* NOT A LICENCE AT ALL */
          return test('rubbish').then(function(d){
            if (d.valid) fails.push('a non-licence tested good');
            show(fails);
          });
        });
      });
    });
  }).catch(function(e){ fails.push('the check itself broke: ' + e.message); show(fails); });

  function show(f){
    var el = document.getElementById('chk');
    if (f.length){
      el.style.display = '';
      el.innerHTML = '<b class="n">THE LICENCE TESTER IS NOT BEHAVING</b><br>' +
        f.join('<br>');
    } else { el.style.display = 'none'; el.innerHTML = ''; }
    window.__licFails = f;
    window.__licDone = true;
  }
}

document.getElementById('make').addEventListener('click', function(){ issue(); });
document.getElementById('check').addEventListener('click', function(){
  test(document.getElementById('test').value.trim()).then(function(r){
    last = r; render();
  });
});
document.getElementById('file').addEventListener('change', function(e){
  if (e.target.files && e.target.files[0]) fingerprintFile(e.target.files[0]);
});

render();
setTimeout(selfCheck, 200);

window.__read = function(){ return { last: last, pub: pubRaw,
  done: !!window.__licDone, fails: window.__licFails,
  bar: document.getElementById('line').textContent }; };
window.__issue = issue;
window.__test = test;
</script>
</body></html>
