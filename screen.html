<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DDR &middot; CPU &middot; GPU SCREEN</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:14px 0 6px;text-transform:uppercase}
  .chan{display:flex;align-items:center;gap:14px;padding:10px 6px;
    border-bottom:1px solid #0e1a26}
  .mk{flex:0 0 72px;width:72px;height:72px;position:relative}
  .mk canvas{position:absolute;inset:0;width:72px;height:72px}
  .read{flex:1 1 auto;min-width:0}
  .read .big{font-size:24px;font-weight:700;color:#eaf6ff;
    font-variant-numeric:tabular-nums}
  .read .u{color:#4a6076;font-size:12px}
  .read .nm{color:#8ea9c2;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .read .st{font-size:12px;font-weight:700;margin-top:2px}
  .onred{color:#ff5b4d}.onblue{color:#4f9bff}.onyellow{color:#ffd23f}
  .dev{color:#8ea9c2;font-size:11px}
  #key{margin-top:10px;font-size:11px;color:#8ea9c2;line-height:1.8}
  #key b{font-weight:700}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #16293a;
    background:#0a121a;border-radius:4px;font-size:11px;line-height:1.7;color:#8ea9c2}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B48</b><i id="line">reading&hellip;</i></div>
<div id="pg" style="padding-top:58px">

  <h2>DDR, CPU, GPU - live, asked over and over</h2>
  <div id="chans"></div>

  <div id="key">
    <b class="onyellow">&#9632; yellow</b> on target, 1 by 1 &mdash; the
    reading is sitting steady.
    <b class="onblue">&#9632; blue</b> near, 3 by 3 &mdash; drifting a
    little.
    <b class="onred">&#9632; red</b> off, 5 by 5 &mdash; well away from
    its own steady value.
  </div>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   THE DDR - CPU - GPU SCREEN.

   GPS tracking is set aside; this is the screen asked for instead.
   Three live channels, each read over and over and never stopping -
   DDR access time, CPU work rate, and GPU frame cadence - and beside
   each one a target mark in the three colours asked for:

     yellow  1 by 1  on target   - within a tight band of its own steady value
     blue    3 by 3  near         - a little off
     red     5 by 5  off          - well away

   The mark is drawn as the nested squares from the sketch: an outer
   red five, a blue three inside it, a yellow one at the centre, and a
   cross-hair showing where the current reading actually sits. "mark
   +- location" - the deviation is shown as a plus-or-minus beside the
   figure.

   THE BAND IS THE CHANNEL'S OWN. Each channel is judged against the
   middle of its own recent readings, not against a number written in
   here - a fast phone and a slow phone each settle at their own value,
   and "on target" means steady for THIS device, which is the honest
   meaning. It takes a moment to settle before it will colour a mark,
   because a band needs a few readings to exist - until then the mark
   says "settling", never a confident green-for-go on a single sample.

   KEEP ON ASKING. The loop never stops; it keeps reading after every
   answer, as asked. It cannot ask 45 times in a nanosecond - nothing
   in a browser can - but it asks continuously and shows the rate it
   truly keeps.
   ================================================================== */

var guard = 0;

/* ---- DDR: access time, pointer-chase so it is a real wait ---- */
var ddrRing = null;
function makeRing(kb){
  var n = kb*1024/4, a = new Int32Array(n), idx = new Int32Array(n), i, j, t;
  for (i=0;i<n;i++) idx[i] = i;
  for (i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  for (i=0;i<n;i++) a[idx[i]] = idx[(i+1)%n];
  return a;
}
function ddrRead(){
  if (!ddrRing) ddrRing = makeRing(65536);
  var p=0, steps=0, t0=performance.now(), t1;
  do { for (var k=0;k<20000;k++) p=ddrRing[p]; steps+=20000; t1=performance.now(); }
  while (t1-t0 < 8);
  guard = p;
  return (t1-t0)*1e6/steps;            /* ns per access */
}

/* ---- CPU: work rate, long enough to be above the clock ---- */
function cpuRead(){
  var t0=performance.now(), x=0, n=0;
  do { for (var i=0;i<200000;i++){ x+=(i&15)+1; } n+=200000; }
  while (performance.now()-t0 < 8);
  guard += x & 1;
  var ms = performance.now()-t0;
  return ms>0 ? (n/ms)/1000 : 0;       /* Mop/s */
}

/* ---- GPU: frame cadence, from the paint loop. The frame rate a
        browser actually sustains is the honest graphics figure a page
        can take without the readPixels gymnastics that read flat. ---- */
var frameGap = 0, frameBest = 1e9, fps = 0, fN = 0, fT = 0, lastF = 0;
(function(){
  function f(now){
    requestAnimationFrame(f);
    if (lastF){ var g = now - lastF; frameGap = g;
      if (g > 1 && g < frameBest) frameBest = g;
      fN++; fT += g; if (fT >= 500){ fps = fN*1000/fT; fN=0; fT=0; } }
    lastF = now;
  }
  requestAnimationFrame(f);
})();

/* ---- GPU GRAPHIC TURN: how many 90-degree turns of a graphic the
        graphics can complete a second, measured off-screen so it is the
        drawing cost and not the screen's refresh. "no graphic can match
        any phone" - this rate is the device's own. ---- */
var turnCv = document.createElement('canvas');
turnCv.width = 256; turnCv.height = 256;
var turnG = turnCv.getContext('2d');
function graphicTurnRate(){
  var t0 = performance.now(), turns = 0, a = 0;
  do {
    /* a quarter turn, drawn - rotate 90 degrees and paint a shape */
    a += Math.PI/2;
    turnG.setTransform(1,0,0,1,128,128); turnG.rotate(a);
    turnG.clearRect(-128,-128,256,256);
    turnG.fillStyle = '#4fd1ff';
    turnG.fillRect(-60,-8,120,16);
    turnG.fillRect(-8,-60,16,120);
    turns++;
  } while (performance.now() - t0 < 8);
  guard += a & 1;
  var ms = performance.now() - t0;
  return ms > 0 ? turns / ms * 1000 : 0;    /* 90-degree turns a second */
}

/* ---- DEVICE TORSION: the phone's own turning rate, from the motion
        sensor where there is one. A browser on a desktop has none, and
        then the ratio cannot be formed and says so rather than faking a
        rotation that is not happening. ---- */
var torsion = { haveSensor: false, noApi: false, rate: 0, note: '' };
(function(){
  if (typeof DeviceMotionEvent === 'undefined'){
    torsion.noApi = true;
    torsion.note = 'this device exposes no motion sensor to a web page';
    return;
  }
  torsion.note = 'waiting for a turn';
  window.addEventListener('devicemotion', function(e){
    var r = e.rotationRate;
    if (r && (r.alpha != null || r.beta != null || r.gamma != null)){
      torsion.haveSensor = true;
      torsion.rate = Math.abs(r.alpha||0) + Math.abs(r.beta||0) + Math.abs(r.gamma||0);
      torsion.note = '';
    }
  });
  /* if the API is there but no live reading has arrived, the phone is
     simply being held still - say that, rather than leaving it blank */
  setTimeout(function(){ if (!torsion.haveSensor && !torsion.noApi)
    torsion.note = 'a motion sensor is present but the phone is being held still'; }, 3000);
})();

/* ---- each channel keeps its own recent readings and its own band ---- */
function Channel(name, unit, read, decimals, lowerBetter){
  this.name = name; this.unit = unit; this.read = read;
  this.dec = decimals; this.lower = lowerBetter;
  this.hist = []; this.value = 0; this.mid = 0; this.devPct = 0;
  this.status = 'settling'; this.color = 'settling';
}
Channel.prototype.sample = function(){
  var v = this.read(); if (!(v > 0)) return;
  this.value = v; this.hist.push(v);
  if (this.hist.length > 40) this.hist.shift();
  if (this.hist.length < 8){ this.status = 'settling'; this.color = 'settling'; return; }
  var i, m = 0; for (i=0;i<this.hist.length;i++) m += this.hist[i];
  m /= this.hist.length; this.mid = m;
  /* the channel's OWN bounce - how much it naturally varies - so the
     band fits the channel. A microbenchmark on a busy machine is
     jittery by nature; judging it against a flat 5% would paint it red
     for behaving normally. Within one bounce is on target, within two
     and a half is near, beyond that is genuinely off for THIS channel. */
  var ss = 0; for (i=0;i<this.hist.length;i++) ss += (this.hist[i]-m)*(this.hist[i]-m);
  var sd = Math.sqrt(ss/(this.hist.length-1));
  this.devPct = m > 0 ? (v - m) / m * 100 : 0;        /* shown as +-% */
  var z = sd > 0 ? Math.abs(v - m) / sd : 0;          /* in its own bounce */
  this.z = z; this.sd = sd;
  /* a FLOOR on sensitivity. When a channel barely moves - a steady
     frame rate, say - its own bounce is almost nothing, and then a
     rounding wobble looks huge in units of it and the mark flickers.
     A reading within 2% of its own mean is on target whatever its
     bounce, so a near-constant channel does not twitch off yellow. */
  var withinFloor = Math.abs(this.devPct) <= 2;
  if (z <= 1 || withinFloor){ this.status = 'on target'; this.color = 'yellow'; }
  else if (z <= 2.5){ this.status = 'near'; this.color = 'blue'; }
  else { this.status = 'off'; this.color = 'red'; }
};

var channels = [
  new Channel('DDR access', 'ns', ddrRead, 1, true),
  new Channel('CPU work rate', 'Mop/s', cpuRead, 0, false),
  new Channel('GPU frame rate', 'fps', function(){ return fps; }, 0, false),
  new Channel('GPU graphic turn', 'turns/s', graphicTurnRate, 0, false)
];

/* ---- the nested-square mark ---- */
function drawMark(cvs, ch){
  var g = cvs.getContext('2d'), W = cvs.width, H = cvs.height, cx = W/2, cy = H/2;
  g.clearRect(0,0,W,H);
  function sq(half, col, lw){
    g.strokeStyle = col; g.lineWidth = lw;
    g.strokeRect(cx-half, cy-half, half*2, half*2);
  }
  var dim = (ch.color === 'settling');
  sq(32, dim ? '#3a2020' : '#ff5b4d', 2);              /* red 5 */
  sq(20, dim ? '#1d2c3a' : '#4f9bff', 2);              /* blue 3 */
  sq(8,  dim ? '#3a3410' : '#ffd23f', 2);              /* yellow 1 */
  /* the cross-hair where the current reading sits: deviation maps out
     from the centre, clamped to the red square */
  /* the cross-hair sits out from centre by how many bounces off it is,
     one bounce = the blue ring, 2.5 = the red edge */
  var z = (ch.devPct||0) < 0 ? -(ch.z||0) : (ch.z||0);
  var off = Math.max(-1, Math.min(1, z / 2.5)) * 32;
  var x = cx + off;
  g.strokeStyle = ch.color === 'red' ? '#ff5b4d' :
                  ch.color === 'blue' ? '#4f9bff' :
                  ch.color === 'yellow' ? '#ffd23f' : '#6d8ba3';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(x-7, cy); g.lineTo(x+7, cy); g.stroke();
  g.beginPath(); g.moveTo(x, cy-7); g.lineTo(x, cy+7); g.stroke();
}

/* ---- the loop: ask, show, keep asking ---- */
var asks = 0, askT0 = 0, askRate = 0;
function render(){
  var box = document.getElementById('chans');
  if (!box.dataset.built){
    box.innerHTML = channels.map(function(c, i){
      return '<div class="chan"><div class="mk"><canvas id="mk'+i+
        '" width="72" height="72"></canvas></div><div class="read">' +
        '<div class="nm">'+c.name+'</div>' +
        '<div><span class="big" id="v'+i+'">-</span> ' +
        '<span class="u">'+c.unit+'</span></div>' +
        '<div class="st" id="s'+i+'">settling</div>' +
        '<div class="dev" id="d'+i+'"></div></div></div>';
    }).join('');
    box.dataset.built = '1';
  }
  channels.forEach(function(c, i){
    document.getElementById('v'+i).textContent =
      c.value ? c.value.toFixed(c.dec) : '-';
    var st = document.getElementById('s'+i);
    st.textContent = c.status;
    st.className = 'st ' + (c.color === 'settling' ? 'dev' : 'on'+c.color);
    var dline = c.hist.length >= 8 ?
      ('steady ' + c.mid.toFixed(c.dec) + ' ' + c.unit + '   ' +
       (c.devPct>=0?'+':'') + c.devPct.toFixed(1) + '% now') :
      ('settling - ' + c.hist.length + ' of 8 readings');
    /* the graphic-turn channel also carries the torsion ratio: graphic
       turns against the phone's own turning. No sensor, no ratio - and
       it says so rather than inventing a rotation. */
    if (c.name === 'GPU graphic turn'){
      if (torsion.haveSensor && torsion.rate > 0.01){
        dline += '   vs device turn ' +
          (c.value / torsion.rate).toFixed(1) + ' per deg/s';
      } else {
        dline += '   device turn: ' + torsion.note;
      }
    }
    document.getElementById('d'+i).textContent = dline;
    drawMark(document.getElementById('mk'+i), c);
  });

  document.getElementById('note').innerHTML =
    'Asking continuously - ' +
    (askRate ? askRate.toFixed(0) + ' times a second on this device' : 'measuring the rate') +
    '. It never stops reading. A browser cannot ask 45 times in a ' +
    'nanosecond; it asks as fast as it truly can and shows that rate. ' +
    'GPU here is the frame rate the screen actually sustains - the ' +
    'honest graphics figure a page can take.';

  var parts = channels.map(function(c){
    return c.name.split(' ')[0] + (c.value ? c.value.toFixed(c.dec) : '-') +
      c.unit + ':' + (c.color==='settling'?'...':c.color.toUpperCase());
  });
  document.getElementById('line').textContent =
    parts.join(' ') + ' ASK' + (askRate?askRate.toFixed(0):'-') + '/s';
}

function tick(){
  channels.forEach(function(c){ c.sample(); });
  asks++;
  var now = performance.now();
  if (!askT0) askT0 = now;
  var el = now - askT0;
  if (el >= 1000){ askRate = asks*1000/el; asks = 0; askT0 = now; }
  render();
  setTimeout(tick, 0);           /* keep on asking, right after the return */
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* all three channels must produce a real number */
  channels.forEach(function(c){
    if (!(c.value > 0)) fails.push(c.name + ' read nothing');
  });

  /* the mark must mean something: feed a channel a reading far from its
     band and it must go red, and one on its band must go yellow. A mark
     that is the same colour whatever the reading is a decoration. */
  var probe = new Channel('t', 'u', function(){ return 100; }, 0, false);
  var i; for (i=0;i<12;i++) probe.sample();          /* settle at 100 */
  probe.read = function(){ return 100; }; probe.sample();
  var onBand = probe.color;
  probe.read = function(){ return 200; }; probe.sample();   /* +100% */
  var offBand = probe.color;
  if (onBand !== 'yellow') fails.push('a steady reading did not read on-target: ' + onBand);
  if (offBand !== 'red') fails.push('a reading twice its band did not read off: ' + offBand);

  /* a single reading must NOT colour confidently - it must say settling,
     because one reading has no band */
  var fresh = new Channel('t', 'u', function(){ return 50; }, 0, false);
  fresh.sample();
  if (fresh.color !== 'settling')
    fails.push('a single reading coloured a mark instead of settling: ' + fresh.color);

  /* the ask rate must be real and sane - never near the impossible 45/ns */
  if (askRate && askRate > 100000)
    fails.push('the ask rate is implausibly high: ' + askRate);

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="onred">THE SCREEN IS NOT BEHAVING</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__scFails = fails;
}

render();
tick();
setTimeout(selfCheck, 2500);

window.__read = function(){ return {
  channels: channels.map(function(c){ return { name:c.name, value:c.value,
    mid:c.mid, devPct:c.devPct, status:c.status, color:c.color,
    n:c.hist.length }; }),
  askRate: askRate, fails: window.__scFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
