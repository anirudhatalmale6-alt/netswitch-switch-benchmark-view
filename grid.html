<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELECTRIC GRID REROUTE</title>
<style>
  :root{ --bg:#05080c; --panel:#0a121a; --line:#16293a; --grid:#0f1d2a;
    --ink:#d7e6f2; --ink2:#8ea9c2; --muted:#6d8ba3; --series:#3987e5;
    --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b; }
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;display:flex;align-items:baseline;
    gap:8px;padding:6px 10px;font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:58px 12px 70px;max-width:1000px}
  h2{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:400;margin:16px 0 6px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
  .card h3{margin:0 0 8px;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.5px}
  canvas#map{display:block;width:100%;height:300px}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px}
  .leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-weight:400;padding:3px 4px;border-bottom:1px solid var(--line);letter-spacing:1px;font-size:9px}
  td{padding:4px;border-bottom:1px solid #0e1a26;vertical-align:top;font-variant-numeric:tabular-nums}
  td.k{color:var(--ink2)} td.v{color:var(--ink);font-weight:700}
  .chip{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:700;font-size:10px;color:#05080c;white-space:nowrap}
  .c-ok{background:var(--ok)} .c-warn{background:var(--warn)} .c-crit{background:var(--crit)} .c-off{background:#8ea9c2}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;text-decoration:none;border-radius:4px;
    padding:8px 12px;font-size:12px;box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
</style></head><body>
<div id="bar"><b id="stamp">B91</b><i id="line">Energising</i></div>
<div id="pg">
  <h2>Electric Grid Reroute</h2>
  <div class="grid">
    <div class="card"><h3>The Grid, Modelled, 20 kV, 50 Hz</h3><canvas id="map"></canvas>
      <div class="leg"><span><i style="background:#0ca30c"></i>Under 80 per cent</span><span><i style="background:#fab219"></i>80 to 100</span>
        <span><i style="background:#d03b3b"></i>Fault or over</span><span><i style="background:#3b4a5a"></i>Dead or open</span></div></div>
    <div class="card"><h3>Now</h3><table id="tNow"></table>
      <table id="tHead" style="margin-top:8px"><thead><tr><th>feeder</th><th>load</th><th>current</th><th>of rating</th></tr></thead><tbody id="hBody"></tbody></table></div>
  </div>
  <h2>What Happened</h2>
  <div class="card"><table id="tLog"><thead><tr><th>time</th><th>event</th></tr></thead><tbody id="lBody"></tbody></table></div>
  <h2>Every Fault So Far</h2>
  <div class="card"><table id="tF"><thead><tr><th>fault</th><th>tie closed</th><th>off for</th><th>worst loading after</th></tr></thead><tbody id="fBody"></tbody></table></div>
  <h2>The Settings</h2>
  <div class="card"><table id="tSet"></table></div>

  <div id="chk" style="display:none"></div>
</div>
<div id="always"><a id="dlDxf" class="alt" download="grid-reroute.dxf">DXF</a>
  <a id="dlTxt" download="grid-reroute.txt">Download</a></div>

<script>
/* ==================================================================
   ELECTRIC GRID REROUTE - a distribution grid that heals itself.

   THE GRID IS AN EXAMPLE, the physics is real. Two substations at
   20 kV, 50 Hz, feed three feeders. Each feeder runs out through load
   points; each section between them has a switch at each end. Two tie
   switches join the ends of feeders and are normally OPEN, so every
   load point is fed from exactly one side - the grid is radial.

   WHAT HAPPENS ON A FAULT, in the order a real grid does it:
     1. the fault; the feeder's relay picks up and after its delay the
        breaker at the substation trips - the whole feeder goes dark;
     2. the switches either side of the faulted section open, cutting
        that one section out;
     3. the breaker closes again - everything up to the fault is back;
     4. the tie switch that can take the rest with the least loading
        closes, and the far side is fed from the other feeder;
     5. the section is repaired, the tie opens, the switches close,
        and the grid is back as it was.

   THE CURRENT in each section is worked out from the load beyond it:
   power over (root three times the voltage times the power factor).
   THE PAGE HOLDS ITSELF TO THE PHYSICS: power out of the substations
   must equal the load being served, no section may carry current with
   a switch open, the faulted section must be dead, no loop may ever
   close, and after a reroute no section may run over its rating.
   ================================================================== */

var KV = 20, PF = 0.95, RATING_A = 120, RELAY_DELAY = 0.4;
var T_ISOLATE = 2.0, T_RECLOSE = 3.0, T_TIE = 4.0, T_REPAIR = 13.0, T_NORMAL = 14.0, FAULT_EVERY = 16;
var SQ3 = Math.sqrt(3);

/* nodes: [id, x, y, load kW]; S1 and S2 are the substations */
var NODES = {
  S1: [5, 28, 0], S2: [95, 28, 0],
  A1: [15, 10, 400], A2: [26, 10, 350], A3: [37, 10, 300], A4: [48, 10, 450], A5: [59, 10, 250],
  B1: [85, 28, 500], B2: [75, 28, 300], B3: [65, 28, 400], B4: [55, 28, 350], B5: [45, 28, 300],
  C1: [15, 46, 300], C2: [27, 46, 450], C3: [39, 46, 250], C4: [51, 46, 400]
};
/* sections: [id, from, to, feeder] in order out from the substation */
var SECT = [
  ['A1', 'S1', 'A1', 'A'], ['A2', 'A1', 'A2', 'A'], ['A3', 'A2', 'A3', 'A'], ['A4', 'A3', 'A4', 'A'], ['A5', 'A4', 'A5', 'A'],
  ['B1', 'S2', 'B1', 'B'], ['B2', 'B1', 'B2', 'B'], ['B3', 'B2', 'B3', 'B'], ['B4', 'B3', 'B4', 'B'], ['B5', 'B4', 'B5', 'B'],
  ['C1', 'S1', 'C1', 'C'], ['C2', 'C1', 'C2', 'C'], ['C3', 'C2', 'C3', 'C'], ['C4', 'C3', 'C4', 'C']
];
var TIES = [['T1', 'A5', 'B5'], ['T2', 'C4', 'B4'], ['T3', 'A3', 'B5']];
var FAULTS = ['B2', 'A3', 'C2', 'B4', 'A1'];

function el(id){ return document.getElementById(id); }
function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){ var d = new Date(); return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate()) + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()); }
function fi(n, d){ if (n === null || n === undefined || !isFinite(n)) return '-'; return n.toFixed(d === undefined ? 1 : d).replace('.', ','); }
function amps(kw){ return kw * 1000 / (SQ3 * KV * 1000 * PF); }

/* ================= switching state ================= */
var st = null;
function normal(){
  var s = { closed: {}, breaker: { A: true, B: true, C: true }, tie: {}, fault: null };
  SECT.forEach(function(x){ s.closed[x[0]] = true; });
  TIES.forEach(function(t){ s.tie[t[0]] = false; });
  return s;
}
/* the edges that conduct right now */
function edges(s){
  var e = [];
  SECT.forEach(function(x){
    var on = s.closed[x[0]] && (x[1] !== 'S1' && x[1] !== 'S2' || s.breaker[x[3]]);
    if (on) e.push([x[1], x[2], x[0]]);
  });
  TIES.forEach(function(t){ if (s.tie[t[0]]) e.push([t[1], t[2], t[0]]); });
  return e;
}
/* walk the grid from each substation: which nodes it feeds, through which edge, and whether a loop closes */
function energise(s){
  var adj = {}, e = edges(s), fed = {}, via = {}, loop = false;
  Object.keys(NODES).forEach(function(n){ adj[n] = []; });
  e.forEach(function(x){ adj[x[0]].push([x[1], x[2]]); adj[x[1]].push([x[0], x[2]]); });
  ['S1', 'S2'].forEach(function(src){
    var stack = [[src, null]];
    while (stack.length){
      var c = stack.pop(), n = c[0], from = c[1];
      if (fed[n] && fed[n] !== src){ loop = true; continue; }
      if (fed[n]){ if (from !== null) loop = true; continue; }
      fed[n] = src; if (from) via[n] = from;
      adj[n].forEach(function(nb){ if (nb[1] !== from && nb[1] !== (via[n] || null)) stack.push([nb[0], nb[1]]); });
    }
  });
  /* section flows: load beyond each conducting edge, worked from the leaves inwards */
  var children = {}; Object.keys(NODES).forEach(function(n){ children[n] = []; });
  Object.keys(via).forEach(function(n){
    var ed = e.filter(function(x){ return x[2] === via[n]; })[0];
    var parent = ed[0] === n ? ed[1] : ed[0];
    children[parent].push(n);
  });
  var flow = {};
  function beyond(n){ var kw = NODES[n][2]; children[n].forEach(function(c){ var b = beyond(c); flow[via[c]] = b; kw += b; }); return kw; }
  var head = { S1: beyond('S1'), S2: beyond('S2') };
  return { fed: fed, via: via, flow: flow, head: head, loop: loop, edges: e };
}

/* ================= the fault programme ================= */
var t0 = performance.now(), log = [], faults = [], fi_n = 0, phase = 'normal', cur = null, fails = [], loopError = null;
function say(t, s){ log.push({ t: t, s: s }); if (log.length > 60) log.shift(); }
function feederOf(sec){ return SECT.filter(function(x){ return x[0] === sec; })[0][3]; }
function chooseTie(s){
  /* try each open tie in turn; keep the one that restores everything with the least worst loading */
  var best = null;
  TIES.forEach(function(t){
    var trial = JSON.parse(JSON.stringify(s)); trial.tie[t[0]] = true;
    var g = energise(trial); if (g.loop) return;
    var dead = Object.keys(NODES).filter(function(n){ return n !== 'S1' && n !== 'S2' && !g.fed[n]; }).length;
    var worst = 0; Object.keys(g.flow).forEach(function(k){ worst = Math.max(worst, amps(g.flow[k]) / RATING_A); });
    var score = dead * 1000 + worst;
    if (!best || score < best.score) best = { tie: t[0], dead: dead, worst: worst, score: score };
  });
  return best;
}
function step(now){
  var t = (now - t0) / 1000, cyc = Math.floor(t / FAULT_EVERY), in_ = t - cyc * FAULT_EVERY;
  if (cur === null || cur.cyc !== cyc){
    if (cur && cur.rec && cur.rec.restored === null) cur.rec.restored = false;
    st = normal(); var sec = FAULTS[cyc % FAULTS.length];
    cur = { cyc: cyc, sec: sec, feeder: feederOf(sec), step: 0, rec: { sec: sec, tie: null, off: 0, worst: null, restored: null, t: t } };
    faults.push(cur.rec); if (faults.length > 12) faults.shift();
  }
  var c = cur, sAt = function(x){ return in_ >= x; };
  if (c.step === 0 && sAt(1.0)){ c.step = 1; st.fault = c.sec; say(t, 'Fault on section ' + c.sec + ', relay picks up'); c.faultT = t; }
  if (c.step === 1 && sAt(1.0 + RELAY_DELAY)){ c.step = 2; st.breaker[c.feeder] = false; say(t, 'Breaker on feeder ' + c.feeder + ' trips after ' + fi(RELAY_DELAY, 1) + ' s'); }
  if (c.step === 2 && sAt(T_ISOLATE)){ c.step = 3; st.closed[c.sec] = false; say(t, 'Section ' + c.sec + ' switched out at both ends'); }
  if (c.step === 3 && sAt(T_RECLOSE)){ c.step = 4; st.breaker[c.feeder] = true; say(t, 'Breaker on feeder ' + c.feeder + ' closes again'); }
  if (c.step === 4 && sAt(T_TIE)){
    c.step = 5; var b = chooseTie(st);
    var before = energise(st), deadBefore = Object.keys(NODES).filter(function(n){ return NODES[n][2] && !before.fed[n]; }).length;
    if (b && deadBefore){ st.tie[b.tie] = true; c.rec.tie = b.tie; c.rec.worst = b.worst;
      say(t, 'Tie ' + b.tie + ' closes, the far side fed from the other feeder, worst loading ' + fi(b.worst * 100, 0) + ' per cent'); }
    else { c.rec.tie = '-'; var g0 = energise(st), w0 = 0; Object.keys(g0.flow).forEach(function(k){ w0 = Math.max(w0, amps(g0.flow[k]) / RATING_A); });
      c.rec.worst = w0; say(t, 'Nothing beyond the fault, no tie needed'); }
    c.rec.restored = true;
  }
  if (c.step === 5 && sAt(T_REPAIR)){ c.step = 6; st.fault = null; say(t, 'Section ' + c.sec + ' repaired'); }
  if (c.step === 6 && sAt(T_NORMAL)){ c.step = 7; st = normal(); say(t, 'Back to normal, ties open'); }
  /* customer-seconds off: every load point not fed, counted while the fault cycle runs */
  var g = energise(st), offKw = 0, offN = 0;
  Object.keys(NODES).forEach(function(n){ if (NODES[n][2] && !g.fed[n]){ offKw += NODES[n][2]; offN++; } });
  c.offKw = offKw; c.offN = offN; c.g = g;
  return g;
}

/* ================= drawing ================= */
var DT_last = 0;
function colourFor(a){ var r = a / RATING_A; return r >= 1 ? '#d03b3b' : (r >= 0.8 ? '#fab219' : '#0ca30c'); }
function drawMap(g){
  var cv = el('map'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth || 300, H = cv.clientHeight || 300;
  if (cv.width !== Math.round(W * dpr)) cv.width = Math.round(W * dpr);
  if (cv.height !== Math.round(H * dpr)) cv.height = Math.round(H * dpr);
  var x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  var X = function(v){ return 14 + v / 100 * (W - 28); }, Y = function(v){ return 14 + v / 56 * (H - 28); };
  function seg(a, b, col, w, dash){ x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []);
    x.beginPath(); x.moveTo(X(NODES[a][0]), Y(NODES[a][1])); x.lineTo(X(NODES[b][0]), Y(NODES[b][1])); x.stroke(); x.setLineDash([]); }
  SECT.forEach(function(s){
    var f = g.flow[s[0]], on = f !== undefined;
    var col = st.fault === s[0] ? '#d03b3b' : (on ? colourFor(amps(f)) : '#3b4a5a');
    seg(s[1], s[2], col, on ? 3 : 2, st.closed[s[0]] ? null : [3, 4]);
    if (on){ var mx = (NODES[s[1]][0] + NODES[s[2]][0]) / 2, my = (NODES[s[1]][1] + NODES[s[2]][1]) / 2;
      x.fillStyle = '#d7e6f2'; x.font = '9px monospace'; x.fillText(fi(amps(f) / RATING_A * 100, 0) + '%', X(mx) - 8, Y(my) - 4); }
    if (st.fault === s[0]){ var fx = (NODES[s[1]][0] + NODES[s[2]][0]) / 2, fy = (NODES[s[1]][1] + NODES[s[2]][1]) / 2;
      x.strokeStyle = '#d03b3b'; x.lineWidth = 2; x.beginPath(); x.moveTo(X(fx) - 6, Y(fy) + 4); x.lineTo(X(fx), Y(fy) - 6); x.lineTo(X(fx) + 2, Y(fy) + 2); x.lineTo(X(fx) + 7, Y(fy) - 5); x.stroke(); }
  });
  TIES.forEach(function(t){ var f = g.flow[t[0]];
    seg(t[1], t[2], st.tie[t[0]] ? colourFor(amps(f || 0)) : '#3b4a5a', st.tie[t[0]] ? 3 : 1.5, st.tie[t[0]] ? null : [2, 5]);
    var mx = (NODES[t[1]][0] + NODES[t[2]][0]) / 2, my = (NODES[t[1]][1] + NODES[t[2]][1]) / 2;
    x.fillStyle = '#8ea9c2'; x.font = '9px monospace'; x.fillText(t[0] + (st.tie[t[0]] ? ' closed' : ' open'), X(mx) + 4, Y(my) + 3); });
  Object.keys(NODES).forEach(function(n){
    var p = NODES[n], src = n === 'S1' || n === 'S2';
    x.fillStyle = src ? '#3987e5' : (g.fed[n] ? '#d7e6f2' : '#3b4a5a');
    if (src){ x.fillRect(X(p[0]) - 7, Y(p[1]) - 7, 14, 14); } else { x.beginPath(); x.arc(X(p[0]), Y(p[1]), 5, 0, 7); x.fill(); }
    x.fillStyle = '#8ea9c2'; x.font = '9px monospace'; x.fillText(n + (p[2] ? ' ' + p[2] : ''), X(p[0]) - 12, Y(p[1]) + (src ? 18 : 15));
  });
}
function row(t, k, v, chip){ var tr = document.createElement('tr'); var a = document.createElement('td'); a.className = 'k'; a.textContent = k;
  var b = document.createElement('td'); b.className = 'v';
  if (chip){ var c = document.createElement('span'); c.className = 'chip ' + chip[0]; c.textContent = chip[1]; b.appendChild(c); b.appendChild(document.createTextNode(' ')); }
  b.appendChild(document.createTextNode(v)); tr.appendChild(a); tr.appendChild(b); t.appendChild(tr); }
function render(g, t){
  var c = cur, tn = el('tNow'); tn.innerHTML = '';
  var stepName = ['Normal', 'Fault, relay timing', 'Breaker open, feeder dark', 'Section switched out', 'Breaker closed again',
                  'Rerouted through a tie', 'Repaired', 'Back to normal'][c.step];
  row(tn, 'State', stepName, [c.step === 0 || c.step === 7 ? 'c-ok' : (c.step === 5 || c.step === 6 ? 'c-warn' : 'c-crit'), c.step === 0 || c.step === 7 ? 'NORMAL' : 'FAULT ' + c.sec]);
  row(tn, 'Load Points Off', c.offN ? c.offN + ', ' + fi(c.offKw, 0) + ' kW' : 'None');
  var total = 0; Object.keys(NODES).forEach(function(n){ total += NODES[n][2]; });
  row(tn, 'Load Served', fi(g.head.S1 + g.head.S2, 0) + ' of ' + fi(total, 0) + ' kW');
  var hb = el('hBody'); hb.innerHTML = '';
  ['A', 'B', 'C'].forEach(function(f){
    var first = SECT.filter(function(x){ return x[3] === f; })[0][0], kw = g.flow[first];
    var tr = document.createElement('tr');
    var cells = ['Feeder ' + f, kw === undefined ? 'Dark' : fi(kw, 0) + ' kW', kw === undefined ? '-' : fi(amps(kw), 1) + ' A', kw === undefined ? '-' : fi(amps(kw) / RATING_A * 100, 0) + ' %'];
    cells.forEach(function(s, i){ var td = document.createElement('td'); td.className = i ? 'v' : 'k'; td.textContent = s; tr.appendChild(td); });
    hb.appendChild(tr);
  });
  var lb = el('lBody'); lb.innerHTML = '';
  log.slice(-10).reverse().forEach(function(e){ var tr = document.createElement('tr');
    var a = document.createElement('td'); a.className = 'k'; a.textContent = fi(e.t, 1) + ' s';
    var b = document.createElement('td'); b.className = 'v'; b.textContent = e.s; tr.appendChild(a); tr.appendChild(b); lb.appendChild(tr); });
  var fb = el('fBody'); fb.innerHTML = '';
  faults.filter(function(r){ return r.restored !== null; }).slice().reverse().forEach(function(r){
    var tr = document.createElement('tr');
    [ 'Section ' + r.sec, r.tie === '-' ? 'None needed' : r.tie, fi(T_TIE - 1.0, 1) + ' s at most', fi(r.worst * 100, 0) + ' %' ]
      .forEach(function(s, i){ var td = document.createElement('td'); td.className = i ? 'v' : 'k'; td.textContent = s; tr.appendChild(td); });
    fb.appendChild(tr);
  });
  el('tF').parentNode.style.display = fb.children.length ? '' : 'none';
  el('tF').parentNode.previousElementSibling.style.display = fb.children.length ? '' : 'none';
  el('line').textContent = (c.step === 0 || c.step === 7 ? 'Normal' : 'Fault on ' + c.sec + ' - ' + stepName) + ', '
    + fi(g.head.S1 + g.head.S2, 0) + ' kW served - example grid, real physics';
  selfCheck(g); refreshDownloads();
}
function renderSettings(){
  var t = el('tSet'); t.innerHTML = '';
  row(t, 'Voltage And Frequency', KV + ' kV, 50 Hz'); row(t, 'Power Factor', fi(PF, 2));
  row(t, 'Section Rating', RATING_A + ' A, ' + fi(SQ3 * KV * RATING_A * PF, 0) + ' kW');
  row(t, 'Relay Delay Before Trip', fi(RELAY_DELAY, 1) + ' s');
  row(t, 'Fault Switched Out After', fi(T_ISOLATE - 1, 1) + ' s'); row(t, 'Far Side Back After', fi(T_TIE - 1, 1) + ' s');
  row(t, 'Ties', TIES.map(function(x){ return x[0] + ' ' + x[1] + ' to ' + x[2]; }).join(', ') + ', normally open');
  row(t, 'Grid', 'An example, not a real network');
}

/* ================= the page checks itself ================= */
var WORDS = ('All Rights Reserved Copyright Electric Grid Reroute The Modelled Now What Happened Every Fault So Far Settings '
  + 'Under Dead Or Open State Load Points Off Served Feeder Dark None Normal Breaker Section Rerouted Repaired Back Relay '
  + 'Voltage And Frequency Power Factor Rating Delay Before Trip Switched Out After Far Side Ties Avainlippu Fault Nothing Tie Needed').split(' ');
function selfCheck(g){
  var f = [], txt = document.body.innerText.replace(el('chk').innerText, '');
  if (document.querySelectorAll('pre, code, textarea').length) f.push('a source block reached the page');
  if (/[$€£]\s?[0-9]|[0-9]\s?[$€£]|\b(price[sd]?|euro|dollars?)\b/i.test(txt)) f.push('money wording reached the page');
  if (/\b(Infinity|NaN|undefined|null)\b/.test(txt)) f.push('a figure with no value reached the page');
  var m = txt.match(/\b[A-Z][a-z]{2,} +[A-Z][a-z]{2,}\b/g) || [];
  var bad = m.filter(function(s){ var w = s.split(/ +/); return WORDS.indexOf(w[0]) < 0 || WORDS.indexOf(w[1]) < 0; });
  if (bad.length) f.push('something reads as a name: ' + bad[0]);
  [].forEach.call(document.querySelectorAll('#pg td.k'), function(td){ var s = td.textContent.trim();
    if (s && /^[a-z]/.test(s)) f.push('a row does not start with a capital: ' + s.slice(0, 30)); });
  if (g){
    /* POWER IN EQUALS LOAD SERVED */
    var served = 0; Object.keys(NODES).forEach(function(n){ if (NODES[n][2] && g.fed[n]) served += NODES[n][2]; });
    if (Math.abs(served - (g.head.S1 + g.head.S2)) > 1e-6) f.push('power out of the substations is not the load served');
    if (g.loop) f.push('a loop closed between the two substations');
    /* nothing flows through an open switch, and a faulted section is dead once it is switched out */
    SECT.forEach(function(s){ if (!st.closed[s[0]] && g.flow[s[0]] !== undefined) f.push('current through open section ' + s[0]); });
    if (st.fault && cur.step >= 3 && cur.step < 6 && g.flow[st.fault] !== undefined) f.push('the faulted section is still live');
    /* after a reroute, every load point back and nothing over its rating */
    if (cur.step === 5){
      Object.keys(NODES).forEach(function(n){ if (NODES[n][2] && !g.fed[n] && n !== '') f.push(n + ' left dark after the reroute'); });
      Object.keys(g.flow).forEach(function(k){ if (amps(g.flow[k]) > RATING_A + 1e-9) f.push(k + ' over its rating after the reroute'); });
    }
  }
  if (loopError) f.push('the live loop hit an error: ' + loopError);
  fails = f;
  var box = el('chk');
  if (f.length){ box.style.display = 'block'; box.innerHTML = '<b style="color:#e0645f">THIS PAGE IS NOT CLEAN</b><br>' + f.map(function(s){ return s.replace(/</g, '&lt;'); }).join('<br>'); }
  else box.style.display = 'none';
  return f;
}

/* ================= what leaves the page ================= */
function textOf(){
  var L = ['ELECTRIC GRID REROUTE', 'AI2Orbit', 'Taken ' + stampNow(), 'Example grid, real physics, 20 kV 50 Hz', '', 'WHAT HAPPENED'];
  log.forEach(function(e){ L.push(fi(e.t, 1) + ' s  ' + e.s); });
  L.push('', 'FAULTS');
  faults.forEach(function(r){ if (r.restored !== null) L.push('Section ' + r.sec + ': tie ' + r.tie + ', worst loading after ' + fi(r.worst * 100, 0) + ' %'); });
  return L.join('\n');
}
function dxfOf(){
  var o = []; function p(a, b){ o.push(a, String(b)); }
  function line(lay, a, b){ p(0, 'LINE'); p(8, lay); p(10, NODES[a][0]); p(20, -NODES[a][1]); p(30, 0); p(11, NODES[b][0]); p(21, -NODES[b][1]); p(31, 0); }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  SECT.forEach(function(s){ line(st.closed[s[0]] ? 'SECTIONS' : 'OPEN', s[1], s[2]); });
  TIES.forEach(function(t){ line(st.tie[t[0]] ? 'TIES_CLOSED' : 'TIES_OPEN', t[1], t[2]); });
  Object.keys(NODES).forEach(function(n){ p(0, 'TEXT'); p(8, 'LABELS'); p(10, NODES[n][0]); p(20, -NODES[n][1] - 2); p(30, 0); p(40, 1.5); p(1, n); });
  p(0, 'ENDSEC'); p(0, 'EOF'); return o.join('\r\n') + '\r\n';
}
var lastDl = 0;
function refreshDownloads(){ if (performance.now() - lastDl < 2000) return; lastDl = performance.now();
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'})); }

/* ================= start, without a button ================= */
renderSettings();
var lastDraw = 0, lastG = null;
function tick(){
  requestAnimationFrame(tick);
  var now = performance.now();               /* the real clock, never the frame's own stamp */
  try {
    lastG = step(now);
    if (now - lastDraw > 250){ lastDraw = now; drawMap(lastG); render(lastG, (now - t0) / 1000); }
  } catch (e){ if (!loopError){ loopError = String(e && e.message || e); selfCheck(lastG); } }
}
requestAnimationFrame(tick);

window.__read = function(){ return { step: cur ? cur.step : null, sec: cur ? cur.sec : null, faults: faults, fails: fails,
  bar: el('stamp').textContent + ' ' + el('line').textContent }; };
window.__selfCheck = function(){ return selfCheck(lastG); };
window.__jump = function(s){ t0 -= s * 1000; };
window.__jumpTo = function(sec){ t0 = performance.now() - sec * 1000; };
window.__energise = function(){ return energise(st); };
window.__lastG = function(){ return lastG; };
window.__textOf = textOf; window.__dxfOf = dxfOf;
window.__break = function(w){ if (w === 'load') NODES.A2[2] += 100; if (w === 'open') { st.closed.A2 = false; } };
</script>
