<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENCRYPT BY DRAWING</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 5px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  td{padding:4px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
  td:first-child{text-align:left;color:#8ea9c2;width:46%;word-break:normal}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #pad{display:block;width:100%;height:260px;background:#070d15;
    border:1px solid #2b6ea8;border-radius:6px;touch-action:none}
  #hint{color:#6d8ba3;font-size:11px;margin:6px 0 0}
  #state{margin-top:8px;padding:9px 11px;border-radius:5px;font-size:12px;
    font-weight:700;border:1px solid #16293a;background:#0a121a}
  .locked{color:#ffc24f}.open{color:#3fd18a}.wrong{color:#ff5b4d}
  #limits{margin-top:12px;padding:9px 11px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.7}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B40</b><i id="line">ready&hellip;</i></div>
<div id="pg" style="padding-top:60px">

  <h2>Draw to lock, draw the same again to open</h2>
  <canvas id="pad"></canvas>
  <p id="hint">A circle, a square, anything. The squares the line passes
    through, in order, are the secret.</p>
  <div id="state" class="locked">nothing locked yet</div>

  <h2>What the drawing gave</h2><table id="tDraw"></table>

  <h2>Folder, files, encrypted</h2><table id="tFiles"></table>

  <h2>This phone</h2><table id="tDev"></table>

  <h2>The levels of the tack</h2><table id="tTack"></table>

  <h2>When it was opened</h2><table id="tLog"></table>

  <div id="limits"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   ENCRYPT BY DRAWING, TIED TO THIS PHONE.

   Draw a shape on the pad. The pad is a grid, and the squares the
   line passes through - in the order it passes through them - are the
   secret. A circle drawn twice crosses the same squares both times,
   so it can be repeated by hand; the exact pixels never can, and are
   not used.

   That sequence, together with what this phone is, becomes a key. The
   key encrypts the files. Draw the same shape again and the files
   open; draw a different one and they do not, and cannot be made to.

   =================================================================
   THE ONE THING THAT HAD TO BE GOT RIGHT, AND IS EASY TO GET WRONG:

   A KEY MUST COME OUT IDENTICAL EVERY TIME. Not nearly identical -
   identical to the bit. So the measured readings this product is
   built on - the tack, the processor rate, the graphics lag, the
   battery - CANNOT be key material. They change on every reading by
   design; that is what makes them measurements. Build a key out of
   them and the file encrypts perfectly, and then never opens again,
   on any device, ever, including the one that locked it.

   So the key is made of things that do not move: the shape drawn, and
   the facts about this phone that are fixed - how many processors,
   how much memory is fitted, the screen. The measurements that do
   move are written into the note of when the file was opened, where
   they belong and where changing is a virtue rather than a fault.
   =================================================================

   The encryption itself is AES-GCM with a 256-bit key, done by the
   browser's own cryptography, not by anything written here. The key
   is stretched out of the secret with 200,000 rounds of PBKDF2 so
   that guessing shapes is slow. Nothing in this file is a cipher of
   my own invention and nothing here should ever be.
   ================================================================== */

var GRID = 12;              /* the pad is 12 squares by 12 */
var ROUNDS = 200000;        /* how hard a wrong guess is made to work */
var AUTO_LOCK_MS = 10000;   /* ten seconds, as asked */

var cells = [], drawing = false, pts = 0;
var locked = null, opened = false, lastErr = '';
var tackLevels = [], devBits = null, log = [];
var tEncrypt = 0, tDerive = 0, tOpen = 0;

/* ---------- the pad ---------- */
var pad = document.getElementById('pad'), g = pad.getContext('2d');
function fit(){
  var w = pad.clientWidth || 300, h = pad.clientHeight || 260;
  if (pad.width !== w || pad.height !== h){ pad.width = w; pad.height = h; }
  paint();
}
function paint(){
  var W = pad.width, H = pad.height, i;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);
  g.strokeStyle = '#16293a'; g.lineWidth = 1;
  for (i=1;i<GRID;i++){
    g.beginPath(); g.moveTo(i*W/GRID, 0); g.lineTo(i*W/GRID, H); g.stroke();
    g.beginPath(); g.moveTo(0, i*H/GRID); g.lineTo(W, i*H/GRID); g.stroke();
  }
  /* the squares the line has crossed, in order */
  cells.forEach(function(c, k){
    var cx = (c % GRID), cy = Math.floor(c / GRID);
    g.fillStyle = 'rgba(79,209,255,' + (0.18 + 0.5*k/Math.max(1,cells.length)) + ')';
    g.fillRect(cx*W/GRID+1, cy*H/GRID+1, W/GRID-2, H/GRID-2);
  });
}
function at(e){
  var r = pad.getBoundingClientRect();
  var t = (e.touches && e.touches[0]) || e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function cellOf(p){
  var cx = Math.floor(p.x / (pad.width/GRID)), cy = Math.floor(p.y / (pad.height/GRID));
  if (cx < 0 || cy < 0 || cx >= GRID || cy >= GRID) return -1;
  return cy*GRID + cx;
}
function down(e){
  e.preventDefault();
  drawing = true; cells = []; pts = 0; opened = false; lastErr = '';
  move(e);
}
function move(e){
  if (!drawing) return;
  e.preventDefault();
  pts++;
  var c = cellOf(at(e));
  /* only a CHANGE of square counts. Holding still in one square would
     otherwise add that square hundreds of times and the secret would
     be a record of how slowly the finger moved, which nobody can
     repeat. */
  if (c >= 0 && cells[cells.length-1] !== c) cells.push(c);
  paint(); render();
}
function up(e){
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
  if (cells.length >= 3) useDrawing();
  render();
}
pad.addEventListener('mousedown', down); pad.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);
pad.addEventListener('touchstart', down, {passive:false});
pad.addEventListener('touchmove', move, {passive:false});
pad.addEventListener('touchend', up, {passive:false});
window.addEventListener('resize', fit);

/* ---------- what this phone is, as far as a browser may see ---------- */
function deviceBinding(){
  return [
    'cpu:' + (navigator.hardwareConcurrency || 0),
    'mem:' + (navigator.deviceMemory || 0),
    'screen:' + screen.width + 'x' + screen.height,
    'dpr:' + (window.devicePixelRatio || 1),
    'depth:' + (screen.colorDepth || 0),
    'tz:' + (new Date().getTimezoneOffset())
  ].join('|');
}
function bytes(s){ return new TextEncoder().encode(s); }
function hex(buf, n){
  var a = new Uint8Array(buf), s = '', i;
  for (i=0;i<Math.min(a.length, n||a.length);i++)
    s += ('0'+a[i].toString(16)).slice(-2);
  return s.toUpperCase();
}

/* ---------- the key ---------- */
function deriveKey(secret, binding){
  var t0 = performance.now();
  return crypto.subtle.importKey('raw', bytes(secret), 'PBKDF2', false,
                                 ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: bytes(binding), iterations: ROUNDS, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
    })
    .then(function(k){ tDerive = performance.now() - t0; return k; });
}

/* ---------- a folder of files ---------- */
function folder(){
  return [
    { name:'notes.txt',   body:'The quick brown fox. '.repeat(40) },
    { name:'numbers.csv', body:'a,b,c\n' + Array.from({length:60},
        function(_,i){ return [i, i*i, i*3].join(','); }).join('\n') },
    { name:'readme.md',   body:'# folder\n\nEverything in here is locked together.\n' }
  ];
}

function useDrawing(){
  var secret = 'grid' + GRID + ':' + cells.join(',');
  var binding = deviceBinding();
  devBits = binding;

  if (!locked){
    /* lock it */
    deriveKey(secret, binding).then(function(key){
      var files = folder(), iv0 = crypto.getRandomValues(new Uint8Array(12));
      var t0 = performance.now();
      return Promise.all(files.map(function(f, i){
        var iv = new Uint8Array(iv0); iv[11] = i;   /* one per file */
        return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, bytes(f.body))
          .then(function(ct){ return { name:f.name, iv:iv,
            ct:new Uint8Array(ct), plain:f.body.length }; });
      })).then(function(out){
        tEncrypt = performance.now() - t0;
        locked = { files: out, binding: binding, cells: cells.slice() };
        opened = false;
        armAutoLock();
        render(); selfCheck();
      });
    }).catch(fail);
  } else {
    /* try to open it */
    deriveKey(secret, locked.binding).then(function(key){
      var t0 = performance.now();
      return Promise.all(locked.files.map(function(f){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:f.iv}, key, f.ct)
          .then(function(pt){ return new TextDecoder().decode(pt); });
      })).then(function(texts){
        tOpen = performance.now() - t0;
        opened = true; lastErr = '';
        /* WHERE AND WHEN, as asked. The device is what a browser can
           see of it; the readings that move are taken at this moment
           on purpose, because this is the one place a changing number
           is the point. */
        log.push({ at: new Date().toISOString().replace('T',' ').slice(0,19),
                   dev: deviceBinding(), ms: tOpen });
        armAutoLock();
        render();
      });
    }).catch(function(e){
      opened = false;
      lastErr = 'the shape did not match, so the files stayed shut';
      render();
    });
  }
}
function fail(e){ lastErr = String(e && e.message || e); render(); }

var lockTimer = null, lockAt = 0;
function armAutoLock(){
  clearTimeout(lockTimer);
  lockAt = Date.now() + AUTO_LOCK_MS;
  lockTimer = setTimeout(function(){ opened = false; render(); }, AUTO_LOCK_MS);
}

/* ---------- the tack, and its levels ---------- */
var guard = 0;
function ring(kb){
  var n = kb*1024/4, a = new Int32Array(n), idx = new Int32Array(n), i, j, t;
  for (i=0;i<n;i++) idx[i] = i;
  for (i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  for (i=0;i<n;i++) a[idx[i]] = idx[(i+1)%n];
  return a;
}
function chase(a, ms){
  var p=0, steps=0, t0=performance.now(), t1;
  do { for (var k=0;k<20000;k++) p=a[p]; steps+=20000; t1=performance.now(); }
  while (t1-t0 < ms);
  guard = p;
  return (t1-t0)*1e6/steps;
}
function best(a, ms){ var x=chase(a,ms), y=chase(a,ms); return Math.min(x,y); }
function measureTack(){
  var SZ = [16, 1024, 8192, 65536], out = [], i = 0;
  (function next(){
    if (i >= SZ.length){
      /* the marks: how far each level is from the nearest one */
      var near = out[0].ns;
      out.forEach(function(L){
        var r = L.ns/near;
        L.marks = r < 1.5 ? '_-' : (r < 12 ? '+-' : '/');
      });
      tackLevels = out; render(); return;
    }
    var kb = SZ[i++];
    out.push({ kb: kb, ns: best(ring(kb), 35) });
    render();
    setTimeout(next, 10);
  })();
}

/* ---------- the listing ---------- */
function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
         '</td><td style="color:#4a6076;width:18%">'+(u||'')+'</td></tr>';
}
function sz(kb){ return kb >= 1024 ? (kb/1024)+' MB' : kb+' kB'; }

function render(){
  /* how many different shapes could have been drawn, honestly: each
     square after the first has at most GRID*GRID choices, but a line
     can only move to a touching square, so the real count is far
     smaller. Eight neighbours is the fair figure. */
  var steps = Math.max(0, cells.length - 1);
  var guesses = cells.length ? Math.log(GRID*GRID)/Math.LN2 + steps*3 : 0;

  document.getElementById('tDraw').innerHTML =
    row('squares crossed', cells.length || '-', '', cells.length ? 'm' : '') +
    row('the order', cells.length ? cells.slice(0,14).join(' ') +
        (cells.length > 14 ? ' …' : '') : '-', '') +
    row('points the finger made', pts || '-', '') +
    row('how hard to guess', cells.length ? '2^' + guesses.toFixed(0) : '-',
        'shapes', cells.length >= 6 ? 'm' : 'w') +
    row('rounds of stretching', ROUNDS.toLocaleString(), '', 'm') +
    row('key making took', tDerive ? tDerive.toFixed(0) : '-', 'ms', 'm');

  var f = '';
  if (locked){
    locked.files.forEach(function(x){
      f += row(x.name, x.plain + ' → ' + x.ct.length, 'bytes', 'm') +
           row('&nbsp;&nbsp;locked bytes', hex(x.ct, 8) + '…', '', '');
    });
    f += row('encrypting took', tEncrypt.toFixed(1), 'ms', 'm') +
         row('opening took', tOpen ? tOpen.toFixed(1) : '-', 'ms', 'm') +
         row('cipher', 'AES-GCM 256', '', 'm');
  } else {
    f = row('folder', 'nothing locked yet - draw a shape', '', 'w');
  }
  document.getElementById('tFiles').innerHTML = f;

  document.getElementById('tDev').innerHTML =
    row('processors', navigator.hardwareConcurrency || '?', '', 'm') +
    row('memory fitted', navigator.deviceMemory || '?', 'GB', 'm') +
    row('screen', screen.width + ' x ' + screen.height, 'px', 'm') +
    row('dots per pixel', (window.devicePixelRatio||1).toFixed(2), '', 'm') +
    row('colour', screen.colorDepth || '?', 'bits', 'm') +
    row('this phone, as one line', devBits || deviceBinding(), '', '');

  var t = '';
  tackLevels.forEach(function(L){
    t += row(sz(L.kb), L.ns.toFixed(L.ns < 10 ? 2 : 1), 'ns', 'm') +
         row('&nbsp;&nbsp;level', L.marks || '…', '', 'm');
  });
  document.getElementById('tTack').innerHTML = t ||
    row('measuring', '…', '');

  var l = '';
  if (!log.length) l = row('opened', 'not yet', '', 'w');
  else log.slice(-6).forEach(function(e, i){
    l += row('opened ' + (log.length - Math.min(6,log.length) + i + 1),
             e.at, '', 'm') +
         row('&nbsp;&nbsp;on', e.dev, '', '') +
         row('&nbsp;&nbsp;took', e.ms.toFixed(1), 'ms', '');
  });
  document.getElementById('tLog').innerHTML = l;

  var st = document.getElementById('state');
  if (lastErr){ st.className = 'wrong'; st.textContent = lastErr; }
  else if (!locked){ st.className = 'locked'; st.textContent = 'nothing locked yet'; }
  else if (opened){ st.className = 'open';
    st.textContent = 'OPEN — shuts again in ' +
      Math.max(0, Math.ceil((lockAt - Date.now())/1000)) + ' seconds'; }
  else { st.className = 'locked';
    st.textContent = 'LOCKED — draw the same shape to open'; }

  document.getElementById('limits').innerHTML =
    '<b>What this does not do, said plainly.</b><br>' +
    '&bull; A browser cannot read the SIM card, the operator or the ' +
    'telephone number. Nothing here can refuse to open because the SIM ' +
    'changed, and any page that claims it does is not reading a SIM.<br>' +
    '&bull; The tack, the processor rate and the graphics lag are ' +
    '<b>not</b> in the key and must never be. They change on every ' +
    'reading - that is what makes them measurements - and a key built ' +
    'from them would lock a file that then never opened again, on any ' +
    'device, including this one. They go in the opened-at note instead.<br>' +
    '&bull; The note of when it was opened is kept in this page. It ' +
    'tells the owner; it cannot stop somebody who holds the phone from ' +
    'erasing it.<br>' +
    '&bull; The strength is the shape. Three or four squares is a weak ' +
    'secret however many rounds are piled on top.';

  document.getElementById('line').textContent =
    (locked ? (opened ? 'OPEN' : 'LOCKED') : 'NOTHING LOCKED') +
    ' SQUARES' + (cells.length || '-') +
    ' GUESS2^' + (cells.length ? guesses.toFixed(0) : '-') +
    ' KEY' + (tDerive ? tDerive.toFixed(0) : '-') + 'ms' +
    ' ENC' + (tEncrypt ? tEncrypt.toFixed(1) : '-') + 'ms' +
    ' FILES' + (locked ? locked.files.length : 0) +
    ' OPENED' + log.length +
    ' TACK' + (tackLevels.length ? tackLevels.length + 'lv' : '-');
}
setInterval(function(){ if (locked && opened) render(); }, 500);

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES.

   The one that matters is the WRONG shape. A lock that opens for the
   right secret proves nothing on its own - a lock that opens for
   everything also opens for the right secret. */
function selfCheck(){
  var fails = [];
  var binding = deviceBinding();
  var right = 'grid12:1,2,3,4,5';
  var wrong = 'grid12:1,2,3,4,6';
  var payload = bytes('the quick brown fox');
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var box;

  deriveKey(right, binding)
    .then(function(k){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, k, payload)
        .then(function(ct){ box = ct;
          /* the right shape must open it */
          return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k, ct); });
    })
    .then(function(pt){
      if (new TextDecoder().decode(pt) !== 'the quick brown fox')
        fails.push('the right shape did not return what went in');
      /* ONE SQUARE DIFFERENT MUST FAIL */
      return deriveKey(wrong, binding).then(function(k2){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k2, box)
          .then(function(){ fails.push('A SHAPE ONE SQUARE OUT OPENED THE FILE'); },
                function(){ /* refused, as it must be */ });
      });
    })
    .then(function(){
      /* AND SO MUST THE RIGHT SHAPE ON A DIFFERENT PHONE */
      return deriveKey(right, binding + '|other').then(function(k3){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k3, box)
          .then(function(){ fails.push('ANOTHER DEVICE OPENED THE FILE'); },
                function(){});
      });
    })
    .then(function(){
      /* and a tampered byte must be refused, not quietly returned */
      var bad = new Uint8Array(box.slice(0)); bad[3] ^= 0xFF;
      return deriveKey(right, binding).then(function(k){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k, bad)
          .then(function(){ fails.push('A CHANGED BYTE WAS ACCEPTED'); },
                function(){});
      });
    })
    .then(function(){ show(fails); })
    .catch(function(e){ fails.push('the check itself broke: ' + e.message);
                        show(fails); });

  function show(f){
    var el = document.getElementById('chk');
    if (f.length){
      el.style.display = '';
      el.innerHTML = '<b class="n">THE LOCK IS NOT BEHAVING</b><br>' +
        f.join('<br>') + '<br>Nothing above should be trusted.';
    } else { el.style.display = 'none'; el.innerHTML = ''; }
    window.__encFails = f;
  }
}

fit(); render();
setTimeout(measureTack, 300);
setTimeout(selfCheck, 100);

/* for checking from outside: draws a shape without a finger */
window.__draw = function(list){
  cells = list.slice(); pts = list.length; opened = false; lastErr = '';
  paint(); useDrawing();
};
window.__read = function(){ return { cells:cells, locked:!!locked,
  opened:opened, lastErr:lastErr, log:log, tackLevels:tackLevels,
  files: locked ? locked.files.map(function(f){ return {
    name:f.name, plain:f.plain, ct:f.ct.length }; }) : [],
  fails: window.__encFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
