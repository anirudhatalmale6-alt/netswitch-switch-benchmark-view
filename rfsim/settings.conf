# rfsim capability settings — turn features On/Off.
# Usage:  ./ggw_rfsim settings settings.conf
# Lines are  key = on|off  (# starts a comment). Unknown keys are ignored.

# --- implemented and available now ---
circuit    = on     # S-parameters, microstrip, match, quarter-wave, line, sweep
filter     = on     # Butterworth / Chebyshev lowpass + bandpass LC synthesis
touchstone = on     # .s2p import + Rollett stability K
fourier    = on     # FFT / inverse FFT spectrum
fdtd1d     = on     # 1D FDTD field solver (verified against closed form)

# --- planned / TODO (see ROADMAP.md). Turning these ON only records intent;
#     the tool will flag them as "enabled but NOT yet built" until they land. ---
fem        = off    # 3D finite-element field solver (CST/HFSS class)
fdtd3d     = off    # 3D FDTD field solver
thermal    = off    # thermal automation hook (phone/laptop temp control)
