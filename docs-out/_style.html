<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       max-width:860px;margin:0 auto;padding:28px 20px;color:#1c2128;line-height:1.55;
       font-size:15px}
  h1{font-size:24px;border-bottom:3px solid #2563eb;padding-bottom:8px;margin-top:0}
  h2{font-size:18px;color:#1d4ed8;margin-top:34px;border-bottom:1px solid #d0d7de;padding-bottom:5px}
  h3{font-size:15px;margin-top:22px}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
  th,td{border:1px solid #d0d7de;padding:7px 10px;text-align:left;vertical-align:top}
  th{background:#f0f4f9;font-weight:600}
  tr:nth-child(even) td{background:#fafbfc}
  code{background:#eff1f3;padding:1px 5px;border-radius:4px;font-size:13px;
       font-family:"SF Mono",Consolas,Menlo,monospace}
  pre{background:#0f1419;color:#e6edf3;padding:14px 16px;border-radius:8px;overflow-x:auto;
      font-size:12.5px;line-height:1.45}
  pre code{background:none;color:inherit;padding:0}
  blockquote{border-left:4px solid #2563eb;margin:14px 0;padding:2px 16px;background:#f0f6ff;color:#31404f}
  a{color:#2563eb}
  @media print{body{padding:0;max-width:none}pre{white-space:pre-wrap;word-wrap:break-word}
               h2{page-break-after:avoid}table{page-break-inside:avoid}}
</style>
