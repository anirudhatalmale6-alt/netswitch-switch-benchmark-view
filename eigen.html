<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EIGEN &middot; MAIN AXIS</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:14px 0 5px;text-transform:uppercase}
  canvas{display:block;width:100%;background:#070d15;
    border:1px solid #16293a;border-radius:4px}
  table{width:100%;border-collapse:collapse}
  td{padding:4px;border-bottom:1px solid #0e1a26;font-variant-numeric:tabular-nums}
  td.k{color:#8ea9c2;width:52%}
  td.v{text-align:right;color:#eaf6ff;font-weight:700}
  td.u{text-align:right;color:#4a6076;width:22%;font-weight:400}
  .ok{color:#3fd18a}.bad{color:#ff5b4d}.a1{color:#4fd1ff}.a2{color:#ffc24f}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #1d4a33;
    background:#08160f;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE, as asked. The panel
     is set to the mark's own background colour so the mark itself is
     never recoloured, recropped or stretched - it is a registered
     export mark and travels byte for byte as supplied. */
</style></head><body>

<div id="bar"><b id="stamp">B36</b><i id="line">gathering readings&hellip;</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Main axis of the two readings</h2>
  <canvas id="g" height="260"></canvas>
  <table id="t"></table>

  <h2>The two directions</h2>
  <table id="v"></table>

  <div id="chk">verifying the arithmetic&hellip;</div>

</div>

<script>
/* ==================================================================
   EIGEN - on this device's own readings.

   Two things are measured over and over: how long a memory access
   takes, and how much work the processor gets through. Each pair is
   one point. The pair of directions is then taken off those points:
   the first is the line the readings actually move along, the second
   is what is left across it, and the two values say how much of the
   movement sits on each.

   THE READINGS ARE PUT ON THE SAME FOOTING FIRST. One is in
   nanoseconds and is a small number, the other is in millions of
   operations and is a large one. Taken raw, the bigger-numbered
   reading would own the main direction every time and the answer
   would be about the units rather than about the device. So each
   reading is turned into how far it sits from its own middle, as a
   fraction of that middle - both then carry no units and are directly
   comparable.

   WHAT IS NOT DONE, AND WHY. The usual step is to divide each reading
   by its own spread as well. That is tidy, and it is wrong here: it
   forces both readings to have exactly the same spread, and then the
   main direction comes out 1 : 1 or 1 : -1 for every device and every
   set of readings, no matter what the machine is doing. It looks like
   a measurement and it is a decoration. Dividing by the middle instead
   leaves the two spreads different, so the direction tilts towards
   whichever reading is really moving more - which is the thing worth
   knowing.

   AND THE ARITHMETIC IS CHECKED AGAINST THE WORKED EXAMPLE in the
   supplied sheet. If the solver ever stops landing on the printed
   answer, the page says so instead of drawing a confident picture.
   Same rule as the sigma page: the check travels with the product, it
   does not live in a note written once and filed.

   NOTHING IS PRINTED WHEN IT PASSES. Prose saying the sums came out
   right is not a result, it is decoration - it was asked to come off.
   The block appears only when the arithmetic stops matching, which is
   the one time it carries information.
   ================================================================== */

/* ---- the pair solver ----
   For the four numbers a b / c d: the two values are the roots of the
   quadratic built from the sum a+d and the cross ad-bc. Halved sum
   plus and minus half the root of (sum squared less four crosses). */
function eig2(a,b,c,d){
  var tr = a + d, det = a*d - b*c, disc = tr*tr - 4*det;
  /* A NEGATIVE DISCRIMINANT IS A REAL ANSWER, NOT A FAILURE - it means
     the two values are complex and there is no straight line to draw.
     It is reported rather than being square-rooted into a NaN that
     would quietly paint an empty chart. */
  if (disc < 0) return { complex:true, tr:tr, det:det };
  var s = Math.sqrt(disc), l1 = (tr+s)/2, l2 = (tr-s)/2;
  return { complex:false, l1:l1, l2:l2, tr:tr, det:det,
           v1: vecFor(a,b,c,d,l1), v2: vecFor(a,b,c,d,l2) };
}
/* The direction for one value. Either row of a-lambda b / c d-lambda
   gives it; the row used has to be one that is not all noughts, which
   is why both are tried before falling back to the plain axes. */
function vecFor(a,b,c,d,l){
  if (Math.abs(b) > 1e-12) return scale1(b, l-a);
  if (Math.abs(c) > 1e-12) return scale1(l-d, c);
  return (Math.abs(l-a) < 1e-12) ? [1,0] : [0,1];
}
/* written in the sheet's form: first part one, so t(1, 3/2) */
function scale1(x,y){
  if (Math.abs(x) > 1e-12) return [1, y/x];
  return [0, 1];
}
function unit(v){ var L=Math.hypot(v[0],v[1])||1; return [v[0]/L, v[1]/L]; }

/* ---- the two readings, taken again and again ---- */
var ring = null, guard = 0, cpuGuard = 0;
var pts = [], MAXP = 60;

function makeRing(kb){
  var n=kb*1024/4, a=new Int32Array(n), idx=new Int32Array(n), i, j, t;
  for(i=0;i<n;i++) idx[i]=i;
  for(i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  for(i=0;i<n;i++) a[idx[i]]=idx[(i+1)%n];
  return a;                       /* BUILT ONCE. Rebuilding this every
                                     pass costs more than the reading
                                     and shows up as a stall in
                                     everything sitting beside it. */
}
/* dependent reads, so this is an access time and not a throughput */
function chase(a, ms){
  var p=0, steps=0, t0=performance.now(), t1;
  do { for(var k=0;k<20000;k++) p=a[p]; steps+=20000; t1=performance.now(); }
  while (t1-t0 < ms);
  guard = p;
  return (t1-t0)*1e6/steps;
}
/* long enough to be timed - a short burst finishes below the clock's
   own resolution and the reading is quantisation noise, not work */
function mops(){
  var t0=performance.now(), x=0, n=0;
  do { for(var i=0;i<200000;i++){ x+=(i&15)+1; } n+=200000; }
  while (performance.now()-t0 < 8);
  cpuGuard = x;
  var ms = performance.now()-t0;
  return ms>0 ? (n/ms)/1000 : 0;
}

function sample(){
  if (!ring) ring = makeRing(65536);
  pts.push([chase(ring, 12), mops()]);
  if (pts.length > MAXP) pts.shift();
  compute(); draw(); tables(); bar();
}

/* ---- the pair of directions, off the readings ---- */
var E = null, Z = [], corr = 0;
function compute(){
  E = null; Z = [];
  if (pts.length < 8) return;
  var i, mx=0, my=0, n=pts.length;
  for(i=0;i<n;i++){ mx+=pts[i][0]; my+=pts[i][1]; }
  mx/=n; my/=n;
  if (!(mx>0) || !(my>0)) return;
  /* each reading as a fraction of its own middle - no units left */
  for(i=0;i<n;i++) Z.push([(pts[i][0]-mx)/mx, (pts[i][1]-my)/my]);
  var vx=0, vy=0, vxy=0;
  for(i=0;i<n;i++){ vx += Z[i][0]*Z[i][0]; vy += Z[i][1]*Z[i][1];
                    vxy += Z[i][0]*Z[i][1]; }
  vx/=(n-1); vy/=(n-1); vxy/=(n-1);
  if (!(vx>0) || !(vy>0)) return;        /* a reading that never moves
                                            has no direction - say
                                            nothing rather than divide */
  corr = vxy/Math.sqrt(vx*vy);           /* how tied, separately, so the
                                            tie is readable on its own */
  E = eig2(vx, vxy, vxy, vy);
  E.mx=mx; E.my=my; E.n=n;
  E.sx=Math.sqrt(vx)*mx; E.sy=Math.sqrt(vy)*my;   /* back in real units */
  E.rx=Math.sqrt(vx)*100; E.ry=Math.sqrt(vy)*100; /* and as a per cent */
  E.cov=vxy; E.sum=E.l1+E.l2;
}

/* ---------------- drawing ---------------- */
function fitc(cv){ var w=cv.clientWidth||320; if(cv.width!==w) cv.width=w;
                   return cv.getContext('2d'); }
function draw(){
  var cv=document.getElementById('g'), g=fitc(cv);
  var W=cv.width, H=cv.height;
  g.fillStyle='#070d15'; g.fillRect(0,0,W,H);
  if(!E || E.complex || !Z.length) return;
  var R = Math.min(W,H)/2 - 16, cx = W/2, cy = H/2;
  var lim = 0; Z.forEach(function(p){ lim = Math.max(lim, Math.abs(p[0]), Math.abs(p[1])); });
  lim = Math.max(lim, 1) * 1.1;
  function X(v){ return cx + v/lim*R; }
  function Y(v){ return cy - v/lim*R; }

  g.strokeStyle='#12202c'; g.beginPath();
  g.moveTo(X(-lim),Y(0)); g.lineTo(X(lim),Y(0));
  g.moveTo(X(0),Y(-lim)); g.lineTo(X(0),Y(lim)); g.stroke();

  /* every reading, oldest faint and newest bright */
  Z.forEach(function(p,i){
    g.fillStyle='rgba(79,209,255,'+(0.25+0.75*i/Math.max(1,Z.length-1))+')';
    g.beginPath(); g.arc(X(p[0]),Y(p[1]),2.6,0,6.283); g.fill();
  });

  /* the two directions, each drawn as long as its share of the movement */
  [[unit(E.v1), E.l1, '#4fd1ff'], [unit(E.v2), E.l2, '#ffc24f']]
    .forEach(function(p){
      var u=p[0], L=Math.sqrt(Math.max(0,p[1]))*2.2;
      g.strokeStyle=p[2]; g.lineWidth=2.5; g.beginPath();
      g.moveTo(X(-u[0]*L), Y(-u[1]*L));
      g.lineTo(X( u[0]*L), Y( u[1]*L)); g.stroke();
    });
  g.font='9px monospace'; g.fillStyle='#4a6076';
  g.fillText('access time', X(lim)-64, Y(0)-5);
  g.fillText('work rate', X(0)+5, Y(lim)+10);
}

function row(k,v,u,cls){
  return '<tr><td class="k">'+k+'</td><td class="v '+(cls||'')+'">'+v+
         '</td><td class="u">'+(u||'')+'</td></tr>';
}
function pair(v){ return v[0].toFixed(0)+' : '+v[1].toFixed(3); }

function tables(){
  var t=document.getElementById('t'), s=document.getElementById('v');
  if(!E){ t.innerHTML = row('readings taken', pts.length, 'of 8 needed');
          s.innerHTML=''; return; }
  if(E.complex){
    t.innerHTML = row('readings taken', E.n||pts.length, '') +
      row('main axis', 'no straight line in this set', '', 'bad');
    s.innerHTML=''; return;
  }
  t.innerHTML =
    row('readings taken', E.n, 'pairs') +
    row('access time, middle', E.mx.toFixed(1), 'ns') +
    row('access time, spread', E.sx.toFixed(2), 'ns') +
    row('access time moves by', E.rx.toFixed(1), '% of its middle') +
    row('work rate, middle', Math.round(E.my).toLocaleString(), 'Mop/s') +
    row('work rate, spread', Math.round(E.sy).toLocaleString(), 'Mop/s') +
    row('work rate moves by', E.ry.toFixed(1), '% of its middle') +
    row('how tied the two are', corr.toFixed(3), '&minus;1 … 1');
  s.innerHTML =
    row('main axis, value', E.l1.toFixed(5), '', 'a1') +
    row('main axis, share of movement', (E.l1/E.sum*100).toFixed(1), '%', 'a1') +
    row('main axis, direction', pair(E.v1), '', 'a1') +
    row('second axis, value', E.l2.toFixed(5), '', 'a2') +
    row('second axis, share of movement', (E.l2/E.sum*100).toFixed(1), '%', 'a2') +
    row('second axis, direction', pair(E.v2), '', 'a2');
}

function bar(){
  var el = document.getElementById('line');
  if(!E){ el.textContent = 'gathering readings… '+pts.length+' of 8'; return; }
  if(E.complex){ el.textContent = 'N'+pts.length+' NO STRAIGHT LINE IN THIS SET'; return; }
  el.textContent =
    'N' + E.n +
    ' TIED' + corr.toFixed(2).replace('.',',') +
    ' MOVEns' + E.rx.toFixed(1).replace('.',',') + '%' +
    ' MOVEop' + E.ry.toFixed(1).replace('.',',') + '%' +
    ' SHARE' + (E.l1/E.sum*100).toFixed(0) + '%' +
    ' DIR1:' + E.v1[1].toFixed(2).replace('.',',') +
    ' DIR1:' + E.v2[1].toFixed(2).replace('.',',');
}

/* ---- THE ARITHMETIC, CHECKED AGAINST THE WORKED EXAMPLE ----
   The four numbers 2 -2 / -3 1 out of the supplied sheet. The printed
   answer: the two values are -1 and 4, directions 1 : 3/2 and 1 : -1.
   Both values and both directions are asserted here, and the picture
   above is not to be believed if this block turns red. */
function selfCheck(){
  var r = eig2(2,-2,-3,1);
  var fails = [];
  function near(a,b){ return Math.abs(a-b) < 1e-9; }
  if (r.complex) fails.push('solver called the worked case complex');
  else {
    /* the sheet lists smaller first; the solver returns larger first */
    if (!near(r.l1, 4))  fails.push('larger value ' + r.l1);
    if (!near(r.l2, -1)) fails.push('smaller value ' + r.l2);
    if (!near(r.v1[0],1) || !near(r.v1[1],-1))
      fails.push('direction for 4 is ' + pair(r.v1));
    if (!near(r.v2[0],1) || !near(r.v2[1],1.5))
      fails.push('direction for -1 is ' + pair(r.v2));
    /* AND THE DIRECTIONS ARE PUT BACK THROUGH THE FOUR NUMBERS. Matching
       a written answer only proves the answer was copied correctly; this
       proves the direction really is one, whatever the sheet says. */
    [[r.l1,r.v1],[r.l2,r.v2]].forEach(function(p){
      var l=p[0], v=p[1];
      var ax = 2*v[0] + -2*v[1], ay = -3*v[0] + 1*v[1];
      if (Math.abs(ax - l*v[0]) > 1e-9 || Math.abs(ay - l*v[1]) > 1e-9)
        fails.push('direction ' + pair(v) + ' does not hold for ' + l);
    });
  }
  var el = document.getElementById('chk');
  if (fails.length){
    el.style.borderColor='#5a1d1d'; el.style.background='#1a0808';
    el.innerHTML = '<b class="bad">THE ARITHMETIC DOES NOT MATCH THE ' +
      'WORKED EXAMPLE</b><br>' + fails.join(', ') +
      '<br>Nothing above should be trusted.';
  } else {
    el.innerHTML = '';                  /* silent while it passes */
    el.style.display = 'none';
  }
  window.__selfCheckFails = fails;
}

selfCheck();
tables(); bar();
/* no button on screen - it takes a fresh pair on its own */
setTimeout(sample, 200);
setInterval(sample, 700);

window.__read = function(){ return { n:pts.length, E:E, corr:corr,
  fails:window.__selfCheckFails,
  bar:document.getElementById('line').textContent }; };
</script>
</body></html>
