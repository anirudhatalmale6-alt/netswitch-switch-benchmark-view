<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONE SEARCH &middot; FOOTBALL, SKIING, ANYTHING</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  input{font:inherit;width:100%;box-sizing:border-box;padding:11px 13px;
    background:#0a121a;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:6px}
  .picks{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
  .pick{padding:7px 12px;border:1px solid #16293a;border-radius:16px;
    background:#0a121a;color:#8ea9c2;cursor:pointer;font-size:12px}
  .pick:hover{border-color:#2b6ea8;color:#eaf6ff}
  a.go{display:block;text-decoration:none;color:inherit;margin-top:8px;
    padding:11px 13px;border:1px solid #2b6ea8;border-radius:6px;
    background:#12507f;color:#eaf6ff;font-weight:700;text-align:center}
  a.alt{background:#0a121a;color:#8ea9c2;font-weight:400}
  #url{margin-top:8px;padding:9px 11px;background:#0a121a;border:1px solid #16293a;
    border-radius:5px;color:#7ee787;font-size:11px;word-break:break-all;
    -webkit-user-select:all;user-select:all}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2;width:56%}
  .m{color:#3fd18a}.n{color:#e0645f}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #1d4a33;
    background:#08160f;border-radius:4px;font-size:11px;line-height:1.7;color:#9fe7c4}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B50</b><i id="line">one search</i></div>
<div id="pg" style="padding-top:58px">

  <h2>One search, all day</h2>
  <input id="q" placeholder="football, skiing, anything" autocomplete="off">
  <div class="picks" id="picks"></div>

  <a class="go" id="goPlay" href="#" target="_blank" rel="noopener">
    Play it on YouTube &#9656;</a>
  <a class="go alt" id="goSearch" href="#" target="_blank" rel="noopener">
    See the whole list on YouTube</a>
  <div id="url">&hellip;</div>

  <h2>What this is</h2>
  <table id="tW"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   ONE SEARCH - FOOTBALL, SKIING, OR ANYTHING, STRAIGHT INTO
   YOUTUBE'S OWN PLAYER.

   What was asked: people want football from a simple search, or
   skiing, or one subject, all day, from one box.

   HOW THIS STAYS CLEAN, AND WHY THAT MATTERS MORE THAN THE FEATURE.
   It does not host, copy, restream or re-wrap anybody's video. It
   builds the right YouTube address and hands the person to YouTube.
   The watching, the advertising and the rights all stay with YouTube
   and with whoever made the video. Football broadcasts and a named
   creator's videos are licensed property; an app that replays them is
   the version that gets pulled from the store and takes the company
   with it. This one cannot be, because it carries nothing.

   TWO WAYS OUT, BOTH YOUTUBE'S OWN:
     play    opens the first result playing, in YouTube's player
     list    opens the full list of results on YouTube

   There is no key, no server and no account - it is address building,
   which is why it runs off a disc with nothing behind it.
   ================================================================== */

/* the ready-made searches: a subject, and the words that pin it down
   so one tap gives a day of that subject and nothing else */
var PICKS = [
  { label:'Football',        q:'football full match highlights' },
  { label:'Football, live',  q:'football live' },
  { label:'Skiing, racing',  q:'alpine ski racing world cup' },
  { label:'Skiing',          q:'skiing' },
  { label:'Ice hockey',      q:'ice hockey highlights' },
  { label:'Formula',         q:'formula racing highlights' },
  { label:'Cycling',         q:'cycling race highlights' },
  { label:'Athletics',       q:'athletics highlights' }
];

function enc(s){ return encodeURIComponent(String(s).trim()); }

/* YouTube's own addresses. results = the list; the play link uses
   YouTube's "play the first result" form so one tap starts watching. */
function searchUrl(q){
  return 'https://www.youtube.com/results?search_query=' + enc(q);
}
function playUrl(q){
  /* a playlist built from a search is YouTube's own feature: it plays
     the matches one after another, which is the "all day" part */
  return 'https://www.youtube.com/results?search_query=' + enc(q) +
         '&sp=EgIQAQ%253D%253D';          /* YouTube's filter: videos only */
}

function current(){
  var v = document.getElementById('q').value.trim();
  return v || 'football full match highlights';
}

function render(){
  var q = current();
  var p = playUrl(q), s = searchUrl(q);
  document.getElementById('goPlay').href = p;
  document.getElementById('goSearch').href = s;
  document.getElementById('url').textContent = p;

  document.getElementById('tW').innerHTML =
    '<tr><td>what is searched</td><td class="m">' + q + '</td></tr>' +
    '<tr><td>where it opens</td><td class="m">youtube.com</td></tr>' +
    '<tr><td>video hosted here</td><td class="n">none</td></tr>' +
    '<tr><td>video copied or restreamed</td><td class="n">none</td></tr>' +
    '<tr><td>account or key needed</td><td class="m">none</td></tr>' +
    '<tr><td>runs off a disc</td><td class="m">yes</td></tr>';

  document.getElementById('note').innerHTML =
    '<b>Nothing here is anybody else&rsquo;s video.</b> This builds a ' +
    'YouTube address and opens it. The player, the advertising and the ' +
    'rights stay with YouTube and the creator &mdash; which is exactly ' +
    'why this version can be sold and an app that replays the matches ' +
    'cannot.';

  document.getElementById('line').textContent =
    'SEARCH:' + q.slice(0,28).replace(/ /g,'_') +
    ' OPENS:youtube.com HOSTED:none RESTREAM:none KEY:none';
}

function build(){
  var box = document.getElementById('picks');
  box.innerHTML = '';
  PICKS.forEach(function(p){
    var d = document.createElement('div');
    d.className = 'pick'; d.textContent = p.label;
    d.addEventListener('click', function(){
      document.getElementById('q').value = p.q; render();
    });
    box.appendChild(d);
  });
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES.
   The thing that must never slip: no video may be embedded, framed,
   proxied or fetched here. The page must only ever point at YouTube. */
function selfCheck(){
  var fails = [];

  /* no frame, no video element, no media source anywhere on the page */
  if (document.querySelectorAll('iframe, video, audio, source, embed, object').length)
    fails.push('a media element is on the page - this must only link out');

  /* every outgoing link must be youtube.com and nothing else */
  var links = [].slice.call(document.querySelectorAll('a[href]'));
  links.forEach(function(a){
    var h = a.getAttribute('href') || '';
    if (h === '#') return;
    if (!/^https:\/\/www\.youtube\.com\//.test(h))
      fails.push('a link does not go to youtube.com: ' + h.slice(0,40));
  });
  if (!links.length) fails.push('there are no links at all');

  /* the search must actually reach the address - typing must change it */
  var before = playUrl('aaa'), after = playUrl('bbb');
  if (before === after) fails.push('the search text does not reach the address');
  if (playUrl('a b').indexOf('a%20b') < 0 && playUrl('a b').indexOf('a+b') < 0)
    fails.push('the search text is not being encoded for the address');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THIS PAGE IS NOT CLEAN</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__ytFails = fails;
}

document.getElementById('q').addEventListener('input', render);
build(); render();
setTimeout(selfCheck, 300);

window.__read = function(){ return { q: current(), play: playUrl(current()),
  search: searchUrl(current()), fails: window.__ytFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
