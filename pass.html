<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;

  .k.blank{border:none;background:none;cursor:default}
  table{width:100%;border-collapse:collapse;margin-top:6px}

  td{padding:4px 5px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2}
  td.v{color:#eaf6ff;font-weight:700}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;
    text-decoration:none;border-radius:4px;padding:8px 12px;font-size:12px;
    box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
  /* THE PURPLE IS THE MARK'S OWN COLOUR, so the panel is only as wide

    gap:6px;background:#d0cefd;border-radius:3px}
  #cr img{width:17px;height:auto;display:block}
  #crText{color:#12261a;font-weight:400;font-size:9px;line-height:1.2;white-space:normal;}

<script>
/* ==================================================================
   FOOTBALLAI - THE BALL AND THE PASS, ON THE SAME STEERING.

   IN METRES, ON A FULL PITCH. Everything here is worked in real units
   on a pitch 105 by 68, so a pass of thirty metres IS thirty metres
   and the ball behaves as a ball does on grass. That is what lets the
   physics be checked rather than merely look right.

   THE BALL ROLLS AND SLOWS. Grass takes speed off a rolling ball at a
   steady rate, so a pass has to be struck hard enough to still be
   moving when it reaches the other player. The strike is worked out
   from that: arrive at the feet at a gentle walking-pace roll, so
   kick at whatever speed the length needs. A pass too long for the
   hardest strike a foot can give does not arrive - it stops short,
   and the page says so instead of pretending it was completed.

   THE PHYSICS CHECKS ITSELF. Every completed pass has a time the
   textbook says it should take and a time it actually took on screen,
   and both are printed side by side. If the two ever disagree, the
   simulation is wrong and the page refuses a clean result.

   IT STARTS ITSELF. The steered player runs and passes on its own the
   moment the page opens. Touch any control and you take over.

   NOTHING NAMED. Shapes and numbers only - no person, club or
   competition - and the page checks itself for it.
   ================================================================== */

var PITCH_W = 105, PITCH_H = 68;     /* metres */
var TURN = 2.6;                       /* radians a second, as on the steer page */
var ACCEL = 4.0, DRAG = 1.2, TOP = 8.0;   /* metres a second, sprint is about 9 */
var ROLL_DECEL = 1.0;                 /* metres a second per second, on grass */
var ARRIVE_AT = 2.5;                  /* how fast the ball should reach the feet */
var MAX_KICK = 30.0;                  /* about as hard as a foot can strike it */
var CONTROL_R = 1.0;                  /* the ball is under control within this */
var CARRY_AHEAD = 0.8;                /* where the ball sits when dribbled */
var CONE = Math.PI / 3;               /* passes go to someone roughly ahead */
var SUBSTEP = 0.001;                  /* the ball is moved a millisecond at a time */
var AUTO_EVERY = 2.2;                 /* seconds between passes when playing itself */

var cv = document.getElementById('g'), g = cv.getContext('2d'), W = 0, H = 0;
var team = [], me = 0, ball = null, held = null, auto = true;
var simT = 0, lastFrame = 0, nextAuto = 1.2, frames = 0, stepMs = 0, fps = 0;
var fpsT0 = 0, fpsN = 0, passes = [], ballPath = [], fails = [];

function el(id){ return document.getElementById(id); }
function fi(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '-';
  return n.toFixed(d === undefined ? 1 : d).replace('.', ',');
}
function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){
  var d = new Date();
  return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate())
       + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}

/* ================= the pass, worked out =================
   KEPT APART FROM THE DRAWING so it can be checked against the
   textbook with no screen at all.

   With the ball losing speed at a steady rate a, a ball struck at v0
   and arriving at va after d metres obeys va^2 = v0^2 - 2ad. So the
   strike that reaches the feet at va is v0 = sqrt(va^2 + 2ad), and
   the time it takes is (v0 - va) / a. */
function strikeFor(d){
  return Math.sqrt(ARRIVE_AT * ARRIVE_AT + 2 * ROLL_DECEL * d);
}
function predictedTime(d){
  var v0 = strikeFor(d);
  if (v0 > MAX_KICK) return null;               /* it cannot get there */
  return (v0 - ARRIVE_AT) / ROLL_DECEL;
}
function stopDistance(v0){ return v0 * v0 / (2 * ROLL_DECEL); }
/* THE TIME A BALL STRUCK AT v0 TAKES TO ROLL s METRES. This is what a
   completed pass is held to - the distance the ball ACTUALLY rolled
   before it was taken, not the planned length, because the player
   takes it a stride before it reaches his exact spot. Holding it to
   the planned length would fail every honest pass by that stride. */
function timeToRoll(v0, s){
  var disc = v0 * v0 - 2 * ROLL_DECEL * s;
  if (disc < 0) return null;
  return (v0 - Math.sqrt(disc)) / ROLL_DECEL;
}

/* One step of a rolling ball, by the millisecond. The same function
   moves the ball on screen and in the checks, so the two cannot
   drift apart. */
function rollBall(b, dt){
  var left = dt;
  while (left > 1e-12 && b.speed > 0){
    var h = Math.min(SUBSTEP, left);
    var dv = ROLL_DECEL * h;
    var ds;
    if (b.speed <= dv){ ds = b.speed * b.speed / (2 * ROLL_DECEL); b.speed = 0; }
    else { ds = (b.speed - dv / 2) * h; b.speed -= dv; }
    b.x += Math.cos(b.dir) * ds; b.y += Math.sin(b.dir) * ds;
    b.run += ds; b.t += h;
    left -= h;
  }
}
/* For the checks: strike a ball over d metres on an empty pitch and
   report when it arrives, using nothing but rollBall. */
function simulatePass(d){
  var v0 = Math.min(strikeFor(d), MAX_KICK);
  var b = { x: 0, y: 0, dir: 0, speed: v0, run: 0, t: 0 };
  var arrivedAt = null, step = 0.004;
  while (b.speed > 0 && b.t < 120){
    rollBall(b, step);
    if (arrivedAt === null && b.run >= d){ arrivedAt = b.t; break; }
  }
  return { v0: v0, arrivedAt: arrivedAt, stoppedAt: b.run, short: arrivedAt === null,
           speedThere: b.speed };
}

/* ================= the team ================= */
function placeTeam(){
  team = [
    { x: 30, y: 34 }, { x: 45, y: 16 }, { x: 52, y: 50 },
    { x: 66, y: 28 }, { x: 78, y: 46 }, { x: 88, y: 22 }
  ].map(function(p, i){
    return { x: p.x, y: p.y, hx: p.x, hy: p.y, head: 0, speed: 0, n: i + 2,
             wob: i * 1.7 };
  });
  me = 0;
  ball = { x: team[0].x + CARRY_AHEAD, y: team[0].y, dir: 0, speed: 0,
           run: 0, t: 0, flight: null };
}

/* Someone roughly ahead, the nearest of them. If nobody is ahead,
   the one whose direction is closest to where the player faces. */
function chooseReceiver(){
  var p = team[me], best = null, bestScore = Infinity, i;
  for (i = 0; i < team.length; i++){
    if (i === me) continue;
    var dx = team[i].x - p.x, dy = team[i].y - p.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var ang = Math.abs(Math.atan2(Math.sin(Math.atan2(dy, dx) - p.head),
                                  Math.cos(Math.atan2(dy, dx) - p.head)));
    var score = ang <= CONE / 2 ? d : 1000 + ang * 100;
    if (score < bestScore){ bestScore = score; best = i; }
  }
  return best;
}

function kick(){
  if (ball.flight) return false;
  var p = team[me];
  var bx = ball.x - p.x, by = ball.y - p.y;
  if (Math.sqrt(bx * bx + by * by) > CONTROL_R + CARRY_AHEAD) return false;
  var r = chooseReceiver();
  if (r === null) return false;
  var q = team[r];
  var dx = q.x - ball.x, dy = q.y - ball.y, d = Math.sqrt(dx * dx + dy * dy);
  var want = strikeFor(d), v0 = Math.min(want, MAX_KICK);
  ball.dir = Math.atan2(dy, dx); ball.speed = v0; ball.run = 0; ball.t = 0;
  ball.flight = { from: me, to: r, d: d, v0: v0, predicted: predictedTime(d),
                  sx: ball.x, sy: ball.y, n: passes.length + 1 };
  ballPath = [[ball.x, ball.y]];
  return true;
}

function finishPass(result){
  var f = ball.flight;
  passes.push({ n: f.n, d: f.d, v0: f.v0, took: ball.t, predicted: f.predicted,
                run: ball.run, physics: timeToRoll(f.v0, ball.run),
                result: result, from: f.from, to: f.to,
                sx: f.sx, sy: f.sy, ex: ball.x, ey: ball.y });
  if (passes.length > 400) passes.shift();
  if (result === 'completed') me = f.to;
  ball.flight = null; ball.speed = 0;
}

/* ================= the game step ================= */
function step(now){
  var t0 = performance.now();
  if (!lastFrame) lastFrame = now;
  var dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  simT += dt;

  var p = team[me];
  var act = held;
  if (auto) act = autoDecide(p);

  if (act === 'left') p.head -= TURN * dt;
  if (act === 'right') p.head += TURN * dt;
  if (act === 'straight') p.speed += ACCEL * dt;
  if (act === 'back'){
    /* BACK TURNS THE RUN ROUND rather than reversing the body. */
    p.head += TURN * dt;
    p.speed += ACCEL * 0.6 * dt;
  }
  if (!act) p.speed -= DRAG * dt * p.speed;
  if (p.speed > TOP) p.speed = TOP;
  if (p.speed < 0) p.speed = 0;
  p.x += Math.cos(p.head) * p.speed * dt;
  p.y += Math.sin(p.head) * p.speed * dt;
  /* the touchline turns a player back in rather than letting him off */
  if (p.x < 2 || p.x > PITCH_W - 2 || p.y < 2 || p.y > PITCH_H - 2){
    var cx = PITCH_W / 2 - p.x, cy = PITCH_H / 2 - p.y;
    p.head = Math.atan2(cy, cx);
    p.x = Math.max(2, Math.min(PITCH_W - 2, p.x));
    p.y = Math.max(2, Math.min(PITCH_H - 2, p.y));
  }

  /* the others drift a little round their places, so passes are not
     to statues - and come towards a ball that is on its way to them */
  team.forEach(function(q, i){
    if (i === me) return;
    q.wob += dt;
    var tx = q.hx + Math.sin(q.wob * 0.7) * 3, ty = q.hy + Math.cos(q.wob * 0.5) * 2;
    if (ball.flight && ball.flight.to === i){ tx = q.x; ty = q.y; }
    q.x += (tx - q.x) * Math.min(1, dt * 0.8);
    q.y += (ty - q.y) * Math.min(1, dt * 0.8);
  });

  if (ball.flight){
    rollBall(ball, dt);
    if (ballPath.length < 2000) ballPath.push([ball.x, ball.y]);
    var q2 = team[ball.flight.to];
    var rx = ball.x - q2.x, ry = ball.y - q2.y;
    if (Math.sqrt(rx * rx + ry * ry) <= CONTROL_R) finishPass('completed');
    else if (ball.speed <= 0) finishPass('short');
    else if (ball.x < 0 || ball.x > PITCH_W || ball.y < 0 || ball.y > PITCH_H)
      finishPass('out');
  } else {
    /* dribbled: the ball sits just ahead of the player who has it */
    var c = team[me];
    ball.x = c.x + Math.cos(c.head) * CARRY_AHEAD;
    ball.y = c.y + Math.sin(c.head) * CARRY_AHEAD;
  }

  if (auto && simT >= nextAuto){ kick(); nextAuto = simT + AUTO_EVERY; }

  draw();
  stepMs = stepMs * 0.95 + (performance.now() - t0) * 0.05;
  fpsN++;
  if (now - fpsT0 >= 1000){ fps = fpsN * 1000 / (now - fpsT0); fpsN = 0; fpsT0 = now; render(); }
  frames++;
  requestAnimationFrame(step);
}

/* Playing itself: run up the pitch, ease towards the next player,
   pass on a beat. Nothing clever - enough to show the passing. */
function autoDecide(p){
  var r = chooseReceiver();
  if (r === null) return 'straight';
  var q = team[r];
  var want = Math.atan2(q.y - p.y, q.x - p.x);
  var diff = Math.atan2(Math.sin(want - p.head), Math.cos(want - p.head));
  if (Math.abs(diff) > 0.15) return diff < 0 ? 'left' : 'right';
  return p.speed < 3 ? 'straight' : null;
}

/* ================= drawing ================= */
function fit(){
  W = cv.clientWidth || 640;
  H = Math.round(W * PITCH_H / PITCH_W);
  if (cv.width !== W) cv.width = W;
  if (cv.height !== H) cv.height = H;
}
function X(m){ return m / PITCH_W * W; }
function Y(m){ return m / PITCH_H * H; }
function draw(){
  fit();
  g.fillStyle = '#0a1f12'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2f5a3a'; g.lineWidth = 1.5;
  g.strokeRect(X(0) + 1, Y(0) + 1, W - 2, H - 2);
  g.beginPath(); g.moveTo(X(52.5), 0); g.lineTo(X(52.5), H); g.stroke();
  g.beginPath(); g.arc(X(52.5), Y(34), X(9.15), 0, 7); g.stroke();
  g.strokeRect(X(0), Y(13.85), X(16.5), Y(40.3));
  g.strokeRect(X(PITCH_W - 16.5), Y(13.85), X(16.5), Y(40.3));

  if (ball.flight && ballPath.length > 1){
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.setLineDash([4, 4]);
    g.beginPath();
    ballPath.forEach(function(pt, i){ i ? g.lineTo(X(pt[0]), Y(pt[1])) : g.moveTo(X(pt[0]), Y(pt[1])); });
    g.stroke(); g.setLineDash([]);
  }
  team.forEach(function(q, i){
    var r = Math.max(5, X(1.1));
    g.fillStyle = i === me ? '#f00' : '#4fd1ff';
    g.beginPath(); g.arc(X(q.x), Y(q.y), r, 0, 7); g.fill();
    if (i === me){
      g.strokeStyle = '#fff'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(X(q.x), Y(q.y));
      g.lineTo(X(q.x + Math.cos(q.head) * 3), Y(q.y + Math.sin(q.head) * 3)); g.stroke();
    }
    g.fillStyle = '#05080c'; g.font = 'bold ' + Math.max(8, r) + 'px monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(q.n), X(q.x), Y(q.y) + 0.5);
  });
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(X(ball.x), Y(ball.y), Math.max(3, X(0.45)), 0, 7); g.fill();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}

/* ================= the tables ================= */
function row(t, k, v, cls){
  var tr = document.createElement('tr');
  var a = document.createElement('td'); a.textContent = k;
  var b = document.createElement('td'); b.className = 'v ' + (cls || ''); b.textContent = v;
  tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
}
function render(){
  var done = passes.filter(function(x){ return x.result === 'completed'; });
  var t = el('tP'); t.innerHTML = '';
  row(t, 'Passes Played', String(passes.length));
  if (passes.length){
    row(t, 'Reached The Player', String(done.length) + ', '
        + fi(done.length / passes.length * 100, 0) + ' per cent',
        done.length === passes.length ? 'm' : '');
    var longest = done.reduce(function(m, x){ return Math.max(m, x.d); }, 0);
    if (longest) row(t, 'Longest Completed', fi(longest, 1) + ' m');
    var hard = passes.reduce(function(m, x){ return Math.max(m, x.v0); }, 0);
    row(t, 'Hardest Strike', fi(hard, 1) + ' m a second, ' + fi(hard * 3.6, 0) + ' km an hour');
    var worst = done.reduce(function(m, x){
      return x.physics !== null ? Math.max(m, Math.abs(x.took - x.physics)) : m; }, 0);
    if (done.length) row(t, 'Physics Against The Screen',
        'within ' + fi(worst * 1000, 1) + ' ms on every pass', worst < 0.02 ? 'm' : 'n');
  }
  row(t, 'Who Has The Ball', 'Number ' + team[me].n + (auto ? ', playing itself' : ', yours'));
  /* NO "LONGEST POSSIBLE PASS" FIGURE. The ball here slows only by
     rolling on grass, which is right for a pass along the ground at the
     speeds actually played, but leaves out the air, which takes most of
     the speed off a ball struck hard. Printed, the model's limit came
     out at 447 m on a 105 m pitch - true to the model, absurd to anyone
     who has watched a match. A figure the model cannot stand behind is
     not shown. */

  var lb = el('lBody'); lb.innerHTML = '';
  passes.slice(-8).reverse().forEach(function(x){
    var tr = document.createElement('tr');
    function td(s, cls){ var e = document.createElement('td'); e.textContent = s;
      if (cls) e.className = cls; tr.appendChild(e); }
    td('Pass ' + x.n);
    td(fi(x.d, 1) + ' m');
    td(fi(x.v0, 1) + ' m/s');
    td(x.result === 'completed' ? fi(x.took, 2) + ' s' : '-');
    td(x.result === 'completed' ? fi(x.physics, 2) + ' s'
       : (x.predicted === null ? 'too long' : fi(x.predicted, 2) + ' s'));
    td(x.result === 'completed' ? 'Reached' : (x.result === 'short' ? 'Stopped short' : 'Out of play'),
       x.result === 'completed' ? 'm' : 'n');
    lb.appendChild(tr);
  });

  var tc = el('tC'); tc.innerHTML = '';
  row(tc, 'Frames A Second', fi(fps, 0));
  row(tc, 'One Step Takes', fi(stepMs, 2) + ' ms');
  row(tc, 'The Ball Is Moved In Steps Of', fi(SUBSTEP * 1000, 0) + ' ms, whatever the screen does');

  el('line').textContent = auto ? 'Playing itself - touch a control to take over'
                                : 'Yours - number ' + team[me].n + ' has the ball';
  refreshDownloads();
  selfCheck();
}

/* ================= the page checks itself ================= */
function selfCheck(){
  /* THE CHECK MUST NOT READ ITS OWN WARNING. The red box quotes what
     it caught - a name, say - and it sits inside the page, so reading
     the whole page found the name again in the warning itself and the
     alarm could never clear once raised. The box is left out. */
  var f = [], txt = document.body.innerText.replace(el('chk').innerText, '');
  if (document.querySelectorAll('pre, code, textarea').length) f.push('a source block reached the page');
  if (/[$€£]\s?[0-9]|\bprice[sd]?\b/i.test(txt)) f.push('money wording reached the page');
  if (/\b(Infinity|NaN)\b/.test(txt)) f.push('a figure with no value reached the page');
  if (el('crText').textContent.trim() !== 'AI2ORBIT CO. Network system Pat. pend. Founded in 2018. Copyright 2018-2027. All rights reserved.')
    f.push('the copyright line is not exact');
  if (document.getElementById('crBiz')) f.push('a second copyright line is on the page');

  /* NOTHING MAY BE NAMED - the same rule as the steer page. */
  if (/\b(FC|AFC|United|City|Madrid|Barcelona|Juventus|Bayern|Liverpool|Arsenal|Chelsea|Premier|Liga|Serie A|Bundesliga|UEFA|FIFA|Champions League)\b/.test(txt))
    f.push('a club, competition or body is named on the page');
  /* A NAME SITS ON ONE LINE. `\s` also matches a line break, so the
     last word of one table row and the first of the next read as a
     first name and a surname - 'Reached' / 'Pass' - and the page
     flagged itself. Spaces only. */
  var m = txt.match(/\b[A-Z][a-z]{2,} +[A-Z][a-z]{2,}\b/g);
  if (m){
    var ok = /^(All Rights|Rights Reserved|Steer And|And Pass|The Passing|The Last|Last Passes|Passes Played|Reached The|The Player|Longest Completed|Hardest Strike|Physics Against|Against The|The Screen|Who Has|Has The|The Ball|Ball Is|Is Moved|Moved In|Longest Pass|Pass The|The Strike|Strike Allows|What It|It Costs|Costs The|The Device|Frames A|One Step|Step Takes|Steps Of|Stopped|Out Of|Reached|Playing)$/;
    var bad = m.filter(function(s){ return !ok.test(s); });
    if (bad.length) f.push('something reads as a name: ' + bad[0]);
  }

  /* THE PHYSICS. A completed pass must take as long as the textbook
     says, give or take one frame. A ball that arrives sooner than a
     rolling ball can is a simulation that is wrong. */
  passes.forEach(function(x){
    if (x.result !== 'completed' || x.physics === null) return;
    if (Math.abs(x.took - x.physics) > 0.02)
      f.push('pass ' + x.n + ' took ' + x.took.toFixed(3) + ' s where the physics says '
             + x.physics.toFixed(3) + ' s for the ' + x.run.toFixed(1) + ' m it rolled');
  });
  fails = f;
  var box = el('chk');
  if (f.length){ box.style.display = 'block';
    box.innerHTML = '<b class="n">THIS PAGE IS NOT CLEAN</b><br>' + f.join('<br>'); }
  else box.style.display = 'none';
  return f;
}

/* ================= what leaves the page ================= */
function textOf(){
  var L = ['FOOTBALLAI - PASS', 'AI2Orbit', 'Taken ' + stampNow(), ''];
  passes.forEach(function(x){
    L.push('Pass ' + x.n + ': ' + fi(x.d, 1) + ' m, struck at ' + fi(x.v0, 1) + ' m/s, '
      + (x.result === 'completed' ? 'reached in ' + fi(x.took, 2) + ' s (physics ' + fi(x.predicted, 2) + ' s)'
                                  : x.result));
  });
  L.push('', 'AI2ORBIT CO. Network system Pat. pend. Founded in 2018. Copyright 2018-2027. All rights reserved.');
  return L.join('\n');
}
function dxfOf(){
  var o = [];
  function p(a, b){ o.push(a, String(b)); }
  function line(lay, x1, y1, x2, y2){
    p(0, 'LINE'); p(8, lay); p(10, x1); p(20, y1); p(30, 0); p(11, x2); p(21, y2); p(31, 0);
  }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  line('PITCH', 0, 0, PITCH_W, 0); line('PITCH', PITCH_W, 0, PITCH_W, PITCH_H);
  line('PITCH', PITCH_W, PITCH_H, 0, PITCH_H); line('PITCH', 0, PITCH_H, 0, 0);
  line('PITCH', 52.5, 0, 52.5, PITCH_H);
  team.forEach(function(q){
    p(0, 'CIRCLE'); p(8, 'PLAYERS'); p(10, q.x.toFixed(3)); p(20, q.y.toFixed(3)); p(30, 0); p(40, 1.1);
  });
  passes.forEach(function(x){ line('PASSES', x.sx.toFixed(3), x.sy.toFixed(3), x.ex.toFixed(3), x.ey.toFixed(3)); });
  p(0, 'TEXT'); p(8, 'LABELS'); p(10, 0); p(20, -4); p(30, 0); p(40, 2);
  p(1, 'FOOTBALLAI PASS ' + stampNow());
  p(0, 'ENDSEC'); p(0, 'EOF');
  return o.join('\r\n') + '\r\n';
}
var lastDl = 0;
function refreshDownloads(){
  if (performance.now() - lastDl < 2000) return;
  lastDl = performance.now();
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'}));
}

/* ================= controls ================= */
function takeOver(){ auto = false; }
function press(d){ takeOver(); held = d; [].forEach.call(document.querySelectorAll('.k[data-d]'),
  function(k){ k.classList.toggle('on', k.dataset.d === d); }); }
function release(){ held = null; [].forEach.call(document.querySelectorAll('.k.on'),
  function(k){ k.classList.remove('on'); }); }
[].forEach.call(document.querySelectorAll('.k[data-d]'), function(k){
  k.addEventListener('mousedown', function(e){ e.preventDefault(); press(k.dataset.d); });
  k.addEventListener('touchstart', function(e){ e.preventDefault(); press(k.dataset.d); }, {passive:false});
});
var pk = document.querySelector('.k[data-p]');
pk.addEventListener('mousedown', function(e){ e.preventDefault(); takeOver(); kick(); });
pk.addEventListener('touchstart', function(e){ e.preventDefault(); takeOver(); kick(); }, {passive:false});
window.addEventListener('mouseup', release);
window.addEventListener('touchend', release);
window.addEventListener('keydown', function(e){
  var map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'straight', ArrowDown:'back' };
  if (map[e.key]){ e.preventDefault(); press(map[e.key]); }
  if (e.key === ' '){ e.preventDefault(); takeOver(); kick(); }
});
window.addEventListener('keyup', function(e){ if (e.key !== ' ') release(); });

placeTeam(); fit(); draw(); render();
requestAnimationFrame(step);

window.__read = function(){
  return { ready: passes.length >= 3, passes: passes, auto: auto, me: me,
           fps: fps, stepMs: stepMs, fails: fails,
           bar: el('stamp').textContent + ' ' + el('line').textContent };
};
window.__strikeFor = strikeFor;
window.__predictedTime = predictedTime;
window.__simulatePass = simulatePass;
window.__timeToRoll = timeToRoll;
window.__constants = { ROLL_DECEL: ROLL_DECEL, ARRIVE_AT: ARRIVE_AT, MAX_KICK: MAX_KICK };
window.__selfCheck = selfCheck;
window.__takeOver = takeOver;
window.__kick = kick;
window.__textOf = textOf;
window.__dxfOf = dxfOf;
</script>
