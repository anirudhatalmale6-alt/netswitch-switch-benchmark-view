plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ggw.sysbar'
    compileSdk 34

    defaultConfig {
        applicationId "com.ggw.sysbar"
        minSdk 23
        targetSdk 33          // targetSdk 33: no forced foreground-service-type; still installs/runs on 14/15
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debuggable, no signing config needed — CI produces app-debug.apk
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
