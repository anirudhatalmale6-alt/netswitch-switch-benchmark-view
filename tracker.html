<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SATELLITE TRACKER &middot; 4-SQUARE</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  canvas{display:block;width:100%;max-width:360px;margin:0 auto;
    background:#070d15;border:1px solid #16293a;border-radius:6px}
  table{width:100%;border-collapse:collapse}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2;width:52%}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  .fix{color:#4fd1ff;font-weight:700;font-size:15px}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.7}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B47</b><i id="line">tracking&hellip;</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Four-square, diamond inside</h2>
  <canvas id="g" width="360" height="360"></canvas>

  <h2>The fixed point</h2>
  <table id="tFix"></table>

  <h2>What was asked, and what a browser can do</h2>
  <table id="tReal"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   SATELLITE TRACKER - A FOUR-SQUARE GRID WITH A DIAMOND INSIDE,
   36 MARKERS, AND A FIXED POINT.

   The layout asked for: a four-square divided to a sixteenth, a
   diamond square set inside it, and markers moving across - 36 of
   them. They sweep the grid and the tracker reports a fixed point,
   written in the minutes given.

   THE FIXED POINT. The coordinate is kept exactly as given and always
   answered the same: it does not drift, it does not round, it is the
   same minutes every time - 60 degrees 01 minutes north, 23 degrees
   02 minutes east, which sits in Kymenlaakso. That is the "always
   respond with the same minutes" asked for.

   WHAT A BROWSER CANNOT DO, SHOWN RATHER THAN FAKED. The request names
   numbers no browser can reach - sixty thousand satellites, forty-five
   million points every thousandth of a second, an answer every
   0.00000013 of a second. A web page cannot see a single real
   satellite - the device gives a position, not the satellites behind
   it - and it cannot schedule finer than milliseconds. So the panel
   shows the asked-for figure beside what this device actually does,
   and the gap is on the screen. The 36 markers are the drawn grid the
   layout asked for, not a claim of 36 real satellites.

   WHERE A REAL POSITION IS AVAILABLE, it is read from the device and
   shown beside the fixed point, marked as the live one. Where it is
   not - no sensor, or permission refused - that row says so and the
   fixed point still stands.
   ================================================================== */

/* the fixed point, kept exactly - degrees and minutes, never recomputed */
var FIX = { latDeg:60, latMin:1, latH:'N', lonDeg:23, lonMin:2, lonH:'E' };
function fixText(){
  return FIX.latDeg + '° ' + ('0'+FIX.latMin).slice(-2) + "' " + FIX.latH +
         '   ' +
         FIX.lonDeg + '° ' + ('0'+FIX.lonMin).slice(-2) + "' " + FIX.lonH;
}

var MARKERS = 36, OUTER = 4, FINE = 16;
var asked = { sats:60000, queryHz:60, ptsPerMs:45000000, respSec:0.00000013 };
var real = { queryHz:0, frameMs:0 }, live = null, liveErr = '';
var guard = 0, queries = 0, qT0 = 0;

/* ---- the drawing: four squares, each cut to a sixteenth, a diamond
        set inside, and the 36 markers sweeping ---- */
var cv = document.getElementById('g'), g = cv.getContext('2d');
var marks = [];
function seed(){
  marks = [];
  for (var i=0;i<MARKERS;i++){
    marks.push({ a: (i/MARKERS)*Math.PI*2,          /* starting angle */
      r: 0.28 + (i%3)*0.11,                          /* three rings */
      sp: 0.15 + (i%5)*0.03 });                      /* a few speeds */
  }
}
function draw(t){
  var W = cv.width, H = cv.height, cx = W/2, cy = H/2, R = W/2 - 8;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);

  /* the four square, to a sixteenth: outer 4x4 of cells */
  g.strokeStyle = '#16293a'; g.lineWidth = 1;
  var step = (W) / FINE, k;
  for (k=1;k<FINE;k++){
    g.globalAlpha = (k % 4 === 0) ? 0.9 : 0.35;      /* heavier on quarters */
    g.beginPath(); g.moveTo(k*step,0); g.lineTo(k*step,H); g.stroke();
    g.beginPath(); g.moveTo(0,k*step); g.lineTo(W,k*step); g.stroke();
  }
  g.globalAlpha = 1;

  /* the diamond set inside */
  g.strokeStyle = '#2b6ea8'; g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(cx, cy-R); g.lineTo(cx+R, cy); g.lineTo(cx, cy+R);
  g.lineTo(cx-R, cy); g.closePath(); g.stroke();

  /* a smaller diamond, the 1/300 inner mark, drawn as the centre eye */
  g.strokeStyle = '#3fd18a'; var r2 = R*0.12;
  g.beginPath();
  g.moveTo(cx, cy-r2); g.lineTo(cx+r2, cy); g.lineTo(cx, cy+r2);
  g.lineTo(cx-r2, cy); g.closePath(); g.stroke();

  /* the 36 markers sweeping the grid */
  var secs = t/1000;
  marks.forEach(function(m, i){
    var ang = m.a + secs*m.sp;
    var x = cx + Math.cos(ang)*m.r*R, y = cy + Math.sin(ang)*m.r*R;
    g.fillStyle = (i%6===0) ? '#4fd1ff' : '#5a7488';
    g.beginPath(); g.arc(x, y, (i%6===0)?3:2, 0, 6.283); g.fill();
  });

  /* the fixed point at the centre */
  g.fillStyle = '#4fd1ff';
  g.beginPath(); g.arc(cx, cy, 3.5, 0, 6.283); g.fill();
}

/* ---- the query loop: ask as fast as the frame allows, and measure
        the rate actually achieved against the 60 a second asked for ---- */
var lastFrame = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (lastFrame){ real.frameMs = now - lastFrame; }
  lastFrame = now;
  queries++;
  if (!qT0) qT0 = now;
  var el = now - qT0;
  if (el >= 1000){ real.queryHz = queries * 1000 / el; queries = 0; qT0 = now; }
  draw(now);
  render();
}

/* ---- a real position, where the device will give one ---- */
function getLive(){
  if (!('geolocation' in navigator)){
    liveErr = 'this device exposes no position sensor to a web page';
    render(); return;
  }
  navigator.geolocation.getCurrentPosition(function(p){
    /* shown to the SAME minutes, so it sits beside the fixed point */
    live = degMin(p.coords.latitude, 'N', 'S') + '   ' +
           degMin(p.coords.longitude, 'E', 'W');
    render();
  }, function(err){
    liveErr = 'position refused or unavailable (' + (err && err.message || '') + ')';
    render();
  }, { timeout: 8000 });
}
function degMin(v, pos, neg){
  var h = v >= 0 ? pos : neg; v = Math.abs(v);
  var d = Math.floor(v), m = Math.round((v - d) * 60);
  if (m === 60){ d++; m = 0; }
  return d + '° ' + ('0'+m).slice(-2) + "' " + h;
}

/* ---------------- the listing ---------------- */
function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:18%">'+(u||'')+'</td></tr>';
}
function render(){
  document.getElementById('tFix').innerHTML =
    '<tr><td>always answered, same minutes</td>' +
    '<td class="fix" colspan="2">' + fixText() + '</td></tr>' +
    row('region named', 'Kymenlaakso', '', 'm') +
    row('markers on the grid', MARKERS, 'drawn', 'm') +
    (live ? '<tr><td>this device, live position</td><td class="fix" colspan="2" ' +
       'style="color:#3fd18a">' + live + '</td></tr>'
     : row('this device, live position',
           liveErr || 'asking the device…', '', 'n'));

  document.getElementById('tReal').innerHTML =
    '<tr><td></td><td style="color:#6d8ba3">asked</td>' +
      '<td style="color:#6d8ba3">this device</td></tr>' +
    '<tr><td>queries a second</td><td class="w">' + asked.queryHz +
      '</td><td class="m">' + (real.queryHz ? real.queryHz.toFixed(0) : '…') + '</td></tr>' +
    '<tr><td>satellites</td><td class="w">' + asked.sats.toLocaleString() +
      '</td><td class="n">none - a browser sees no satellites</td></tr>' +
    '<tr><td>points per 1/1000 s</td><td class="w">' + asked.ptsPerMs.toLocaleString() +
      '</td><td class="n">far beyond a browser</td></tr>' +
    '<tr><td>answer every</td><td class="w">' + asked.respSec + ' s' +
      '</td><td class="n">a browser schedules in ms, not that</td></tr>';

  document.getElementById('note').innerHTML =
    '<b>What is real here and what is drawn.</b><br>' +
    '&bull; The fixed point is answered exactly and to the same minutes ' +
    'every time, as asked.<br>' +
    '&bull; The four-square, the diamond and the 36 markers are the ' +
    'layout asked for, drawn - they are not 36 real satellites.<br>' +
    '&bull; A web page cannot see a satellite, cannot hold forty-five ' +
    'million points a millisecond, and cannot answer every ' +
    '0.00000013 of a second. The asked figures are shown beside what ' +
    'this device actually manages, so the gap is in plain view. A real ' +
    'satellite feed needs a receiver and a service behind it, not a ' +
    'browser - that is a different build, and an honest one.';

  document.getElementById('line').textContent =
    'FIX ' + fixText().replace(/\s+/g,'') +
    ' MARK' + MARKERS +
    ' Q/s' + (real.queryHz ? real.queryHz.toFixed(0) : '-') + '/' + asked.queryHz +
    ' SATS0/' + asked.sats +
    (live ? ' LIVEyes' : ' LIVEno');
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* the fixed point must be exactly the minutes given, and must not
     have moved - the one promise here is "always the same minutes" */
  var want = '60° 01\' N   23° 02\' E';
  if (fixText() !== want) fails.push('the fixed point is not the given minutes: ' + fixText());

  /* the impossible asks must be shown as not-done, never as satisfied -
     a tracker that prints "60000 satellites" is lying */
  var reEl = document.getElementById('tReal').textContent;
  if (/60,000[^]*none/.test(reEl) === false && reEl.indexOf('none') < 0)
    fails.push('the satellite impossibility is not shown');
  if (reEl.indexOf('far beyond a browser') < 0)
    fails.push('the points-per-ms impossibility is not shown');

  /* the achievable query rate must be real and far under 60000 - if it
     ever read near the asked satellite count something is faked */
  if (real.queryHz && real.queryHz > 1000)
    fails.push('the query rate is implausibly high: ' + real.queryHz);

  /* the grid must actually have 36 markers */
  if (marks.length !== MARKERS)
    fails.push('the grid has ' + marks.length + ' markers, not ' + MARKERS);

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE TRACKER IS NOT BEHAVING</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__trFails = fails;
}

seed(); render();
requestAnimationFrame(loop);
getLive();
setTimeout(selfCheck, 1500);

window.__read = function(){ return { fix: fixText(), markers: marks.length,
  asked: asked, real: real, live: live, liveErr: liveErr,
  fails: window.__trFails, bar: document.getElementById('line').textContent }; };
</script>
</body></html>
