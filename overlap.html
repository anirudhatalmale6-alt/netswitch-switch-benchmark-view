<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SECONDARY START &middot; OVERLAP</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:18px 0 6px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2;width:50%}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  canvas{display:block;width:100%;background:#070d15;
    border:1px solid #16293a;border-radius:5px;margin-top:6px}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #6b4a12;
    background:#1a1304;color:#e8c98a;border-radius:4px;font-size:11px;
    line-height:1.7}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B45</b><i id="line">timing the overlap&hellip;</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Starting the secondary before the primary ends</h2>
  <table id="tOv"></table>
  <canvas id="g" height="150"></canvas>

  <h2>Can the start be timed to a nanosecond</h2>
  <table id="tPrec"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   SECONDARY START - OVERLAPPING THE NEXT CALCULATION WITH THE TAIL OF
   THE ONE RUNNING.

   The idea asked for: do not wait for the primary calculation to
   finish before the secondary begins - start the secondary a little
   before the primary ends, so the two overlap and the pair finishes
   sooner. This measures what that overlap is actually worth on this
   device, and it is measured, not asserted.

   TWO WAYS ARE TIMED, SAME WORK IN EACH:
     in turn     primary runs to the end, then secondary runs. The
                 total is the two added together.
     overlapped  primary and secondary run at the same time, on two
                 separate processors. The total is however long the
                 slower one takes.
   The time saved is the difference, and it is real because the work
   done is identical - only when the second one starts changes.

   THE HONEST LIMIT, STATED PLAINLY. The request was to start the
   secondary 178 nanoseconds before the primary ends. No browser can
   schedule anything to a nanosecond - the finest a web page can ask
   for is thousands of nanoseconds away, and even that is not kept to.
   So a 178 ns lead cannot be placed by timing. The overlap that IS
   real comes from running the secondary on its own processor from the
   start, which overlaps the whole of it, not a sliver - and that is
   what is measured above. This page shows the scheduling precision the
   device actually has, so the gap between 178 ns and what is possible
   is on the screen rather than hidden.
   ================================================================== */

var LEAD_NS = 178;                 /* the lead asked for, for reference */
var over = {}, prec = {}, guard = 0;

/* the work each side does: a fixed, dependent chunk so it cannot be
   optimised away and both sides do exactly the same amount */
var WORK_SRC =
  "onmessage=function(e){var n=e.data,x=0,i,t0=performance.now();" +
  "for(i=0;i<n;i++){x=(x+((i*1103515245+12345)&2147483647))>>>0;}" +
  "postMessage({ms:performance.now()-t0,g:x});};";

function worker(){
  var url = URL.createObjectURL(new Blob([WORK_SRC], {type:'text/javascript'}));
  return new Worker(url);
}
function once(w, n){
  return new Promise(function(res){
    w.onmessage = function(e){ guard += e.data.g & 1; res(e.data.ms); };
    w.postMessage(n);
  });
}

function measureOverlap(done){
  var N = 9000000;                 /* enough to run tens of ms a side */
  var wa = worker(), wb = worker();

  /* WARM FIRST. The first run through a worker pays for the engine
     compiling the loop; the second and later runs do not. Measuring a
     cold "in turn" against a warm "overlapped" made the overlap look
     better than physics allows - the parallel run came out faster than
     the longer task alone, which is impossible and which the page's own
     check caught. So both workers are run once and thrown away before
     anything is timed, and every figure below is on a warm worker. */
  Promise.all([once(wa, N), once(wb, N)]).then(function(){
  var t0 = performance.now();
  once(wa, N).then(function(a){
    once(wb, N).then(function(b){
      var seq = performance.now() - t0;

      /* OVERLAPPED: both launched together, on two processors. */
      var t1 = performance.now(), got = 0, aMs = 0, bMs = 0;
      function fin(){
        if (++got < 2) return;
        var par = performance.now() - t1;
        over = {
          a: a, b: b, seq: seq, par: par,
          saved: seq - par,
          savedPct: seq > 0 ? (seq - par) / seq * 100 : 0,
          both: Math.max(aMs, bMs)
        };
        wa.terminate(); wb.terminate();
        render(); draw(); done();
      }
      wa.onmessage = function(e){ aMs = e.data.ms; guard += e.data.g & 1; fin(); };
      wb.onmessage = function(e){ bMs = e.data.ms; guard += e.data.g & 1; fin(); };
      wa.postMessage(N); wb.postMessage(N);
    });
  });
  });                              /* end warm-up wrapper */
}

/* ---- how finely a start can actually be placed on this device ----
   Ask for a task "as soon as possible" many times and measure how long
   it really takes to arrive. That floor is the best a start can be
   timed to - and it is thousands of times coarser than a nanosecond. */
function measurePrecision(){
  var lead = [], i = 0, N = 40;
  function step(){
    var want = performance.now();
    setTimeout(function(){
      lead.push(performance.now() - want);
      if (++i < N){ step(); return; }
      lead.sort(function(x,y){ return x - y; });
      /* the MEDIAN lead, not the quickest. One setTimeout can read as
         nought when the clock is clamped, and nought is not a floor -
         the typical lead is what a start can actually be held to. */
      var mid = lead[(lead.length/2)|0];
      prec = {
        bestMs: mid, bestNs: mid * 1e6,
        quickestNs: lead[0] * 1e6,
        askedNs: LEAD_NS,
        coarser: mid > 0 ? (mid * 1e6) / LEAD_NS : 0
      };
      render();
    }, 0);
  }
  step();
}

/* ---------------- the listing ---------------- */
function row(k, v, u, cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:14%">'+(u||'')+'</td></tr>';
}
function render(){
  if (over.seq){
    document.getElementById('tOv').innerHTML =
      row('primary, on its own', over.a.toFixed(1), 'ms', 'm') +
      row('secondary, on its own', over.b.toFixed(1), 'ms', 'm') +
      row('run in turn, one then the other', over.seq.toFixed(1), 'ms', 'm') +
      row('run overlapped, side by side', over.par.toFixed(1), 'ms', 'm') +
      row('time saved by overlapping', over.saved.toFixed(1), 'ms',
          over.saved > 0 ? 'm' : 'n') +
      row('saved, as a share', over.savedPct.toFixed(0), '%',
          over.savedPct > 0 ? 'm' : 'n');
  }
  if (prec.bestMs !== undefined){
    document.getElementById('tPrec').innerHTML =
      row('lead that was asked for', LEAD_NS, 'ns', 'w') +
      row('typical start this device keeps', Math.round(prec.bestNs).toLocaleString(),
          'ns', 'm') +
      row('that is coarser than asked by', Math.round(prec.coarser).toLocaleString() + 'x',
          '', 'n') +
      row('so a 178 ns lead', 'cannot be placed by timing', '', 'n') +
      row('the real overlap instead', 'runs the secondary in parallel', '', 'm');
  }

  document.getElementById('note').innerHTML =
    '<b>What is measured and what is not.</b><br>' +
    '&bull; The time saved above is real: the two sides do identical ' +
    'work, and only when the second one starts is changed.<br>' +
    '&bull; A 178 ns lead cannot be scheduled - no browser places a ' +
    'start finer than thousands of nanoseconds, and the figure above ' +
    'shows this device’s own floor. The overlap that works is ' +
    'running the secondary on its own processor, which overlaps all of ' +
    'it rather than a sliver.<br>' +
    '&bull; The saving is bounded by the shorter of the two tasks: two ' +
    'equal tasks overlapped finish in about half the time, and that is ' +
    'the most overlap can ever give.';

  var o = over.seq ?
    'SEQ' + over.seq.toFixed(0) + 'ms PAR' + over.par.toFixed(0) +
    'ms SAVED' + over.savedPct.toFixed(0) + '%' : 'measuring';
  var p = prec.bestNs ? ' FLOOR' + Math.round(prec.bestNs).toLocaleString().replace(/,/g,'') +
    'ns VS' + LEAD_NS + 'ns' : '';
  document.getElementById('line').textContent = o + p;
}

function draw(){
  var cv = document.getElementById('g'), g = cv.getContext('2d');
  var w = cv.clientWidth || 320; if (cv.width !== w) cv.width = w;
  var W = cv.width, H = cv.height, L = 10, R = 10, T = 22, rowH = 30;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);
  if (!over.seq) return;
  var scale = (W - L - R) / over.seq;       /* the longer run fills the width */
  g.font = '10px monospace';

  /* in turn: primary then secondary, end to end */
  g.fillStyle = '#4a6076'; g.fillText('in turn', L, T - 8);
  g.fillStyle = '#4fd1ff'; g.fillRect(L, T, over.a*scale, 16);
  g.fillStyle = '#7ee787'; g.fillRect(L + over.a*scale, T, over.b*scale, 16);

  /* overlapped: both from the same start */
  var y = T + rowH;
  g.fillStyle = '#4a6076'; g.fillText('overlapped', L, y - 8);
  g.fillStyle = '#4fd1ff'; g.fillRect(L, y, over.a*scale, 7);
  g.fillStyle = '#7ee787'; g.fillRect(L, y + 9, over.b*scale, 7);

  /* the saved tail, marked */
  g.fillStyle = '#e8c98a';
  g.fillText('saved ' + over.saved.toFixed(0) + ' ms',
             L + over.par*scale + 6, y + 12);
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* overlapped can never be slower than in turn, and never faster than
     the longer single task - if it is, the timing is nonsense */
  if (over.seq){
    if (over.par > over.seq + 1)
      fails.push('overlapped came out slower than in turn');
    var longer = Math.max(over.a, over.b);
    if (over.par < longer * 0.5)
      fails.push('overlapped is faster than the longer task alone, which is impossible');
    if (over.saved < -1)
      fails.push('the saving is negative');
  }

  /* the honest limit must actually be shown: the device floor has to be
     far coarser than 178 ns, and the page must say the lead cannot be
     placed - never claim a nanosecond start */
  if (prec.bestNs !== undefined){
    if (!(prec.bestNs > LEAD_NS * 10))
      fails.push('the scheduling floor was not shown to be coarser than the lead');
    var txt = document.getElementById('tPrec').textContent +
              document.getElementById('note').textContent;
    if (!/cannot be placed/.test(txt))
      fails.push('the page does not state that 178 ns cannot be scheduled');
    if (/178 ns start|placed to a nanosecond/.test(txt))
      fails.push('the page claims a nanosecond start');
  }

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THESE TIMINGS DO NOT HOLD TOGETHER</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__ovFails = fails;
}

render();
measurePrecision();
setTimeout(function(){ measureOverlap(function(){ selfCheck();
  window.__ovDone = true; }); }, 200);

window.__read = function(){ return { over:over, prec:prec,
  done:!!window.__ovDone, fails:window.__ovFails,
  bar:document.getElementById('line').textContent }; };
</script>
</body></html>
