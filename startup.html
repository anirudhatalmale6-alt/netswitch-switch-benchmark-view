<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARTUP &middot; BOOT LOG</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:12px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 10px 26px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:14px 0 5px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;color:#6d8ba3;font-weight:400;padding:3px 4px;
    border-bottom:1px solid #16293a;letter-spacing:1px;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{padding:4px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td.k{color:#8ea9c2;text-align:left}
  td.v{color:#eaf6ff;font-weight:700}
  td.u{color:#4a6076;font-weight:400}
  .m{color:#3fd18a}.r{color:#d8a53f}.n{color:#e0645f}
  .sub{color:#4a6076}
  /* THE TOP TEXT CARRIES NO SMILEY AND NO PICTURE GLYPH OF ANY KIND -
     plain words and digits only. The page's own check fails if one
     ever gets back in. */
  #top{padding:60px 10px 0}
  #topText{color:#9fb6c9;font-size:12px}
  #ref{margin-top:6px;color:#4fd1ff;font-weight:700;letter-spacing:1px;
    word-break:break-all}
  canvas{display:block;width:100%;background:#070d15;
    border:1px solid #16293a;border-radius:4px;margin-top:6px}
  pre{white-space:pre;overflow-x:auto;background:#070d15;border:1px solid #16293a;
    border-radius:4px;padding:8px;color:#c7dcea;font-size:11px;margin:6px 0 0}
  a.dl{color:#4fd1ff;text-decoration:underline;font-weight:700}
  #log{background:#070d15;border:1px solid #16293a;border-radius:4px;
    padding:8px;overflow-x:auto;white-space:pre;font-size:11px;color:#c7dcea}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #note{margin-top:10px;color:#9fb6c9;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B58</b><i id="line">reading the startup&hellip;</i></div>

<div id="top">
  <div id="topText">Startup and boot, logged. Every leg timed on this device.</div>
  <div id="ref">&nbsp;</div>
</div>

<div id="pg">

  <h2>Startup, this device</h2><table id="tAns"></table>

  <h2>Every leg of the startup</h2>
  <table id="tLeg"><thead><tr>
    <th>leg</th><th>ms</th><th>kv</th><th>share</th>
  </tr></thead><tbody id="legBody"></tbody></table>
  <canvas id="g" height="150"></canvas>

  <h2>The log &mdash; ALogTIME</h2><div id="log"></div>

  <h2>Asked for again, with the cache warm</h2><table id="tAgain"></table>

  <h2>What a browser cannot see</h2><table id="tNo"></table>

  <div style="margin-top:10px">
    <a class="dl" id="dlDxf" download="startup.dxf">download the startup as DXF</a>
  </div>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   STARTUP AND BOOT, LOGGED.

   WHAT THIS IS AND WHAT IT IS NOT. A page cannot see the device being
   switched on. The operating system's power-on clock is not handed to
   anything running in a browser, and no amount of measuring in here
   will produce it. What IS available, and what this reads, is the
   startup of the app itself: the clock starts the moment the device
   was asked for this page and stops when the last of it was on screen.
   Both of those are the device's own figures, not mine.

   EVERY LEG IS THE DEVICE'S OWN RECORD. The browser keeps a stamp for
   each step of fetching and building a page - the lookup, the
   connection, the wait for the first byte, the download, the parse.
   Those stamps are read out here and subtracted. Nothing is modelled
   and nothing is estimated.

   A ZERO IS NOT ALWAYS A ZERO, AND THAT IS THE ONE TRAP IN HERE. When
   a connection is reused, the lookup and the handshake stamps come
   back identical, and subtracting them gives 0.0 ms. Printed as a
   number that reads as an instant handshake, which would be a lie -
   there was no handshake at all. Those legs are printed in words
   instead, and the page's own check FAILS if a reused leg ever gets
   printed as a figure.

   kv = ONE TENTH OF A MILLISECOND, as given. Every leg is in kv as
   well as milliseconds, so the two can be checked by eye: 1 ms = 10 kv.

   THE BUDGET IS 500 ms, the figure as sent. The verdict line says
   whether this device's startup came in under it. That is your number
   being tested, not a claim about the hardware.
   ================================================================== */

var KV_PER_MS = 10;                /* kv = a tenth of a millisecond */
var BUDGET_MS = 500;               /* the startup budget, as given */
function kv(ms){ return ms * KV_PER_MS; }

function two(n){ return (n<10?'0':'') + n; }
/* the clock with no dots: fourteen digits, YYYYMMDDHHMMSS */
function stampOf(d){
  return String(d.getFullYear()) + two(d.getMonth()+1) + two(d.getDate())
       + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}
function stampNow(){ return stampOf(new Date()); }
/* a milestone's wall clock, from the page's own origin plus its offset */
function stampAt(ms){
  var origin = performance.timeOrigin || (Date.now() - performance.now());
  return stampOf(new Date(origin + ms));
}

/* ============== the legs, built from a timing record ==============
   KEPT AS A PLAIN FUNCTION OF THE RECORD so it can be handed a
   made-up startup and checked. A leg-builder that can only ever run
   on this one real page load is a leg-builder nobody has tested.

   seq true  - the leg is a step in the chain, and the chain adds up
               to the whole startup
   seq false - the leg sits INSIDE another one (the handshake is part
               of the connection) and must never be added in twice
   reused    - the two stamps are identical because the work did not
               happen; this one is reported in words                  */
function buildLegs(t){
  function leg(name, a, b, seq, note){
    var reused = false, why = '', ms = 0;
    if (a === 0 && b === 0){ reused = true; why = 'absent'; }   /* never ran */
    else if (b === a){ reused = true; why = 'nothing to time'; } /* no span */
    else ms = b - a;
    return { name:name, ms:ms, seq:seq !== false, reused:reused, why:why,
             note:note || '', from:a, to:b };
  }
  var tls = (t.secureConnectionStart > 0)
      ? leg('handshake, inside the connection', t.secureConnectionStart,
            t.connectEnd, false, 'part of the connection above')
      : { name:'handshake, inside the connection', ms:0, seq:false,
          reused:true, note:'plain http, or the connection was reused',
          from:0, to:0 };

  var out = [
    leg('redirects', t.redirectStart, t.redirectEnd, true, 'no redirect'),
    leg('service worker start', t.workerStart,
        t.workerStart ? t.fetchStart : 0, true, 'no service worker'),
    leg('lookup of the name', t.domainLookupStart, t.domainLookupEnd, true,
        'connection reused, nothing to look up'),
    leg('connection', t.connectStart, t.connectEnd, true,
        'connection reused, nothing to open'),
    tls,
    leg('wait for the first byte', t.requestStart, t.responseStart, true),
    leg('download of the document', t.responseStart, t.responseEnd, true),
    leg('parse to interactive', t.responseEnd, t.domInteractive, true),
    leg('scripts and the document ready', t.domInteractive,
        t.domContentLoadedEventEnd, true),
    leg('the rest to complete', t.domContentLoadedEventEnd, t.domComplete, true),
    leg('the load event', t.loadEventStart, t.loadEventEnd, true)
  ];
  /* the gap before anything happened - the browser's own setting up */
  var firstSeq = 0, i;
  for (i=0;i<out.length;i++){ if (out[i].seq && !out[i].reused){ firstSeq = out[i].from; break; } }
  if (firstSeq > 0.5) out.unshift({ name:'before the fetch began', ms:firstSeq,
    seq:true, reused:false, note:'', from:0, to:firstSeq });
  return out;
}

/* THE FIGURE FOR A LEG. A leg with nothing to time gets words, never a
   number - and the words say WHICH of the two it was. A step that never
   ran at all and a step that ran inside the clock's resolution are not
   the same thing, and printing 0.0 ms would have hidden both. */
function fmtLeg(l){
  if (!l.reused) return l.ms.toFixed(1);
  if (l.note) return l.note;
  return l.why === 'absent' ? 'did not happen' : 'no measurable time';
}

var nav = null, legs = [], total = 0, paint = 0, again = null, dxf = '';

function readNav(){
  var e = performance.getEntriesByType && performance.getEntriesByType('navigation');
  if (e && e.length) return e[0];
  return null;                 /* older browsers: say so rather than guess */
}
function readPaint(){
  var p = performance.getEntriesByType && performance.getEntriesByType('paint'), i;
  if (!p) return 0;
  for (i=0;i<p.length;i++) if (p[i].name === 'first-contentful-paint') return p[i].startTime;
  for (i=0;i<p.length;i++) if (p[i].name === 'first-paint') return p[i].startTime;
  return 0;
}

/* ---------- asked for again, with the cache warm ----------
   TWO FETCHES OF THIS SAME PAGE, timed. One is told to ignore the
   cache and go to the source; one is allowed to use it. That is what
   the device holding on to the file is worth on this
   connection. Off a disc there is nothing to ask again, and it says so
   rather than printing a figure. */
function askAgain(done){
  if (location.protocol === 'file:'){
    done({ possible:false, why:'opened off the disc, there is nothing to ask for' });
    return;
  }
  var url = location.href.split('#')[0];
  var t0 = performance.now();
  fetch(url, { cache:'reload' }).then(function(r){ return r.text(); }).then(function(){
    var cold = performance.now() - t0, t1 = performance.now();
    return fetch(url, { cache:'default' }).then(function(r){ return r.text(); })
      .then(function(){ done({ possible:true, cold:cold, warm:performance.now()-t1 }); });
  }).catch(function(e){
    done({ possible:false, why:'the page could not be asked for again: ' + e });
  });
}

/* ================= the DXF =================
   THE STARTUP AS REAL GEOMETRY, not a picture of it. One line per leg
   on its own row, at its measured length, plus a circle where the
   first paint landed and a line for the budget. It opens in drawing
   software as lines you can measure, which is the whole point of
   handing it over in this format.
   Group codes in pairs: 0 what it is, 8 which layer, 10/20 one end,
   11/21 the other. */
function toDXF(ls, totalMs, paintMs){
  var o = [], SX = totalMs > 0 ? 200 / totalMs : 1;   /* 200 units wide */
  function p(c, v){ o.push(String(c)); o.push(String(v)); }
  function line(lay, x1, y1, x2, y2){
    p(0,'LINE'); p(8,lay); p(10,x1.toFixed(3)); p(20,y1.toFixed(3));
    p(30,'0.0'); p(11,x2.toFixed(3)); p(21,y2.toFixed(3)); p(31,'0.0');
  }
  function circle(lay, x, y, r){
    p(0,'CIRCLE'); p(8,lay); p(10,x.toFixed(3)); p(20,y.toFixed(3));
    p(30,'0.0'); p(40,r.toFixed(3));
  }
  function text(lay, x, y, h, s){
    p(0,'TEXT'); p(8,lay); p(10,x.toFixed(3)); p(20,y.toFixed(3)); p(30,'0.0');
    p(40,h.toFixed(2)); p(1,s);
  }
  p(0,'SECTION'); p(2,'ENTITIES');
  var y = 0, run = 0, i;
  for (i=0;i<ls.length;i++){
    var l = ls[i];
    if (!l.seq || l.reused) continue;          /* only the real chain */
    y -= 10;
    line('STARTUP', run*SX, y, (run+l.ms)*SX, y);
    text('STARTUPTEXT', 0, y+2, 2.5, l.name + ' ' + l.ms.toFixed(1) + ' ms');
    run += l.ms;
  }
  line('AXIS', 0, 2, totalMs*SX, 2);
  text('AXIS', 0, 5, 3, 'startup ' + totalMs.toFixed(1) + ' ms / '
       + kv(totalMs).toFixed(0) + ' kv');
  line('BUDGET', BUDGET_MS*SX, 4, BUDGET_MS*SX, y-4);
  text('BUDGET', BUDGET_MS*SX, 6, 2.5, 'budget ' + BUDGET_MS + ' ms');
  if (paintMs > 0) circle('FIRSTPAINT', paintMs*SX, y/2, 3);
  p(0,'ENDSEC'); p(0,'EOF');
  return o.join('\r\n') + '\r\n';
}

function dataLink(el, text, mime){
  var b = new Blob([text], { type:mime });
  el.href = URL.createObjectURL(b);
}

/* ================= rendering ================= */
function row(t, k, v, u){
  var tr = document.createElement('tr');
  tr.innerHTML = '<td class="k">' + k + '</td><td class="v">' + v
               + '</td><td class="u">' + (u||'') + '</td>';
  t.appendChild(tr);
}

function render(){
  var tA = document.getElementById('tAns'); tA.innerHTML = '';
  if (!nav){
    row(tA, 'the device\'s startup record',
        '<span class="n">not available in this browser</span>', '');
    return;
  }
  var inside = total <= BUDGET_MS;
  row(tA, 'startup, the whole of it', total.toFixed(1), 'ms');
  row(tA, 'the same in kv', kv(total).toFixed(0), 'kv');
  row(tA, 'first paint on screen',
      paint > 0 ? paint.toFixed(1) : '<span class="sub">not reported</span>',
      paint > 0 ? 'ms' : '');
  row(tA, 'the budget, as given', BUDGET_MS + ' / ' + kv(BUDGET_MS), 'ms / kv');
  row(tA, 'against the budget',
      '<span class="' + (inside ? 'm' : 'n') + '">'
      + (inside ? 'inside it by ' + (BUDGET_MS-total).toFixed(0) + ' ms'
                : 'over it by ' + (total-BUDGET_MS).toFixed(0) + ' ms')
      + '</span>', '');
  row(tA, 'how it was served',
      location.protocol === 'file:' ? 'off the disc, file protocol'
        : (nav.nextHopProtocol || location.protocol.replace(':','')), '');
  /* A SMALL TRANSFER IS NOT A SMALL DOCUMENT. When the device already
     had the file, only the headers come over the wire and the body is
     taken off the disc - so the two sizes are given side by side and
     the gap is named, rather than one number that looks like a
     suspiciously tiny page. */
  row(tA, 'the document, over the wire',
      nav.transferSize ? nav.transferSize.toLocaleString().replace(/,/g,' ')
        : '<span class="sub">not reported</span>',
      nav.transferSize ? 'bytes' : '');
  if (nav.decodedBodySize){
    row(tA, 'the document itself',
        nav.decodedBodySize.toLocaleString().replace(/,/g,' '), 'bytes');
    if (nav.transferSize && nav.transferSize < nav.decodedBodySize * 0.5)
      row(tA, 'why the wire figure is smaller',
          '<span class="r">the device already had it, only the headers came over</span>', '');
  }
  row(tA, 'started by', nav.type || 'navigate', '');

  var tb = document.getElementById('legBody'); tb.innerHTML = '';
  legs.forEach(function(l){
    var tr = document.createElement('tr');
    var share = (!l.reused && l.seq && total > 0)
        ? (l.ms/total*100).toFixed(1) + ' %' : '';
    tr.innerHTML = '<td class="k">' + l.name
      + (l.seq ? '' : ' <span class="sub">(inside the one above)</span>')
      + '</td><td class="' + (l.reused ? 'sub' : 'v') + '">' + fmtLeg(l)
      + '</td><td class="u">' + (l.reused ? '' : kv(l.ms).toFixed(0))
      + '</td><td class="u">' + share + '</td>';
    tb.appendChild(tr);
  });

  /* the log */
  var marks = [
    ['the page was asked for', nav.startTime || 0],
    ['the fetch began', nav.fetchStart],
    ['the first byte arrived', nav.responseStart],
    ['the document was here', nav.responseEnd],
    ['the document was interactive', nav.domInteractive],
    ['scripts and document ready', nav.domContentLoadedEventEnd],
    ['first paint on screen', paint],
    ['the document was complete', nav.domComplete],
    ['the load event finished', nav.loadEventEnd]
  ];
  /* THE LOG RUNS IN THE ORDER THE CLOCK SAYS, not the order I happened
     to list them in. The first paint can land after the load event on
     a slow screen, and a log that printed it earlier would be telling
     the wrong story about what followed what. */
  marks = marks.filter(function(m){
    return m[1] > 0 || m[0] === 'the page was asked for'; });
  marks.sort(function(a,b){ return a[1] - b[1]; });
  var out = [], n = 0;
  marks.forEach(function(m){
    n++;
    out.push('ALogTIME-' + n + '  ' + stampAt(m[1]) + '  +'
      + m[1].toFixed(1) + ' ms  ' + m[0]);
  });
  document.getElementById('log').textContent = out.join('\n');
  window.__logLines = out;

  /* asked for again */
  var tG = document.getElementById('tAgain'); tG.innerHTML = '';
  if (!again) row(tG, 'asking again', 'running&hellip;', '');
  else if (!again.possible) row(tG, 'asking again',
    '<span class="sub">' + again.why + '</span>', '');
  else {
    row(tG, 'straight from the source', again.cold.toFixed(1), 'ms');
    row(tG, 'allowed to use the cache', again.warm.toFixed(1), 'ms');
    var saved = again.cold - again.warm;
    row(tG, 'what the cache was worth',
      '<span class="' + (saved > 0 ? 'm' : 'r') + '">'
      + (saved > 0 ? saved.toFixed(1) + ' ms saved' : 'nothing saved here')
      + '</span>', '');
  }

  /* what cannot be seen */
  var tN = document.getElementById('tNo'); tN.innerHTML = '';
  row(tN, 'the device being switched on',
      '<span class="n">NOT POSSIBLE</span>', 'from a browser');
  row(tN, 'how long the operating system took to boot',
      '<span class="n">NOT POSSIBLE</span>', 'from a browser');
  row(tN, 'which services started before this app',
      '<span class="n">NOT POSSIBLE</span>', 'from a browser');
  row(tN, 'the startup of this app',
      '<span class="m">MEASURED</span>', 'above, by the device');
  row(tN, 'what the server sent and when',
      '<span class="r">READ</span>', 'the device\'s own stamps');

  dxf = toDXF(legs, total, paint);
  dataLink(document.getElementById('dlDxf'), dxf, 'image/vnd.dxf');
  window.__dxf = dxf;

  /* the run reference, below the top text and nowhere else */
  var digits = (Math.round(total*10) + '' + Math.round(kv(paint||total)));
  while (digits.length < 7) digits += '0';
  document.getElementById('ref').textContent =
    'c.YTGaA.' + digits.slice(0,7) + '   ALogTIME-1 ' + stampAt(0);

  document.getElementById('note').innerHTML =
    '<b>What this says.</b> The startup is the device\'s own record, leg ' +
    'by leg, from the moment the page was asked for to the moment the ' +
    'last of it was on screen. A leg that did not happen is written in ' +
    'words, not as a zero - a reused connection has no handshake to ' +
    'time, and printing 0.0 ms there would read as an instant handshake. ' +
    'The device switching on is not in here at all and cannot be: a ' +
    'browser is not handed the power-on clock.';

  document.getElementById('line').textContent =
    'STARTUP' + total.toFixed(0) + 'ms ' + kv(total).toFixed(0) + 'kv'
    + ' PAINT' + (paint>0?paint.toFixed(0):'-')
    + ' BUDGET' + BUDGET_MS + (total<=BUDGET_MS?' IN':' OVER')
    + ' LEGS' + legs.filter(function(l){ return l.seq && !l.reused; }).length
    + ' ' + stampNow();

  draw();
}

function draw(){
  var cv = document.getElementById('g'), g = cv.getContext('2d');
  var w = cv.clientWidth || 320; if (cv.width !== w) cv.width = w;
  var W = cv.width, H = cv.height, L = 6, R = 6, T = 8, B = 16;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);
  var chain = legs.filter(function(l){ return l.seq && !l.reused && l.ms > 0; });
  if (!chain.length || total <= 0) return;
  /* THE CHART IS DRAWN TO THE STARTUP, NOT TO THE BUDGET. Scaled to
     500 ms, a 24 ms startup is four pixels wide and every leg in it is
     invisible - a chart that technically contains the answer and shows
     nothing. When the budget does not fit, it is said in words at the
     edge instead of being drawn off the end. */
  var fits = BUDGET_MS <= total * 1.6;
  var span = fits ? Math.max(total, BUDGET_MS) * 1.08 : total * 1.08;
  function X(ms){ return L + (ms/span) * (W-L-R); }
  var COL = ['#4fd1ff','#7ee787','#ffc24f','#ff6b8a','#b78bff','#52d9c0',
             '#e8e06a','#ff9d5c','#6aa9ff','#9fe870','#d98be0','#8adbff'];
  var run = 0, y = T, h = Math.max(6, (H-T-B) / chain.length - 2);
  chain.forEach(function(l,i){
    g.fillStyle = COL[i % COL.length];
    g.fillRect(X(run), y, Math.max(1, X(run+l.ms)-X(run)), h);
    run += l.ms; y += h + 2;
  });
  /* the budget, where it falls - or in words when it is off the end */
  g.font = '9px monospace'; g.fillStyle = '#ff5b4d';
  if (fits){
    g.strokeStyle = '#ff5b4d'; g.lineWidth = 1; g.beginPath();
    g.moveTo(X(BUDGET_MS), T-4); g.lineTo(X(BUDGET_MS), H-B+2); g.stroke();
    g.fillText(BUDGET_MS + ' ms budget', Math.min(X(BUDGET_MS)+3, W-72), H-4);
  } else {
    var pct = (total/BUDGET_MS*100).toFixed(0);
    g.fillText(BUDGET_MS + ' ms budget is off this chart - the startup used '
      + pct + ' per cent of it', 4, H-4);
  }
  if (paint > 0){
    g.strokeStyle = '#eaf6ff'; g.beginPath();
    g.moveTo(X(paint), T-4); g.lineTo(X(paint), H-B+2); g.stroke();
    g.fillStyle = '#eaf6ff'; g.fillText('paint', Math.max(2, X(paint)-30), H-4);
  }
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [], i;

  /* NO SMILEY AND NO PICTURE GLYPH IN THE TOP TEXT. Plain words and
     digits only, in the bar and in the two lines under it. Checked
     rather than trusted, so a later edit cannot quietly put one back.

     IT IS AN ALLOW LIST, NOT A LIST OF BANNED GLYPHS. Listing the ones
     to forbid would pass every picture glyph I had not thought of -
     and there are thousands. So anything outside plain characters and
     four pieces of punctuation fails, whatever it is. */
  var OK_EXTRA = '…–—·';     /* ellipsis, dashes, middle dot */
  var topText = document.getElementById('bar').textContent + ' '
              + document.getElementById('top').textContent;
  var odd = [], c, j;
  for (j=0;j<topText.length;j++){
    c = topText.charCodeAt(j);
    if (c >= 32 && c < 127) continue;
    if (c === 9 || c === 10 || c === 13) continue;      /* layout whitespace */
    if (OK_EXTRA.indexOf(topText.charAt(j)) >= 0) continue;
    if (odd.indexOf(topText.charAt(j)) < 0) odd.push(topText.charAt(j));
  }
  if (odd.length)
    fails.push('there is a picture glyph in the top text: ' + odd.join(' '));
  if (/[:;][-^]?[)(DPp]/.test(topText))
    fails.push('there is a typed smiley in the top text');

  /* NO SOURCE CODE ON VIEW. Asked for twice. The first version of this
     page put a server configuration file on screen as a block of text,
     which is exactly what that rule forbids - so now the page refuses
     to show a clean result if any code block gets back onto it. */
  if (document.querySelector('pre, code, textarea'))
    fails.push('there is a code block on the page');

  /* the clock stamp: fourteen digits, no dots, no separators */
  var s = stampNow();
  if (/[.\-: ]/.test(s)) fails.push('the clock stamp has separators in it: ' + s);
  if (!/^\d{14}$/.test(s)) fails.push('the clock stamp is not 14 digits: ' + s);

  /* A LEG THAT DID NOT HAPPEN MUST NOT BE PRINTED AS A FIGURE. This is
     the honesty guard, and it is tested on a made-up startup where the
     lookup stamps are identical: if that comes back as a number, the
     page is reporting an instant lookup that never took place. */
  var fake = buildLegs({ redirectStart:0, redirectEnd:0, workerStart:0,
    fetchStart:10, domainLookupStart:10, domainLookupEnd:10,
    connectStart:10, connectEnd:10, secureConnectionStart:0,
    requestStart:10, responseStart:40, responseEnd:50, domInteractive:70,
    domContentLoadedEventEnd:80, domComplete:90, loadEventStart:90,
    loadEventEnd:95 });
  for (i=0;i<fake.length;i++){
    if (fake[i].name.indexOf('lookup') >= 0 || fake[i].name.indexOf('connection') === 0){
      if (!fake[i].reused || /^[0-9.]+$/.test(fmtLeg(fake[i])))
        fails.push('a leg that did not happen is being printed as a figure: '
          + fake[i].name);
    }
  }

  /* THE CHAIN MUST ADD UP TO THE WHOLE STARTUP. If the legs do not sum
     to the total, either one is being counted twice or a piece of the
     startup is missing from the table. Half a millisecond of slack for
     the stamps themselves. */
  if (nav && total > 0){
    var sum = 0;
    legs.forEach(function(l){ if (l.seq && !l.reused) sum += l.ms; });
    if (Math.abs(sum - total) > Math.max(1, total*0.02))
      fails.push('the legs add to ' + sum.toFixed(1) + ' ms but the startup is '
        + total.toFixed(1) + ' ms');
  }

  /* the DXF must be geometry that parses back, not a text file that
     merely ends in dxf */
  if (dxf){
    var pairs = dxf.split(/\r\n/), lines = 0;
    for (i=0;i<pairs.length-1;i+=2) if (pairs[i] === '0' && pairs[i+1] === 'LINE') lines++;
    var want = legs.filter(function(l){ return l.seq && !l.reused; }).length + 2;
    if (lines !== want)
      fails.push('the DXF holds ' + lines + ' lines, expected ' + want);
    if (dxf.indexOf('ENDSEC') < 0 || dxf.slice(-5).indexOf('EOF') < 0)
      fails.push('the DXF is not closed off properly');
  }

  /* the phrase, exactly, and the mark beside it */

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THE STARTUP PAGE IS NOT RIGHT</b><br>' + fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__fails = fails;
  return fails;
}

function start(){
  nav = readNav();
  paint = readPaint();
  if (nav){
    legs = buildLegs(nav);
    total = nav.loadEventEnd || nav.domComplete || performance.now();
    /* the whole of the startup is the last stamp, not the sum - the
       sum is checked against it below */
  }
  render();
  selfCheck();
  askAgain(function(r){ again = r; render(); selfCheck(); window.__ready = true; });
}

/* the load event's own stamps are only final after the load event, so
   the reading waits for it */
if (document.readyState === 'complete') setTimeout(start, 60);
else window.addEventListener('load', function(){ setTimeout(start, 60); });

/* ---- hooks, for checking from outside ---- */
window.__buildLegs = buildLegs;
window.__fmtLeg = fmtLeg;
window.__selfCheck = selfCheck;
window.__putGlyph = function(g){           /* positive control for the glyph sweep */
  document.getElementById('topText').textContent += ' ' + g;
};
window.__pokeLeg = function(i, ms){       /* positive control for the sum check */
  legs[i].ms = ms; legs[i].reused = false; legs[i].seq = true;
};
window.__read = function(){ return {
  ready: !!window.__ready, fails: window.__fails,
  total: total, paint: paint, budget: BUDGET_MS,
  legs: legs.map(function(l){ return { name:l.name, ms:l.ms, seq:l.seq,
    reused:l.reused, shown:fmtLeg(l) }; }),
  log: window.__logLines || [], again: again,
  ref: document.getElementById('ref').textContent,
  topText: document.getElementById('top').textContent,
  dxfLines: (window.__dxf||'').split(/\r\n/).filter(function(v,i,a){
    return v === 'LINE' && a[i-1] === '0'; }).length,
  stamp: stampNow(),
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
