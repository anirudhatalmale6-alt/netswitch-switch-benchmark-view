<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE WATCH</title>
<style>
  :root{
    --bg:#05080c; --panel:#0a121a; --line:#16293a; --grid:#0f1d2a;
    --ink:#d7e6f2; --ink2:#8ea9c2; --muted:#6d8ba3; --series:#3987e5;
    --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  }
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:58px 12px 70px;max-width:980px}
  h2{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
  .card h3{margin:0 0 8px;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.5px}
  .donut{display:flex;align-items:center;gap:14px}
  .donut svg{flex:0 0 auto}
  .leg{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .leg span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .chip{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:700;font-size:10px;
    letter-spacing:.5px;color:#05080c}
  .st-OK{background:var(--ok)} .st-WARNING{background:var(--warn)} .st-CRITICAL{background:var(--crit)}
  .bars .b{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-bottom:8px;cursor:default}
  .bars .lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink2)}
  .bars .lab b{color:var(--ink);font-weight:700;white-space:nowrap}
  .bars .track{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
  .bars .fill{height:100%;border-radius:0 4px 4px 0}
  .spark svg{display:block;width:100%;height:96px;touch-action:none}
  .spark .now{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:4px}
  .spark .now b{color:var(--ink)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-weight:400;padding:3px 4px;
    border-bottom:1px solid var(--line);letter-spacing:1px;font-size:9px}
  td{padding:5px 4px;border-bottom:1px solid #0e1a26;vertical-align:top;font-variant-numeric:tabular-nums}
  td.svc{color:var(--ink);font-weight:700}
  td .sub{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
  td.out{color:var(--ink2);font-size:12px}
  #tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);color:var(--ink);
    padding:4px 7px;border-radius:4px;font-size:11px;display:none;z-index:20;white-space:nowrap}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;
    text-decoration:none;border-radius:4px;padding:8px 12px;font-size:12px;box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
  canvas#gl{position:absolute;left:-9999px;top:0;width:256px;height:256px}
</style></head><body>
<div id="bar"><b id="stamp">B90</b><i id="line">Watching</i></div>
<div id="pg">
  <h2>The Watch</h2>
  <div class="grid">
    <div class="card"><h3>Services Now</h3><div class="donut" id="dNow"></div></div>
    <div class="card"><h3>Every Check Run</h3><div class="donut" id="dAll"></div></div>
    <div class="card"><h3>Against Its Own Best</h3><div class="bars" id="bars"></div></div>
  </div>
  <h2>Live</h2>
  <div class="grid" id="sparks"></div>
  <h2>Services</h2>
  <div class="card"><table id="tS"><thead><tr><th>service</th><th>output</th></tr></thead><tbody id="sBody"></tbody></table></div>
  <h2>Latest State Changes</h2>
  <div class="card"><table id="tC"><thead><tr><th>time</th><th>service</th><th>change</th></tr></thead><tbody id="cBody"></tbody></table></div>

  <div id="chk" style="display:none"></div>
</div>
<div id="always">
  <a id="dlDxf" class="alt" download="the-watch.dxf">DXF</a>
  <a id="dlTxt" download="the-watch.txt">Download</a>
</div>
<div id="tip"></div>
<canvas id="gl" width="256" height="256"></canvas>

<script>
/* ==================================================================
   THE WATCH - THIS DEVICE, CHECKED THE WAY A SERVER IS WATCHED.

   EVERY MEASUREMENT IS A SERVICE. Each one is checked on its own
   schedule and given a state - OK, WARNING or CRITICAL - with the
   reading that earned it. A change of state is logged with its time.

   ONE CHECK AT A TIME. The checks queue and run one after another, so
   the processor check never shares the machine with the graphics check
   and neither reading is spoiled by the other.

   STATES AGAINST WHAT THIS DEVICE HAS ALREADY DONE. A browser cannot
   reach the targets set for native code, so holding it to them would
   paint everything red for ever and say nothing. Instead each speed is
   held to the best this device has shown since the page opened: 85 per
   cent of it or more is OK, 60 per cent or more WARNING, less is
   CRITICAL. That catches a machine slowing down - heat, a battery
   saver, something else taking the cores - which is what watching is
   for. Where a target was given, the share of it is printed too.
   Round trip, stalls, battery and storage have fixed limits instead.

   A STATE IS NEVER COLOUR ALONE. Every state is written as a word.

   NOTHING WITHOUT DATA IS SHOWN. A service the device will not answer
   for stays off the page.
   ================================================================== */

var TARGET_CPU = 5455000000, TARGET_DRAWS = 579000;   /* and 80 screen updates a second, on the screen service */
var OK_AT = 0.85, WARN_AT = 0.60;
var HISTORY = 60;                     /* readings kept per service */
var X8 = Math.max(1, Math.min(20, +(/[?&]x=(\d+)/.exec(location.search) || [0, 1])[1]));

var CORES = Math.max(1, Math.min(32, navigator.hardwareConcurrency || 4));
var services = [], changes = [], runs = [], running = null, wurl = null, murl = null;
var fails = [], t0Page = performance.now(), gpuBusy = false;

function el(id){ return document.getElementById(id); }
function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){
  var d = new Date();
  return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate())
       + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}
function hms(ms){ var d = new Date(ms); return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()); }
function fi(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '-';
  return n.toFixed(d === undefined ? 1 : d).replace('.', ',');
}
function comma(n){
  var s = Math.round(n).toString(), o = '', i, c = 0;
  for (i = s.length - 1; i >= 0; i--){ o = s[i] + o; if (++c % 3 === 0 && i > 0) o = ' ' + o; }
  return o;
}
function ago(ms){
  var s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + ' s';
  if (s < 3600) return Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
  return Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min';
}

/* ================= the services ================= */
/* kind 'best-up'  : bigger is better, held to its own best
   kind 'best-down': smaller is better, held to its own best
   kind 'limit-up' : smaller is better, fixed OK and WARNING limits
   kind 'limit-down': bigger is better, fixed limits                 */
function svc(o){ o.hist = []; o.state = null; o.since = null; o.last = null; o.best = null;
  o.due = 0; o.value = null; o.out = ''; services.push(o); return o; }

var S_CPU1 = svc({ id: 'cpu1', name: 'Processor, One Core', kind: 'best-up', every: 20, fmt: function(v){ return comma(v) + ' a second'; } });
var S_CPUN = svc({ id: 'cpuN', name: 'Processor, Every Core', kind: 'best-up', every: 20, target: TARGET_CPU, fmt: function(v){ return comma(v) + ' a second'; } });
var S_GPU  = svc({ id: 'gpu',  name: 'Graphics, Draws A Second', kind: 'best-up', every: 30, target: TARGET_DRAWS, fmt: function(v){ return comma(v) + ' a second'; } });
var S_MEM  = svc({ id: 'mem',  name: 'Memory, One Random Fetch', kind: 'best-down', every: 30, fmt: function(v){ return fi(v, 2) + ' ns'; } });
var S_FPS  = svc({ id: 'fps',  name: 'Screen, Frames A Second', kind: 'best-up', every: 0, target: 80, fmt: function(v){ return fi(v, 0) + ' a second'; } });
var S_STALL= svc({ id: 'stall',name: 'Main Thread, Longest Stall', kind: 'limit-up', every: 0, ok: 50, warn: 200, fmt: function(v){ return fi(v, 0) + ' ms'; } });
var S_RTT  = svc({ id: 'rtt',  name: 'Network, Round Trip', kind: 'limit-up', every: 10, ok: 150, warn: 400, fmt: function(v){ return fi(v, 0) + ' ms'; } });
var S_DOWN = svc({ id: 'down', name: 'Network, Download', kind: 'best-up', every: 60, fmt: function(v){ return fi(v, 1) + ' Mbit a second'; } });
var S_BATT = svc({ id: 'batt', name: 'Battery', kind: 'limit-down', every: 30, ok: 30, warn: 15, fmt: function(v){ return fi(v, 0) + ' per cent'; } });
var S_STORE= svc({ id: 'store',name: 'Storage Used', kind: 'limit-up', every: 60, ok: 80, warn: 95, fmt: function(v){ return fi(v, 1) + ' per cent'; } });

/* THE STATE OF A READING. One function, used both to set the state and
   by the check that re-works it, so the two cannot disagree in code -
   the check holds the PRINTED state to it. */
function stateOf(s, v, best){
  if (s.kind === 'best-up'){ var r = v / best; return r >= OK_AT ? 'OK' : (r >= WARN_AT ? 'WARNING' : 'CRITICAL'); }
  if (s.kind === 'best-down'){ var r2 = best / v; return r2 >= OK_AT ? 'OK' : (r2 >= WARN_AT ? 'WARNING' : 'CRITICAL'); }
  if (s.kind === 'limit-up') return v < s.ok ? 'OK' : (v < s.warn ? 'WARNING' : 'CRITICAL');
  return v > s.ok ? 'OK' : (v > s.warn ? 'WARNING' : 'CRITICAL');
}
function shareOfBest(s){
  if (s.value === null || s.best === null) return null;
  if (s.kind === 'best-up') return s.value / s.best;
  if (s.kind === 'best-down') return s.best / s.value;
  return null;
}
function record(s, v, extra){
  var now = Date.now();
  if (s.kind === 'best-up') s.best = s.best === null ? v : Math.max(s.best, v);
  if (s.kind === 'best-down') s.best = s.best === null ? v : Math.min(s.best, v);
  var st = stateOf(s, v, s.best);
  if (extra && extra.force) st = extra.force;
  s.value = v; s.last = now;
  s.hist.push([now, v]); if (s.hist.length > HISTORY) s.hist.shift();
  var out = s.fmt(v);
  var sh = shareOfBest(s);
  if (sh !== null) out += ', ' + fi(sh * 100, 0) + ' per cent of the best here';
  if (s.target) out += ', ' + fi(v / s.target * 100, 1) + ' per cent of the ' + comma(s.target) + ' target';
  if (s.kind === 'limit-up') out += ', OK under ' + s.ok + ', WARNING under ' + s.warn;
  if (s.kind === 'limit-down') out += ', OK over ' + s.ok + ', WARNING over ' + s.warn;
  if (extra && extra.note) out += '. ' + extra.note;
  s.out = out;
  /* A CHANGE IS CONFIRMED ON THE NEXT CHECK before it is announced, as
     a server watch does. One 250 ms reading on a busy machine can dip
     by a third; a state that flapped on every dip would be noise. The
     first reading of a service sets its state at once. */
  if (st !== s.state && s.state !== null){
    if (s.pending && s.pending.state === st) s.pending.n++;
    else s.pending = { state: st, n: 1 };
    if (s.pending.n < 2){
      s.out = out + '. Reads ' + st + ', to be confirmed on the next check';
      s.forced = !!(extra && extra.force);
      runs.push({ t: now, id: s.id, state: st });
      if (runs.length > 2000) runs.shift();
      return;
    }
  }
  s.pending = null;
  if (st !== s.state){
    changes.push({ t: now, id: s.id, name: s.name, from: s.state, to: st, out: out });
    if (changes.length > 200) changes.shift();
    s.state = st; s.since = now;
  }
  s.forced = !!(extra && extra.force);
  runs.push({ t: now, id: s.id, state: st });
  if (runs.length > 2000) runs.shift();
}

/* ================= the measurements ================= */
var WSRC = [
  'function burn(ms){',
  '  var t0 = performance.now(), n = 0, acc = 0, i, x;',
  '  while (performance.now() - t0 < ms){',
  '    for (i = 0; i < 100000; i++){ x = (i & 1023) + 1; acc += x * 2654435761 % 4294967296; }',
  '    n += 100000;',
  '  }',
  '  var el = performance.now() - t0;',
  '  return { ops: n, ms: el, perSec: n / (el / 1000), guard: acc };',
  '}',
  'self.onmessage = function(e){ self.postMessage(burn(e.data.ms)); };'
].join('\n');
function spawn(n, ms, then){
  if (!wurl) wurl = URL.createObjectURL(new Blob([WSRC], {type: 'text/javascript'}));
  var got = [], done = 0, ws = [], i;
  for (i = 0; i < n; i++){
    (function(){
      var w = new Worker(wurl); ws.push(w);
      w.onmessage = function(e){ got.push(e.data); w.terminate(); if (++done === n) then(got); };
    })();
  }
  ws.forEach(function(w){ w.postMessage({ ms: ms }); });      /* started together */
}
var MSRC = [
  'function chase(kb, ms){',
  '  var n = kb*1024/4, a = new Int32Array(n), idx = new Int32Array(n), i, j, t;',
  '  for (i=0;i<n;i++) idx[i]=i;',
  '  for (i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }',
  '  for (i=0;i<n;i++) a[idx[i]] = idx[(i+1)%n];',
  '  var p=0, steps=0, t0=performance.now(), t1;',
  '  do { for (var k=0;k<10000;k++) p=a[p]; steps+=10000; t1=performance.now(); }',
  '  while (t1-t0 < ms);',
  '  return { kb: kb, ns: (t1-t0)*1e6/steps, guard: p };',
  '}',
  'self.onmessage = function(e){ self.postMessage(chase(e.data.kb, e.data.ms)); };'
].join('\n');
function memCheck(then){
  if (!murl) murl = URL.createObjectURL(new Blob([MSRC], {type: 'text/javascript'}));
  var w = new Worker(murl);
  w.onmessage = function(e){ w.terminate(); then(e.data.ns); };
  w.postMessage({ kb: 32768, ms: 150 });      /* 32 MB: well past every cache, so main memory */
}
var glc = null;
function gpuCheck(){
  var cv = el('gl');
  if (!glc){
    var gl = cv.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' })
          || cv.getContext('webgl', { antialias: false });
    if (!gl) return null;
    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    var renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    var vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    var fs = 'precision mediump float; void main(){ gl_FragColor = vec4(0.2,0.6,1.0,1.0); }';
    function sh(type, src){ var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; }
    var p = gl.createProgram(), a = sh(gl.VERTEX_SHADER, vs), b = sh(gl.FRAGMENT_SHADER, fs);
    if (!a || !b) return null;
    gl.attachShader(p, a); gl.attachShader(p, b); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return null;
    gl.useProgram(p);
    var TRIS = 64, verts = new Float32Array(TRIS * 6);
    for (var i = 0; i < TRIS; i++){ var x = (i / TRIS) * 2 - 1;
      verts.set([x, -0.9, x + 0.02, -0.9, x, 0.9], i * 6); }
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    glc = { gl: gl, tris: TRIS, renderer: renderer, soft: /swiftshader|software|llvmpipe|mesa offscreen/i.test(renderer || '') };
  }
  var g = glc.gl, px = new Uint8Array(4);
  function pass(draws){
    var t0 = performance.now();
    for (var d = 0; d < draws; d++) g.drawArrays(g.TRIANGLES, 0, glc.tris * 3);
    g.readPixels(0, 0, 1, 1, g.RGBA, g.UNSIGNED_BYTE, px);       /* finished, not queued */
    return performance.now() - t0;
  }
  pass(16);
  var draws = 64, ms = 0;
  while (draws < 65536){ ms = pass(draws); if (ms >= 60) break; draws *= 2; }
  var best = Infinity;
  for (var k = 0; k < 3; k++){ var t = pass(draws); if (t < best) best = t; }
  return { perSec: draws / (best / 1000), soft: glc.soft, renderer: glc.renderer };
}
function rttCheck(then){
  if (!/^https?:/.test(location.protocol)) return then(null);
  var u = location.pathname + '?rtt=' + Date.now() + Math.random();
  var t0 = performance.now();
  fetch(u, { method: 'HEAD', cache: 'no-store' }).then(function(r){
    then(r.ok ? performance.now() - t0 : null);
  }).catch(function(){ then(null); });
}
function downCheck(then){
  if (!/^https?:/.test(location.protocol)) return then(null);
  var u = location.pathname + '?down=' + Date.now() + Math.random();
  var t0 = performance.now();
  fetch(u, { cache: 'no-store' }).then(function(r){ return r.arrayBuffer(); }).then(function(b){
    var ms = performance.now() - t0;
    then(ms > 0 ? { mbit: b.byteLength * 8 / (ms / 1000) / 1e6, kb: b.byteLength / 1024 } : null);
  }).catch(function(){ then(null); });
}
function battCheck(then){
  if (!navigator.getBattery) return then(null);
  navigator.getBattery().then(function(b){ then({ pct: b.level * 100, charging: b.charging }); })
    .catch(function(){ then(null); });
}
function storeCheck(then){
  if (!navigator.storage || !navigator.storage.estimate) return then(null);
  navigator.storage.estimate().then(function(e){
    then(e.quota ? { pct: e.usage / e.quota * 100, mb: e.usage / 1048576, qmb: e.quota / 1048576 } : null);
  }).catch(function(){ then(null); });
}

/* ================= the scheduler: one check at a time ============= */
var RUN = {
  cpu1: function(done){ spawn(1, 250, function(g){ record(S_CPU1, g[0].perSec); done(); }); },
  cpuN: function(done){ spawn(CORES, 250, function(g){
    var sum = g.reduce(function(a, x){ return a + x.perSec; }, 0);
    record(S_CPUN, sum, { note: CORES + ' threads started together' }); done(); }); },
  gpu: function(done){
    gpuBusy = true;
    setTimeout(function(){
      var r = gpuCheck();
      if (r) record(S_GPU, r.perSec, r.soft ? { force: 'WARNING',
        note: 'Drawn by a SOFTWARE RENDERER - the processor, not a graphics part' } : null);
      /* THE NEXT FRAME'S GAP SPANS THE CHECK ITSELF, so it is not counted
         either - it read as a 383 ms stall the first time round. */
      gpuBusy = false; lastF = 0; done();
    }, 0);
  },
  mem: function(done){ memCheck(function(ns){ record(S_MEM, ns, { note: '32 MB, past every cache' }); done(); }); },
  rtt: function(done){ rttCheck(function(ms){ if (ms !== null) record(S_RTT, ms); done(); }); },
  down: function(done){ downCheck(function(r){ if (r) record(S_DOWN, r.mbit, { note: 'This page itself, ' + fi(r.kb, 0) + ' kB' }); done(); }); },
  batt: function(done){ battCheck(function(r){ if (r) record(S_BATT, r.pct, { note: r.charging ? 'Charging' : 'On battery' }); done(); }); },
  store: function(done){ storeCheck(function(r){ if (r) record(S_STORE, r.pct, { note: fi(r.mb, 1) + ' MB of ' + comma(r.qmb) + ' MB' }); done(); }); }
};
var ORDER = ['cpu1', 'cpuN', 'mem', 'gpu', 'rtt', 'down', 'batt', 'store'];
function nowS(){ return (performance.now() - t0Page) / 1000 * X8; }
function schedule(){
  if (running) return;
  var t = nowS(), pick = null;
  ORDER.forEach(function(id){
    var s = services.filter(function(x){ return x.id === id; })[0];
    if (s.due <= t && (!pick || s.due < pick.due)) pick = s;
  });
  if (!pick) return;
  running = pick.id;
  RUN[pick.id](function(){ pick.due = nowS() + pick.every; running = null; render(); });
}

/* frames and stalls, measured all the time - except while the graphics
   check holds the main thread, which would otherwise count as a stall */
var fN = 0, fT0 = 0, lastF = 0, stallMax = 0, stallT0 = 0;
/* THE PAGE'S OWN HEAVY CHECKS ARE NOT COUNTED AGAINST THE SCREEN. The
   every-core check fills all the cores and starved the screen into a
   350 ms 'stall' on a phone; the graphics check holds the main thread
   outright. While one of them runs, frames and gaps are not measured,
   and the first gap after it is skipped too. */
var HEAVY = { cpu1: 1, cpuN: 1, gpu: 1, mem: 1 }, skipF = 0;
/* TIMED BY THE CLOCK WHEN THE FRAME RUNS, not the frame's own stamp.
   After the main thread is held, the first frame through carries a
   stamp from BEFORE the hold, so the frame after it showed the whole
   hold as one gap. Two frames are let through after a heavy check
   before gaps are counted again. */
function frame(){
  var now = performance.now();
  if (!fT0){ fT0 = now; stallT0 = now; }
  if (gpuBusy || HEAVY[running]){ lastF = 0; fN = 0; fT0 = now; skipF = 2; requestAnimationFrame(frame); return; }
  if (skipF > 0){ skipF--; lastF = now; fN = 0; fT0 = now; requestAnimationFrame(frame); return; }
  if (lastF){ var gap = now - lastF; if (gap > stallMax) stallMax = gap; }
  lastF = now; fN++;
  if (now - fT0 >= 1000){
    record(S_FPS, fN * 1000 / (now - fT0));
    fN = 0; fT0 = now;
  }
  if (now - stallT0 >= 10000 / X8){
    if (stallMax > 0) record(S_STALL, stallMax, { note: 'Longest gap between two frames in the last 10 s, outside the page\u2019s own checks' });
    stallMax = 0; stallT0 = now;
  }
  requestAnimationFrame(frame);
}

/* ================= drawing ================= */
var COL = { OK: '#0ca30c', WARNING: '#fab219', CRITICAL: '#d03b3b' };
var STATES = ['OK', 'WARNING', 'CRITICAL'];
function svgEl(tag, at){ var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in at) e.setAttribute(k, at[k]); return e; }
/* A DONUT OF STATES, with a 2 px gap of surface between segments. */
function donut(host, counts, centre){
  host.innerHTML = '';
  var total = STATES.reduce(function(a, k){ return a + counts[k]; }, 0);
  var S = 96, R = 40, w = 12, svg = svgEl('svg', { width: S, height: S, viewBox: '0 0 ' + S + ' ' + S });
  svg.appendChild(svgEl('circle', { cx: S / 2, cy: S / 2, r: R, fill: 'none', stroke: '#0f1d2a', 'stroke-width': w }));
  var C = 2 * Math.PI * R, at = 0, gap = total && STATES.filter(function(k){ return counts[k]; }).length > 1 ? 2 : 0;
  STATES.forEach(function(k){
    if (!counts[k]) return;
    var len = counts[k] / total * C;
    var seg = svgEl('circle', { cx: S / 2, cy: S / 2, r: R, fill: 'none', stroke: COL[k], 'stroke-width': w,
      'stroke-dasharray': Math.max(0, len - gap) + ' ' + (C - Math.max(0, len - gap)),
      'stroke-dashoffset': -at, transform: 'rotate(-90 ' + S / 2 + ' ' + S / 2 + ')' });
    seg.dataset.tip = k + ': ' + counts[k];
    tipOn(seg);
    svg.appendChild(seg); at += len;
  });
  var tx = svgEl('text', { x: S / 2, y: S / 2 + 6, 'text-anchor': 'middle', fill: '#d7e6f2',
    'font-size': 18, 'font-weight': 700, 'font-family': 'monospace' });
  tx.textContent = String(centre); svg.appendChild(tx);
  host.appendChild(svg);
  var leg = document.createElement('div'); leg.className = 'leg';
  STATES.forEach(function(k){
    if (!counts[k]) return;
    var d = document.createElement('div');
    d.innerHTML = '<span class="sw" style="background:' + COL[k] + '"></span>';
    d.appendChild(document.createTextNode(k + ' ' + counts[k]));
    leg.appendChild(d);
  });
  host.appendChild(leg);
}
var SPARKS = [S_CPUN, S_FPS, S_MEM, S_RTT, S_GPU, S_CPU1];
function spark(s){
  var card = document.createElement('div'); card.className = 'card spark';
  var h = document.createElement('h3'); h.textContent = s.name; card.appendChild(h);
  var W = 300, H = 96, P = 4;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none' });
  var vals = s.hist.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo){ hi = hi * 1.05 + 1e-9; lo = lo * 0.95; }
  if (lo > 0) lo = 0;                 /* every graph starts at zero, so a dip is not exaggerated */
  function X(i){ return s.hist.length < 2 ? W / 2 : P + i / (s.hist.length - 1) * (W - 2 * P); }
  function Y(v){ return H - P - (v - lo) / (hi - lo) * (H - 2 * P); }
  [0.25, 0.5, 0.75].forEach(function(f){
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H * f, y2: H * f, stroke: '#0f1d2a', 'stroke-width': 1 }));
  });
  var d = s.hist.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(' ');
  svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: '#3987e5', 'stroke-width': 2,
    'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }));
  var cross = svgEl('line', { y1: 0, y2: H, stroke: '#8ea9c2', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke', visibility: 'hidden' });
  svg.appendChild(cross);
  /* THE HOVER: the nearest reading, its time and value */
  function at(ev){
    var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    var i = s.hist.length < 2 ? 0 : Math.round((x - P) / (W - 2 * P) * (s.hist.length - 1));
    i = Math.max(0, Math.min(s.hist.length - 1, i));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    showTip(ev, hms(s.hist[i][0]) + '  ' + s.fmt(s.hist[i][1]));
  }
  svg.addEventListener('pointermove', at);
  svg.addEventListener('pointerdown', at);
  svg.addEventListener('pointerleave', function(){ cross.setAttribute('visibility', 'hidden'); hideTip(); });
  card.appendChild(svg);
  var now = document.createElement('div'); now.className = 'now';
  var a = document.createElement('span'); a.textContent = 'Now ';
  var b = document.createElement('b'); b.textContent = s.fmt(s.value); a.appendChild(b);
  var c = document.createElement('span'); c.textContent = 'Scale 0 to ' + s.fmt(hi);
  now.appendChild(a); now.appendChild(c); card.appendChild(now);
  return card;
}
var tip = el('tip');
function showTip(ev, s){ tip.textContent = s; tip.style.display = 'block';
  var x = Math.min(ev.clientX + 12, window.innerWidth - tip.offsetWidth - 6);
  tip.style.left = Math.max(6, x) + 'px'; tip.style.top = (ev.clientY - 30) + 'px'; }
function hideTip(){ tip.style.display = 'none'; }
function tipOn(node){
  node.addEventListener('pointermove', function(ev){ showTip(ev, node.dataset.tip); });
  node.addEventListener('pointerleave', hideTip);
}

/* ================= the page ================= */
function live(){ return services.filter(function(s){ return s.state !== null; }); }
function render(){
  var L = live(), now = Date.now();
  var cNow = { OK: 0, WARNING: 0, CRITICAL: 0 }, cAll = { OK: 0, WARNING: 0, CRITICAL: 0 };
  L.forEach(function(s){ cNow[s.state]++; });
  runs.forEach(function(r){ cAll[r.state]++; });
  if (L.length) donut(el('dNow'), cNow, L.length);
  if (runs.length) donut(el('dAll'), cAll, runs.length);
  el('dNow').parentNode.style.display = L.length ? '' : 'none';
  el('dAll').parentNode.style.display = runs.length ? '' : 'none';

  var bars = el('bars'); bars.innerHTML = '';
  L.forEach(function(s){
    var sh = shareOfBest(s);
    if (sh === null) return;
    var b = document.createElement('div'); b.className = 'b';
    b.dataset.tip = s.name + ': ' + s.fmt(s.value) + ', best ' + s.fmt(s.best);
    var lab = document.createElement('div'); lab.className = 'lab';
    var n = document.createElement('span'); n.textContent = s.name;
    var v = document.createElement('b'); v.textContent = fi(sh * 100, 0) + ' per cent, ' + s.state;
    lab.appendChild(n); lab.appendChild(v);
    var tr = document.createElement('div'); tr.className = 'track';
    var f = document.createElement('div'); f.className = 'fill';
    f.style.width = Math.min(100, sh * 100).toFixed(2) + '%'; f.style.background = COL[s.state];
    f.dataset.share = sh;
    tr.appendChild(f); b.appendChild(lab); b.appendChild(tr); bars.appendChild(b);
    tipOn(b);
  });
  bars.parentNode.style.display = bars.children.length ? '' : 'none';

  var sp = el('sparks'); sp.innerHTML = '';
  SPARKS.forEach(function(s){ if (s.hist.length >= 2) sp.appendChild(spark(s)); });
  sp.style.display = sp.children.length ? '' : 'none';
  sp.previousElementSibling.style.display = sp.children.length ? '' : 'none';

  var sb = el('sBody'); sb.innerHTML = '';
  L.forEach(function(s){
    var tr = document.createElement('tr'); tr.dataset.state = s.state;
    var a = document.createElement('td'); a.className = 'svc'; a.textContent = s.name;
    var sub = document.createElement('span'); sub.className = 'sub';
    var chip = document.createElement('span'); chip.className = 'chip st-' + s.state; chip.textContent = s.state;
    sub.appendChild(chip);
    sub.appendChild(document.createTextNode(' for ' + ago(now - s.since)));
    a.appendChild(sub);
    var b = document.createElement('td'); b.className = 'out';
    b.textContent = s.out.charAt(0).toUpperCase() + s.out.slice(1);
    var sub2 = document.createElement('span'); sub2.className = 'sub';
    sub2.textContent = 'Checked ' + ago(now - s.last) + ' ago' + (s.every ? ', every ' + s.every + ' s' : ', all the time');
    b.appendChild(sub2);
    tr.appendChild(a); tr.appendChild(b); sb.appendChild(tr);
  });

  var cb = el('cBody'); cb.innerHTML = '';
  changes.slice(-12).reverse().forEach(function(c){
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.textContent = hms(c.t);
    var b = document.createElement('td'); b.className = 'svc'; b.textContent = c.name;
    var d = document.createElement('td');
    if (c.from){ var c1 = document.createElement('span'); c1.className = 'chip st-' + c.from; c1.textContent = c.from;
      d.appendChild(c1); d.appendChild(document.createTextNode(' to ')); }
    else d.appendChild(document.createTextNode('First '));
    var c2 = document.createElement('span'); c2.className = 'chip st-' + c.to; c2.textContent = c.to; d.appendChild(c2);
    tr.appendChild(a); tr.appendChild(b); tr.appendChild(d); cb.appendChild(tr);
  });
  el('tC').parentNode.style.display = changes.length ? '' : 'none';
  el('tC').parentNode.previousElementSibling.style.display = changes.length ? '' : 'none';

  var worst = cNow.CRITICAL ? 'CRITICAL' : (cNow.WARNING ? 'WARNING' : 'OK');
  el('line').textContent = L.length ? (L.length + ' services, ' + cNow.OK + ' OK, ' + cNow.WARNING + ' WARNING, '
    + cNow.CRITICAL + ' CRITICAL' + (running ? ' - checking ' + nameOf(running) : '')) : 'Watching - first checks running';
  refreshDownloads();
  selfCheck();
}
function nameOf(id){ return services.filter(function(s){ return s.id === id; })[0].name; }

/* ================= the page checks itself ================= */
var WORDS = ('All Rights Reserved Copyright The Watch Services Now Every Check Run Against Its Own Best Live '
  + 'Latest State Changes Processor One Core Graphics Draws Second Memory Random Fetch Screen Frames Main '
  + 'Thread Longest Stall Network Round Trip Download Battery Storage Used Checked First Drawn This Page '
  + 'Charging On Avainlippu Longest Gap Between Two Reads').split(' ');
function selfCheck(){
  var f = [], txt = document.body.innerText.replace(el('chk').innerText, '');
  if (document.querySelectorAll('pre, code, textarea').length) f.push('a source block reached the page');
  if (/[☀-➿]|\ud83c|\ud83d|\ud83e/.test(el('line').textContent)) f.push('a picture glyph is in the top text');
  /* the symbol can come before the figure or, as written here, after it */
  if (/[$€£]\s?[0-9]|[0-9]\s?[$€£]|\b(price[sd]?|euro|dollars?)\b/i.test(txt)) f.push('money wording reached the page');
  if (/\b(Infinity|NaN|undefined|null)\b/.test(txt)) f.push('a figure with no value reached the page');
  if (document.getElementById('crBiz')) f.push('a second copyright line is on the page');
  var m = txt.match(/\b[A-Z][a-z]{2,} +[A-Z][a-z]{2,}\b/g) || [];
  var bad = m.filter(function(s){ var w = s.split(/ +/); return WORDS.indexOf(w[0]) < 0 || WORDS.indexOf(w[1]) < 0; });
  if (bad.length) f.push('something reads as a name: ' + bad[0]);
  [].forEach.call(document.querySelectorAll('#pg td'), function(td){
    var s = td.textContent.trim();
    if (s && /^[a-z]/.test(s)) f.push('a row does not start with a capital: ' + s.slice(0, 30));
  });
  /* EVERY PRINTED STATE MUST BE THE ONE ITS READING EARNS */
  live().forEach(function(s){
    var earns = stateOf(s, s.value, s.best);
    var waiting = s.pending && s.pending.n === 1 && s.pending.state === earns;
    if (!s.forced && earns !== s.state && !waiting)
      f.push(s.name + ' shows ' + s.state + ' where its reading earns ' + earns);
  });
  /* THE DONUT MUST ADD UP TO THE TABLE, state by state */
  var rows = document.querySelectorAll('#sBody tr'), byRow = { OK: 0, WARNING: 0, CRITICAL: 0 };
  [].forEach.call(rows, function(r){ byRow[r.dataset.state]++; });
  var leg = el('dNow').querySelectorAll('.leg div'), byLeg = { OK: 0, WARNING: 0, CRITICAL: 0 };
  [].forEach.call(leg, function(d){ var p = d.textContent.trim().split(' '); byLeg[p[0]] = +p[1]; });
  STATES.forEach(function(k){ if (byRow[k] !== byLeg[k])
    f.push('the donut says ' + byLeg[k] + ' ' + k + ' but the table has ' + byRow[k]); });
  /* EACH BAR IS AS LONG AS ITS SHARE */
  [].forEach.call(document.querySelectorAll('#bars .fill'), function(b){
    var want = Math.min(100, +b.dataset.share * 100), got = parseFloat(b.style.width);
    if (Math.abs(want - got) > 0.01) f.push('a bar is drawn at ' + got + ' per cent for a share of ' + want.toFixed(2));
  });
  /* EVERY CORE CANNOT BE SLOWER THAN ONE, measured minutes apart or not */
  if (S_CPU1.best && S_CPUN.best && S_CPUN.best < S_CPU1.best * 0.9)
    f.push('every core came out slower than one core at its best, so the threads did not overlap');
  fails = f;
  var box = el('chk');
  if (f.length){ box.style.display = 'block';
    box.innerHTML = '<b style="color:#e0645f">THIS PAGE IS NOT CLEAN</b><br>' + f.map(function(s){ return s.replace(/</g, '&lt;'); }).join('<br>'); }
  else box.style.display = 'none';
  return f;
}

/* ================= what leaves the page ================= */
function textOf(){
  var L = ['THE WATCH', 'AI2Orbit', 'Taken ' + stampNow(), '', 'SERVICES'];
  live().forEach(function(s){ L.push(s.name + ': ' + s.state + ' - ' + s.out); });
  L.push('', 'LATEST STATE CHANGES');
  changes.forEach(function(c){ L.push(hms(c.t) + '  ' + c.name + ': ' + (c.from || 'first') + ' to ' + c.to + ' - ' + c.out); });
  L.push('', 'READINGS');
  services.forEach(function(s){ if (s.hist.length)
    L.push(s.name + ': ' + s.hist.map(function(p){ return hms(p[0]) + ' ' + s.fmt(p[1]); }).join('; ')); });
  return L.join('\n');
}
function dxfOf(){
  var o = [];
  function p(a, b){ o.push(a, String(b)); }
  function text(lay, x, y, h, s){ p(0, 'TEXT'); p(8, lay); p(10, x); p(20, y); p(30, 0); p(40, h); p(1, s); }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  /* one graph per service, 100 wide and 30 high, stacked downwards */
  var row = 0;
  services.forEach(function(s){
    if (s.hist.length < 2) return;
    var y0 = -row * 45, vals = s.hist.map(function(q){ return q[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals); if (hi === lo) hi = lo + 1;
    var lay = s.id.toUpperCase();
    p(0, 'LWPOLYLINE'); p(8, lay); p(90, s.hist.length); p(70, 0);
    s.hist.forEach(function(q, i){ p(10, (i / (s.hist.length - 1) * 100).toFixed(3)); p(20, (y0 + (q[1] - lo) / (hi - lo) * 30).toFixed(3)); });
    text(lay, 0, y0 + 34, 2.5, s.name + ' ' + s.state + ' ' + s.fmt(s.value));
    row++;
  });
  text('LABELS', 0, 12, 3, 'THE WATCH ' + stampNow());
  p(0, 'ENDSEC'); p(0, 'EOF');
  return o.join('\r\n') + '\r\n';
}
var lastDl = 0;
function refreshDownloads(){
  if (performance.now() - lastDl < 2000) return;
  lastDl = performance.now();
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'}));
}

render();
requestAnimationFrame(frame);
setInterval(function(){ schedule(); }, 250);
setInterval(render, 1000);

window.__read = function(){
  return { services: services.map(function(s){ return { id: s.id, state: s.state, value: s.value, best: s.best,
           n: s.hist.length, out: s.out, forced: !!s.forced }; }),
           changes: changes, runs: runs.length, fails: fails, bar: el('stamp').textContent + ' ' + el('line').textContent };
};
window.__selfCheck = selfCheck;
window.__services = services;
window.__record = function(id, v){ record(services.filter(function(s){ return s.id === id; })[0], v); render(); };
window.__textOf = textOf;
window.__dxfOf = dxfOf;
</script>
