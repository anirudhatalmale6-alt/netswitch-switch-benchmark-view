<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FINLAND GRID</title>
<style>
  :root{ --bg:#05080c; --panel:#0a121a; --line:#16293a; --ink:#d7e6f2; --ink2:#8ea9c2; --muted:#6d8ba3;
    --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b; }
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:58px 12px 70px;max-width:1000px}
  h2{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:400;margin:16px 0 6px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
  .card h3{margin:0 0 8px;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.5px}
  canvas{display:block;width:100%;touch-action:none}
  #fin{height:520px} #loc{height:300px}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px}
  .leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
  .seg{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
  .seg a{padding:2px 8px;border:1px solid #2b6ea8;border-radius:4px;color:#cfe3f5;cursor:pointer;font-size:11px;user-select:none}
  .seg a.on{background:#12507f;color:#fff}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-weight:400;padding:3px 4px;border-bottom:1px solid var(--line);letter-spacing:1px;font-size:9px}
  td{padding:4px;border-bottom:1px solid #0e1a26;vertical-align:top;font-variant-numeric:tabular-nums}
  td.k{color:var(--ink2)} td.v{color:var(--ink);font-weight:700}
  .chip{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:700;font-size:10px;color:#05080c;white-space:nowrap}
  .c-ok{background:var(--ok)} .c-warn{background:var(--warn)} .c-crit{background:var(--crit)}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  #always{position:fixed;right:10px;bottom:10px;z-index:10;display:flex;gap:6px}
  #always a{display:block;background:#4fd1ff;color:#05080c;font-weight:700;text-decoration:none;border-radius:4px;padding:8px 12px;font-size:12px;box-shadow:0 2px 10px #000a}
  #always a.alt{background:#16293a;color:#9fd6f5}
</style></head><body>
<div id="bar"><b id="stamp">B92</b><i id="line">Energising Finland</i></div>
<div id="pg">
  <h2>Finland Grid</h2>
  <div class="grid">
    <div class="card"><h3>The Country, Modelled Lines Between Real Places</h3><canvas id="fin"></canvas>
      <div class="leg"><span><i style="background:#0ca30c"></i>Under 80 per cent</span><span><i style="background:#fab219"></i>80 to 100</span>
        <span><i style="background:#d03b3b"></i>Over or cut</span><span><i style="background:#3987e5"></i>Supply</span></div></div>
    <div class="card"><h3 id="locTitle">Local View</h3>
      <div class="seg" id="cities"></div>
      <canvas id="loc"></canvas>
      <table id="tLoc" style="margin-top:8px"></table></div>
  </div>
  <h2>The Country Now</h2>
  <div class="card"><table id="tNat"></table></div>
  <h2>Supply</h2>
  <div class="card"><table id="tSup"><thead><tr><th>supply</th><th>can give</th><th>giving</th><th>share</th></tr></thead><tbody id="sBody"></tbody></table></div>
  <h2>Busiest Lines</h2>
  <div class="card"><table id="tLines"><thead><tr><th>line</th><th>flow</th><th>of rating</th></tr></thead><tbody id="liBody"></tbody></table></div>
  <h2>The Settings</h2>
  <div class="card"><table id="tSet"></table></div>
  <div id="chk" style="display:none"></div>
</div>
<div id="always"><a id="dlDxf" class="alt" download="finland-grid.dxf">DXF</a><a id="dlTxt" download="finland-grid.txt">Download</a></div>

<script>
/* ==================================================================
   FINLAND GRID - the country and a local view of each part of it.

   WHAT IS REAL: the places. 28 cities and towns at their real
   coordinates with their populations rounded, and four supply points
   at real kinds of site - the two nuclear stations on the coast,
   hydro on the northern rivers, wind on the west coast.

   WHAT IS MODELLED, and the page says so: which place connects to
   which (built from distance, as the Europe map is), how much each
   place uses (population times one figure for use per person), what
   each supply point gives, and every line's rating. It shows how a
   grid behaves - it is not the national grid's real network.

   THE COUNTRY. Each place is fed from the nearest supply that still
   has power to give, along the shortest way. Every few seconds one of
   the busiest lines is cut; the feed is worked out again round it and
   every line's loading is shown. The cut heals before the next one.

   THE LOCAL VIEW. A city is far too big for one substation, so the
   local view is ONE district: a 20 kV substation and its feeders,
   sized to the city, with a fault on a feeder switched out and the
   far side fed through a tie - the same steps as the grid page. The
   view moves round the country by itself, or pick a place.

   THE PAGE HOLDS ITSELF TO THE PHYSICS at both levels: power given
   equals power used, no supply over what it can give, every place
   fed, the shortest way checked a second way; locally no loop, no
   current through an open switch, the faulted section dead.
   ================================================================== */

var KW_PER_PERSON = 1.5;        /* average use per person, kW - chosen, said */
var LINE_MW = 1500, NEAR = 3, MAXLINK = 260, CUT_EVERY = 10, LOCAL_EVERY = 16;

/* name, latitude, longitude, people (rounded) */
var PLACES = [
  ['Helsinki', 60.170, 24.938, 664000], ['Espoo', 60.205, 24.655, 305000], ['Vantaa', 60.294, 25.040, 245000],
  ['Tampere', 61.498, 23.761, 249000], ['Oulu', 65.012, 25.465, 214000], ['Turku', 60.452, 22.267, 201000],
  ['Jyvaskyla', 62.242, 25.747, 147000], ['Kuopio', 62.892, 27.677, 124000], ['Lahti', 60.983, 25.656, 121000],
  ['Pori', 61.485, 21.797, 83000], ['Kouvola', 60.869, 26.704, 79000], ['Joensuu', 62.601, 29.763, 77000],
  ['Lappeenranta', 61.058, 28.188, 73000], ['Hameenlinna', 60.996, 24.464, 68000], ['Vaasa', 63.096, 21.616, 68000],
  ['Seinajoki', 62.790, 22.840, 65000], ['Rovaniemi', 66.503, 25.729, 65000], ['Mikkeli', 61.688, 27.272, 52000],
  ['Kotka', 60.466, 26.946, 51000], ['Salo', 60.384, 23.127, 51000], ['Porvoo', 60.393, 25.664, 51000],
  ['Kokkola', 63.838, 23.130, 48000], ['Rauma', 61.128, 21.511, 39000], ['Kajaani', 64.227, 27.728, 36000],
  ['Savonlinna', 61.869, 28.879, 32000], ['Tornio', 65.848, 24.147, 21000], ['Kemi', 65.736, 24.564, 20000],
  ['Ivalo', 68.657, 27.539, 7000]
];
/* supply points: name, latitude, longitude, MW it can give in this model */
var SUPPLY = [
  ['Nuclear, west coast', 61.237, 21.443, 3400], ['Nuclear, south coast', 60.370, 26.348, 1000],
  ['Hydro, northern rivers', 66.150, 25.400, 1100], ['Wind, west coast', 63.300, 21.900, 1500]
];

function el(id){ return document.getElementById(id); }
function two(n){ return (n < 10 ? '0' : '') + n; }
function stampNow(){ var d = new Date(); return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate()) + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()); }
function fi(n, d){ if (n === null || n === undefined || !isFinite(n)) return '-'; return n.toFixed(d === undefined ? 1 : d).replace('.', ','); }
function km(a, b){ var R = 6371, p1 = a[1] * Math.PI / 180, p2 = b[1] * Math.PI / 180, dp = p2 - p1, dl = (b[2] - a[2]) * Math.PI / 180;
  var h = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2); return 2 * R * Math.asin(Math.sqrt(h)); }

/* ================= the country ================= */
var N = PLACES.concat(SUPPLY.map(function(s){ return [s[0], s[1], s[2], 0, s[3]]; }));   /* supplies after places */
var NP = PLACES.length, links = [], adj = N.map(function(){ return []; });
function link(a, b){ if (adj[a].indexOf(b) >= 0) return; adj[a].push(b); adj[b].push(a); links.push([a, b, km(N[a], N[b])]); }
(function build(){
  for (var i = 0; i < N.length; i++){
    var d = []; for (var j = 0; j < N.length; j++) if (j !== i) d.push([km(N[i], N[j]), j]);
    d.sort(function(p, q){ return p[0] - q[0]; });
    for (var k = 0; k < NEAR; k++) if (d[k][0] <= MAXLINK || k === 0) link(i, d[k][1]);
  }
  for (;;){                                  /* join separate pieces by their shortest gap */
    var comp = pieces(null); if (Math.max.apply(null, comp) === 0) break;
    var best = null;
    for (var a = 0; a < N.length; a++) if (comp[a] === 0) for (var b = 0; b < N.length; b++) if (comp[b] !== 0){
      var dd = km(N[a], N[b]); if (!best || dd < best[2]) best = [a, b, dd]; }
    link(best[0], best[1]);
  }
})();
function lkey(a, b){ return a < b ? a + '-' + b : b + '-' + a; }
function pieces(cut){
  var comp = N.map(function(){ return -1; }), c = 0;
  for (var i = 0; i < N.length; i++) if (comp[i] < 0){
    var st = [i]; comp[i] = c;
    while (st.length){ var u = st.pop(); adj[u].forEach(function(v){ if (cut && cut[lkey(u, v)]) return; if (comp[v] < 0){ comp[v] = c; st.push(v); } }); }
    c++;
  }
  return comp;
}
function dijkstra(src, cut){
  var d = N.map(function(){ return Infinity; }), prev = N.map(function(){ return -1; }), done = N.map(function(){ return false; });
  d[src] = 0;
  for (;;){
    var u = -1; for (var i = 0; i < N.length; i++) if (!done[i] && (u < 0 || d[i] < d[u])) u = i;
    if (u < 0 || d[u] === Infinity) break; done[u] = true;
    adj[u].forEach(function(v){ if (cut && cut[lkey(u, v)]) return; var w = km(N[u], N[v]); if (d[u] + w < d[v] - 1e-12){ d[v] = d[u] + w; prev[v] = u; } });
  }
  return { d: d, prev: prev };
}
function bellman(src, cut){
  var d = N.map(function(){ return Infinity; }); d[src] = 0;
  for (var k = 0; k < N.length; k++) links.forEach(function(l){ if (cut && cut[lkey(l[0], l[1])]) return;
    if (d[l[0]] + l[2] < d[l[1]]) d[l[1]] = d[l[0]] + l[2]; if (d[l[1]] + l[2] < d[l[0]]) d[l[0]] = d[l[1]] + l[2]; });
  return d;
}
function loadMW(i){ return PLACES[i][3] * KW_PER_PERSON / 1000; }
/* feed every place from the nearest supply that can still give, biggest places first */
function solve(cut){
  var paths = SUPPLY.map(function(s, k){ return dijkstra(NP + k, cut); });
  var left = SUPPLY.map(function(s){ return s[3]; }), feed = [], flow = {};
  var order = PLACES.map(function(p, i){ return i; }).sort(function(a, b){ return PLACES[b][3] - PLACES[a][3]; });
  order.forEach(function(i){
    var mw = loadMW(i), cands = SUPPLY.map(function(s, k){ return k; }).filter(function(k){ return paths[k].d[i] < Infinity && left[k] >= mw; })
      .sort(function(a, b){ return paths[a].d[i] - paths[b].d[i]; });
    if (!cands.length){ feed[i] = null; return; }
    var k = cands[0]; left[k] -= mw; feed[i] = k;
    var c = i; while (paths[k].prev[c] >= 0){ var p = paths[k].prev[c], key = lkey(p, c); flow[key] = (flow[key] || 0) + mw; c = p; }
  });
  var given = SUPPLY.map(function(s, k){ return s[3] - left[k]; });
  return { feed: feed, flow: flow, given: given, left: left, paths: paths };
}

/* ================= the local view ================= */
var LOC_KV = 20, LOC_PF = 0.95, LOC_RATING_A = 300, SQ3 = Math.sqrt(3);
function amps(kw){ return kw * 1000 / (SQ3 * LOC_KV * 1000 * LOC_PF); }
var loc = null;
function buildLocal(pi){
  /* one district: feeders around a substation, five load points each, ties between neighbouring feeder ends */
  var pop = PLACES[pi][3], F = Math.max(3, Math.min(6, Math.round(pop / 60000) + 2)), seed = pi * 7919 + 13;
  function r(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  var nodes = { S: [50, 50, 0] }, sect = [], ties = [];
  for (var f = 0; f < F; f++){
    var ang = f / F * Math.PI * 2 - Math.PI / 2, prev = 'S';
    for (var k = 1; k <= 5; k++){
      var id = 'F' + (f + 1) + '.' + k, rad = 8 + k * 7.5;
      nodes[id] = [50 + Math.cos(ang) * rad, 50 + Math.sin(ang) * rad * 0.9, Math.round(600 + r() * 300)];
      sect.push([id, prev, id, f]); prev = id;
    }
  }
  for (var g = 0; g < F; g++) ties.push(['T' + (g + 1), 'F' + (g + 1) + '.5', 'F' + ((g + 1) % F + 1) + '.5']);
  return { pi: pi, F: F, nodes: nodes, sect: sect, ties: ties, faultN: 0, t0: performance.now(), step: 0,
           st: null, log: [], done: [], districts: Math.max(1, Math.round(loadMW(pi) / (F * 5 * 0.75))) };
}
function locNormal(L){ var s = { closed: {}, breaker: {}, tie: {}, fault: null };
  L.sect.forEach(function(x){ s.closed[x[0]] = true; s.breaker[x[3]] = true; }); L.ties.forEach(function(t){ s.tie[t[0]] = false; }); return s; }
function locEnergise(L, s){
  var adjL = {}, e = [], fed = {}, via = {}, loop = false;
  Object.keys(L.nodes).forEach(function(n){ adjL[n] = []; });
  L.sect.forEach(function(x){ if (s.closed[x[0]] && (x[1] !== 'S' || s.breaker[x[3]])) e.push([x[1], x[2], x[0]]); });
  L.ties.forEach(function(t){ if (s.tie[t[0]]) e.push([t[1], t[2], t[0]]); });
  e.forEach(function(x){ adjL[x[0]].push([x[1], x[2]]); adjL[x[1]].push([x[0], x[2]]); });
  var stack = [['S', null]];
  while (stack.length){ var c = stack.pop(), n = c[0], from = c[1];
    if (fed[n]){ loop = true; continue; } fed[n] = true; if (from) via[n] = from;
    adjL[n].forEach(function(nb){ if (nb[1] !== from) stack.push([nb[0], nb[1]]); }); }
  var children = {}; Object.keys(L.nodes).forEach(function(n){ children[n] = []; });
  Object.keys(via).forEach(function(n){ var ed = e.filter(function(x){ return x[2] === via[n]; })[0]; children[ed[0] === n ? ed[1] : ed[0]].push(n); });
  var flow = {};
  function beyond(n){ var kw = L.nodes[n][2]; children[n].forEach(function(c){ var b = beyond(c); flow[via[c]] = b; kw += b; }); return kw; }
  return { fed: fed, flow: flow, head: beyond('S'), loop: loop };
}
function locChooseTie(L, s){
  var best = null;
  L.ties.forEach(function(t){ var trial = JSON.parse(JSON.stringify(s)); trial.tie[t[0]] = true;
    var g = locEnergise(L, trial); if (g.loop) return;
    var dead = Object.keys(L.nodes).filter(function(n){ return L.nodes[n][2] && !g.fed[n]; }).length, worst = 0;
    Object.keys(g.flow).forEach(function(k){ worst = Math.max(worst, amps(g.flow[k]) / LOC_RATING_A); });
    var sc = dead * 1000 + worst; if (!best || sc < best.sc) best = { tie: t[0], worst: worst, sc: sc, dead: dead }; });
  return best;
}
function locStep(L, now){
  var t = (now - L.t0) / 1000, cyc = Math.floor(t / LOCAL_EVERY), x = t - cyc * LOCAL_EVERY;
  if (L.cyc !== cyc){ L.cyc = cyc; L.st = locNormal(L); L.step = 0;
    L.sec = L.sect[(cyc * 7 + 3) % L.sect.length]; }
  var S = L.st, sec = L.sec;
  function say(s){ L.log.push(fi(t, 1) + ' s  ' + s); if (L.log.length > 30) L.log.shift(); }
  if (L.step === 0 && x >= 1){ L.step = 1; S.fault = sec[0]; say('Fault on ' + sec[0]); }
  if (L.step === 1 && x >= 1.4){ L.step = 2; S.breaker[sec[3]] = false; say('Feeder ' + (sec[3] + 1) + ' breaker trips'); }
  if (L.step === 2 && x >= 2){ L.step = 3; S.closed[sec[0]] = false; say(sec[0] + ' switched out'); }
  if (L.step === 3 && x >= 3){ L.step = 4; S.breaker[sec[3]] = true; say('Breaker closes again'); }
  if (L.step === 4 && x >= 4){ L.step = 5; var b = locChooseTie(L, S), g0 = locEnergise(L, S);
    var dark = Object.keys(L.nodes).filter(function(n){ return L.nodes[n][2] && !g0.fed[n]; }).length;
    if (b && dark){ S.tie[b.tie] = true; L.lastTie = b; say('Tie ' + b.tie + ' closes, worst loading ' + fi(b.worst * 100, 0) + ' per cent'); }
    else { L.lastTie = null; say('Nothing beyond the fault'); } }
  if (L.step === 5 && x >= 12){ L.step = 6; S.fault = null; say(sec[0] + ' repaired'); }
  if (L.step === 6 && x >= 13){ L.step = 7; L.st = locNormal(L); say('Back to normal'); }
  return locEnergise(L, L.st);
}

/* ================= state ================= */
var t0 = performance.now(), cut = {}, cutName = null, nat = null, cutN = 0, lastCut = -1, fails = [], loopError = null, locIdx = 0, locPinned = false, lastLocSwitch = 0;
function cutNext(){
  var base = solve({}), ranked = Object.keys(base.flow).sort(function(a, b){ return base.flow[b] - base.flow[a]; }).slice(0, 6);
  var k = ranked[cutN % ranked.length]; cutN++;
  cut = {}; cut[k] = true;
  var ab = k.split('-').map(Number); cutName = N[ab[0]][0] + ' to ' + N[ab[1]][0];
}

/* ================= drawing ================= */
function prep(cv){ var dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth || 300, H = cv.clientHeight || 300;
  if (cv.width !== Math.round(W * dpr)) cv.width = Math.round(W * dpr); if (cv.height !== Math.round(H * dpr)) cv.height = Math.round(H * dpr);
  var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); return { g: g, W: W, H: H }; }
function col(r){ return r >= 1 ? '#d03b3b' : (r >= 0.8 ? '#fab219' : '#0ca30c'); }
var FINXY = null;
function drawFin(){
  var c = prep(el('fin')), g = c.g, W = c.W, H = c.H;
  var lat0 = 59.6, lat1 = 69.2, lon0 = 20.5, lon1 = 31.8, k = Math.cos(64 * Math.PI / 180);
  var sx = (W - 30) / ((lon1 - lon0) * k), sy = (H - 30) / (lat1 - lat0), sc = Math.min(sx, sy);
  var X = function(p){ return 15 + (p[2] - lon0) * k * sc; }, Y = function(p){ return H - 15 - (p[1] - lat0) * sc; };
  FINXY = { X: X, Y: Y };
  links.forEach(function(l){ var key = lkey(l[0], l[1]), f = nat.flow[key] || 0;
    g.strokeStyle = cut[key] ? '#d03b3b' : (f ? col(f / LINE_MW) : '#2b3d50'); g.lineWidth = cut[key] ? 2 : (f ? 1.5 + Math.min(4, f / 400) : 1);
    g.setLineDash(cut[key] ? [5, 4] : []); g.beginPath(); g.moveTo(X(N[l[0]]), Y(N[l[0]])); g.lineTo(X(N[l[1]]), Y(N[l[1]])); g.stroke(); });
  g.setLineDash([]);
  N.forEach(function(p, i){
    if (i >= NP){ g.fillStyle = '#3987e5'; g.fillRect(X(p) - 6, Y(p) - 6, 12, 12); }
    else { var r = 2.5 + Math.sqrt(p[3] / 20000); g.fillStyle = nat.feed[i] === null ? '#d03b3b' : (i === locIdx ? '#ffffff' : '#8ea9c2');
      g.beginPath(); g.arc(X(p), Y(p), r, 0, 7); g.fill(); }
    if (i >= NP || p[3] >= 60000 || i === locIdx){ g.fillStyle = '#d7e6f2'; g.font = '10px monospace'; g.fillText(p[0], X(p) + 7, Y(p) + 3); }
  });
}
function drawLoc(g0){
  var L = loc, c = prep(el('loc')), g = c.g, W = c.W, H = c.H, S = L.st;
  var X = function(v){ return W / 2 + (v - 50) / 50 * Math.min(W, H) * 0.47; }, Y = function(v){ return H / 2 + (v - 50) / 50 * Math.min(W, H) * 0.47; };
  function seg(a, b){ g.beginPath(); g.moveTo(X(L.nodes[a][0]), Y(L.nodes[a][1])); g.lineTo(X(L.nodes[b][0]), Y(L.nodes[b][1])); g.stroke(); }
  L.sect.forEach(function(s){ var f = g0.flow[s[0]]; g.strokeStyle = S.fault === s[0] ? '#d03b3b' : (f !== undefined ? col(amps(f) / LOC_RATING_A) : '#3b4a5a');
    g.lineWidth = f !== undefined ? 3 : 2; g.setLineDash(S.closed[s[0]] ? [] : [3, 4]); seg(s[1], s[2]); });
  L.ties.forEach(function(t){ var f = g0.flow[t[0]]; g.strokeStyle = S.tie[t[0]] ? col(amps(f || 0) / LOC_RATING_A) : '#3b4a5a';
    g.lineWidth = S.tie[t[0]] ? 3 : 1.2; g.setLineDash(S.tie[t[0]] ? [] : [2, 5]); seg(t[1], t[2]); });
  g.setLineDash([]);
  Object.keys(L.nodes).forEach(function(n){ var p = L.nodes[n];
    if (n === 'S'){ g.fillStyle = '#3987e5'; g.fillRect(X(p[0]) - 7, Y(p[1]) - 7, 14, 14); }
    else { g.fillStyle = g0.fed[n] ? '#d7e6f2' : '#3b4a5a'; g.beginPath(); g.arc(X(p[0]), Y(p[1]), 4, 0, 7); g.fill(); } });
}
function row(t, k, v, chip){ var tr = document.createElement('tr'), a = document.createElement('td'); a.className = 'k'; a.textContent = k;
  var b = document.createElement('td'); b.className = 'v';
  if (chip){ var c = document.createElement('span'); c.className = 'chip ' + chip[0]; c.textContent = chip[1]; b.appendChild(c); b.appendChild(document.createTextNode(' ')); }
  b.appendChild(document.createTextNode(v)); tr.appendChild(a); tr.appendChild(b); t.appendChild(tr); }
function render(g0){
  var tn = el('tNat'); tn.innerHTML = '';
  var used = 0; PLACES.forEach(function(p, i){ used += loadMW(i); });
  var given = nat.given.reduce(function(a, b){ return a + b; }, 0), unfed = nat.feed.filter(function(x){ return x === null; }).length;
  var worst = 0; Object.keys(nat.flow).forEach(function(k){ worst = Math.max(worst, nat.flow[k] / LINE_MW); });
  row(tn, 'Line Cut', cutName ? cutName + ', fed round it' : 'None');
  row(tn, 'Places Fed', (NP - unfed) + ' of ' + NP, [unfed ? 'c-crit' : 'c-ok', unfed ? 'NOT ALL' : 'ALL']);
  row(tn, 'Power Used', fi(used, 0) + ' MW, ' + fi(given, 0) + ' MW given');
  row(tn, 'Busiest Line', fi(worst * 100, 0) + ' per cent of its rating', [worst >= 1 ? 'c-crit' : (worst >= 0.8 ? 'c-warn' : 'c-ok'), worst >= 1 ? 'OVER' : (worst >= 0.8 ? 'HIGH' : 'OK')]);
  var sb = el('sBody'); sb.innerHTML = '';
  SUPPLY.forEach(function(s, k){ var tr = document.createElement('tr');
    [s[0].charAt(0).toUpperCase() + s[0].slice(1), fi(s[3], 0) + ' MW', fi(nat.given[k], 0) + ' MW', fi(nat.given[k] / s[3] * 100, 0) + ' %']
      .forEach(function(x, i){ var td = document.createElement('td'); td.className = i ? 'v' : 'k'; td.textContent = x; tr.appendChild(td); }); sb.appendChild(tr); });
  var lb = el('liBody'); lb.innerHTML = '';
  Object.keys(nat.flow).sort(function(a, b){ return nat.flow[b] - nat.flow[a]; }).slice(0, 8).forEach(function(k){
    var ab = k.split('-').map(Number), tr = document.createElement('tr');
    [N[ab[0]][0] + ' to ' + N[ab[1]][0], fi(nat.flow[k], 0) + ' MW', fi(nat.flow[k] / LINE_MW * 100, 0) + ' %']
      .forEach(function(x, i){ var td = document.createElement('td'); td.className = i ? 'v' : 'k'; td.textContent = x; tr.appendChild(td); }); lb.appendChild(tr); });
  var L = loc; el('locTitle').textContent = 'Local View, One District Of ' + PLACES[L.pi][0];
  var tl = el('tLoc'); tl.innerHTML = '';
  var stepName = ['Normal', 'Fault, relay timing', 'Breaker open', 'Section switched out', 'Breaker closed again', 'Rerouted through a tie', 'Repaired', 'Back to normal'][L.step];
  row(tl, 'State', stepName, [L.step === 0 || L.step === 7 ? 'c-ok' : (L.step >= 5 ? 'c-warn' : 'c-crit'), L.step === 0 || L.step === 7 ? 'NORMAL' : 'FAULT ' + L.sec[0]]);
  row(tl, 'District', L.F + ' feeders, ' + fi(g0.head / 1000, 1) + ' MW served, ' + fi(amps(g0.head), 0) + ' A');
  row(tl, 'City', fi(loadMW(L.pi), 0) + ' MW, about ' + L.districts + ' districts like this one');
  if (L.log.length) row(tl, 'Last', L.log[L.log.length - 1].replace(/^[0-9,]+ s  /, ''));
  el('line').textContent = 'Finland: ' + (cutName ? 'line ' + cutName + ' cut, ' : '') + (NP - unfed) + ' of ' + NP + ' places fed, busiest line '
    + fi(worst * 100, 0) + ' per cent - local view ' + PLACES[L.pi][0] + ' - real places, modelled grid';
  [].forEach.call(document.querySelectorAll('#cities a'), function(a){ a.classList.toggle('on', +a.dataset.i === L.pi); });
  selfCheck(g0); refreshDownloads();
}
function renderSettings(){ var t = el('tSet'); t.innerHTML = '';
  row(t, 'Use Per Person', fi(KW_PER_PERSON, 1) + ' kW, chosen'); row(t, 'Line Rating, Country', LINE_MW + ' MW, modelled');
  row(t, 'Lines', links.length + ', from distance, not the real network'); row(t, 'Local Feeders', LOC_KV + ' kV, ' + LOC_RATING_A + ' A each, 50 Hz');
  row(t, 'Places', NP + ' real places, populations rounded'); }

/* ================= the page checks itself ================= */
var WORDS = ('All Rights Reserved Copyright Finland Grid The Country Modelled Lines Between Real Places Local View One District Of '
  + 'Now Supply Busiest Settings Under Over Line Cut None Fed Power Used Nuclear Hydro Wind State Normal Fault City Last Feeder '
  + 'Breaker Section Rerouted Repaired Back Use Per Person Rating Feeders Tie Nothing Avainlippu').split(' ').concat(PLACES.map(function(p){ return p[0]; }));
function selfCheck(g0){
  var f = [], txt = document.body.innerText.replace(el('chk').innerText, '');
  if (document.querySelectorAll('pre, code, textarea').length) f.push('a source block reached the page');
  if (/[$€£]\s?[0-9]|[0-9]\s?[$€£]|\b(price[sd]?|euro|dollars?)\b/i.test(txt)) f.push('money wording reached the page');
  if (/\b(Infinity|NaN|undefined|null)\b/.test(txt)) f.push('a figure with no value reached the page');
  var m = txt.match(/\b[A-Z][a-z]{2,} +[A-Z][a-z]{2,}\b/g) || [];
  var bad = m.filter(function(s){ var w = s.split(/ +/); return WORDS.indexOf(w[0]) < 0 || WORDS.indexOf(w[1]) < 0; });
  if (bad.length) f.push('something reads as a name: ' + bad[0]);
  [].forEach.call(document.querySelectorAll('#pg td.k'), function(td){ var s = td.textContent.trim(); if (s && /^[a-z]/.test(s)) f.push('a row does not start with a capital: ' + s.slice(0, 30)); });
  if (nat){
    var used = 0; PLACES.forEach(function(p, i){ if (nat.feed[i] !== null) used += loadMW(i); });
    var given = nat.given.reduce(function(a, b){ return a + b; }, 0);
    if (Math.abs(used - given) > 1e-6) f.push('power given is not the power used');
    nat.left.forEach(function(x, k){ if (x < -1e-9) f.push(SUPPLY[k][0] + ' gives more than it can'); });
    nat.feed.forEach(function(x, i){ if (x === null) f.push(PLACES[i][0] + ' is not fed'); });
    Object.keys(cut).forEach(function(k){ if (nat.flow[k]) f.push('power flows through the cut line'); });
    var b0 = bellman(NP, cut); PLACES.forEach(function(p, i){ if (Math.abs(b0[i] - nat.paths[0].d[i]) > 1e-6) f.push('a shortest way to ' + p[0] + ' is wrong'); });
  }
  if (g0 && loc){
    var served = 0; Object.keys(loc.nodes).forEach(function(n){ if (loc.nodes[n][2] && g0.fed[n]) served += loc.nodes[n][2]; });
    if (Math.abs(served - g0.head) > 1e-6) f.push('the district gives out more or less than it serves');
    if (g0.loop) f.push('a loop closed in the district');
    loc.sect.forEach(function(s){ if (!loc.st.closed[s[0]] && g0.flow[s[0]] !== undefined) f.push('current through open section ' + s[0]); });
    if (loc.st.fault && loc.step >= 3 && loc.step < 6 && g0.flow[loc.st.fault] !== undefined) f.push('the faulted section is still live');
  }
  if (loopError) f.push('the live loop hit an error: ' + loopError);
  fails = f; var box = el('chk');
  if (f.length){ box.style.display = 'block'; box.innerHTML = '<b style="color:#e0645f">THIS PAGE IS NOT CLEAN</b><br>' + f.map(function(s){ return s.replace(/</g, '&lt;'); }).join('<br>'); }
  else box.style.display = 'none';
  return f;
}

/* ================= what leaves the page ================= */
function textOf(){
  var L = ['FINLAND GRID', 'AI2Orbit', 'Taken ' + stampNow(), 'Real places, modelled grid', '', 'LINE CUT: ' + (cutName || 'none'), '', 'SUPPLY'];
  SUPPLY.forEach(function(s, k){ L.push(s[0] + ': ' + fi(nat.given[k], 0) + ' of ' + s[3] + ' MW'); });
  L.push('', 'PLACES');
  PLACES.forEach(function(p, i){ L.push(p[0] + ': ' + fi(loadMW(i), 0) + ' MW from ' + (nat.feed[i] === null ? 'NOTHING' : SUPPLY[nat.feed[i]][0])); });
  L.push('', 'LOCAL VIEW ' + PLACES[loc.pi][0].toUpperCase()); loc.log.forEach(function(x){ L.push(x); });
  return L.join('\n');
}
function dxfOf(){
  var o = []; function p(a, b){ o.push(a, String(b)); }
  p(0, 'SECTION'); p(2, 'ENTITIES');
  links.forEach(function(l){ var a = N[l[0]], b = N[l[1]]; p(0, 'LINE'); p(8, cut[lkey(l[0], l[1])] ? 'CUT' : 'LINES'); p(10, a[2]); p(20, a[1]); p(30, 0); p(11, b[2]); p(21, b[1]); p(31, 0); });
  N.forEach(function(n, i){ p(0, 'TEXT'); p(8, i >= NP ? 'SUPPLY' : 'PLACES'); p(10, n[2]); p(20, n[1]); p(30, 0); p(40, 0.08); p(1, n[0]); });
  p(0, 'ENDSEC'); p(0, 'EOF'); return o.join('\r\n') + '\r\n';
}
var lastDl = 0;
function refreshDownloads(){ if (performance.now() - lastDl < 2000) return; lastDl = performance.now();
  el('dlTxt').href = URL.createObjectURL(new Blob([textOf()], {type: 'text/plain'}));
  el('dlDxf').href = URL.createObjectURL(new Blob([dxfOf()], {type: 'image/vnd.dxf'})); }

/* ================= start, without a button ================= */
PLACES.forEach(function(p, i){ var a = document.createElement('a'); a.textContent = p[0]; a.dataset.i = i;
  a.onclick = function(){ locPinned = true; locIdx = i; loc = buildLocal(i); }; el('cities').appendChild(a); });
loc = buildLocal(0); nat = solve({}); renderSettings(); lastLocSwitch = performance.now();
var lastDraw = 0, lastG = null;
function tick(){
  requestAnimationFrame(tick);
  var now = performance.now();                 /* the real clock, never the frame's own stamp */
  try {
    var t = (now - t0) / 1000;
    if (Math.floor(t / CUT_EVERY) !== lastCut){ lastCut = Math.floor(t / CUT_EVERY); if (lastCut > 0) cutNext(); nat = solve(cut); }
    /* the local view tours the country: the next place, rebuilt, every LOCAL_EVERY seconds */
    if (!locPinned && now - lastLocSwitch > LOCAL_EVERY * 1000){ lastLocSwitch = now; locIdx = (locIdx + 1) % NP; loc = buildLocal(locIdx); }
    lastG = locStep(loc, now);
    if (now - lastDraw > 250){ lastDraw = now; drawFin(); drawLoc(lastG); render(lastG); }
  } catch (e){ if (!loopError){ loopError = String(e && e.message || e); selfCheck(lastG); } }
}
requestAnimationFrame(tick);
addEventListener('resize', function(){ lastDraw = 0; });

window.__read = function(){ return { cut: cutName, fed: nat.feed.filter(function(x){ return x !== null; }).length, given: nat.given, loc: PLACES[loc.pi][0],
  step: loc.step, links: links.length, fails: fails, bar: el('stamp').textContent + ' ' + el('line').textContent }; };
window.__selfCheck = function(){ return selfCheck(lastG); };
window.__cut = function(){ cutNext(); nat = solve(cut); return cutName; };
window.__pick = function(name){ for (var i = 0; i < NP; i++) if (PLACES[i][0] === name){ locPinned = true; locIdx = i; loc = buildLocal(i); } };
window.__jumpLocal = function(s){ loc.t0 = performance.now() - s * 1000; };
window.__nat = function(){ return nat; }; window.__lastG = function(){ return lastG; };
window.__textOf = textOf; window.__dxfOf = dxfOf;
</script>
