<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WORK LISTING &middot; NFC</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:16px 0 6px;text-transform:uppercase}
  input{font:inherit;width:100%;box-sizing:border-box;padding:9px 11px;
    background:#0a121a;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:5px}
  .row{display:flex;gap:8px;margin:6px 0}
  .row input{flex:1 1 auto}
  button{font:inherit;font-weight:700;letter-spacing:.5px;padding:9px 13px;
    background:#12507f;color:#eaf6ff;border:1px solid #2b6ea8;border-radius:5px;
    cursor:pointer;white-space:nowrap}
  button.alt{background:#0a121a}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:left;color:#6d8ba3;font-weight:400;font-size:9px;letter-spacing:1px;
    padding:4px 6px;border-bottom:1px solid #16293a}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;vertical-align:top}
  td.id{color:#4fd1ff;font-weight:700}
  td.t{color:#8ea9c2;white-space:nowrap}
  .done{color:#3fd18a}.open{color:#e8c98a}
  #cap{margin-top:8px;padding:8px 10px;border-radius:4px;font-size:11px;
    line-height:1.6}
  .capok{border:1px solid #1d4a33;background:#08160f;color:#9fe7c4}
  .capno{border:1px solid #6b4a12;background:#1a1304;color:#e8c98a}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B44</b><i id="line">work listing</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Search the listing</h2>
  <input id="q" placeholder="station, item or status - type to filter" autocomplete="off">

  <h2>Add a work item</h2>
  <div class="row">
    <input id="fId" placeholder="tag or item id" autocomplete="off">
    <button id="scan">Tap a tag</button>
  </div>
  <div class="row">
    <input id="fWhat" placeholder="what the work is" autocomplete="off">
  </div>
  <div class="row">
    <input id="fWhere" placeholder="station" autocomplete="off">
    <button id="add">Add, timestamped</button>
  </div>
  <div id="cap" class="capno">checking this device&hellip;</div>

  <h2>Work items</h2>
  <table id="t"><thead><tr>
    <th>id</th><th>what</th><th>station</th><th>status</th><th>when</th>
  </tr></thead><tbody id="body"></tbody></table>

  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   A WORK LISTING, READ BY NFC WHERE THE DEVICE ALLOWS IT.

   A search page and an add page in one. Every item carries a
   timestamp taken when it was added or last touched, so the listing
   is a record of what happened and when, not just what exists. It
   keeps itself in the device's own storage, so it survives the page
   being closed and works with no network.

   NFC HONESTLY. Reading a tag from a web page is only possible in one
   browser, on one system, over a secure connection - Chrome on
   Android. Everywhere else there is no tag reader to call, and a page
   that pretends otherwise is lying to the person holding it. So the
   device is asked plainly whether it can read a tag, the answer is
   shown, and where it cannot the id is simply typed or scanned by the
   usual camera instead. The listing itself works the same either way.

   This is why the product is both a page and an app: the page does
   everything except reach the tag reader, and reaching the tag reader
   is the one thing that needs the app. The reach, not the speed, is
   the reason to install.

   NOTHING MUSICAL AND NOTHING COPYRIGHTED is in here. It is a record
   of industrial work items - a station, a task, a tag, a time.
   ================================================================== */

var KEY = 'ai2_worklist_v1';
var items = [];

function load(){
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch(e){ items = []; }
  if (!items.length) seed();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
}
/* a few rows so the listing is not empty on a first open. Marked as
   examples, and cleared the moment a real item is added on a fresh
   device, so they are never mistaken for real work. */
function seed(){
  var t = Date.now();
  items = [
    { id:'TAG-0142', what:'line A belt tension check', where:'Line A',
      status:'done', at:t-5400000, ex:true },
    { id:'TAG-0143', what:'press 3 die change', where:'Press 3',
      status:'open', at:t-3600000, ex:true },
    { id:'TAG-0190', what:'coolant top-up', where:'CNC 2',
      status:'open', at:t-900000, ex:true }
  ];
}

/* ---- timestamps: taken on the device, shown plainly ---- */
function stamp(ms){
  var d = new Date(ms);
  function p(n){ return (n<10?'0':'') + n; }
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function matches(it, q){
  if (!q) return true;
  q = q.toLowerCase();
  return (it.id + ' ' + it.what + ' ' + it.where + ' ' + it.status)
         .toLowerCase().indexOf(q) >= 0;
}

function render(){
  var q = document.getElementById('q').value.trim();
  var rows = '', shown = 0;
  /* newest first, so the most recent work is at the top */
  items.slice().sort(function(a,b){ return b.at - a.at; }).forEach(function(it){
    if (!matches(it, q)) return;
    shown++;
    rows += '<tr><td class="id">' + esc(it.id) + (it.ex ? ' <span style="color:#4a6076">ex</span>' : '') +
      '</td><td>' + esc(it.what) + '</td><td>' + esc(it.where) +
      '</td><td class="' + (it.status === 'done' ? 'done' : 'open') + '">' +
      esc(it.status) + '</td><td class="t">' + stamp(it.at) + '</td></tr>';
  });
  document.getElementById('body').innerHTML = rows ||
    '<tr><td colspan="5" style="color:#6d8ba3">nothing matches that search</td></tr>';

  document.getElementById('line').textContent =
    'ITEMS' + items.length +
    ' SHOWN' + shown +
    ' OPEN' + items.filter(function(i){ return i.status !== 'done'; }).length +
    ' NFC' + (nfcReady ? 'YES' : 'NO');
}

/* ---- adding, always timestamped ---- */
function addItem(id, what, where){
  id = (id || '').trim(); what = (what || '').trim(); where = (where || '').trim();
  if (!id && !what) return false;
  /* the first real item clears the examples, so they never mix in */
  if (items.every(function(i){ return i.ex; })) items = [];
  items.push({ id: id || ('ITEM-' + (items.length+1)), what: what || '(not stated)',
    where: where || '(not stated)', status: 'open', at: Date.now(), ex: false });
  save(); render();
  return true;
}

/* ---- NFC, where it is possible ---- */
var nfcReady = ('NDEFReader' in window);
function setupNfc(){
  var cap = document.getElementById('cap');
  if (nfcReady){
    cap.className = 'capok';
    cap.textContent = 'This device can read a tag. Tap "Tap a tag", then ' +
      'hold a tag to the phone - its id fills in and the item is added, timestamped.';
  } else {
    cap.className = 'capno';
    cap.textContent = 'This device cannot read a tag from a web page ' +
      '(that needs Chrome on Android, as an app, over a secure connection). ' +
      'Type or camera-scan the id into the box instead - the listing works ' +
      'exactly the same.';
    document.getElementById('scan').textContent = 'No tag reader here';
    document.getElementById('scan').disabled = true;
  }
}
function scanTag(){
  if (!nfcReady) return;
  try {
    var reader = new NDEFReader();
    reader.scan().then(function(){
      reader.onreading = function(e){
        var id = e.serialNumber || '';
        /* a tag may also carry a text record; take the first if present */
        if (e.message && e.message.records){
          e.message.records.forEach(function(r){
            if (r.recordType === 'text'){
              try { id = new TextDecoder().decode(r.data) || id; } catch(_){}
            }
          });
        }
        document.getElementById('fId').value = id;
        var what = document.getElementById('fWhat').value;
        var where = document.getElementById('fWhere').value;
        addItem(id, what, where);
      };
    }).catch(function(err){
      document.getElementById('cap').className = 'capno';
      document.getElementById('cap').textContent =
        'The tag reader was refused: ' + (err && err.message || err) +
        '. Type the id in instead.';
    });
  } catch(e){ nfcReady = false; setupNfc(); }
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* a timestamp must be the time it was taken, to the minute */
  var now = Date.now(), s = stamp(now), re = /^\d{4}-\d\d-\d\d \d\d:\d\d$/;
  if (!re.test(s)) fails.push('a timestamp is not in the plain form: ' + s);

  /* search must actually filter - a search box that returns everything
     is not a search box */
  var probe = items.slice();
  var any = probe.some(function(it){ return matches(it, probe[0] ? probe[0].where : 'x'); });
  var none = probe.some(function(it){ return matches(it, 'zzqq-not-here-9'); });
  if (probe.length && !any) fails.push('search matched nothing it should have');
  if (none) fails.push('search matched something it should not have');

  /* the NFC claim on screen must agree with what the device can do -
     the one lie that would matter here is saying it can read a tag
     when it cannot */
  var claims = /can read a tag/.test(document.getElementById('cap').textContent) &&
               !/cannot/.test(document.getElementById('cap').textContent);
  if (claims !== nfcReady)
    fails.push('the NFC notice does not match what the device can actually do');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b style="color:#ff5b4d">THE LISTING IS NOT BEHAVING</b><br>' +
      fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__wlFails = fails;
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('add').addEventListener('click', function(){
  if (addItem(document.getElementById('fId').value,
              document.getElementById('fWhat').value,
              document.getElementById('fWhere').value)){
    document.getElementById('fId').value = '';
    document.getElementById('fWhat').value = '';
    document.getElementById('fWhere').value = '';
  }
});
document.getElementById('scan').addEventListener('click', scanTag);

load(); setupNfc(); render(); selfCheck();

/* for checking from outside */
window.__add = function(id, what, where){ return addItem(id, what, where); };
window.__search = function(q){ document.getElementById('q').value = q; render();
  return document.querySelectorAll('#body tr').length; };
window.__read = function(){ return { count: items.length, nfc: nfcReady,
  fails: window.__wlFails, bar: document.getElementById('line').textContent }; };
</script>
</body></html>
