<script>
/* ==================================================================
   HOW LONG DOES THE PROCESSOR TAKE TO READ MEMORY, AND HOW LONG IS
   THAT IN PROCESSOR TERMS.

   Nanoseconds are the wrong unit for the question. A slow chip and a
   fast chip can both take 100 ns and mean completely different things
   to the processor sitting there waiting. So every reading is given
   twice: in nanoseconds, and in WORK - the number of operations this
   processor would have got through in the same span. That second
   figure is what the wait actually costs.

   BOTH HALVES ARE MEASURED ON THIS MACHINE. The work rate is timed
   here, not taken off a specification, so the conversion is this
   device's own and not a number looked up somewhere.

   THE LEVELS ARE FOUND, NOT ASSUMED. Nothing here says "this chip has
   three levels of cache" - the ladder is walked from small to large,
   and wherever one reading is sharply slower than the one before it,
   the walk has fallen off the edge of a level onto the next. The
   names follow the order they are found in: primary, secondary,
   tertiary, then main memory for the furthest. A device with two
   levels reports two and a device with five reports five.
   ================================================================== */

var SIZES = [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048,
             4096, 8192, 16384, 32768, 65536];        /* kB */
var STEP = 1.6;         /* a neighbour this much slower is a new level */

var rings = {}, ns = {}, guard = 0, opsPerNs = 0, levels = [], busy = false;

function ring(kb){
  if (rings[kb]) return rings[kb];
  var n = kb*1024/4, a = new Int32Array(n), idx = new Int32Array(n), i, j, t;
  for (i=0;i<n;i++) idx[i] = i;
  for (i=n-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  for (i=0;i<n;i++) a[idx[i]] = idx[(i+1)%n];
  rings[kb] = a;        /* BUILT ONCE - rebuilding a 64 MB shuffled ring
                           costs more than every reading put together */
  return a;
}

/* Each read's address comes out of the read before it, so the
   processor cannot run ahead and fetch them in parallel. That is the
   whole point: this is the time one read takes when nothing can hide
   it, which is the time the processor actually waits. */
function chase(a, ms){
  var p = 0, steps = 0, t0 = performance.now(), t1;
  do { for (var k=0;k<20000;k++) p = a[p]; steps += 20000; t1 = performance.now(); }
  while (t1 - t0 < ms);
  guard = p;
  return (t1 - t0) * 1e6 / steps;
}

/* the work rate, in operations per nanosecond, measured here */
function measureWork(){
  var t0 = performance.now(), x = 0, n = 0;
  do { for (var i=0;i<200000;i++){ x += (i&15)+1; } n += 200000; }
  while (performance.now() - t0 < 25);
  guard += x & 1;
  var ms = performance.now() - t0;
  opsPerNs = ms > 0 ? n / (ms * 1e6) : 0;
}

/* ---- the levels, found from the shape of the ladder ----
   Kept apart from the measuring so it can be fed a made-up ladder and
   checked. A level-finder that can only ever be run on live readings
   is a level-finder nobody has tested. */
function findLevels(sizes, time){
  /* THE BOUNDARY IS A JUMP BETWEEN NEIGHBOURS, not a jump away from
     the worst reading seen so far. Measured against a running worst,
     a slow steady climb keeps clearing the threshold and gets chopped
     into a new level every couple of steps - which is how a machine
     with four levels of memory first reported seven. Falling off the
     edge of a real level shows up as one neighbour being sharply
     slower than the one before it. */
  var NAMES = ['primary', 'secondary', 'tertiary'];
  var out = [], cur = null, prev = 0, i;
  for (i=0;i<sizes.length;i++){
    var t = time[sizes[i]];
    if (t === undefined) continue;
    if (cur && prev && t > prev * STEP){ out.push(cur); cur = null; }
    if (!cur) cur = { from:sizes[i], to:sizes[i], sum:0, n:0 };
    cur.to = sizes[i]; cur.sum += t; cur.n++; prev = t;
  }
  if (cur) out.push(cur);
  for (i=0;i<out.length;i++){
    out[i].ns = out[i].sum / out[i].n;
    /* exactly one level is main memory - the furthest one - and no
       name is ever handed out twice */
    out[i].name = (i === out.length - 1) ? 'main memory'
                : (NAMES[i] || ('level ' + (i+1)));
  }
  return out;
}

function runAll(){
  if (busy) return;
  busy = true;
  measureWork();
  var i = 0;
  (function next(){
    if (i >= SIZES.length){
      levels = findLevels(SIZES, ns);
      busy = false; render(); draw(); selfCheck(); return;
    }
    var kb = SIZES[i++];
    /* TAKEN TWICE, AND THE FASTER ONE KEPT. A reading can only ever
       come out too slow - something else on the machine steals time,
       nothing ever gives time back - so the quicker of two passes is
       the one less disturbed. One pass each made the ladder DIP by
       half on a contended machine, which is the shape that says the
       instrument was interrupted, not that far memory got faster. */
    var a = chase(ring(kb), 40), b2 = chase(ring(kb), 40);
    ns[kb] = Math.min(a, b2);
    render();
    setTimeout(next, 12);      /* let the page breathe between readings */
  })();
}

/* ---------------- the listing ---------------- */
function work(nsVal){ return nsVal * opsPerNs; }
function fmt(v, d){ return v.toLocaleString(undefined,
  { minimumFractionDigits:d, maximumFractionDigits:d }); }
function sz(kb){ return kb >= 1024 ? (kb/1024) + ' MB' : kb + ' kB'; }
function row(k, v, u, cls){
  return '<tr><td class="k">'+k+'</td><td class="'+(cls||'')+'">'+v+
         '</td><td style="color:#4a6076;width:22%">'+(u||'')+'</td></tr>';
}

function render(){
  var first = ns[SIZES[0]], last = ns[SIZES[SIZES.length-1]];
  var main = levels.length ? levels[levels.length-1] : null;
  var top = levels.length ? levels[0] : null;

  document.getElementById('tAns').innerHTML =
    row('work rate measured here',
        opsPerNs ? fmt(opsPerNs*1000, 0) : '-', 'ops per microsecond', 'm') +
    row('one read from main memory',
        main ? fmt(main.ns, 1) : '-', 'ns', 'm') +
    row('&nbsp;&nbsp;the processor waits',
        main ? fmt(work(main.ns), 0) : '-', 'operations', 'm') +
    row('one read from the nearest level',
        top ? fmt(top.ns, 2) : '-', 'ns', 'm') +
    row('&nbsp;&nbsp;the processor waits',
        top ? fmt(work(top.ns), 1) : '-', 'operations', 'm') +
    row('main memory against the nearest',
        (main && top && top.ns) ? fmt(main.ns/top.ns, 0) + 'x' : '-',
        'times longer', 'm') +
    row('levels found', levels.length || '-', '', 'm');

  var lev = '';
  levels.forEach(function(L, i){
    lev += row('<b class="L' + Math.min(i,3) + '">' + L.name + '</b>',
               fmt(L.ns, L.ns < 10 ? 2 : 1), 'ns', 'L' + Math.min(i,3)) +
      row('&nbsp;&nbsp;working set', sz(L.from) + (L.from !== L.to ?
          ' to ' + sz(L.to) : ''), '') +
      row('&nbsp;&nbsp;the processor waits', fmt(work(L.ns), 1), 'operations') +
      row('&nbsp;&nbsp;against the nearest level',
          levels[0].ns ? fmt(L.ns/levels[0].ns, 1) + 'x' : '-', '');
  });
  document.getElementById('tLev').innerHTML = lev;

  var rows = '';
  SIZES.forEach(function(kb){
    var t = ns[kb];
    rows += '<tr><td>' + sz(kb) + '</td>' +
      '<td>' + (t ? fmt(t, t < 10 ? 2 : 1) + ' ns' : '&hellip;') + '</td>' +
      '<td>' + (t && opsPerNs ? fmt(work(t), 1) : '-') + '</td>' +
      '<td>' + (t && first ? fmt(t/first, 1) + 'x' : '-') + '</td></tr>';
  });
  document.getElementById('ladBody').innerHTML = rows;

  document.getElementById('line').textContent =
    'LEVELS' + (levels.length || '-') +
    ' NEAR' + (top ? fmt(top.ns, 2).replace('.', ',') : '-') + 'ns' +
    ' MAIN' + (main ? fmt(main.ns, 0) : '-') + 'ns' +
    ' WAIT' + (main ? fmt(work(main.ns), 0).replace(/,/g,'') : '-') + 'ops' +
    ' RATIO' + ((main && top && top.ns) ? fmt(main.ns/top.ns, 0) : '-') + 'x' +
    ' RATE' + (opsPerNs ? fmt(opsPerNs*1000, 0).replace(/,/g,'') : '-') + 'op/\u00B5s';
}

/* ---------------- the picture ---------------- */
function draw(){
  var cv = document.getElementById('g'), g = cv.getContext('2d');
  var w = cv.clientWidth || 320; if (cv.width !== w) cv.width = w;
  var W = cv.width, H = cv.height, L = 46, R = 10, T = 12, B = 24;
  g.fillStyle = '#070d15'; g.fillRect(0,0,W,H);
  var vals = SIZES.map(function(k){ return ns[k]; }).filter(Boolean);
  if (vals.length < 2) return;
  var lg = function(v){ return Math.log(v)/Math.LN10; };
  var x0 = lg(SIZES[0]), x1 = lg(SIZES[SIZES.length-1]);
  var y0 = lg(Math.min.apply(null, vals)/1.5),
      y1 = lg(Math.max.apply(null, vals)*1.5);
  var X = function(k){ return L + (lg(k)-x0)/(x1-x0)*(W-L-R); };
  var Y = function(v){ return T + (1-(lg(v)-y0)/(y1-y0))*(H-T-B); };

  g.font = '9px monospace'; g.strokeStyle = '#12202c'; g.fillStyle = '#4a6076';
  for (var d=-1; d<=4; d++){
    var v = Math.pow(10,d);
    if (lg(v) < y0 || lg(v) > y1) continue;
    var y = Y(v);
    g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke();
    g.fillText(v + ' ns', 3, y+3);
  }
  /* the edge of each level, where the walk fell off it */
  levels.forEach(function(L2, i){
    if (i === 0) return;
    var x = X(L2.from);
    g.strokeStyle = '#2a3c4e'; g.setLineDash([4,3]);
    g.beginPath(); g.moveTo(x,T); g.lineTo(x,H-B); g.stroke(); g.setLineDash([]);
  });
  g.strokeStyle = '#4fd1ff'; g.lineWidth = 2; g.beginPath();
  var started = false;
  SIZES.forEach(function(k){
    if (!ns[k]) return;
    var x = X(k), y = Y(ns[k]);
    if (!started){ g.moveTo(x,y); started = true; } else g.lineTo(x,y);
  });
  g.stroke();
  SIZES.forEach(function(k){
    if (!ns[k]) return;
    g.fillStyle = '#4fd1ff';
    g.beginPath(); g.arc(X(k), Y(ns[k]), 2.5, 0, 6.283); g.fill();
  });
  g.fillStyle = '#4a6076';
  [SIZES[0], 1024, SIZES[SIZES.length-1]].forEach(function(k){
    g.fillText(sz(k), X(k)-12, H-8);
  });
}

/* ================= the check on all of it ==================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [], i;

  /* the ladder has to climb. Memory further away is never nearer. */
  var prev = 0, worstDrop = 0;
  for (i=0;i<SIZES.length;i++){
    var t = ns[SIZES[i]];
    if (!t) continue;
    if (prev && t < prev * 0.7) worstDrop = Math.max(worstDrop, prev/t);
    prev = Math.max(prev, t);
  }
  if (worstDrop > 1) fails.push('the ladder fell by ' + worstDrop.toFixed(1) +
                                'x on the way up');

  /* the work figure must really be the time times the rate, or the
     second column is decoration sitting beside the first */
  var m = levels.length ? levels[levels.length-1] : null;
  if (m && Math.abs(work(m.ns) - m.ns*opsPerNs) > 1e-9)
    fails.push('the work figure is not the time times the rate');
  if (!(opsPerNs > 0)) fails.push('no work rate was measured');

  /* THE LEVEL FINDER, ON A LADDER WHOSE ANSWER IS ALREADY KNOWN.
     Three flat runs with two big jumps between them must come back as
     three levels split in the right places. If the finder is really
     just printing fixed names in order, this catches it. */
  var fakeSizes = [1,2,4,8,16,32], fake = {1:2,2:2.1,4:9,8:9.2,16:60,32:62};
  var got = findLevels(fakeSizes, fake);
  if (got.length !== 3)
    fails.push('the level finder found ' + got.length + ' levels in a ladder built with 3');
  else {
    if (got[0].from !== 1 || got[0].to !== 2) fails.push('first level split wrongly');
    if (got[1].from !== 4 || got[1].to !== 8) fails.push('second level split wrongly');
    if (got[2].from !== 16) fails.push('third level split wrongly');
    if (got[2].name !== 'main memory') fails.push('the last level is not named for main memory');
  }
  /* and a ladder with no jumps at all must come back as ONE level */
  var flat = findLevels([1,2,4,8], {1:5,2:5.1,4:5.2,8:5.05});
  if (flat.length !== 1)
    fails.push('a flat ladder produced ' + flat.length + ' levels');

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THESE READINGS DO NOT HOLD TOGETHER</b><br>' +
      fails.join('<br>') + '<br>Nothing above should be trusted.';
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__ladderFails = fails;
}

window.addEventListener('resize', draw);
setTimeout(runAll, 150);
render();

window.__read = function(){ return { ns:ns, levels:levels, opsPerNs:opsPerNs,
  fails:window.__ladderFails, busy:busy,
  bar:document.getElementById('line').textContent }; };
</script>
</body></html>
