<!doctype html>
<meta charset="utf-8">
<title>Screen Inhibitor / Dead-Pixel Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif;}
  #stage{position:fixed;inset:0;background:#000;transition:background .08s;}
  #hud{position:fixed;left:12px;top:12px;color:#fff;mix-blend-mode:difference;
       font-size:13px;line-height:1.5;background:rgba(0,0,0,.0);pointer-events:none;}
  #hud b{font-size:15px;}
  #wake{color:#7CFC00;} #wake.off{color:#ff5252;}
  kbd{background:#222;color:#eee;border-radius:4px;padding:1px 6px;font-size:12px;border:1px solid #444;}
  #panel{position:fixed;right:12px;top:12px;color:#fff;mix-blend-mode:difference;font-size:12px;text-align:right;pointer-events:none;}
</style>
<div id="stage"></div>
<div id="hud">
  <b>Screen Inhibitor · Dead-Pixel Test</b><br>
  <span id="name">BLACK</span> &nbsp; <span id="idx">1/8</span><br>
  Wake lock: <span id="wake" class="off">off</span><br>
  <span style="opacity:.85">
    <kbd>Space</kbd>/<kbd>click</kbd> next colour ·
    <kbd>A</kbd> auto-cycle ·
    <kbd>F</kbd> fullscreen ·
    <kbd>W</kbd> wake lock
  </span>
</div>
<div id="panel"><span id="auto">auto: off</span></div>
<script>
// One full-screen area, one colour at a time — for stuck/dead-pixel checks — plus a
// screen wake-lock so the display never sleeps while testing.
const COLORS=[
  ["BLACK","#000000"],["WHITE","#ffffff"],["RED","#ff0000"],["GREEN","#00ff00"],
  ["BLUE","#0000ff"],["CYAN","#00ffff"],["MAGENTA","#ff00ff"],["GREY","#808080"]
];
let i=0, auto=null, wl=null;
const stage=document.getElementById('stage');
function paint(){
  const [n,c]=COLORS[i];
  stage.style.background=c;
  document.getElementById('name').textContent=n;
  document.getElementById('idx').textContent=(i+1)+'/'+COLORS.length;
}
function next(d=1){ i=(i+d+COLORS.length)%COLORS.length; paint(); }
function toggleAuto(){
  if(auto){ clearInterval(auto); auto=null; }
  else { auto=setInterval(()=>next(1),1000); }
  document.getElementById('auto').textContent='auto: '+(auto?'on (1s)':'off');
}
async function toggleWake(){
  try{
    if(wl){ await wl.release(); wl=null; }
    else if('wakeLock' in navigator){ wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>setWake(false)); }
    setWake(!!wl);
  }catch(e){ setWake(false); }
}
function setWake(on){
  const el=document.getElementById('wake');
  el.textContent=on?'on':'off'; el.className=on?'':'off';
}
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); next(1); }
  else if(e.key==='a'||e.key==='A') toggleAuto();
  else if(e.key==='f'||e.key==='F') fs();
  else if(e.key==='w'||e.key==='W') toggleWake();
  else if(e.key==='ArrowLeft') next(-1);
  else if(e.key==='ArrowRight') next(1);
});
stage.addEventListener('click',()=>next(1));
// re-acquire wake lock after tab returns to foreground
document.addEventListener('visibilitychange',()=>{ if(wl===null && document.visibilityState==='visible'){} });
paint();
</script>
