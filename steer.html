<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOOTBALLAI &middot; STEER</title>
<style>
  html,body{margin:0;min-height:100%;background:#05080c;color:#d7e6f2;
    font:13px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
    -webkit-user-select:none;user-select:none}
  #bar{position:fixed;left:0;right:0;top:0;background:#f00;color:#fff;
    display:flex;align-items:baseline;gap:8px;padding:6px 10px;
    font-weight:700;letter-spacing:.3px;z-index:9;flex-wrap:wrap}
  #bar i{font-style:normal;flex:1 1 auto;min-width:0;font-weight:400}
  #pg{padding:8px 12px 26px;max-width:760px}
  h2{font-size:10px;letter-spacing:2px;color:#6d8ba3;font-weight:400;
    margin:14px 0 6px;text-transform:uppercase}
  canvas{display:block;width:100%;background:#0a1f12;
    border:1px solid #16293a;border-radius:6px;touch-action:none}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    max-width:320px;margin:10px auto 0}
  .k{padding:16px 0;text-align:center;font-weight:700;letter-spacing:1px;
    background:#0a121a;border:1px solid #2b6ea8;border-radius:8px;
    color:#eaf6ff;cursor:pointer;font-size:14px}
  .k:active,.k.on{background:#12507f}
  .k.blank{border:none;background:none;cursor:default}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:5px 6px;border-bottom:1px solid #0e1a26;
    font-variant-numeric:tabular-nums;text-align:right}
  td:first-child{text-align:left;color:#8ea9c2;width:52%}
  .m{color:#3fd18a}.n{color:#e0645f}.w{color:#e8c98a}
  #note{margin-top:10px;padding:9px 11px;border:1px solid #16293a;
    background:#0a121a;border-radius:4px;font-size:11px;line-height:1.7;color:#8ea9c2}
  #chk{margin-top:12px;padding:8px 10px;border:1px solid #5a1d1d;
    background:#1a0808;border-radius:4px;font-size:11px;line-height:1.6}
  /* THE MARK SITS WITH THE PHRASE AND NOWHERE ELSE. The jpeg is the
     supplied file, untouched - a registered mark, never recoloured,
     recropped or stretched. The panel carries the mark's own colour. */
</style></head><body>

<div id="bar"><b id="stamp">B53</b><i id="line">steer</i></div>
<div id="pg" style="padding-top:58px">

  <h2>Steer: left, right, straight, back</h2>
  <canvas id="g" height="300"></canvas>
  <div id="pad">
    <div class="k blank"></div>
    <div class="k" data-d="straight">STRAIGHT</div>
    <div class="k blank"></div>
    <div class="k" data-d="left">LEFT</div>
    <div class="k" data-d="back">BACK</div>
    <div class="k" data-d="right">RIGHT</div>
  </div>

  <h2>The steer</h2><table id="tS"></table>

  <h2>What it costs the device</h2><table id="tC"></table>

  <div id="note"></div>
  <div id="chk" style="display:none"></div>

</div>

<script>
/* ==================================================================
   FOOTBALLAI - STEERING. LEFT, RIGHT, STRAIGHT, BACK.

   The four ways asked for, on a pitch: steer the run left, right,
   straight on, or turn back. Hold a key and the run keeps going that
   way; the turn is gradual, as a body turns, not a snap to a new
   heading - which is the part that makes it read as a player rather
   than a cursor.

   AND IT CARRIES THE MEASUREMENT, because that is what this whole set
   of products is. Every frame is timed, so the page shows what the
   steering actually costs the device: the frame rate it holds, the
   time one step takes, and how far the run travels for each turn.
   Nothing here is drawn and then described - the figures come off the
   frames as they happen.

   NOTHING NAMED. No player, no club, no competition, no kit. The
   runner is a shape, the pitch is a pitch, and the page carries no
   name of any person or team - that is a standing rule on this
   product and the page checks itself for it before it will show a
   clean result. A demonstration that borrows a real name borrows a
   real licence problem with it.
   ================================================================== */

var W = 0, H = 0, cv = document.getElementById('g'), g = cv.getContext('2d');

/* the runner: a position, a heading, a speed. Nothing else. */
var run = { x: 0.5, y: 0.75, head: -Math.PI/2, speed: 0, trail: [] };
var held = null, lastT = 0;
var TURN = 2.6;            /* radians a second when turning */
var ACCEL = 0.55, DRAG = 1.9, TOP = 0.42;   /* of the pitch a second */

var frames = 0, fT = 0, fps = 0, stepMs = 0, turned = 0, travelled = 0;

function fit(){
  var w = cv.clientWidth || 320;
  if (cv.width !== w){ cv.width = w; }
  W = cv.width; H = cv.height;
}

function press(d){ held = d; paintKeys(); }
function release(){ held = null; paintKeys(); }
function paintKeys(){
  [].forEach.call(document.querySelectorAll('.k[data-d]'), function(k){
    if (k.dataset.d === held) k.classList.add('on'); else k.classList.remove('on');
  });
}

function step(now){
  requestAnimationFrame(step);
  fit();
  if (!lastT){ lastT = now; return; }
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;               /* a tab coming back, not a frame */
  stepMs = dt * 1000;
  frames++; fT += dt;
  if (fT >= 0.5){ fps = frames / fT; frames = 0; fT = 0; }

  /* the four steers */
  if (held === 'left'){ run.head -= TURN * dt; turned += TURN * dt; }
  if (held === 'right'){ run.head += TURN * dt; turned += TURN * dt; }
  if (held === 'straight'){ run.speed += ACCEL * dt; }
  if (held === 'back'){
    /* BACK TURNS THE RUN ROUND, it does not reverse the body. A player
       turning back swings through the turn and runs the other way -
       stepping backwards up the pitch would look like a cursor. */
    var want = run.head + Math.PI;
    var diff = Math.atan2(Math.sin(want - run.head), Math.cos(want - run.head));
    var turn = Math.min(Math.abs(diff), TURN * dt) * (diff < 0 ? -1 : 1);
    run.head += turn; turned += Math.abs(turn);
    run.speed += ACCEL * 0.6 * dt;
  }
  if (!held) run.speed -= DRAG * dt * run.speed;
  if (run.speed > TOP) run.speed = TOP;
  if (run.speed < 0) run.speed = 0;

  var dx = Math.cos(run.head) * run.speed * dt;
  var dy = Math.sin(run.head) * run.speed * dt;
  run.x += dx; run.y += dy;
  travelled += Math.sqrt(dx*dx + dy*dy);

  /* the touchline: the run stops at the edge rather than leaving */
  if (run.x < 0.03){ run.x = 0.03; run.speed *= 0.4; }
  if (run.x > 0.97){ run.x = 0.97; run.speed *= 0.4; }
  if (run.y < 0.03){ run.y = 0.03; run.speed *= 0.4; }
  if (run.y > 0.97){ run.y = 0.97; run.speed *= 0.4; }

  run.trail.push([run.x, run.y]);
  if (run.trail.length > 240) run.trail.shift();

  draw(); render();
}

function draw(){
  g.fillStyle = '#0a1f12'; g.fillRect(0,0,W,H);
  /* the pitch: lines only, no badge, no name */
  g.strokeStyle = '#1d4a33'; g.lineWidth = 2;
  g.strokeRect(6, 6, W-12, H-12);
  g.beginPath(); g.moveTo(W/2, 6); g.lineTo(W/2, H-6); g.stroke();
  g.beginPath(); g.arc(W/2, H/2, Math.min(W,H)*0.13, 0, 6.283); g.stroke();
  var bw = W*0.3, bh = H*0.16;
  g.strokeRect((W-bw)/2, 6, bw, bh);
  g.strokeRect((W-bw)/2, H-6-bh, bw, bh);

  /* the path run so far */
  g.strokeStyle = 'rgba(79,209,255,0.55)'; g.lineWidth = 2;
  g.beginPath();
  run.trail.forEach(function(p, i){
    var x = p[0]*W, y = p[1]*H;
    if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
  });
  g.stroke();

  /* the runner: a shape with a heading, and no name on it */
  var x = run.x*W, y = run.y*H;
  g.save(); g.translate(x,y); g.rotate(run.head);
  g.fillStyle = '#4fd1ff';
  g.beginPath(); g.moveTo(11,0); g.lineTo(-7,6); g.lineTo(-7,-6); g.closePath();
  g.fill();
  g.restore();
}

function dirWord(){
  var d = ((run.head * 180/Math.PI) % 360 + 360) % 360;
  return d.toFixed(0);
}
function row(k,v,u,cls){
  return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+
    '</td><td style="color:#4a6076;width:16%">'+(u||'')+'</td></tr>';
}
function render(){
  document.getElementById('tS').innerHTML =
    row('steering', held ? held.toUpperCase() : 'coasting', '', held?'m':'') +
    row('heading', dirWord(), 'degrees', 'm') +
    row('speed', (run.speed*100).toFixed(1), '% of pitch a second', 'm') +
    row('turned so far', (turned*180/Math.PI).toFixed(0), 'degrees', 'm') +
    row('run so far', (travelled*100).toFixed(0), '% of pitch', 'm');

  document.getElementById('tC').innerHTML =
    row('frame rate held', fps ? fps.toFixed(0) : '-', 'a second', 'm') +
    row('one step', stepMs ? stepMs.toFixed(1) : '-', 'ms', 'm') +
    row('path points kept', run.trail.length, '', 'm') +
    row('processors', navigator.hardwareConcurrency || '?', '', 'm');

  document.getElementById('note').innerHTML =
    '<b>Hold a key, the run keeps going that way.</b> The turn is ' +
    'gradual, as a body turns - BACK swings the run round and goes the ' +
    'other way rather than stepping backwards, which is what makes it ' +
    'read as a player and not a cursor. Every figure above comes off ' +
    'the frames as they happen. Nothing on this page is named: no ' +
    'player, no club, no competition, no kit.';

  document.getElementById('line').textContent =
    'STEER' + (held ? held.toUpperCase() : '-') +
    ' HEAD' + dirWord() + 'deg' +
    ' SPEED' + (run.speed*100).toFixed(0) + '%' +
    ' FPS' + (fps?fps.toFixed(0):'-') +
    ' STEP' + (stepMs?stepMs.toFixed(1):'-') + 'ms' +
    ' RUN' + (travelled*100).toFixed(0) + '%';
}

/* ================= the check =================
   IT PRINTS NOTHING WHILE IT PASSES. */
function selfCheck(){
  var fails = [];

  /* the four steers must all exist and be distinct */
  var keys = [].map.call(document.querySelectorAll('.k[data-d]'),
    function(k){ return k.dataset.d; });
  ['left','right','straight','back'].forEach(function(d){
    if (keys.indexOf(d) < 0) fails.push('the ' + d + ' steer is missing');
  });

  /* NOTHING MAY BE NAMED. A rendered name of a person, club or
     competition is a licence problem walking onto a stand, so the page
     refuses to show a clean result if one appears. */
  var txt = document.body.innerText;
  if (/\b(FC|AFC|United|City|Madrid|Barcelona|Juventus|Bayern|Liverpool|Arsenal|Chelsea|Premier|Liga|Serie A|Bundesliga|UEFA|FIFA|Champions League)\b/.test(txt))
    fails.push('a club, competition or body is named on the page');
  /* a two-word Capitalised Name is what a player name looks like */
  var m = txt.match(/\b[A-Z][a-z]{2,}\s+[A-Z][a-z]{2,}\b/g);
  if (m){
    var allowed = /^(All Rights|Rights Reserved|Audio Lights|Work Listing)$/;
    var bad = m.filter(function(s){ return !allowed.test(s); });
    if (bad.length) fails.push('something reads as a name: ' + bad[0]);
  }

  var el = document.getElementById('chk');
  if (fails.length){
    el.style.display = '';
    el.innerHTML = '<b class="n">THIS PAGE IS NOT CLEAN</b><br>' + fails.join('<br>');
  } else { el.style.display = 'none'; el.innerHTML = ''; }
  window.__stFails = fails;
}

[].forEach.call(document.querySelectorAll('.k[data-d]'), function(k){
  k.addEventListener('mousedown', function(e){ e.preventDefault(); press(k.dataset.d); });
  k.addEventListener('touchstart', function(e){ e.preventDefault(); press(k.dataset.d); }, {passive:false});
});
window.addEventListener('mouseup', release);
window.addEventListener('touchend', release);
window.addEventListener('keydown', function(e){
  var map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'straight', ArrowDown:'back' };
  if (map[e.key]){ e.preventDefault(); press(map[e.key]); }
});
window.addEventListener('keyup', release);

fit(); render();
requestAnimationFrame(step);
setTimeout(selfCheck, 600);

/* for checking from outside: steer without a finger */
window.__steer = function(d, ms){
  press(d);
  return new Promise(function(res){ setTimeout(function(){ release(); res(); }, ms||300); });
};
window.__read = function(){ return { held: held, head: run.head,
  speed: run.speed, x: run.x, y: run.y, turned: turned, travelled: travelled,
  fps: fps, trail: run.trail.length, fails: window.__stFails,
  bar: document.getElementById('line').textContent }; };
</script>
</body></html>
